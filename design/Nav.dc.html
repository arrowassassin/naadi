<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Navigation pill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; width: fit-content; max-width: 100%; box-sizing: border-box; margin: 0 auto; padding: 6px; border-radius: 28px; background: rgba(20,21,25,0.86); backdrop-filter: blur(18px); border: 1px solid #26282E; font-family: Inter, system-ui, sans-serif; color: #F4F4F0">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 10px; text-decoration: none; color: #F4F4F0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px"><span style="width: 28px; height: 28px; border-radius: 50%; background: #C6FF3D; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l3-7 4 14 3-7h6"></path></svg></span>Naadi</a>
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<a href="{{i.href}}" style="{{i.style}}">{{i.label}}</a>
</sc-for>
<a href="Search.dc.html" aria-label="Search everything" style="width: 44px; height: 44px; border-radius: 50%; background: #1B1D22; color: #F4F4F0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></a>
<a href="Settings.dc.html" aria-label="Profile and settings" style="width: 44px; height: 44px; border-radius: 50%; background: #17132E; border: 1px solid #3A3170; color: #C4BAFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px">[A]</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"today","options":["today","learn","practice","plan","notes","pathway","none"]},"$preview":{"width":760,"height":58}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const base = 'display:flex;align-items:center;min-height:44px;border-radius:999px;text-decoration:none;font-size:14px;';
    const items = [['today', 'Today', 'Main.dc.html'], ['learn', 'Learn', 'Courses.dc.html'], ['practice', 'Practice', 'Builder.dc.html'], ['plan', 'Plan', 'Planner.dc.html'], ['notes', 'Notes', 'Notes.dc.html'], ['pathway', 'Pathway', 'Pathway.dc.html']].map(([id, label, href]) => ({
      label, href,
      style: base + (id === active ? 'padding:0 18px;background:#F4F4F0;color:#050506;font-weight:600' : 'padding:0 16px;color:#C9CBD1')
    }));
    return { items };
  }
}
</script>
</body>
</html>
