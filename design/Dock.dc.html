<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Assistant bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="display: flex; align-items: center; gap: 8px; max-width: 780px; margin: 0 auto; box-sizing: border-box; padding: 8px; border-radius: 999px; background: rgba(20,21,25,0.9); backdrop-filter: blur(22px); border: 1px solid #34363D; font-family: Inter, system-ui, sans-serif; color: #F4F4F0">
<button type="button" aria-label="Attach a document, image or video" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: #23252B; color: #F4F4F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<input type="text" aria-label="Ask Naadi" placeholder="{{ask}}" style="flex: 1; min-width: 0; min-height: 48px; background: transparent; border: 0; outline: none; color: #F4F4F0; font-size: 16px">
<button type="button" aria-label="Search the web" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: transparent; color: #C9CBD1; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></button>
<button type="button" aria-label="Voice" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: transparent; color: #C9CBD1; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="button" aria-label="Send" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: #C6FF3D; color: #0B1400; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ask":{"editor":"text","default":"Ask Naadi about anything on this page…"},"$preview":{"width":780,"height":66}}'>
class Component extends DCLogic {
  renderVals() {
    return { ask: this.props.ask ?? 'Ask Naadi about anything on this page…' };
  }
}
</script>
</body>
</html>
