<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Build a question block</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#C6FF3D}a:hover{color:#E2FF94}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #050506; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 16px 0 24px">
<div style="position: sticky; top: 16px; z-index: 5; padding: 0 16px"><dc-import name="Nav" active="practice" hint-size="100%,58px"></dc-import></div>

<main style="max-width: 1320px; margin: 0 auto; padding: 64px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(56px, 10vw, 136px); line-height: 0.88; letter-spacing: -0.05em">Build<br><span style="color: #8A8C92">a block.</span></h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Results.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A3D45; color: #F4F4F0; text-decoration: none; font-size: 14px">Past blocks</a>
<a href="Exam.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A3D45; color: #F4F4F0; text-decoration: none; font-size: 14px">Full practice exam</a>
<a href="Cards.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A3D45; color: #F4F4F0; text-decoration: none; font-size: 14px">Flashcards · 62 due</a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<fieldset style="margin: 0; padding: 28px; border-radius: 32px; background: #0E0F12; border: 1px solid #1F2126; display: flex; flex-direction: column; gap: 14px; min-width: 0">
<legend style="float: left; padding: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">{{g.title}}</legend>
<div style="clear: both; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.on}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-for>
</div>

<aside aria-label="Block summary" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="flex: 1; padding: 32px; border-radius: 32px; background: #C6FF3D; color: #0B1400; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase">Your block</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Fewer questions" style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid #0B1400; background: transparent; color: #0B1400; font-size: 28px; line-height: 1">−</button>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 144px; line-height: 0.85; letter-spacing: -0.06em">40</span>
<button type="button" aria-label="More questions" style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid #0B1400; background: transparent; color: #0B1400; font-size: 28px; line-height: 1">+</button>
</div>
<p style="margin: 0; font-size: 16px; font-weight: 500">Timed · 60 minutes · Renal and Pharmacology · unused and incorrect · 212 questions match.</p>
<a href="Qbank.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 999px; background: #0B1400; color: #C6FF3D; text-decoration: none; font-weight: 600; font-size: 17px">Start block</a>
</div>
<div style="padding: 28px; border-radius: 32px; background: #17132E; border: 1px solid #2C2552; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #C4BAFF">Or let Naadi choose</span>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; line-height: 1.2">20 questions aimed at the three topics you miss most.</p>
<button type="button" style="min-height: 52px; border-radius: 999px; border: 0; background: #F4F4F0; color: #050506; font-weight: 600; font-size: 15px">Build my weak-spot block</button>
</div>
</aside>
</div>
</main>

<div style="position: sticky; bottom: 20px; z-index: 6; margin-top: 36px; padding: 0 16px"><dc-import name="Dock" ask="“Give me 10 hard questions on diuretics”" hint-size="100%,66px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (on) => 'min-height:48px;padding:0 18px;border-radius:999px;font-size:15px;' + (on ? 'border:0;background:#F4F4F0;color:#050506;font-weight:600' : 'border:1px solid #3A3D45;background:transparent;color:#F4F4F0');
    const mk = (title, opts) => ({ title, opts: opts.map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: chip(on) })) });
    const groups = [
      mk('Mode', [['Timed', true], ['Tutor — explain after each', false], ['Untimed', false], ['Exam simulation', false]]),
      mk('Systems', [['Renal', true], ['Pharmacology', true], ['Cardiovascular', false], ['Respiratory', false], ['Gastrointestinal', false], ['Endocrine', false], ['Neurology', false], ['Microbiology', false], ['Biostatistics', false], ['All systems', false]]),
      mk('Which questions', [['Unused', true], ['Incorrect', true], ['Flagged', false], ['Correct', false], ['From my uploads', false]]),
      mk('Difficulty', [['Mixed', true], ['Easier', false], ['Harder', false]])
    ];
    return { groups };
  }
}
</script>
</body>
</html>
