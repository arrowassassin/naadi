<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Flashcard review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#C6FF3D}a:hover{color:#E2FF94}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="min-height: 100vh; background: #050506; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 16px 0 24px">
<div style="position: sticky; top: 16px; z-index: 5; padding: 0 16px"><dc-import name="Nav" active="practice" hint-size="100%,58px"></dc-import></div>

<main style="max-width: 980px; margin: 0 auto; padding: 48px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.03em">14 <span style="color: #8A8C92">/ 62</span></span>
<div role="img" aria-label="14 of 62 cards reviewed" style="flex: 1 1 200px; height: 6px; border-radius: 3px; background: #26282E"><div style="width: 23%; height: 6px; border-radius: 3px; background: #C6FF3D"></div></div>
<span style="font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid #3A3D45; color: #C9CBD1">Renal · from your highlight</span>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 14px">Edit card</button>
</header>

<section aria-label="Flashcard" style="{{cardStyle}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7">{{side}}</span>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 6vw, 76px); line-height: 0.98; letter-spacing: -0.04em">{{text}}</p>
<sc-if value="{{flipped}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<span style="font-family: Caveat, cursive; font-weight: 700; font-size: 34px; color: #5B45D6; transform: rotate(-3deg)">low aldo → K⁺ stays high!</span>
<a href="Chapter.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #050506; color: #050506; text-decoration: none; font-size: 14px">Open source page</a>
</div>
</sc-if>
<sc-if value="{{front}}" hint-placeholder-val="{{true}}">
<span style="font-size: 15px; opacity: 0.7">Say it, or write your answer with Pencil below — then flip.</span>
</sc-if>
</section>

<sc-if value="{{front}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{flip}}" style="min-height: 68px; border-radius: 999px; border: 0; background: #C6FF3D; color: #0B1400; font-weight: 600; font-size: 19px">Show answer</button>
</sc-if>
<sc-if value="{{flipped}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
<button type="button" onClick="{{flip}}" style="min-height: 68px; border-radius: 22px; border: 2px solid #FFB454; background: transparent; color: #FFB454; font-size: 17px; font-weight: 600">Again · 10 min</button>
<button type="button" onClick="{{flip}}" style="min-height: 68px; border-radius: 22px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 17px">Hard · 1 day</button>
<button type="button" onClick="{{flip}}" style="min-height: 68px; border-radius: 22px; border: 0; background: #F4F4F0; color: #050506; font-size: 17px; font-weight: 600">Good · 3 days</button>
<button type="button" onClick="{{flip}}" style="min-height: 68px; border-radius: 22px; border: 0; background: #C6FF3D; color: #0B1400; font-size: 17px; font-weight: 600">Easy · 7 days</button>
</div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 2 1 360px; min-width: 0; min-height: 150px; padding: 18px; border-radius: 28px; background-color: #0E0F12; background-image: radial-gradient(#34363D 1.2px, transparent 1.2px); background-size: 22px 22px; border: 1px solid #1F2126; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #9C9EA6">Scratch — write your answer</span>
<span style="font-family: Caveat, cursive; font-weight: 700; font-size: 36px; color: #C6FF3D">type 4 ?</span>
</div>
<div style="flex: 1 1 260px; min-width: 0; padding: 24px; border-radius: 28px; background: #17132E; border: 1px solid #2C2552; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #C4BAFF">Stuck?</span>
<button type="button" style="min-height: 48px; border-radius: 999px; border: 0; background: #F4F4F0; color: #050506; font-weight: 600; font-size: 14px">Give me a hint</button>
<button type="button" style="min-height: 48px; border-radius: 999px; border: 1px solid #5A4FA0; background: transparent; color: #E7E3FF; font-size: 14px">Explain it another way</button>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { flipped: false }; }
  renderVals() {
    const flipped = this.state.flipped;
    const base = 'min-height:420px;padding:clamp(28px,5vw,64px);border-radius:40px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:28px;';
    return {
      flipped, front: !flipped,
      side: flipped ? 'Answer' : 'Question',
      text: flipped ? 'Type 4 — too little aldosterone, or resistance to it.' : 'Which renal tubular acidosis causes hyperkalemia?',
      cardStyle: base + (flipped ? 'background:#F4F4F0;color:#050506' : 'background:#0E0F12;border:1px solid #26282E;color:#F4F4F0'),
      flip: () => this.setState({ flipped: !flipped })
    };
  }
}
</script>
</body>
</html>
