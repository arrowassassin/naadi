<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#C6FF3D}a:hover{color:#E2FF94}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #050506; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 16px 0 48px">
<div style="position: sticky; top: 16px; z-index: 5; padding: 0 16px"><dc-import name="Nav" active="none" hint-size="100%,58px"></dc-import></div>

<main style="max-width: 1320px; margin: 0 auto; padding: 64px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(56px, 10vw, 136px); line-height: 0.88; letter-spacing: -0.05em">Make it<br><span style="color: #8A8C92">yours.</span></h1>
<div style="display: flex; align-items: center; gap: 16px; padding: 16px 24px 16px 16px; border-radius: 999px; background: #0E0F12; border: 1px solid #1F2126">
<span style="width: 64px; height: 64px; border-radius: 50%; background: #17132E; border: 1px solid #3A3170; color: #C4BAFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">[A]</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 18px">Dr. [NAME]</span><span style="font-size: 13px; color: #9C9EA6">MBBS · [COLLEGE] · [EMAIL]</span></span>
</div>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section style="padding: 28px; border-radius: 32px; background: #0E0F12; border: 1px solid #1F2126; display: flex; flex-direction: column">
<h2 style="margin: 0 0 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em">{{g.title}}</h2>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 16px; min-height: 60px; border-top: 1px solid #1F2126">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px">{{r.name}}</span><span style="font-size: 13px; color: #9C9EA6">{{r.note}}</span></span>
<sc-if value="{{r.toggle}}" hint-placeholder-val="{{true}}"><input type="checkbox" checked="{{r.on}}" style="width: 26px; height: 26px; accent-color: #C6FF3D"></sc-if>
<sc-if value="{{r.hasValue}}" hint-placeholder-val="{{false}}"><span style="min-height: 44px; display: flex; align-items: center; padding: 0 16px; border-radius: 999px; border: 1px solid #3A3D45; font-size: 14px; white-space: nowrap">{{r.value}}</span></sc-if>
</label>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (name, note, on) => ({ name, note, toggle: true, hasValue: false, on, value: '' });
    const v = (name, note, value) => ({ name, note, toggle: false, hasValue: true, on: false, value });
    const groups = [
      { title: 'Pencil & ink', rows: [t('Ink on every page', 'Chapters, questions, cards and PDFs', true), t('Only Pencil draws', 'Finger scrolls and taps', true), v('Double-tap Pencil', 'Switch between two tools', 'Pen ↔ eraser'), t('Make handwriting searchable', 'Recognised on this device', true), v('Default paper', 'For new notebook pages', 'Ruled')] },
      { title: 'Study plan', rows: [v('Exam', 'Changes the whole plan', 'Step 1 · [EXAM DATE]'), v('Daily hours', 'Used by the planner', '6 h'), v('Rest day', 'Kept free when Naadi rebalances', 'Sunday'), t('Auto-rebalance after a missed day', 'Naadi asks before moving anything', true)] },
      { title: 'Appearance', rows: [v('Theme', 'Dark, paper, or follow the device', 'Dark'), v('Reading text size', 'Chapters and questions', 'Large'), t('Reduce motion', 'Turns off drawing and slide animations', false), t('High-contrast mode', 'Stronger borders and text', false)] },
      { title: 'Offline', rows: [t('Download this week automatically', 'Chapters, questions and cards in the plan', true), v('Video quality', 'For downloads', '1080p'), v('Stored on this iPad', '[N] GB', 'Manage'), t('Sync notes over mobile data', '', false)] },
      { title: 'Naadi assistant', rows: [t('Search the web when needed', 'Always shows its sources', true), t('Use my notes and uploads', 'To answer questions', true), t('Stay silent in exam mode', 'Matches test-day conditions', true), v('Voice', 'Read answers aloud', 'Off')] },
      { title: 'Data & export', rows: [v('Export notebooks', 'Ink and typed notes', 'PDF'), v('Export flashcards', '', 'Anki deck'), v('Calendar sync', 'Google or Apple calendar', 'Connect'), v('Reminders', 'Daily plan and cards due', '07:00')] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
