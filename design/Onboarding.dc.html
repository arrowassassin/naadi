<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Set up your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#C6FF3D}a:hover{color:#E2FF94}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #050506; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 24px 0 48px">
<div style="max-width: 1320px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px"><span style="width: 32px; height: 32px; border-radius: 50%; background: #C6FF3D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l3-7 4 14 3-7h6"></path></svg></span>Naadi</span>
<ol aria-label="Setup steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<li style="{{s.style}}">{{s.label}}</li>
</sc-for>
</ol>
</header>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(56px, 10vw, 148px); line-height: 0.88; letter-spacing: -0.05em">When is<br>the big day<span style="color: #C6FF3D">?</span></h1>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<form style="flex: 2 1 520px; min-width: 0; padding: 36px; border-radius: 32px; background: #0E0F12; border: 1px solid #1F2126; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #9C9EA6">Which exam</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 56px; padding: 0 26px; border-radius: 999px; border: 0; background: #F4F4F0; color: #050506; font-weight: 600; font-size: 17px">Step 1</button>
<button type="button" style="min-height: 56px; padding: 0 26px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 17px">Step 2 CK</button>
<button type="button" style="min-height: 56px; padding: 0 26px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 17px">Step 3</button>
<button type="button" style="min-height: 56px; padding: 0 26px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 17px">OET Medicine</button>
</div>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #C9CBD1">Exam date<input type="date" style="min-height: 56px; padding: 0 18px; border-radius: 18px; border: 1px solid #3A3D45; background: #050506; color: #F4F4F0; font-size: 17px"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #C9CBD1">Medical school<input type="text" placeholder="[MEDICAL COLLEGE, CITY]" style="min-height: 56px; padding: 0 18px; border-radius: 18px; border: 1px solid #3A3D45; background: #050506; color: #F4F4F0; font-size: 17px"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #C9CBD1"><span style="display: flex; justify-content: space-between"><span>Hours you can study on a normal day</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; color: #F4F4F0">6 h</span></span><input type="range" min="1" max="14" value="6" style="width: 100%; height: 44px; accent-color: #C6FF3D"></label>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; color: #C9CBD1">Study days</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.on}}" style="{{d.style}}">{{d.label}}</button>
</sc-for>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; color: #C9CBD1">What you already use — Naadi will plan around it</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</fieldset>
</form>

<aside aria-label="Plan preview" style="flex: 1 1 320px; min-width: 0; padding: 36px; border-radius: 32px; background: #C6FF3D; color: #0B1400; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 28px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase">Your plan so far</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 120px; line-height: 0.85; letter-spacing: -0.06em">11</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">weeks, six days a week.</span>
</div>
<p style="margin: 0; font-size: 16px; font-weight: 500">Next: a 40-question diagnostic so the plan starts from what you already know, not from page one.</p>
<a href="Qbank.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 999px; background: #0B1400; color: #C6FF3D; text-decoration: none; font-weight: 600; font-size: 17px">Take the diagnostic</a>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = 'min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:999px;font-size:13px;';
    const steps = ['1 Goal', '2 Schedule', '3 Materials', '4 Diagnostic', '5 Plan'].map((label, i) => ({
      label, style: pill + (i === 0 ? 'background:#F4F4F0;color:#050506;font-weight:600' : 'border:1px solid #26282E;color:#C9CBD1')
    }));
    const chip = (on) => 'min-height:48px;padding:0 18px;border-radius:999px;font-size:15px;' + (on ? 'border:0;background:#F4F4F0;color:#050506;font-weight:600' : 'border:1px dashed #5A5D66;background:transparent;color:#C9CBD1');
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((label, i) => ({ label, on: i < 6 ? 'true' : 'false', style: chip(i < 6) }));
    const tools = [['A question bank', true], ['A review book', true], ['Anki decks', true], ['Video course', false], ['My own PDFs', true], ['Nothing yet', false]].map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: chip(on) }));
    return { steps, days, tools };
  }
}
</script>
</body>
</html>
