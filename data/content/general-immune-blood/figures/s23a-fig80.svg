<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" aria-label="Timeline of primitive reflexes and the parachute reaction from birth to 24 months"><title>Timeline of primitive reflexes and the parachute reaction from birth to 24 months</title><rect x="0" y="0" width="960" height="412" fill="#ffffff"/><text x="480" y="28" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#4a4a4a">Primitive reflexes and the parachute reaction, birth to 24 months</text><text x="200" y="74" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Moro</text><rect x="210.0" y="60" width="91.7" height="20" fill="#2f6fb0"/><rect x="301.7" y="60" width="45.8" height="20" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="353.5" y="74" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a4a4a">gone by about 4–6 mo</text><text x="200" y="108" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Rooting</text><rect x="210.0" y="94" width="68.8" height="20" fill="#2f6fb0"/><rect x="278.8" y="94" width="22.9" height="20" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="307.6666666666667" y="108" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a4a4a">gone by about 3–4 mo</text><text x="200" y="142" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Palmar grasp</text><rect x="210.0" y="128" width="91.7" height="20" fill="#2f6fb0"/><rect x="301.7" y="128" width="45.8" height="20" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="353.5" y="142" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a4a4a">gone by about 4–6 mo</text><text x="200" y="176" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Asymmetric tonic neck</text><rect x="210.0" y="162" width="91.7" height="20" fill="#2f6fb0"/><rect x="301.7" y="162" width="45.8" height="20" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="353.5" y="176" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a4a4a">gone by about 4–6 mo</text><text x="200" y="210" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Plantar grasp</text><rect x="210.0" y="196" width="206.2" height="20" fill="#2f6fb0"/><rect x="416.2" y="196" width="68.8" height="20" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="491.0" y="210" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a4a4a">gone by about 9–12 mo</text><text x="200" y="244" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Extensor plantar response</text><rect x="210.0" y="230" width="275.0" height="20" fill="#2f6fb0"/><rect x="485.0" y="230" width="275.0" height="20" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="766.0" y="244" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a4a4a">gone by about 12–24 mo</text><text x="200" y="278" font-family="sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#4a4a4a">Parachute reaction</text><rect x="393.3" y="264" width="22.9" height="20" fill="#ffffff" stroke="#b0552f" stroke-width="2" stroke-dasharray="5 3"/><rect x="416.2" y="264" width="343.8" height="20" fill="#b0552f"/><text x="387.33333333333337" y="278" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">appears 8–9 mo, lifelong</text><line x1="210" y1="304" x2="760" y2="304" stroke="#4a4a4a" stroke-width="1.5"/><line x1="210.0" y1="304" x2="210.0" y2="310" stroke="#4a4a4a"/><text x="210.0" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">0</text><line x1="278.8" y1="304" x2="278.8" y2="310" stroke="#4a4a4a"/><text x="278.75" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">3</text><line x1="347.5" y1="304" x2="347.5" y2="310" stroke="#4a4a4a"/><text x="347.5" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">6</text><line x1="416.2" y1="304" x2="416.2" y2="310" stroke="#4a4a4a"/><text x="416.25" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">9</text><line x1="485.0" y1="304" x2="485.0" y2="310" stroke="#4a4a4a"/><text x="485.0" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">12</text><line x1="553.8" y1="304" x2="553.8" y2="310" stroke="#4a4a4a"/><text x="553.75" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">15</text><line x1="622.5" y1="304" x2="622.5" y2="310" stroke="#4a4a4a"/><text x="622.5" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">18</text><line x1="691.2" y1="304" x2="691.2" y2="310" stroke="#4a4a4a"/><text x="691.25" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">21</text><line x1="760.0" y1="304" x2="760.0" y2="310" stroke="#4a4a4a"/><text x="760.0" y="324" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">24</text><text x="485.0" y="342" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Age (months)</text><rect x="120" y="362" width="28" height="14" fill="#2f6fb0"/><text x="154" y="374" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4a4a4a">reflex reliably present</text><rect x="330" y="362" width="28" height="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="5 3"/><text x="364" y="374" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4a4a4a">usual window of disappearance (or emergence)</text><text x="480" y="398" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Persistence beyond the window, or asymmetry, warrants neurological evaluation.</text></svg>