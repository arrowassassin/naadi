<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" aria-label="Order and approximate timing of pubertal events in girls and boys"><title>Order and approximate timing of pubertal events in girls and boys</title><rect x="0" y="0" width="800" height="376" fill="#ffffff"/><text x="400" y="28" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#4a4a4a">Usual order of pubertal events (average ages, wide normal range)</text><text x="20" y="115" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#4a4a4a">Girls</text><line x1="120" y1="110" x2="760" y2="110" stroke="#d9d9d9" stroke-width="6"/><rect x="267.2" y="84" width="160.0" height="14" fill="#f0d5c9"/><text x="356.79999999999995" y="79" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a4a4a">growth spurt (peak height velocity)</text><polygon points="350.8,98 362.8,98 356.8,106" fill="#b0552f"/><circle cx="280.0" cy="110" r="7" fill="#b0552f"/><text x="280.0" y="136" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">1. breast budding</text><circle cx="324.8" cy="110" r="7" fill="#b0552f"/><text x="324.79999999999995" y="152" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">2. pubic hair</text><circle cx="414.4" cy="110" r="7" fill="#b0552f"/><text x="414.4" y="136" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">3. menarche</text><text x="20" y="235" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#4a4a4a">Boys</text><line x1="120" y1="230" x2="760" y2="230" stroke="#d9d9d9" stroke-width="6"/><rect x="408.0" y="204" width="179.2" height="14" fill="#c9dbee"/><text x="491.20000000000005" y="199" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a4a4a">growth spurt (peak height velocity)</text><polygon points="485.2,218 497.2,218 491.2,226" fill="#2f6fb0"/><circle cx="344.0" cy="230" r="7" fill="#2f6fb0"/><text x="344.0" y="256" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">1. testicular enlargement</text><circle cx="395.2" cy="230" r="7" fill="#2f6fb0"/><text x="395.20000000000005" y="272" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">2. pubic hair, penile growth</text><circle cx="529.6" cy="230" r="7" fill="#2f6fb0"/><text x="529.6" y="256" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">3. voice change, facial hair</text><line x1="120" y1="300" x2="760" y2="300" stroke="#4a4a4a" stroke-width="1.5"/><line x1="120.0" y1="300" x2="120.0" y2="306" stroke="#4a4a4a"/><text x="120.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">8</text><line x1="184.0" y1="300" x2="184.0" y2="306" stroke="#4a4a4a"/><text x="184.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">9</text><line x1="248.0" y1="300" x2="248.0" y2="306" stroke="#4a4a4a"/><text x="248.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">10</text><line x1="312.0" y1="300" x2="312.0" y2="306" stroke="#4a4a4a"/><text x="312.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">11</text><line x1="376.0" y1="300" x2="376.0" y2="306" stroke="#4a4a4a"/><text x="376.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">12</text><line x1="440.0" y1="300" x2="440.0" y2="306" stroke="#4a4a4a"/><text x="440.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">13</text><line x1="504.0" y1="300" x2="504.0" y2="306" stroke="#4a4a4a"/><text x="504.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">14</text><line x1="568.0" y1="300" x2="568.0" y2="306" stroke="#4a4a4a"/><text x="568.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">15</text><line x1="632.0" y1="300" x2="632.0" y2="306" stroke="#4a4a4a"/><text x="632.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">16</text><line x1="696.0" y1="300" x2="696.0" y2="306" stroke="#4a4a4a"/><text x="696.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">17</text><line x1="760.0" y1="300" x2="760.0" y2="306" stroke="#4a4a4a"/><text x="760.0" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">18</text><text x="440.0" y="338" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Age (years)</text><text x="400" y="362" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Girls: spurt early, before menarche. Boys: first sign is testicular growth; spurt comes later.</text></svg>