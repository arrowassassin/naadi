<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" aria-label="Schistocyte shapes: helmet cell, triangular fragment, keratocyte and microspherocyte, with a diagram of how a red cell is cut"><title>Schistocyte shapes: helmet cell, triangular fragment, keratocyte and microspherocyte, with a diagram of how a red cell is cut</title><rect x="0" y="0" width="800" height="350" fill="#ffffff"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#333333"/></marker></defs><text x="400" y="30" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#333333">Red cell shapes on a peripheral smear in fragmentation hemolysis</text><circle cx="80" cy="110" r="26" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><circle cx="80" cy="110" r="9.9" fill="#f7e3e3"/><path d="M 207 118 A 28 28 0 0 1 263 118 L 269 104 L 255 124 L 215 124 L 201 104 Z" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><polygon points="374,132 428,128 402,84" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5" stroke-linejoin="round"/><path d="M 555 86 L 561 102 L 569 102 L 575 86 A 26 26 0 1 1 555 86 Z" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><circle cx="720" cy="110" r="15" fill="#c98585" stroke="#a05050" stroke-width="1.5"/><text x="80" y="172" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Normal discocyte</text><text x="80" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">central pallor</text><text x="235" y="172" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Helmet cell</text><text x="235" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">straight cut edge</text><text x="400" y="172" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Triangular fragment</text><text x="400" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">sharp angles</text><text x="565" y="172" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Keratocyte</text><text x="565" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">paired horns</text><text x="720" y="172" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Microspherocyte</text><text x="720" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">small, no pallor</text><rect x="40" y="220" width="720" height="110" rx="8" fill="#eeeeee" stroke="#888888"/><text x="400" y="245" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#333333">How fragments form</text><line x1="120" y1="290" x2="680" y2="290" stroke="#5b4a9e" stroke-width="3"/><text x="400" y="280" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b4a9e">fibrin strand or high-shear jet</text><circle cx="200" cy="290" r="18" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><path d="M 360 272 A 18 18 0 0 1 360 308" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><path d="M 372 272 A 18 18 0 0 0 372 308" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><polygon points="560,300 590,302 574,276" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><text x="200" y="322" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">intact cell</text><text x="366" y="322" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">cell cut</text><text x="575" y="322" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">fragment in blood</text><path d="M 232 290 L 330 290" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/><path d="M 400 290 L 540 290" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/></svg>
