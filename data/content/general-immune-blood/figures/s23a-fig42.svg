<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" aria-label="Heme synthesis pathway with mitochondrial and cytosolic steps and the enzyme deficiency of each disorder"><title>Heme synthesis and its disorders</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444444"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a65a1e"/></marker></defs><rect x="0" y="0" width="1000" height="600" fill="#ffffff"/><rect x="20" y="40" width="470" height="530" rx="12" fill="#eef4fa" stroke="#2f5d8a" stroke-width="2"/><rect x="510" y="40" width="470" height="530" rx="12" fill="#f6f6f6" stroke="#888888" stroke-width="2"/><text x="255" y="30" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Mitochondrion</text><text x="745" y="30" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Cytosol</text><rect x="50" y="70" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="150.0" y="92" font-family="sans-serif" font-size="13" text-anchor="middle">Glycine + succinyl-CoA</text><line x1="150" y1="104" x2="150" y2="150" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="165" y="122" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">ALA synthase (B6 cofactor; rate-limiting)</text><text x="165" y="138" font-family="sans-serif" font-size="12" fill="#222222">Disorder: X-linked sideroblastic anemia (ALAS2)</text><rect x="50" y="152" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="150.0" y="174" font-family="sans-serif" font-size="13" text-anchor="middle">δ-Aminolevulinic acid (ALA)</text><line x1="250" y1="169" x2="538" y2="169" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="380" y="161" font-family="sans-serif" font-size="12" fill="#222222">exported</text><rect x="540" y="152" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="640.0" y="174" font-family="sans-serif" font-size="13" text-anchor="middle">ALA</text><line x1="640" y1="186" x2="640" y2="232" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="655" y="204" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">ALA dehydratase</text><text x="655" y="220" font-family="sans-serif" font-size="12" fill="#222222">Inhibited by lead</text><rect x="540" y="234" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="640.0" y="256" font-family="sans-serif" font-size="13" text-anchor="middle">Porphobilinogen (PBG)</text><line x1="640" y1="268" x2="640" y2="314" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="655" y="286" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">PBG deaminase</text><text x="655" y="302" font-family="sans-serif" font-size="12" fill="#222222">Disorder: acute intermittent porphyria</text><rect x="540" y="316" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="640.0" y="338" font-family="sans-serif" font-size="13" text-anchor="middle">Hydroxymethylbilane</text><line x1="640" y1="350" x2="640" y2="396" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="655" y="368" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Uroporphyrinogen III synthase</text><text x="655" y="384" font-family="sans-serif" font-size="12" fill="#222222">Disorder: congenital erythropoietic porphyria</text><rect x="540" y="398" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="640.0" y="420" font-family="sans-serif" font-size="13" text-anchor="middle">Uroporphyrinogen III</text><line x1="640" y1="432" x2="640" y2="478" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="655" y="450" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Uroporphyrinogen decarboxylase</text><text x="655" y="466" font-family="sans-serif" font-size="12" fill="#222222">Disorder: porphyria cutanea tarda</text><rect x="540" y="480" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="640.0" y="502" font-family="sans-serif" font-size="13" text-anchor="middle">Coproporphyrinogen III</text><line x1="540" y1="497" x2="252" y2="497" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="372" y="489" font-family="sans-serif" font-size="12" fill="#222222">imported</text><rect x="50" y="480" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="150.0" y="502" font-family="sans-serif" font-size="13" text-anchor="middle">Coproporphyrinogen III</text><line x1="150" y1="480" x2="150" y2="434" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="165" y="462" font-family="sans-serif" font-size="12" fill="#222222">Two oxidase steps</text><rect x="50" y="398" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="150.0" y="420" font-family="sans-serif" font-size="13" text-anchor="middle">Protoporphyrin IX</text><line x1="150" y1="398" x2="150" y2="352" stroke="#444444" stroke-width="2" marker-end="url(#ah)"/><text x="165" y="370" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Ferrochelatase + Fe2+ (lead inhibits)</text><text x="165" y="386" font-family="sans-serif" font-size="12" fill="#222222">Disorder: erythropoietic protoporphyria</text><rect x="50" y="316" width="200" height="34" rx="6" fill="#ffffff" stroke="#555555"/><text x="150.0" y="338" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Heme</text><path d="M50,333 C26,300 26,120 48,90" fill="none" stroke="#a65a1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahb)"/><text x="64" y="232" font-family="sans-serif" font-size="12" fill="#a65a1e">Heme represses</text><text x="64" y="248" font-family="sans-serif" font-size="12" fill="#a65a1e">hepatic ALA synthase</text><text x="64" y="264" font-family="sans-serif" font-size="12" fill="#a65a1e">(negative feedback)</text><text x="500" y="592" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">Early precursors (ALA, PBG): neurovisceral attacks. Later porphyrins: photosensitivity.</text></svg>