<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" aria-label="Complement pathways, their regulators and what CH50 and AH50 measure">
<title>Complement pathways, regulators and screening assays</title>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="456" fill="#ffffff"/>
<text x="380" y="28" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Three entry routes, one C3 hub, one terminal lytic pathway</text>
<g font-family="sans-serif" font-size="13" fill="#222">
<rect x="20" y="56" width="220" height="62" rx="8" fill="#eeeeee" stroke="#555"/>
<text x="130" y="78" text-anchor="middle" font-weight="bold">Classical</text><text x="130" y="96" text-anchor="middle">IgG/IgM–antigen binds C1q</text><text x="130" y="112" text-anchor="middle">C1r, C1s → C4, C2</text>
<rect x="20" y="140" width="220" height="50" rx="8" fill="#eeeeee" stroke="#555"/>
<text x="130" y="162" text-anchor="middle" font-weight="bold">Lectin</text><text x="130" y="180" text-anchor="middle">MBL/ficolin + MASPs → C4, C2</text>
<rect x="20" y="214" width="220" height="62" rx="8" fill="#eeeeee" stroke="#555"/>
<text x="130" y="236" text-anchor="middle" font-weight="bold">Alternative</text><text x="130" y="254" text-anchor="middle">spontaneous C3 tick-over</text><text x="130" y="270" text-anchor="middle">factor B, factor D, properdin</text>
<rect x="320" y="130" width="130" height="70" rx="8" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="385" y="156" text-anchor="middle" font-weight="bold">C3 convertase</text><text x="385" y="174" text-anchor="middle">C3 → C3a + C3b</text><text x="385" y="191" text-anchor="middle">(opsonin)</text>
<rect x="510" y="130" width="100" height="70" rx="8" fill="#eeeeee" stroke="#555"/>
<text x="560" y="160" text-anchor="middle" font-weight="bold">C5</text><text x="560" y="178" text-anchor="middle">→ C5a + C5b</text>
<rect x="640" y="122" width="110" height="86" rx="8" fill="#eeeeee" stroke="#555"/>
<text x="695" y="146" text-anchor="middle" font-weight="bold">MAC</text><text x="695" y="164" text-anchor="middle">C5b–C9</text><text x="695" y="182" text-anchor="middle">lysis of thin-</text><text x="695" y="198" text-anchor="middle">walled Neisseria</text>
</g>
<g stroke="#555" stroke-width="2" fill="none" marker-end="url(#b)">
<path d="M240,87 C285,95 295,140 318,150"/><line x1="240" y1="165" x2="318" y2="165"/><path d="M240,245 C285,235 295,190 318,182"/>
<line x1="450" y1="165" x2="508" y2="165"/><line x1="610" y1="165" x2="638" y2="165"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#7a1f9c">
<rect x="20" y="296" width="220" height="40" rx="6" fill="#ffffff" stroke="#7a1f9c" stroke-dasharray="5,3"/>
<text x="130" y="314" text-anchor="middle">Regulator: C1 inhibitor (also blocks</text><text x="130" y="329" text-anchor="middle">kallikrein → less bradykinin)</text>
<rect x="290" y="226" width="190" height="40" rx="6" fill="#ffffff" stroke="#7a1f9c" stroke-dasharray="5,3"/>
<text x="385" y="244" text-anchor="middle">Regulators: factor H, factor I</text><text x="385" y="259" text-anchor="middle">(limit C3b on host cells)</text>
<rect x="510" y="226" width="160" height="40" rx="6" fill="#ffffff" stroke="#7a1f9c" stroke-dasharray="5,3"/>
<text x="590" y="244" text-anchor="middle">Drug: eculizumab or</text><text x="590" y="259" text-anchor="middle">ravulizumab binds C5</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#222">
<line x1="20" y1="352" x2="740" y2="352" stroke="#999"/>
<text x="20" y="372" font-weight="bold">CH50 (classical lytic assay) needs C1q through C9.</text>
<text x="20" y="388" font-weight="bold">AH50 (alternative lytic assay) needs factor B, factor D, properdin and C3 through C9.</text>
<text x="20" y="408">Both low: C3 or C5–C9 missing, or C3 consumed (factor H or I loss).   CH50 low, AH50 normal: C1q, C1r/s, C4, C2.</text>
<text x="20" y="424">CH50 normal, AH50 low: factor B, factor D or properdin.   MBL loss is missed by both assays.</text>
<text x="20" y="440">A falsely low CH50 follows delayed or warm specimen handling: repeat on a properly handled sample.</text>
</g>
</svg>
