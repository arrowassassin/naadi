<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" role="img" aria-label="Flow chart for suspected deep vein thrombosis using Wells pretest probability, D-dimer and compression ultrasonography."><title>DVT diagnostic pathway</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bd3"/></marker></defs><rect x="0" y="0" width="900" height="465" fill="#ffffff"/><text x="450" y="30" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Suspected lower-limb DVT: pretest probability first</text><rect x="320" y="48" width="260" height="44" rx="8" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="1.5"/><text x="450.0" y="66.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Clinical suspicion of DVT</text><text x="450.0" y="82.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">estimate pretest probability (Wells)</text><line x1="400" y1="92" x2="230" y2="126" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><line x1="500" y1="92" x2="670" y2="126" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="100" y="128" width="260" height="40" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="230.0" y="152.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">DVT unlikely (Wells 1 or less)</text><rect x="540" y="128" width="260" height="40" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="670.0" y="152.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">DVT likely (Wells 2 or more)</text><line x1="230" y1="168" x2="230" y2="196" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="110" y="198" width="240" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="230.0" y="222.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">High-sensitivity D-dimer</text><line x1="180" y1="238" x2="110" y2="282" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><text x="110" y="262" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">negative</text><line x1="280" y1="238" x2="360" y2="282" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><text x="355" y="262" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">positive</text><rect x="20" y="284" width="180" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="110.0" y="303.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">DVT excluded</text><text x="110.0" y="318.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">no imaging, no treatment</text><line x1="670" y1="168" x2="670" y2="196" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="540" y="198" width="260" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="670.0" y="222.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">Compression ultrasonography</text><rect x="300" y="284" width="220" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="410.0" y="308.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">Compression ultrasonography</text><line x1="410" y1="324" x2="410" y2="352" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="300" y="354" width="220" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="410.0" y="373.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Positive: treat</text><text x="410.0" y="388.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Negative: DVT excluded</text><line x1="620" y1="238" x2="600" y2="282" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><text x="575" y="262" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">positive</text><line x1="720" y1="238" x2="780" y2="282" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><text x="790" y="262" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">negative</text><rect x="540" y="284" width="130" height="46" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="605.0" y="311.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Anticoagulate</text><rect x="690" y="284" width="190" height="80" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="785.0" y="313.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Proximal scan only:</text><text x="785.0" y="328.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">D-dimer or repeat</text><text x="785.0" y="343.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">ultrasound in about 1 week</text><text x="450" y="430" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">If imaging will be delayed and pretest probability is high, start anticoagulation while waiting (unless bleeding risk is high).</text><text x="450" y="448" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">D-dimer is less useful in pregnancy, after surgery, in cancer, in older adults and in inpatients: specificity falls.</text></svg>