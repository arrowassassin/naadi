<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" aria-label="Laboratory HIV testing algorithm from the antigen/antibody screen to the differentiation assay and HIV-1 RNA">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<g font-family="sans-serif" font-size="12" fill="#222" text-anchor="middle">
<rect x="230" y="10" width="260" height="44" rx="6" fill="#f4f4f4" stroke="#555"/><text x="360" y="29">HIV-1/2 antigen/antibody</text><text x="360" y="45">immunoassay (screen)</text>
<rect x="20" y="90" width="180" height="40" rx="6" fill="#fff" stroke="#555"/><text x="110" y="108">Nonreactive:</text><text x="110" y="123">no infection*</text>
<rect x="400" y="90" width="300" height="44" rx="6" fill="#f4f4f4" stroke="#555"/><text x="550" y="109">Reactive → HIV-1/HIV-2 antibody</text><text x="550" y="125">differentiation immunoassay</text>
<rect x="250" y="175" width="140" height="44" rx="6" fill="#fff" stroke="#555"/><text x="320" y="194">HIV-1 positive</text><text x="320" y="210">(or HIV-2 positive)</text>
<rect x="410" y="175" width="290" height="44" rx="6" fill="#f4f4f4" stroke="#555"/><text x="555" y="194">Negative or indeterminate</text><text x="555" y="210">→ HIV-1 RNA (nucleic acid test)</text>
<rect x="410" y="245" width="135" height="44" rx="6" fill="#fff" stroke="#555"/><text x="477" y="264">RNA positive:</text><text x="477" y="280">acute HIV-1</text>
<rect x="565" y="245" width="135" height="44" rx="6" fill="#fff" stroke="#555"/><text x="632" y="264">RNA negative:</text><text x="632" y="280">false-positive screen</text>
</g>
<g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
<path d="M300,54 L130,88"/><path d="M420,54 L520,88"/><path d="M500,134 L340,173"/><path d="M570,134 L570,173"/><path d="M500,219 L480,243"/><path d="M610,219 L630,243"/>
</g>
<text x="20" y="160" font-family="sans-serif" font-size="11" fill="#222">*If exposure was very recent or</text>
<text x="20" y="175" font-family="sans-serif" font-size="11" fill="#222">acute HIV is suspected, test HIV-1 RNA.</text>
</svg>
