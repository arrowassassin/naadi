<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" aria-label="Diagram of anticoagulant and antiplatelet drug targets with their reversal agents"><title>Diagram of anticoagulant and antiplatelet drug targets with their reversal agents</title><rect x="0" y="0" width="900" height="450" fill="#ffffff"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#333333"/></marker></defs><text x="450" y="28" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#333333">Where antithrombotic drugs act, and what reverses them</text><text x="275" y="58" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#333333">Coagulation (fibrin)</text><rect x="210" y="70" width="130" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="92.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Factor Xa</text><rect x="210" y="150" width="130" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="172.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Thrombin (IIa)</text><rect x="210" y="230" width="130" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="252.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Fibrin clot</text><path d="M 275 104 L 275 146" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/><path d="M 275 184 L 275 226" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/><rect x="10" y="296" width="330" height="50" rx="6" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/><text x="175.0" y="326.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333"></text><text x="175" y="316" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">Vitamin K-dependent synthesis of</text><text x="175" y="334" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">II, VII, IX, X (and proteins C, S)</text><text x="12" y="84" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5b4a9e">apixaban, rivaroxaban,</text><text x="12" y="99" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5b4a9e">edoxaban (direct)</text><text x="12" y="126" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5b4a9e">heparins via antithrombin:</text><text x="12" y="141" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5b4a9e">UFH Xa = IIa; LMWH Xa > IIa</text><text x="12" y="164" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5b4a9e">dabigatran, argatroban,</text><text x="12" y="179" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5b4a9e">bivalirudin (direct)</text><text x="175" y="368" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b4a9e">warfarin blocks VKORC1 recycling of vitamin K</text><text x="660" y="58" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#333333">Platelet activation and aggregation</text><ellipse cx="660" cy="160" rx="125" ry="80" fill="#f4f1fb" stroke="#333333" stroke-width="1.5"/><text x="660" y="122" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">COX-1 to thromboxane A2</text><text x="660" y="162" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">P2Y12 (ADP receptor)</text><text x="660" y="198" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">GP IIb/IIIa (binds fibrinogen)</text><text x="660" y="260" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b4a9e">aspirin: irreversible COX-1 acetylation</text><text x="660" y="276" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b4a9e">clopidogrel, prasugrel, ticagrelor: P2Y12</text><text x="660" y="292" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b4a9e">eptifibatide, tirofiban: GP IIb/IIIa</text><rect x="380" y="310" width="510" height="130" rx="8" fill="#ffffff" stroke="#888888"/><text x="635" y="330" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Reversal (life-threatening bleeding)</text><text x="395" y="352" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#333333">Warfarin</text><text x="575" y="352" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">IV vitamin K + 4-factor PCC</text><text x="395" y="374" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#333333">Dabigatran</text><text x="575" y="374" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">idarucizumab (binds drug)</text><text x="395" y="396" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#333333">Oral Xa inhibitors</text><text x="575" y="396" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">andexanet alfa or 4-factor PCC</text><text x="395" y="418" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#333333">Unfractionated heparin</text><text x="575" y="418" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">protamine (partial for LMWH)</text></svg>
