<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Schematic of the coagulation cascade showing intrinsic, extrinsic and common pathways, antithrombin and protein C/S inhibition sites, and anticoagulant drug targets."><title>Coagulation cascade and its regulators</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bd3"/></marker></defs><rect x="0" y="0" width="900" height="520" fill="#ffffff"/><text x="450" y="30" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Coagulation cascade, natural anticoagulants and drug targets</text><text x="170" y="62" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f5bd3">Intrinsic (aPTT)</text><rect x="110" y="72" width="120" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="170.0" y="93.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">XII → XIIa</text><line x1="170" y1="106" x2="170" y2="124" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="110" y="126" width="120" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="170.0" y="147.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">XI → XIa</text><line x1="170" y1="160" x2="170" y2="178" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="90" y="180" width="160" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="170.0" y="201.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">IX → IXa (+ VIIIa)</text><text x="700" y="62" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f5bd3">Extrinsic (PT)</text><rect x="610" y="126" width="180" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="700.0" y="147.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">Tissue factor + VIIa</text><text x="640" y="270" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f5bd3">Common pathway</text><text x="640" y="286" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f5bd3">(PT and aPTT)</text><line x1="170" y1="214" x2="400" y2="249" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><line x1="700" y1="160" x2="500" y2="249" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="370" y="250" width="160" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="450.0" y="271.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">X → Xa (+ Va)</text><line x1="450" y1="284" x2="450" y2="304" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340" y="306" width="220" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="450.0" y="327.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">Prothrombin (II) → thrombin (IIa)</text><line x1="450" y1="340" x2="450" y2="360" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="340" y="362" width="220" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="450.0" y="383.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">Fibrinogen → fibrin monomer</text><line x1="450" y1="396" x2="450" y2="416" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="320" y="418" width="260" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="450.0" y="439.55" font-family="sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">XIIIa cross-links fibrin (stable clot)</text><text x="700" y="316" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">Positive feedback: thrombin</text><text x="700" y="332" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">activates V, VIII, XI, XIII</text><text x="700" y="348" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">and platelets</text><rect x="20" y="300" width="250" height="74" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/><text x="145.0" y="326.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Antithrombin</text><text x="145.0" y="341.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">inactivates IIa, Xa (and IXa, XIa)</text><text x="145.0" y="356.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">heparins accelerate it</text><line x1="270" y1="330" x2="338" y2="323" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA2)"/><line x1="270" y1="316" x2="368" y2="272" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA2)"/><rect x="300" y="96" width="270" height="74" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/><text x="435.0" y="122.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Activated protein C + protein S</text><text x="435.0" y="137.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">inactivate Va and VIIIa</text><text x="435.0" y="152.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">(thrombomodulin-thrombin activates C)</text><line x1="300" y1="150" x2="252" y2="190" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA2)"/><line x1="470" y1="170" x2="470" y2="248" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA2)"/><rect x="630" y="360" width="250" height="116" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="755.0" y="377.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Drug targets</text><text x="755.0" y="392.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Apixaban, rivaroxaban,</text><text x="755.0" y="407.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">edoxaban: direct Xa</text><text x="755.0" y="422.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Dabigatran, argatroban,</text><text x="755.0" y="437.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">bivalirudin: direct IIa</text><text x="755.0" y="452.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Warfarin: synthesis of II, VII, IX,</text><text x="755.0" y="467.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">X and proteins C and S</text><text x="450" y="505" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">Solid arrows: activation. Dashed boxes and arrows: natural anticoagulants and where they act.</text></svg>