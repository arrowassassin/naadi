<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" aria-label="Schematic alkaline hemoglobin electrophoresis lanes for six genotypes">
<title>Schematic hemoglobin electrophoresis at alkaline pH</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<g font-family="sans-serif" fill="#222">
<text x="450" y="26" font-size="16" text-anchor="middle" font-weight="bold">Alkaline electrophoresis (schematic, not to scale)</text>
<text x="40" y="62" font-size="13" font-weight="bold">Cathode (−), origin</text>
<text x="40" y="440" font-size="13" font-weight="bold">Anode (+)</text>
<line x1="20" y1="70" x2="20" y2="425" stroke="#444" stroke-width="2"/>
<polygon points="14,425 26,425 20,437" fill="#444"/>
<g font-size="13">
<text x="40" y="115">A2 / C position</text>
<text x="40" y="195">S position</text>
<text x="40" y="275">F position</text>
<text x="40" y="355">A position</text>
</g>
<g stroke="#bbbbbb" stroke-dasharray="4 4">
<line x1="160" y1="110" x2="880" y2="110"/>
<line x1="160" y1="190" x2="880" y2="190"/>
<line x1="160" y1="270" x2="880" y2="270"/>
<line x1="160" y1="350" x2="880" y2="350"/>
</g>
<g font-size="13" text-anchor="middle" font-weight="bold">
<text x="230" y="62">1. Normal adult</text>
<text x="350" y="62">2. HbAS</text>
<text x="470" y="62">3. HbSS</text>
<text x="590" y="62">4. HbSC</text>
<text x="710" y="62">5. Newborn FS</text>
<text x="830" y="62">6. β-thal trait</text>
</g>
<g fill="#f4f4f4" stroke="#888">
<rect x="195" y="72" width="70" height="350"/>
<rect x="315" y="72" width="70" height="350"/>
<rect x="435" y="72" width="70" height="350"/>
<rect x="555" y="72" width="70" height="350"/>
<rect x="675" y="72" width="70" height="350"/>
<rect x="795" y="72" width="70" height="350"/>
</g>
<g fill="#2f5d8a">
<rect x="200" y="106" width="60" height="5"/>
<rect x="200" y="344" width="60" height="14"/>
<rect x="320" y="106" width="60" height="5"/>
<rect x="320" y="185" width="60" height="9"/>
<rect x="320" y="344" width="60" height="12"/>
<rect x="440" y="106" width="60" height="5"/>
<rect x="440" y="183" width="60" height="16"/>
<rect x="440" y="267" width="60" height="5"/>
<rect x="560" y="104" width="60" height="11"/>
<rect x="560" y="185" width="60" height="11"/>
<rect x="680" y="187" width="60" height="7"/>
<rect x="680" y="264" width="60" height="15"/>
<rect x="800" y="105" width="60" height="8"/>
<rect x="800" y="268" width="60" height="4"/>
<rect x="800" y="344" width="60" height="14"/>
</g>
<g font-size="11" text-anchor="middle">
<text x="230" y="378">A2 small, A main</text>
<text x="350" y="378">A greater than S</text>
<text x="470" y="378">S main, no A</text>
<text x="590" y="378">S and C similar</text>
<text x="710" y="378">F main, S, no A</text>
<text x="830" y="378">A2 raised</text>
</g>
<text x="200" y="460" font-size="12">Band thickness suggests relative amount. HbA2 and HbC co-migrate at alkaline pH; acid electrophoresis or HPLC separates them.</text>
</g>
</svg>
