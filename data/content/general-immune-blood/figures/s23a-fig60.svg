<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-label="Flow chart: interpreting PT and aPTT patterns and the 1:1 mixing study for a prolonged aPTT."><title>PT, aPTT and mixing study logic</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bd3"/></marker></defs><rect x="0" y="0" width="900" height="565" fill="#ffffff"/><text x="450" y="30" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Screening coagulation tests: PT, aPTT and the mixing study</text><rect x="300" y="50" width="300" height="46" rx="8" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="1.5"/><text x="450.0" y="69.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Bleeding history or abnormal screen</text><text x="450.0" y="85.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">measure PT and aPTT</text><line x1="450" y1="96" x2="120" y2="140" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="20" y="142" width="200" height="46" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="120.0" y="161.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">PT long</text><text x="120.0" y="177.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">aPTT normal</text><line x1="450" y1="96" x2="340" y2="140" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="240" y="142" width="200" height="46" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="340.0" y="161.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">PT normal</text><text x="340.0" y="177.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">aPTT long</text><line x1="450" y1="96" x2="560" y2="140" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="460" y="142" width="200" height="46" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="560.0" y="161.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">PT long</text><text x="560.0" y="177.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">aPTT long</text><line x1="450" y1="96" x2="780" y2="140" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="680" y="142" width="200" height="46" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="780.0" y="161.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">PT normal</text><text x="780.0" y="177.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">aPTT normal</text><rect x="20" y="210" width="200" height="120" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="120.0" y="251.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Factor VII deficiency</text><text x="120.0" y="266.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Early vitamin K deficiency</text><text x="120.0" y="281.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Early liver disease</text><text x="120.0" y="296.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Warfarin (early effect)</text><rect x="680" y="210" width="200" height="120" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="780.0" y="244.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Platelet count low or</text><text x="780.0" y="259.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">platelet function defect</text><text x="780.0" y="274.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">von Willebrand disease</text><text x="780.0" y="289.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Factor XIII deficiency</text><text x="780.0" y="304.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Vascular (e.g. scurvy)</text><rect x="460" y="210" width="200" height="120" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="560.0" y="244.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Common pathway (X, V, II,</text><text x="560.0" y="259.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">fibrinogen) deficiency</text><text x="560.0" y="274.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Severe vitamin K deficiency</text><text x="560.0" y="289.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Liver disease, DIC</text><text x="560.0" y="304.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Anticoagulant excess</text><line x1="100" y1="188" x2="100" y2="208" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><line x1="780" y1="188" x2="780" y2="208" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><line x1="560" y1="188" x2="560" y2="208" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><line x1="340" y1="188" x2="340" y2="208" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="240" y="210" width="200" height="46" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="340.0" y="229.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">1:1 mixing study</text><text x="340.0" y="245.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">with normal plasma</text><line x1="300" y1="256" x2="160" y2="360" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><text x="250" y="334" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">corrects</text><line x1="380" y1="256" x2="560" y2="360" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><text x="470" y="350" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">does not correct</text><rect x="40" y="362" width="260" height="112" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="170.0" y="392.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Factor deficiency</text><text x="170.0" y="407.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">VIII or IX: hemophilia A or B</text><text x="170.0" y="422.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">XI: bleeding after surgery/trauma</text><text x="170.0" y="437.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">XII, prekallikrein, HMWK:</text><text x="170.0" y="452.2" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">no clinical bleeding</text><rect x="420" y="362" width="280" height="46" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="560.0" y="389.55" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Inhibitor present</text><line x1="500" y1="408" x2="470" y2="430" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><line x1="620" y1="408" x2="660" y2="430" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/><rect x="330" y="432" width="260" height="98" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="460.0" y="462.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Immediate inhibitor</text><text x="460.0" y="477.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Lupus anticoagulant:</text><text x="460.0" y="492.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">thrombosis, not bleeding</text><text x="460.0" y="507.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Heparin in the sample</text><rect x="600" y="432" width="280" height="98" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="740.0" y="462.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Time-dependent inhibitor</text><text x="740.0" y="477.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">(prolongs after 1-2 h at 37 °C)</text><text x="740.0" y="492.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Factor VIII autoantibody:</text><text x="740.0" y="507.7" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">acquired hemophilia A</text><text x="450" y="552" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">Mixing study: patient plasma mixed 1:1 with normal plasma restores any deficient factor to about 50%, enough to normalize the aPTT.</text></svg>