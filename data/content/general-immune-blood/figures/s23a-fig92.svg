<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" aria-label="Timeline of adult screening recommendations by age from 18 to 85">
<title>Adult screening by age</title>
<rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
<text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Average-risk adult screening by age (summary)</text>
<line x1="250.0" y1="60" x2="250.0" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="250.0" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">18</text>
<line x1="321.6" y1="60" x2="321.6" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="321.6" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">30</text>
<line x1="381.3" y1="60" x2="381.3" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="381.3" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">40</text>
<line x1="441.0" y1="60" x2="441.0" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="441.0" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">50</text>
<line x1="530.6" y1="60" x2="530.6" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="530.6" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">65</text>
<line x1="590.3" y1="60" x2="590.3" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="590.3" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">75</text>
<line x1="650.0" y1="60" x2="650.0" y2="410" stroke="#dddddd" stroke-width="1"/>
<text x="650.0" y="54" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">85</text>
<text x="20" y="85" font-family="sans-serif" font-size="12" fill="#222222">Blood pressure</text>
<rect x="250.0" y="72" width="400.0" height="16" fill="#1f5fa8"/>
<text x="450.0" y="84" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">18+</text>
<text x="20" y="115" font-family="sans-serif" font-size="12" fill="#222222">Diabetes (if overweight)</text>
<rect x="351.5" y="102" width="209.0" height="16" fill="#1f5fa8"/>
<text x="456.0" y="114" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">35–70</text>
<text x="20" y="145" font-family="sans-serif" font-size="12" fill="#222222">Statin risk decision</text>
<rect x="381.3" y="132" width="209.0" height="16" fill="#1f5fa8"/>
<text x="485.8" y="144" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">40–75</text>
<text x="20" y="175" font-family="sans-serif" font-size="12" fill="#222222">Cervical cancer</text>
<rect x="267.9" y="162" width="262.7" height="16" fill="#1f5fa8"/>
<text x="399.3" y="174" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">21–65</text>
<text x="20" y="205" font-family="sans-serif" font-size="12" fill="#222222">Breast (every 2 years)</text>
<rect x="381.3" y="192" width="203.0" height="16" fill="#1f5fa8"/>
<text x="482.8" y="204" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">40–74</text>
<text x="20" y="235" font-family="sans-serif" font-size="12" fill="#222222">Colorectal cancer</text>
<rect x="411.2" y="222" width="179.1" height="16" fill="#1f5fa8"/>
<rect x="596.3" y="222" width="53.7" height="16" fill="#ffffff" stroke="#777777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="623.1" y="234" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">indiv.</text>
<text x="500.7" y="234" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">45–75</text>
<text x="20" y="265" font-family="sans-serif" font-size="12" fill="#222222">Lung LDCT (smoking criteria)</text>
<rect x="441.0" y="252" width="179.1" height="16" fill="#1f5fa8"/>
<text x="530.6" y="264" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">50–80</text>
<text x="20" y="295" font-family="sans-serif" font-size="12" fill="#222222">HIV (at least once)</text>
<rect x="250.0" y="282" width="280.6" height="16" fill="#1f5fa8"/>
<text x="390.3" y="294" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">to 65</text>
<text x="20" y="325" font-family="sans-serif" font-size="12" fill="#222222">Hepatitis C (once)</text>
<rect x="250.0" y="312" width="364.2" height="16" fill="#1f5fa8"/>
<text x="432.1" y="324" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">18–79</text>
<text x="20" y="355" font-family="sans-serif" font-size="12" fill="#222222">AAA, men who ever smoked (once)</text>
<rect x="530.6" y="342" width="59.7" height="16" fill="#1f5fa8"/>
<text x="560.4" y="354" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">65–75</text>
<text x="20" y="385" font-family="sans-serif" font-size="12" fill="#222222">Osteoporosis, women</text>
<rect x="530.6" y="372" width="119.4" height="16" fill="#1f5fa8"/>
<text x="590.3" y="384" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">65+</text>
<rect x="20" y="420" width="22" height="14" fill="#1f5fa8"/><text x="48" y="432" font-family="sans-serif" font-size="12" fill="#222222">Recommended (routine)</text>
<rect x="230" y="420" width="22" height="14" fill="#ffffff" stroke="#777777" stroke-dasharray="4 3"/><text x="258" y="432" font-family="sans-serif" font-size="12" fill="#222222">Individualized decision</text>
<text x="20" y="458" font-family="sans-serif" font-size="11" fill="#555555">Ages follow USPSTF statements; CDC also advises one-time hepatitis B and C screening for all adults.</text>
</svg>