<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="Schematic peripheral blood smear showing erythrocytes containing small ring-shaped intracellular organisms, including one cell with four organisms in a cross arrangement, with no pigment and no enlargement of infected cells" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="16" y="26" font-size="16" fill="#111111">Peripheral blood smear, Wright stain (schematic)</text>

  <circle cx="110" cy="110" r="44" fill="#fbe9e7" stroke="#8a4b10"/>
  <circle cx="98" cy="100" r="11" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <circle cx="122" cy="124" r="10" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <text x="66" y="172" font-size="12" fill="#333333">two ring forms, one cell</text>

  <circle cx="250" cy="110" r="44" fill="#fbe9e7" stroke="#8a4b10"/>
  <circle cx="236" cy="96" r="9" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <circle cx="264" cy="96" r="9" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <circle cx="236" cy="124" r="9" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <circle cx="264" cy="124" r="9" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <text x="196" y="172" font-size="12" fill="#333333">four organisms in a cross</text>

  <circle cx="390" cy="110" r="44" fill="#fbe9e7" stroke="#8a4b10"/>
  <text x="352" y="172" font-size="12" fill="#333333">uninfected erythrocyte</text>
  <line x1="390" y1="66" x2="390" y2="46" stroke="#555555"/>
  <text x="352" y="40" font-size="11" fill="#333333">normal size, no stippling</text>

  <circle cx="532" cy="110" r="40" fill="#f2f2f2" stroke="#555555"/>
  <path d="M512 100 q10 -16 22 -4 q14 -12 20 6 q-12 18 -24 8 q-12 10 -18 -10 z" fill="#d9d9d9" stroke="#555555"/>
  <text x="498" y="172" font-size="12" fill="#333333">neutrophil (for scale)</text>

  <rect x="16" y="206" width="608" height="158" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="26" y="230" font-size="13" fill="#111111">Features labelled on this smear</text>
  <text x="26" y="252" font-size="12" fill="#333333">Small ring-shaped organisms inside erythrocytes, often several per cell</text>
  <text x="26" y="272" font-size="12" fill="#333333">One cell contains four organisms arranged as a cross</text>
  <text x="26" y="292" font-size="12" fill="#333333">No brown-black pigment inside infected cells</text>
  <text x="26" y="312" font-size="12" fill="#333333">Infected cells are not enlarged and show no membrane stippling</text>
  <text x="26" y="332" font-size="12" fill="#333333">No banana-shaped or crescentic forms are present</text>
  <text x="26" y="354" font-size="12" fill="#333333">Rings sit in otherwise normal-looking erythrocytes; nuclei of organisms are not visible at this scale</text>
</svg>
