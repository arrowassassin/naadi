<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" aria-label="Three growth-faltering patterns comparing weight, length and head circumference percentiles over time"><title>Three growth-faltering patterns comparing weight, length and head circumference percentiles over time</title><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><text x="450" y="26" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#4a4a4a">Growth-faltering patterns: which curve falls first?</text><text x="175" y="52" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#4a4a4a">A. Weight falls first</text><rect x="60" y="60" width="230" height="190" fill="none" stroke="#d9d9d9"/><line x1="60" y1="98.0" x2="290" y2="98.0" stroke="#d9d9d9" stroke-dasharray="3 3"/><text x="56" y="102.0" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">50th</text><line x1="60" y1="238.6" x2="290" y2="238.6" stroke="#d9d9d9" stroke-dasharray="3 3"/><text x="56" y="242.6" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">3th</text><polyline points="75.0,98.0 141.7,113.2 208.3,189.2 275.0,234.8" fill="none" stroke="#b0552f" stroke-width="3" stroke-dasharray="none"/><text x="281.0" y="238.8" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#b0552f">W</text><polyline points="75.0,98.0 141.7,98.0 208.3,113.2 275.0,158.8" fill="none" stroke="#2f6fb0" stroke-width="3" stroke-dasharray="6 4"/><text x="281.0" y="162.8" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2f6fb0">L</text><polyline points="75.0,98.0 141.7,98.0 208.3,98.0 275.0,98.0" fill="none" stroke="#4a4a4a" stroke-width="3" stroke-dasharray="2 3"/><text x="281.0" y="102.0" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#4a4a4a">H</text><text x="175" y="268" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a4a4a">age →</text><text x="175" y="290" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Inadequate intake, malabsorption</text><text x="175" y="306" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">or excess losses</text><text x="465" y="52" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#4a4a4a">B. Length falls first</text><rect x="350" y="60" width="230" height="190" fill="none" stroke="#d9d9d9"/><line x1="350" y1="98.0" x2="580" y2="98.0" stroke="#d9d9d9" stroke-dasharray="3 3"/><text x="346" y="102.0" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">50th</text><line x1="350" y1="238.6" x2="580" y2="238.6" stroke="#d9d9d9" stroke-dasharray="3 3"/><text x="346" y="242.6" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">3th</text><polyline points="365.0,98.0 431.7,91.9 498.3,82.8 565.0,82.8" fill="none" stroke="#b0552f" stroke-width="3" stroke-dasharray="none"/><text x="571.0" y="86.8" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#b0552f">W</text><polyline points="365.0,98.0 431.7,143.6 498.3,189.2 565.0,225.7" fill="none" stroke="#2f6fb0" stroke-width="3" stroke-dasharray="6 4"/><text x="571.0" y="229.7" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2f6fb0">L</text><polyline points="365.0,98.0 431.7,98.0 498.3,98.0 565.0,104.1" fill="none" stroke="#4a4a4a" stroke-width="3" stroke-dasharray="2 3"/><text x="571.0" y="108.1" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#4a4a4a">H</text><text x="465" y="268" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a4a4a">age →</text><text x="465" y="290" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Endocrine cause (hypothyroidism,</text><text x="465" y="306" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">GH deficiency) or skeletal dysplasia</text><text x="755" y="52" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#4a4a4a">C. All three low from early on</text><rect x="640" y="60" width="230" height="190" fill="none" stroke="#d9d9d9"/><line x1="640" y1="98.0" x2="870" y2="98.0" stroke="#d9d9d9" stroke-dasharray="3 3"/><text x="636" y="102.0" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">50th</text><line x1="640" y1="238.6" x2="870" y2="238.6" stroke="#d9d9d9" stroke-dasharray="3 3"/><text x="636" y="242.6" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4a4a4a">3th</text><polyline points="655.0,201.4 721.7,204.4 788.3,207.4 855.0,207.4" fill="none" stroke="#b0552f" stroke-width="3" stroke-dasharray="none"/><text x="861.0" y="211.4" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#b0552f">W</text><polyline points="655.0,222.6 721.7,225.7 788.3,225.7 855.0,225.7" fill="none" stroke="#2f6fb0" stroke-width="3" stroke-dasharray="6 4"/><text x="861.0" y="229.7" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#2f6fb0">L</text><polyline points="655.0,240.9 721.7,243.9 788.3,243.9 855.0,243.9" fill="none" stroke="#4a4a4a" stroke-width="3" stroke-dasharray="2 3"/><text x="861.0" y="247.9" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#4a4a4a">H</text><text x="755" y="268" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a4a4a">age →</text><text x="755" y="290" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">Prenatal or genetic cause</text><text x="755" y="306" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">(congenital infection, teratogen)</text><text x="450" y="340" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a4a4a">W = weight (solid), L = length (dashed), H = head circumference (dotted); percentile lines 50th and 3rd.</text></svg>