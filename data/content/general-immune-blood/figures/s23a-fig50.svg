<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" aria-label="Graph of hemoglobin concentration, blood volume and reticulocyte count over time after a single acute bleed"><title>Time course after acute blood loss</title><desc>Blood volume falls at once and is restored over hours to days; hemoglobin concentration stays near baseline at first, then falls to a nadir at about 3 days; reticulocytes rise after about 3 days and peak near day 7.</desc>
<rect x="0" y="0" width="520" height="300" fill="#ffffff"/>
<line x1="70" y1="40" x2="70" y2="230" stroke="#444444" stroke-width="1.5"/>
<line x1="70" y1="230" x2="470" y2="230" stroke="#444444" stroke-width="1.5"/>
<text x="70" y="252" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">0</text>
<text x="150" y="252" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">6 h</text>
<text x="230" y="252" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">24 h</text>
<text x="310" y="252" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">3 d</text>
<text x="390" y="252" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">7 d</text>
<text x="462" y="252" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">14 d</text>
<text x="270" y="275" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">Time after a single acute bleed</text>
<text x="30" y="60" font-family="sans-serif" font-size="12" fill="#222222">high</text>
<text x="30" y="226" font-family="sans-serif" font-size="12" fill="#222222">low</text>
<line x1="70" y1="70" x2="470" y2="70" stroke="#cccccc" stroke-width="1"/>
<text x="476" y="74" font-family="sans-serif" font-size="11" fill="#555555">baseline</text>
<polyline points="70,70 78,150 150,120 230,92 310,76 390,72 470,70" fill="none" stroke="#777777" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="104" y="176" font-family="sans-serif" font-size="12" fill="#222222">blood volume (dashed grey)</text>
<polyline points="70,70 90,72 150,96 230,140 310,168 390,140 470,104" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
<text x="300" y="192" font-family="sans-serif" font-size="12" fill="#1f5fa8">hemoglobin concentration (solid blue)</text>
<polyline points="70,214 150,212 230,204 310,176 352,146 390,138 430,160 470,186" fill="none" stroke="#9a6b00" stroke-width="2.5" stroke-dasharray="2 3"/>
<text x="330" y="124" font-family="sans-serif" font-size="12" fill="#9a6b00">reticulocytes (dotted brown)</text>
<circle cx="90" cy="72" r="4" fill="#1f5fa8"/>
<text x="98" y="56" font-family="sans-serif" font-size="11" fill="#222222">early Hb near normal</text>
<circle cx="310" cy="168" r="4" fill="#1f5fa8"/>
<text x="314" y="212" font-family="sans-serif" font-size="11" fill="#222222">Hb nadir after equilibration</text>
</svg>
