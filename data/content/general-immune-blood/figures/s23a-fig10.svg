<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" aria-label="Lymphocyte development with the steps blocked in major primary immunodeficiencies">
<title>Where lymphocyte development stops in primary immunodeficiency</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380" y="28" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Lymphocyte development and the step each defect blocks</text>
<g font-family="sans-serif" font-size="13" fill="#222">
<rect x="20" y="170" width="110" height="56" rx="8" fill="#eeeeee" stroke="#555"/>
<text x="75" y="194" text-anchor="middle">Common lymphoid</text><text x="75" y="212" text-anchor="middle">progenitor</text>
<text x="380" y="66" text-anchor="middle" font-weight="bold">T-cell lineage (thymus)</text>
<rect x="190" y="80" width="110" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="245" y="108" text-anchor="middle">Thymocyte</text>
<rect x="350" y="80" width="120" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="410" y="100" text-anchor="middle">TCR rearranged</text><text x="410" y="117" text-anchor="middle">(DP thymocyte)</text>
<rect x="520" y="80" width="120" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="580" y="100" text-anchor="middle">Naive CD4 / CD8</text><text x="580" y="117" text-anchor="middle">T cell (TREC+)</text>
<rect x="670" y="80" width="80" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="710" y="100" text-anchor="middle">Helper</text><text x="710" y="117" text-anchor="middle">signals</text>
<text x="380" y="262" text-anchor="middle" font-weight="bold">B-cell lineage (bone marrow, then lymph node)</text>
<rect x="190" y="276" width="100" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="240" y="304" text-anchor="middle">Pro-B</text>
<rect x="320" y="276" width="100" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="370" y="304" text-anchor="middle">Pre-B</text>
<rect x="450" y="276" width="110" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="505" y="296" text-anchor="middle">Mature naive</text><text x="505" y="313" text-anchor="middle">B (IgM, IgD)</text>
<rect x="590" y="276" width="160" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="670" y="296" text-anchor="middle">Class-switched</text><text x="670" y="313" text-anchor="middle">memory B / plasma cell</text>
<rect x="20" y="62" width="110" height="46" rx="8" fill="#eeeeee" stroke="#555"/><text x="75" y="82" text-anchor="middle">NK cell</text><text x="75" y="99" text-anchor="middle">(needs IL-15)</text>
</g>
<g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M130,186 C160,150 160,110 188,103"/>
<path d="M130,212 C160,250 160,295 188,299"/>
<path d="M75,170 L75,110"/>
<line x1="300" y1="103" x2="348" y2="103"/><line x1="470" y1="103" x2="518" y2="103"/><line x1="640" y1="103" x2="668" y2="103"/>
<line x1="290" y1="299" x2="318" y2="299"/><line x1="420" y1="299" x2="448" y2="299"/><line x1="560" y1="299" x2="588" y2="299"/>
<path d="M710,126 C710,200 680,240 670,274"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#7a1f9c">
<circle cx="168" cy="140" r="11" fill="#ffffff" stroke="#7a1f9c" stroke-width="2"/><text x="168" y="144" text-anchor="middle" font-weight="bold">1</text>
<circle cx="324" cy="88" r="11" fill="#ffffff" stroke="#7a1f9c" stroke-width="2"/><text x="324" y="92" text-anchor="middle" font-weight="bold">2</text>
<circle cx="304" cy="282" r="11" fill="#ffffff" stroke="#7a1f9c" stroke-width="2"/><text x="304" y="286" text-anchor="middle" font-weight="bold">2</text>
<circle cx="434" cy="282" r="11" fill="#ffffff" stroke="#7a1f9c" stroke-width="2"/><text x="434" y="286" text-anchor="middle" font-weight="bold">3</text>
<circle cx="698" cy="200" r="11" fill="#ffffff" stroke="#7a1f9c" stroke-width="2"/><text x="698" y="204" text-anchor="middle" font-weight="bold">4</text>
<circle cx="575" cy="345" r="11" fill="#ffffff" stroke="#7a1f9c" stroke-width="2"/><text x="575" y="349" text-anchor="middle" font-weight="bold">5</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#222">
<text x="20" y="356">1 = cytokine signalling or nucleotide toxicity: IL2RG or JAK3 (T−B+NK−), ADA (T−B−NK−);</text>
<text x="20" y="371">     also thymic aplasia in complete 22q11.2 deletion</text>
<text x="20" y="386">2 = V(D)J recombination: RAG1/2, Artemis (T−B−NK+)   3 = pre-B receptor signalling: BTK</text>
<text x="20" y="401">4 = T-cell help: CD40L on activated CD4 T cells   5 = class switching and plasma-cell output:</text>
<text x="20" y="416">     AID or UNG, CD40; CVID (heterogeneous); selective IgA deficiency</text>
</g>
</svg>
