<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" aria-label="Plasmodium life cycle: mosquito bite, liver stage with hypnozoites, erythrocytic cycle and gametocyte uptake" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="16" y="28" font-size="17" fill="#111111">Plasmodium life cycle (human stages left to right)</text>

  <rect x="16" y="52" width="150" height="86" rx="8" fill="#f2f2f2" stroke="#555555"/>
  <text x="26" y="76" font-size="13" fill="#111111">Mosquito (vector)</text>
  <text x="26" y="96" font-size="12" fill="#333333">Anopheles bite</text>
  <text x="26" y="114" font-size="12" fill="#333333">injects sporozoites</text>
  <text x="26" y="132" font-size="12" fill="#333333">from salivary gland</text>

  <line x1="166" y1="95" x2="216" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="220" y="52" width="170" height="106" rx="8" fill="#f2f2f2" stroke="#555555"/>
  <text x="230" y="76" font-size="13" fill="#111111">Liver (hepatocyte)</text>
  <text x="230" y="96" font-size="12" fill="#333333">schizogony &#8594; merozoites</text>
  <text x="230" y="114" font-size="12" fill="#333333">P. vivax / P. ovale also</text>
  <text x="230" y="132" font-size="12" fill="#333333">form dormant hypnozoites</text>
  <text x="230" y="150" font-size="12" fill="#333333">(relapse weeks-months later)</text>

  <line x1="390" y1="95" x2="440" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="444" y="52" width="258" height="106" rx="8" fill="#f2f2f2" stroke="#555555"/>
  <text x="454" y="76" font-size="13" fill="#111111">Erythrocyte (blood stage)</text>
  <text x="454" y="96" font-size="12" fill="#333333">ring &#8594; trophozoite &#8594; schizont</text>
  <text x="454" y="114" font-size="12" fill="#333333">rupture &#8594; fever paroxysm, hemolysis</text>
  <text x="454" y="132" font-size="12" fill="#333333">some become gametocytes</text>
  <text x="454" y="150" font-size="12" fill="#333333">(taken up by next mosquito)</text>

  <path d="M573 158 C573 210 300 210 300 165" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="332" y="206" font-size="11" fill="#333333">hypnozoite reactivation feeds the blood stage again</text>

  <path d="M680 158 C700 250 120 270 95 142" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="268" font-size="11" fill="#333333">gametocytes ingested: sexual cycle completes in the mosquito</text>

  <rect x="16" y="296" width="686" height="106" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="26" y="318" font-size="13" fill="#111111">Where drugs act (labelled, not by colour)</text>
  <text x="26" y="340" font-size="12" fill="#333333">1. Blood schizonticides (chloroquine, artemisinins, atovaquone-proguanil): erythrocytic stage only</text>
  <text x="26" y="360" font-size="12" fill="#333333">2. Hypnozoiticides (primaquine, tafenoquine): liver dormant stage &#8594; prevent relapse; check G6PD first</text>
  <text x="26" y="380" font-size="12" fill="#333333">3. Severe disease: intravenous artesunate, then a full oral combination course</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
