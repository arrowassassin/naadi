<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" aria-label="Hemophagocytic lymphohistiocytosis: failed cytotoxic killing drives a T cell and macrophage activation loop with its laboratory findings" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <text x="16" y="28" font-size="17" fill="#111111">Hemophagocytic syndrome: the activation loop</text>

  <rect x="16" y="50" width="196" height="92" rx="8" fill="#f2f2f2" stroke="#555555"/>
  <text x="26" y="72" font-size="13" fill="#111111">Trigger</text>
  <text x="26" y="92" font-size="12" fill="#333333">infection (EBV, CMV),</text>
  <text x="26" y="110" font-size="12" fill="#333333">lymphoma, rheumatic disease;</text>
  <text x="26" y="128" font-size="11" fill="#333333">or inherited PRF1/UNC13D defect</text>

  <line x1="212" y1="96" x2="258" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="262" y="50" width="200" height="92" rx="8" fill="#eaf3ff" stroke="#1f4e79"/>
  <text x="272" y="72" font-size="13" fill="#111111">Cytotoxic T / NK cell</text>
  <text x="272" y="92" font-size="12" fill="#333333">cannot kill the target cell</text>
  <text x="272" y="110" font-size="12" fill="#333333">&#8594; antigen persists</text>
  <text x="272" y="128" font-size="12" fill="#333333">&#8594; interferon-&#947; poured out</text>

  <line x1="462" y1="96" x2="508" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="512" y="50" width="172" height="92" rx="8" fill="#fff2e8" stroke="#8a4b10"/>
  <text x="522" y="72" font-size="13" fill="#111111">Macrophage</text>
  <text x="522" y="92" font-size="12" fill="#333333">activated: IL-1, IL-6,</text>
  <text x="522" y="110" font-size="12" fill="#333333">TNF-&#945;, ferritin release;</text>
  <text x="522" y="128" font-size="12" fill="#333333">ingests blood cells</text>

  <path d="M598 142 C598 196 362 196 362 146" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#a2)"/>
  <text x="392" y="190" font-size="11" fill="#333333">cytokines further activate T cells: self-sustaining loop</text>

  <rect x="16" y="216" width="668" height="168" rx="8" fill="#ffffff" stroke="#555555"/>
  <text x="26" y="240" font-size="13" fill="#111111">Resulting findings</text>
  <text x="26" y="262" font-size="12" fill="#333333">Fever that does not remit; splenomegaly; hepatitis</text>
  <text x="26" y="282" font-size="12" fill="#333333">Two or three lineage cytopenias (marrow suppression plus phagocytosis)</text>
  <text x="26" y="302" font-size="12" fill="#333333">Ferritin in the thousands; soluble CD25 (soluble IL-2 receptor) high</text>
  <text x="26" y="322" font-size="12" fill="#333333">Fibrinogen low with high D-dimer; triglycerides high</text>
  <text x="26" y="342" font-size="12" fill="#333333">Marrow or node: macrophages containing intact blood cells</text>
  <text x="26" y="366" font-size="12" fill="#333333">Treatment aims at both arms: suppress the immune loop and remove the trigger</text>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
