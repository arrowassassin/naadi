<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" aria-label="Spleen schematic: white pulp with follicle, periarteriolar sheath and marginal zone; red pulp cords and sinuses showing culling and pitting"><title>Spleen schematic: white pulp with follicle, periarteriolar sheath and marginal zone; red pulp cords and sinuses showing culling and pitting</title><rect x="0" y="0" width="800" height="360" fill="#ffffff"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#333333"/></marker></defs><text x="400" y="28" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#333333">Splenic microanatomy and red-cell filtration</text><circle cx="200" cy="190" r="125" fill="#f4f1fb" stroke="#5b4a9e" stroke-width="2" stroke-dasharray="6 4"/><circle cx="200" cy="190" r="95" fill="#e4def5" stroke="#5b4a9e" stroke-width="1.5"/><ellipse cx="200" cy="140" rx="45" ry="30" fill="#ffffff" stroke="#5b4a9e" stroke-width="1.5"/><circle cx="200" cy="215" r="34" fill="#cfc5ee" stroke="#5b4a9e" stroke-width="1.5"/><circle cx="200" cy="215" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="200" y="136" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Follicle</text><text x="200" y="152" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">B cells</text><text x="200" y="246" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">PALS: T cells</text><text x="200" y="270" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#444444">central arteriole</text><text x="200" y="302" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Marginal zone</text><text x="200" y="333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">macrophages, marginal-zone B cells</text><text x="200" y="60" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#5b4a9e">WHITE PULP (immune surveillance)</text><rect x="400" y="70" width="370" height="270" rx="10" fill="#fbf0f0" stroke="#a05050" stroke-width="1.5"/><text x="585" y="60" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#a05050">RED PULP (filtration)</text><text x="500" y="95" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Splenic cord</text><text x="690" y="95" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Venous sinus</text><line x1="600" y1="105" x2="600" y2="320" stroke="#333333" stroke-width="3" stroke-dasharray="26 8"/><text x="600" y="335" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">endothelial slits (narrow gaps)</text><circle cx="480" cy="140" r="18" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><circle cx="480" cy="140" r="6.8" fill="#f7e3e3"/><ellipse cx="600" cy="140" rx="5" ry="16" fill="#e8b4b4" stroke="#a05050"/><circle cx="700" cy="140" r="18" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><circle cx="700" cy="140" r="6.8" fill="#f7e3e3"/><path d="M 502 140 L 588 140" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/><path d="M 612 140 L 676 140" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/><text x="690" y="172" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">deformable cell passes</text><circle cx="470" cy="225" r="16" fill="#c98585" stroke="#a05050"/><ellipse cx="530" cy="225" rx="32" ry="24" fill="#dddddd" stroke="#888888"/><text x="530" y="229" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Mφ</text><text x="500" y="265" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Culling: rigid or old</text><text x="500" y="281" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">cell engulfed whole</text><circle cx="690" cy="225" r="18" fill="#e8b4b4" stroke="#a05050" stroke-width="1.5"/><circle cx="690" cy="225" r="6.8" fill="#f7e3e3"/><circle cx="690" cy="225" r="4" fill="#5b4a9e"/><text x="690" y="265" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Pitting: inclusion</text><text x="690" y="281" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">removed, cell returns</text></svg>
