<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" aria-label="Typical timing of infections after solid organ transplantation in three periods">
<rect x="0" y="0" width="720" height="230" fill="#ffffff"/>
<g font-family="sans-serif" font-size="12" fill="#222">
<text x="360" y="22" text-anchor="middle" font-size="13">Typical timing of infection after solid organ transplantation</text>
<rect x="10" y="40" width="210" height="32" fill="#e6e6e6" stroke="#666"/><text x="115" y="61" text-anchor="middle" font-weight="bold">Month 1</text>
<rect x="230" y="40" width="250" height="32" fill="#d0d0d0" stroke="#666"/><text x="355" y="61" text-anchor="middle" font-weight="bold">Months 1–6 (peak immunosuppression)</text>
<rect x="490" y="40" width="220" height="32" fill="#e6e6e6" stroke="#666"/><text x="600" y="61" text-anchor="middle" font-weight="bold">After 6 months</text>
<text x="18" y="96">Surgical-site and wound infection</text><text x="18" y="116">Line, urinary and hospital pneumonia</text><text x="18" y="136">Clostridioides difficile</text><text x="18" y="156">Donor-derived infection</text><text x="18" y="176">Herpes simplex reactivation</text>
<text x="238" y="96">Cytomegalovirus (after prophylaxis ends)</text><text x="238" y="116">Pneumocystis (without prophylaxis)</text><text x="238" y="136">BK polyomavirus (kidney)</text><text x="238" y="156">EBV-driven lymphoproliferation</text><text x="238" y="176">Fungi, Listeria, Nocardia, Toxoplasma</text>
<text x="498" y="96">Community infections (influenza,</text><text x="498" y="111">pneumococcus) in stable patients</text><text x="498" y="131">Late CMV, varicella-zoster</text><text x="498" y="151">Chronic viral infection (HBV, HCV)</text><text x="498" y="171">Opportunistic infection if</text><text x="498" y="186">immunosuppression is intensified</text>
<text x="18" y="215" font-size="11">Prophylaxis (TMP-SMX, valganciclovir) shifts and reduces the middle-period infections.</text>
</g>
</svg>
