<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 465" role="img" aria-label="Timeline chart of transfusion reactions by time of onset, from minutes (anaphylaxis, acute hemolysis, sepsis) to weeks (transfusion-associated graft-versus-host disease)."><title>Transfusion reactions by onset</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bd3"/></marker></defs><rect x="0" y="0" width="980" height="465" fill="#ffffff"/><text x="490" y="30" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Transfusion reactions by time of onset after the start of transfusion</text><line x1="230" y1="62" x2="870" y2="62" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/><line x1="230" y1="56" x2="230" y2="68" stroke="#1f2937" stroke-width="1.5"/><text x="230" y="50" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">minutes</text><line x1="330" y1="56" x2="330" y2="68" stroke="#1f2937" stroke-width="1.5"/><text x="330" y="50" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">1 h</text><line x1="450" y1="56" x2="450" y2="68" stroke="#1f2937" stroke-width="1.5"/><text x="450" y="50" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">6 h</text><line x1="560" y1="56" x2="560" y2="68" stroke="#1f2937" stroke-width="1.5"/><text x="560" y="50" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">12-24 h</text><line x1="700" y1="56" x2="700" y2="68" stroke="#1f2937" stroke-width="1.5"/><text x="700" y="50" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">days 3-14</text><line x1="830" y1="56" x2="830" y2="68" stroke="#1f2937" stroke-width="1.5"/><text x="830" y="50" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">weeks 1-6</text><text x="220" y="105" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Anaphylactic (anti-IgA)</text><line x1="230" y1="101" x2="870" y2="101" stroke="#e5e7eb" stroke-width="1"/><rect x="230" y="93" width="70" height="16" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="308" y="105" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b45309">life-threatening</text><text x="220" y="137" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Acute hemolytic (ABO)</text><line x1="230" y1="133" x2="870" y2="133" stroke="#e5e7eb" stroke-width="1"/><rect x="230" y="125" width="130" height="16" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="368" y="137" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b45309">life-threatening</text><text x="220" y="169" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Septic (bacterial)</text><line x1="230" y1="165" x2="870" y2="165" stroke="#e5e7eb" stroke-width="1"/><rect x="230" y="157" width="150" height="16" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="388" y="169" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b45309">life-threatening</text><text x="220" y="201" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Urticarial (allergic)</text><line x1="230" y1="197" x2="870" y2="197" stroke="#e5e7eb" stroke-width="1"/><rect x="230" y="189" width="170" height="16" rx="8" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="1.5"/><text x="220" y="233" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Febrile non-hemolytic</text><line x1="230" y1="229" x2="870" y2="229" stroke="#e5e7eb" stroke-width="1"/><rect x="230" y="221" width="220" height="16" rx="8" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="1.5"/><text x="220" y="265" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">TRALI</text><line x1="230" y1="261" x2="870" y2="261" stroke="#e5e7eb" stroke-width="1"/><rect x="240" y="253" width="210" height="16" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="458" y="265" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b45309">life-threatening</text><text x="220" y="297" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">TACO</text><line x1="230" y1="293" x2="870" y2="293" stroke="#e5e7eb" stroke-width="1"/><rect x="240" y="285" width="320" height="16" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="568" y="297" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b45309">life-threatening</text><text x="220" y="329" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Delayed hemolytic / serologic</text><line x1="230" y1="325" x2="870" y2="325" stroke="#e5e7eb" stroke-width="1"/><rect x="650" y="317" width="110" height="16" rx="8" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="1.5"/><text x="220" y="361" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">Post-transfusion purpura</text><line x1="230" y1="357" x2="870" y2="357" stroke="#e5e7eb" stroke-width="1"/><rect x="680" y="349" width="100" height="16" rx="8" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="1.5"/><text x="220" y="393" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1f2937">TA-GVHD</text><line x1="230" y1="389" x2="870" y2="389" stroke="#e5e7eb" stroke-width="1"/><rect x="700" y="381" width="160" height="16" rx="8" fill="#fdf0e1" stroke="#b45309" stroke-width="1.5"/><text x="868" y="393" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b45309">life-threatening</text><text x="490" y="432" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">Stop the transfusion for any reaction except isolated mild urticaria; check patient and unit identity first.</text><text x="490" y="450" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">Bars show the usual window of onset (schematic, not to scale).</text></svg>