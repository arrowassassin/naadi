<text x="420" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">aorta</text>
<text x="210" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">RV</text>
<text x="490" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">LV</text>
<path d="M230,280 C300,270 330,230 360,160" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#s23b-fig-081401-01-ar)"/>
<text x="30" y="150" font-family="sans-serif" font-size="13" fill="#dc2626">1. RV outflow (infundibular)</text>
<text x="30" y="166" font-family="sans-serif" font-size="13" fill="#dc2626">   obstruction</text>
<line x1="185" y1="163" x2="256" y2="170" stroke="#dc2626" stroke-width="1.5"/>
<text x="560" y="150" font-family="sans-serif" font-size="13" fill="#0f172a">2. Overriding aorta</text>
