<line x1="556" y1="256" x2="356" y2="260" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="30" y="420" font-family="sans-serif" font-size="13" fill="#0f172a">4. RV hypertrophy (thick wall)</text>
<text x="380" y="420" font-family="sans-serif" font-size="13" fill="#1d4ed8">Blue arrow: right-to-left shunt into aorta</text>
