<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-label="Schematic of tetralogy of Fallot: anterosuperior deviation of the outlet septum causing right ventricular outflow obstruction, a large ventricular septal defect, an aorta overriding the defect, and right ventricular hypertrophy, with deoxygenated blood shunting right to left into the aorta">
<rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
<defs><marker id="s23b-fig-081401-01-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Tetralogy of Fallot</text>
<path d="M120,220 L320,220 L320,400 Q200,410 150,350 Q120,300 120,220 Z" fill="#f8fafc" stroke="#334155" stroke-width="12"/>
<path d="M380,220 L580,220 Q580,300 540,350 Q470,410 380,400 Z" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
