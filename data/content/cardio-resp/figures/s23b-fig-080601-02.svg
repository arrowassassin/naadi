<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Timeline of myocardial changes and mechanical complications after acute myocardial infarction"><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><line x1="20" y1="150" x2="740" y2="150" stroke="#0f172a" stroke-width="2"/><text x="20" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Myocardium</text><text x="20" y="190" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Typical complications</text><rect x="24" y="134" width="136" height="32" rx="6" fill="#e2e8f0" stroke="#334155"/><text x="92.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">0–24 h</text><text x="92.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Coagulation necrosis</text><text x="92.0" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">begins; wavy fibres</text><text x="92.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Ventricular arrhythmia</text><text x="92.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(VF: leading early</text><text x="92.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">cause of death)</text><text x="92.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Cardiogenic shock, HF</text><rect x="168" y="134" width="136" height="32" rx="6" fill="#e2e8f0" stroke="#334155"/><text x="236.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1–3 days</text><text x="236.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Neutrophils infiltrate</text><text x="236.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Early fibrinous</text><text x="236.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">pericarditis over</text><text x="236.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">transmural infarct</text><rect x="312" y="134" width="136" height="32" rx="6" fill="#fde68a" stroke="#334155"/><text x="380.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3–14 days</text><text x="380.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Macrophages clear</text><text x="380.0" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">debris; wall softest</text><text x="380.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Papillary muscle rupture</text><text x="380.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Septal rupture</text><text x="380.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Free wall rupture</text><text x="380.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">→ tamponade</text><rect x="456" y="134" width="136" height="32" rx="6" fill="#e2e8f0" stroke="#334155"/><text x="524.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2 wk – 2 mo</text><text x="524.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Granulation tissue,</text><text x="524.0" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">then collagen</text><text x="524.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Post-infarction</text><text x="524.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">(autoimmune)</text><text x="524.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">pericarditis</text><rect x="600" y="134" width="136" height="32" rx="6" fill="#e2e8f0" stroke="#334155"/><text x="668.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">> 2 months</text><text x="668.0" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Dense scar</text><text x="668.0" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Ventricular aneurysm,</text><text x="668.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">mural thrombus,</text><text x="668.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">scar-related VT</text><text x="20" y="318" font-family="sans-serif" font-size="12" fill="#334155">Highlighted window: highest risk of rupture. Times are typical ranges and overlap; rupture can occur earlier.</text></svg>