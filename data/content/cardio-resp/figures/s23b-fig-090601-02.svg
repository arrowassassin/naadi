<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Spectrum of ventilation-perfusion ratios from shunt to dead space"><rect x="0" y="0" width="700" height="300" fill="#ffffff"/><defs><marker id="s23b-fig-090601-02-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><line x1="70" y1="70" x2="630" y2="70" stroke="#334155" stroke-width="2.5" marker-start="url(#s23b-fig-090601-02-ar)" marker-end="url(#s23b-fig-090601-02-ar)"/><text x="350" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Ventilation/perfusion (V/Q) ratio of a lung unit</text><rect x="40" y="95" width="200" height="185" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="140" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">V/Q = 0 (shunt)</text><text x="52" y="148" font-family="sans-serif" font-size="12.5" fill="#0f172a">Perfused, not ventilated</text><text x="52" y="169" font-family="sans-serif" font-size="12.5" fill="#0f172a">Alveolar gas ≈ mixed venous:</text><text x="52" y="190" font-family="sans-serif" font-size="12.5" fill="#0f172a">PO2 ≈ 40, PCO2 ≈ 46 mm Hg</text><text x="52" y="211" font-family="sans-serif" font-size="12.5" fill="#0f172a">Examples: airway plug,</text><text x="52" y="232" font-family="sans-serif" font-size="12.5" fill="#0f172a">pneumonia, edema, atelectasis</text><text x="52" y="253" font-family="sans-serif" font-size="12.5" fill="#0f172a">Poor response to 100% O2</text><rect x="250" y="95" width="200" height="185" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="350" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">V/Q ≈ 0.8 (ideal)</text><text x="262" y="148" font-family="sans-serif" font-size="12.5" fill="#0f172a">Ventilation matches flow</text><text x="262" y="169" font-family="sans-serif" font-size="12.5" fill="#0f172a">PAO2 ≈ 100, PACO2 ≈ 40</text><text x="262" y="190" font-family="sans-serif" font-size="12.5" fill="#0f172a">Lung base: V/Q below 1</text><text x="262" y="211" font-family="sans-serif" font-size="12.5" fill="#0f172a">Lung apex: V/Q about 3</text><text x="262" y="232" font-family="sans-serif" font-size="12.5" fill="#0f172a">(apex: highest PAO2,</text><text x="262" y="253" font-family="sans-serif" font-size="12.5" fill="#0f172a">lowest PACO2)</text><rect x="460" y="95" width="200" height="185" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="560" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">V/Q = ∞ (dead space)</text><text x="472" y="148" font-family="sans-serif" font-size="12.5" fill="#0f172a">Ventilated, not perfused</text><text x="472" y="169" font-family="sans-serif" font-size="12.5" fill="#0f172a">Alveolar gas ≈ inspired air:</text><text x="472" y="190" font-family="sans-serif" font-size="12.5" fill="#0f172a">PO2 ≈ 150, PCO2 ≈ 0 mm Hg</text><text x="472" y="211" font-family="sans-serif" font-size="12.5" fill="#0f172a">Examples: pulmonary</text><text x="472" y="232" font-family="sans-serif" font-size="12.5" fill="#0f172a">embolism, low cardiac output</text><text x="472" y="253" font-family="sans-serif" font-size="12.5" fill="#0f172a">↑ wasted ventilation</text></svg>
