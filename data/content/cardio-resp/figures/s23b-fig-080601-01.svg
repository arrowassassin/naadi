<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Schematic comparison of normal heart and dilated, hypertrophic and restrictive cardiomyopathy"><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><text x="95" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Normal</text><ellipse cx="95" cy="91" rx="30" ry="22" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/><text x="95" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LA</text><ellipse cx="95" cy="175" rx="55" ry="80" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><ellipse cx="95" cy="181" rx="38" ry="60" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="95" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LV</text><text x="95" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Normal wall and cavity</text><text x="285" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Dilated</text><ellipse cx="285" cy="71" rx="34" ry="24" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/><text x="285" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LA</text><ellipse cx="285" cy="175" rx="70" ry="98" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><ellipse cx="285" cy="181" rx="60" ry="86" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="285" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LV</text><text x="285" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Thin walls, large cavity</text><text x="285" y="301" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Systolic failure, low EF</text><text x="285" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Eccentric remodelling; S3</text><text x="475" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Hypertrophic</text><ellipse cx="475" cy="83" rx="34" ry="24" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/><text x="475" y="87" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LA</text><ellipse cx="475" cy="175" rx="62" ry="86" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><ellipse cx="489" cy="181" rx="26" ry="52" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="489" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LV</text><text x="475" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Thick septum, small cavity</text><text x="475" y="301" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Diastolic dysfunction</text><text x="475" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Dynamic outflow obstruction; S4</text><text x="665" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Restrictive</text><ellipse cx="665" cy="79" rx="48" ry="34" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/><text x="665" y="83" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LA</text><ellipse cx="665" cy="175" rx="55" ry="80" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/><ellipse cx="665" cy="181" rx="38" ry="60" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="665" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">LV</text><text x="665" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Normal-sized stiff ventricle</text><text x="665" y="301" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Large atria</text><text x="665" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Diastolic failure, preserved EF</text><text x="423" y="179" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0f172a">septum</text></svg>