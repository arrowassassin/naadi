<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" role="img" aria-label="Diagram of the lungs showing central tumours near the hilum (squamous cell, small cell, carcinoid), peripheral tumours (adenocarcinoma, large cell) and an apical superior sulcus tumour, each with its typical syndromes">
<rect width="760" height="485" fill="#ffffff"/>
<g transform="translate(370,260) scale(0.82) translate(-370,-260)">
<path d="M370,70 L370,150 M370,150 L330,190 M370,150 L410,190" stroke="#334155" stroke-width="10" fill="none" stroke-linecap="round"/>
<path d="M318,120 C250,110 205,190 200,300 C196,380 230,420 300,420 C335,420 345,390 345,340 L345,200 C345,160 335,125 318,120 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<path d="M422,120 C490,110 535,190 540,300 C544,380 510,420 440,420 C405,420 395,390 395,340 L395,200 C395,160 405,125 422,120 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<ellipse cx="370" cy="225" rx="62" ry="48" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4"/>
<circle cx="345" cy="222" r="11" fill="#2563eb"/><circle cx="398" cy="235" r="9" fill="#2563eb"/>
<circle cx="228" cy="300" r="12" fill="#b45309"/><circle cx="515" cy="330" r="10" fill="#b45309"/>
<circle cx="438" cy="140" r="10" fill="#7c3aed"/>
</g>
<text x="20" y="40" font-family="sans-serif" font-size="14" text-anchor="start" fill="#2563eb" font-weight="bold">CENTRAL (hilar, large bronchi)</text>
<text x="20" y="62" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Squamous cell carcinoma</text>
<text x="32" y="80" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">cavitation; PTHrP → hypercalcemia</text>
<text x="20" y="102" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Small cell carcinoma</text>
<text x="32" y="120" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">SIADH, ectopic ACTH,</text>
<text x="32" y="136" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Lambert-Eaton, anti-Hu;</text>
<text x="32" y="152" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">SVC syndrome</text>
<text x="20" y="174" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Carcinoid tumour</text>
<text x="32" y="192" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">endobronchial polyp;</text>
<text x="32" y="208" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">obstruction</text>
<text x="20" y="234" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Cough, hemoptysis, collapse,</text>
<text x="20" y="250" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">post-obstructive pneumonia</text>
<line x1="200" y1="225" x2="321" y2="231" stroke="#2563eb" stroke-width="1.5"/>
<text x="20" y="330" font-family="sans-serif" font-size="14" text-anchor="start" fill="#b45309" font-weight="bold">PERIPHERAL</text>
<text x="20" y="352" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Adenocarcinoma</text>
<text x="32" y="370" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">never-smokers; EGFR, ALK,</text>
<text x="32" y="386" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">ROS1 drivers; clubbing,</text>
<text x="32" y="402" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">osteoarthropathy</text>
<text x="20" y="424" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Large cell carcinoma</text>
<text x="32" y="442" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">undifferentiated, poor prognosis</text>
<text x="250" y="470" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Peripheral tumours are often silent: found as a nodule or by pleural spread</text>
<line x1="150" y1="352" x2="249" y2="294" stroke="#b45309" stroke-width="1.5"/>
<text x="560" y="60" font-family="sans-serif" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">APEX (superior sulcus)</text>
<text x="560" y="82" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Lower brachial plexus:</text>
<text x="572" y="100" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">C8–T1 pain, hand wasting</text>
<text x="560" y="122" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="normal">Sympathetic chain:</text>
<text x="572" y="140" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">ptosis, miosis, anhidrosis</text>
<line x1="556" y1="110" x2="434" y2="160" stroke="#7c3aed" stroke-width="1.5"/>
<text x="560" y="300" font-family="sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Also from the hilum:</text>
<text x="560" y="320" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Recurrent laryngeal nerve</text>
<text x="572" y="336" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">→ hoarseness</text>
<text x="560" y="356" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Phrenic nerve</text>
<text x="572" y="372" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">→ raised hemidiaphragm</text>
<text x="560" y="392" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Superior vena cava</text>
<text x="572" y="408" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">→ facial and arm swelling</text>
</svg>
