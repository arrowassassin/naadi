<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 380" role="img" aria-label="Where anticoagulants act on the common coagulation pathway">
<defs><marker id="s23b-fig-081203-01-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="790" height="380" fill="#ffffff"/>
<g font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">
<rect x="270" y="20" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="350" y="45">Factor X</text>
<rect x="270" y="110" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="350" y="135">Factor Xa</text>
<rect x="270" y="200" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="350" y="225">Thrombin (IIa)</text>
<rect x="270" y="290" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="350" y="315">Fibrin clot</text>
<text x="120" y="225">Prothrombin (II)</text>
<text x="120" y="315">Fibrinogen</text>
</g>
<g stroke="#334155" stroke-width="2" marker-end="url(#s23b-fig-081203-01-a)" fill="none">
<line x1="350" y1="60" x2="350" y2="106"/><line x1="350" y1="150" x2="350" y2="196"/><line x1="350" y1="240" x2="350" y2="286"/>
<line x1="185" y1="220" x2="266" y2="220"/><line x1="170" y1="310" x2="266" y2="310"/>
</g>
<g font-family="sans-serif" font-size="13" fill="#0f172a">
<line x1="440" y1="130" x2="470" y2="130" stroke="#dc2626" stroke-width="3"/>
<text x="478" y="118">Direct Xa inhibitors:</text><text x="478" y="134">rivaroxaban, apixaban, edoxaban</text>
<text x="478" y="150">Fondaparinux, LMWH (via antithrombin)</text>
<line x1="440" y1="220" x2="470" y2="220" stroke="#dc2626" stroke-width="3"/>
<text x="478" y="208">Direct thrombin inhibitors:</text><text x="478" y="224">dabigatran, argatroban, bivalirudin</text>
<text x="478" y="240">Unfractionated heparin (via antithrombin)</text>
<text x="20" y="40" font-weight="bold">Warfarin</text>
<text x="20" y="58">blocks vitamin K epoxide reductase,</text>
<text x="20" y="74">so less functional II, VII, IX, X</text>
<text x="20" y="90">and proteins C and S are made</text>
<text x="20" y="366" fill="#334155">UFH inhibits both Xa and IIa through antithrombin; LMWH acts mostly on Xa.</text>
</g>
</svg>
