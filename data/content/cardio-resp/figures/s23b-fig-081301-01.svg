<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Thoracic aorta showing the isthmus just distal to the left subclavian artery at the ligamentum arteriosum"><rect x="0" y="0" width="720" height="420" fill="#ffffff"/><path d="M250,380 L250,200 C250,110 300,80 360,80 C420,80 450,110 450,170 L450,390" fill="none" stroke="#2563eb" stroke-width="42" stroke-linecap="butt" opacity="0.25"/><path d="M229,380 L229,200 C229,95 290,59 360,59 C430,59 471,100 471,170 L471,390" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M271,380 L271,205 C271,125 310,101 360,101 C405,101 429,125 429,175 L429,390" fill="none" stroke="#334155" stroke-width="2.5"/><line x1="290" y1="70" x2="290" y2="20" stroke="#334155" stroke-width="2.5"/><line x1="308" y1="68" x2="308" y2="20" stroke="#334155" stroke-width="2.5"/><line x1="340" y1="64" x2="340" y2="20" stroke="#334155" stroke-width="2.5"/><line x1="358" y1="62" x2="358" y2="20" stroke="#334155" stroke-width="2.5"/><line x1="390" y1="64" x2="390" y2="20" stroke="#334155" stroke-width="2.5"/><line x1="408" y1="62" x2="408" y2="20" stroke="#334155" stroke-width="2.5"/><text x="284" y="40" font-family="sans-serif" font-size="12" text-anchor="end" fill="#0f172a" font-weight="normal" >Brachiocephalic</text><text x="341" y="14" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >L carotid</text><text x="416" y="40" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >L subclavian</text><path d="M330,300 C330,230 350,190 380,180" fill="none" stroke="#334155" stroke-width="18" opacity="0.35"/><text x="300" y="330" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >Pulmonary trunk</text><line x1="380" y1="178" x2="430" y2="150" stroke="#0f172a" stroke-width="4"/><text x="486" y="150" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >Ligamentum arteriosum</text><line x1="484" y1="146" x2="434" y2="150" stroke="#334155" stroke-width="1"/><path d="M471,160 l14,6 l-12,6 l14,6" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M429,160 l-14,6 l12,6 l-14,6" fill="none" stroke="#dc2626" stroke-width="3"/><text x="492" y="190" font-family="sans-serif" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold" >Isthmus: commonest site of</text><text x="492" y="206" font-family="sans-serif" font-size="12" text-anchor="start" fill="#dc2626" font-weight="bold" >blunt aortic tear</text><text x="60" y="240" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >Mobile: ascending</text><text x="60" y="256" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >aorta and arch</text><text x="486" y="300" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >Fixed: descending</text><text x="486" y="316" font-family="sans-serif" font-size="12" text-anchor="start" fill="#0f172a" font-weight="normal" >thoracic aorta</text><text x="360.0" y="410" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#334155" font-weight="normal" >Sudden deceleration shears the mobile arch against the tethered descending aorta.</text></svg>
