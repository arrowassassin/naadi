<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Timeline of fetal lung development stages from week 4 to term, with surfactant production and viability marked">
<rect width="760" height="250" fill="#ffffff"/>
<rect x="108.0" y="60" width="51.0" height="70" fill="#e0f2fe" stroke="#334155" stroke-width="1"/>
<text x="108.0" y="52" font-family="sans-serif" font-size="11" text-anchor="start" fill="#0f172a" font-weight="bold">Embryonic (lung bud, bronchi)</text>
<rect x="159.0" y="60" width="153.0" height="70" fill="#dbeafe" stroke="#334155" stroke-width="1"/>
<text x="235.5" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Pseudoglandular</text>
<text x="235.5" y="108" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155" font-weight="normal">conducting airways</text>
<rect x="312.0" y="60" width="170.0" height="70" fill="#e0e7ff" stroke="#334155" stroke-width="1"/>
<text x="397.0" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Canalicular</text>
<text x="397.0" y="108" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155" font-weight="normal">respiratory bronchioles,</text>
<rect x="482.0" y="60" width="170.0" height="70" fill="#ede9fe" stroke="#334155" stroke-width="1"/>
<text x="567.0" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Saccular</text>
<text x="567.0" y="108" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155" font-weight="normal">terminal sacs</text>
<rect x="652.0" y="60" width="68.0" height="70" fill="#fae8ff" stroke="#334155" stroke-width="1"/>
<text x="686.0" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Alveolar</text>
<text x="686.0" y="108" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155" font-weight="normal">→ age ~8 y</text>
<text x="397.0" y="122" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155" font-weight="normal">type II cells appear</text>
<line x1="40" y1="150" x2="720" y2="150" stroke="#0f172a" stroke-width="2"/>
<line x1="40.0" y1="146" x2="40.0" y2="154" stroke="#0f172a"/>
<text x="40.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">0</text>
<line x1="108.0" y1="146" x2="108.0" y2="154" stroke="#0f172a"/>
<text x="108.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">4</text>
<line x1="176.0" y1="146" x2="176.0" y2="154" stroke="#0f172a"/>
<text x="176.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">8</text>
<line x1="244.0" y1="146" x2="244.0" y2="154" stroke="#0f172a"/>
<text x="244.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">12</text>
<line x1="312.0" y1="146" x2="312.0" y2="154" stroke="#0f172a"/>
<text x="312.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">16</text>
<line x1="380.0" y1="146" x2="380.0" y2="154" stroke="#0f172a"/>
<text x="380.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">20</text>
<line x1="448.0" y1="146" x2="448.0" y2="154" stroke="#0f172a"/>
<text x="448.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">24</text>
<line x1="516.0" y1="146" x2="516.0" y2="154" stroke="#0f172a"/>
<text x="516.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">28</text>
<line x1="584.0" y1="146" x2="584.0" y2="154" stroke="#0f172a"/>
<text x="584.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">32</text>
<line x1="652.0" y1="146" x2="652.0" y2="154" stroke="#0f172a"/>
<text x="652.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">36</text>
<line x1="720.0" y1="146" x2="720.0" y2="154" stroke="#0f172a"/>
<text x="720.0" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="normal">40</text>
<text x="380.0" y="188" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal">Gestational age (weeks)</text>
<line x1="448.0" y1="40" x2="448.0" y2="200" stroke="#b45309" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="635.0" y1="40" x2="635.0" y2="200" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4"/>
<text x="444.0" y="34" font-family="sans-serif" font-size="12" text-anchor="end" fill="#b45309" font-weight="normal">~24 wk: earliest viability</text>
<text x="639.0" y="34" font-family="sans-serif" font-size="12" text-anchor="end" fill="#2563eb" font-weight="normal">~35 wk: surfactant adequate</text>
<text x="40" y="225" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal">Antenatal corticosteroids speed type II cell maturation when preterm birth is expected.</text>
</svg>
