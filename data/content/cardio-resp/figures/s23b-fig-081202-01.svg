<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 235" role="img" aria-label="Ankle-brachial index interpretation scale from below 0.40 to above 1.40">
<rect x="0" y="0" width="700" height="235" fill="#ffffff"/>
<text x="350" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">ABI = higher ankle systolic pressure ÷ higher arm systolic pressure</text>
<text x="350" y="54" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">(calculated separately for each leg)</text>
<g font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">
<rect x="40" y="90" width="120" height="50" fill="#fecaca" stroke="#334155"/>
<rect x="160" y="90" width="160" height="50" fill="#fee2e2" stroke="#334155"/>
<rect x="320" y="90" width="90" height="50" fill="#f1f5f9" stroke="#334155"/>
<rect x="410" y="90" width="150" height="50" fill="#ffffff" stroke="#334155"/>
<rect x="560" y="90" width="100" height="50" fill="#e2e8f0" stroke="#334155" stroke-dasharray="6,4"/>
<text x="100" y="120">&lt; 0.40</text>
<text x="240" y="120">0.40–0.90</text>
<text x="365" y="120">0.91–0.99</text>
<text x="485" y="120">1.00–1.40</text>
<text x="610" y="120">&gt; 1.40</text>
<text x="100" y="166">Severe disease;</text>
<text x="100" y="182">rest pain, tissue</text>
<text x="100" y="198">loss likely</text>
<text x="240" y="166">PAD (≤ 0.90)</text>
<text x="240" y="182">claudication range</text>
<text x="365" y="166">Borderline</text>
<text x="485" y="166">Normal</text>
<text x="610" y="166">Noncompressible</text>
<text x="610" y="182">(calcified) arteries:</text>
<text x="610" y="198">use toe-brachial</text>
<text x="610" y="214">index</text>
</g>
<line x1="40" y1="76" x2="660" y2="76" stroke="#334155" stroke-width="2"/>
<text x="40" y="70" font-family="sans-serif" font-size="12" fill="#334155">lower</text>
<text x="660" y="70" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end">higher</text>
</svg>
