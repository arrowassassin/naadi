<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-label="Stanford classification of aortic dissection: type A involves the ascending aorta, type B begins distal to the left subclavian artery and spares the ascending aorta">
<rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
<text x="175" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Stanford type A</text>
<text x="525" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Stanford type B</text>
<g fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
<path d="M120,330 L120,150 C120,70 240,70 240,150 L240,360"/>
<path d="M470,330 L470,150 C470,70 590,70 590,150 L590,360"/>
</g>
<g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
<path d="M120,330 L120,150 C120,70 240,70 240,150 L240,360"/>
<path d="M470,330 L470,150 C470,70 590,70 590,150 L590,360"/>
</g>
<g stroke="#334155" stroke-width="6" stroke-linecap="round">
<line x1="150" y1="92" x2="150" y2="50"/><line x1="180" y1="82" x2="180" y2="42"/><line x1="210" y1="92" x2="210" y2="50"/>
<line x1="500" y1="92" x2="500" y2="50"/><line x1="530" y1="82" x2="530" y2="42"/><line x1="560" y1="92" x2="560" y2="50"/>
</g>
<g fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round">
<path d="M126,320 L126,150 C126,84 234,84 234,150 L234,355"/>
<path d="M584,140 L584,355"/>
</g>
<text x="60" y="230" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Ascending</text>
<text x="60" y="246" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">aorta</text>
<text x="300" y="250" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Descending</text>
<text x="300" y="266" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">aorta</text>
<text x="655" y="120" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Starts distal</text>
<text x="655" y="136" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">to left</text>
<text x="655" y="152" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">subclavian</text>
<line x1="620" y1="140" x2="598" y2="140" stroke="#334155" stroke-width="2"/>
<text x="175" y="385" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Ascending aorta involved → emergency surgery</text>
<text x="525" y="385" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Ascending spared → medical therapy first</text>
<rect x="250" y="300" width="14" height="14" fill="#dc2626"/>
<text x="270" y="312" font-family="sans-serif" font-size="12" fill="#0f172a">false lumen</text>
</svg>
