<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Timeline of microscopic changes after myocardial infarction and the complications of each window"><rect x="0" y="0" width="760" height="370" fill="#ffffff"/><text x="380.0" y="30" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold" >Myocardial infarction: what the tissue shows and what can go wrong</text><line x1="40" y1="70" x2="720" y2="70" stroke="#334155" stroke-width="3"/><circle cx="108.0" cy="70" r="7" fill="#334155"/><text x="108.0" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold" >0–4 h</text><rect x="44.0" y="90" width="128.0" height="120" rx="6" fill="#f1f5f9" stroke="#334155"/><rect x="44.0" y="220" width="128.0" height="100" rx="6" fill="#ffffff" stroke="#334155"/><text x="108.0" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Little or no</text><text x="108.0" y="129" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >change by light</text><text x="108.0" y="146" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >microscopy; wavy</text><text x="108.0" y="163" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >fibers at the edge</text><text x="108.0" y="242" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Arrhythmia (VF) is</text><text x="108.0" y="259" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >the main early</text><text x="108.0" y="276" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >killer</text><circle cx="244.0" cy="70" r="7" fill="#334155"/><text x="244.0" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold" >4–24 h</text><rect x="180.0" y="90" width="128.0" height="120" rx="6" fill="#f1f5f9" stroke="#334155"/><rect x="180.0" y="220" width="128.0" height="100" rx="6" fill="#ffffff" stroke="#334155"/><text x="244.0" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Coagulation</text><text x="244.0" y="129" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >necrosis begins:</text><text x="244.0" y="146" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >hypereosinophilic</text><text x="244.0" y="163" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >cells, nuclear</text><text x="244.0" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >loss; edema</text><text x="244.0" y="242" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Arrhythmia risk</text><text x="244.0" y="259" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >persists</text><circle cx="380.0" cy="70" r="7" fill="#334155"/><text x="380.0" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold" >1–3 d</text><rect x="316.0" y="90" width="128.0" height="120" rx="6" fill="#f1f5f9" stroke="#334155"/><rect x="316.0" y="220" width="128.0" height="100" rx="6" fill="#ffffff" stroke="#334155"/><text x="380.0" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Neutrophils</text><text x="380.0" y="129" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >infiltrate the</text><text x="380.0" y="146" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >dead muscle</text><text x="380.0" y="242" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Early fibrinous</text><text x="380.0" y="259" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >pericarditis</text><circle cx="516.0" cy="70" r="7" fill="#dc2626"/><text x="516.0" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold" >3–14 d</text><rect x="452.0" y="90" width="128.0" height="120" rx="6" fill="#f1f5f9" stroke="#334155"/><rect x="452.0" y="220" width="128.0" height="100" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="516.0" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Macrophages clear</text><text x="516.0" y="129" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >debris;</text><text x="516.0" y="146" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >granulation tissue</text><text x="516.0" y="163" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >starts at the</text><text x="516.0" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >border; wall</text><text x="516.0" y="197" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >weakest</text><text x="516.0" y="242" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="normal" >Free wall, septal</text><text x="516.0" y="259" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="normal" >or papillary</text><text x="516.0" y="276" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="normal" >muscle rupture</text><circle cx="652.0" cy="70" r="7" fill="#334155"/><text x="652.0" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold" >2 wk–2 mo</text><rect x="588.0" y="90" width="128.0" height="120" rx="6" fill="#f1f5f9" stroke="#334155"/><rect x="588.0" y="220" width="128.0" height="100" rx="6" fill="#ffffff" stroke="#334155"/><text x="652.0" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Collagen</text><text x="652.0" y="129" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >deposition matures</text><text x="652.0" y="146" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >into a gray-white</text><text x="652.0" y="163" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >scar</text><text x="652.0" y="242" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >Aneurysm, mural</text><text x="652.0" y="259" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >thrombus;</text><text x="652.0" y="276" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >autoimmune</text><text x="652.0" y="293" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >pericarditis weeks</text><text x="652.0" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="normal" >later</text><text x="44" y="345" font-family="sans-serif" font-size="12" text-anchor="start" fill="#334155" font-weight="normal" >Upper boxes: microscopic findings. Lower boxes: complications typical of that window.</text></svg>
