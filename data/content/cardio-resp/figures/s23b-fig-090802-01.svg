<text x="160" y="400" font-family="sans-serif" font-size="12" fill="#f8fafc">low, flat diaphragm</text>
<text x="380" y="80" font-family="sans-serif" font-size="12" fill="#f8fafc">trachea shifted</text>
</svg>
