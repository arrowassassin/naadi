<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 515" role="img" aria-label="Four flow-volume loops: normal, obstructive, restrictive and fixed upper airway obstruction"><rect x="0" y="0" width="700" height="515" fill="#ffffff"/><g transform="translate(10,10)"><text x="160" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Normal</text><line x1="30" y1="120" x2="300" y2="120" stroke="#334155" stroke-width="1.5"/><line x1="30" y1="28" x2="30" y2="200" stroke="#334155" stroke-width="1.5"/><text x="34" y="36" font-family="sans-serif" font-size="12" fill="#334155">Expiration</text><text x="34" y="198" font-family="sans-serif" font-size="12" fill="#334155">Inspiration</text><text x="165" y="216" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">Volume: TLC (left) → RV (right)</text><text x="22" y="120" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end" transform="rotate(-90 22 120)">Flow</text><path d="M80,120 C82,70 88,45 100,40 L240,120" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M240,120 C230,185 90,185 80,120" fill="none" stroke="#2563eb" stroke-width="3"/></g><g transform="translate(360,10)"><text x="160" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Obstructive (e.g. COPD)</text><line x1="30" y1="120" x2="300" y2="120" stroke="#334155" stroke-width="1.5"/><line x1="30" y1="28" x2="30" y2="200" stroke="#334155" stroke-width="1.5"/><text x="34" y="36" font-family="sans-serif" font-size="12" fill="#334155">Expiration</text><text x="34" y="198" font-family="sans-serif" font-size="12" fill="#334155">Inspiration</text><text x="165" y="216" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">Volume: TLC (left) → RV (right)</text><text x="22" y="120" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end" transform="rotate(-90 22 120)">Flow</text><path d="M80,120 C82,70 88,45 100,40 L240,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><path d="M240,120 C230,185 90,185 80,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><path d="M50,120 C52,85 56,70 64,68 C90,100 140,115 200,120" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M200,120 C190,172 60,172 50,120" fill="none" stroke="#2563eb" stroke-width="3"/></g><g transform="translate(10,260)"><text x="160" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Restrictive (e.g. pulmonary fibrosis)</text><line x1="30" y1="120" x2="300" y2="120" stroke="#334155" stroke-width="1.5"/><line x1="30" y1="28" x2="30" y2="200" stroke="#334155" stroke-width="1.5"/><text x="34" y="36" font-family="sans-serif" font-size="12" fill="#334155">Expiration</text><text x="34" y="198" font-family="sans-serif" font-size="12" fill="#334155">Inspiration</text><text x="165" y="216" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">Volume: TLC (left) → RV (right)</text><text x="22" y="120" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end" transform="rotate(-90 22 120)">Flow</text><path d="M80,120 C82,70 88,45 100,40 L240,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><path d="M240,120 C230,185 90,185 80,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><path d="M135,120 C136,78 140,58 147,55 L230,120" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M230,120 C225,178 140,178 135,120" fill="none" stroke="#2563eb" stroke-width="3"/></g><g transform="translate(360,260)"><text x="160" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Fixed upper airway obstruction</text><line x1="30" y1="120" x2="300" y2="120" stroke="#334155" stroke-width="1.5"/><line x1="30" y1="28" x2="30" y2="200" stroke="#334155" stroke-width="1.5"/><text x="34" y="36" font-family="sans-serif" font-size="12" fill="#334155">Expiration</text><text x="34" y="198" font-family="sans-serif" font-size="12" fill="#334155">Inspiration</text><text x="165" y="216" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">Volume: TLC (left) → RV (right)</text><text x="22" y="120" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end" transform="rotate(-90 22 120)">Flow</text><path d="M80,120 C82,70 88,45 100,40 L240,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><path d="M240,120 C230,185 90,185 80,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><path d="M80,120 L86,78 L215,78 C228,82 236,100 240,120" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M240,120 C238,152 230,160 220,160 L95,160 C86,160 81,150 80,120" fill="none" stroke="#2563eb" stroke-width="3"/></g><text x="350" y="505" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">Dashed grey = normal loop for comparison. Larger volumes plot further left.</text></svg>
