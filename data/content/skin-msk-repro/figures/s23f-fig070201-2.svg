<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Two schematic radiographs: left, an osteoid osteoma with a small round lucent nidus in thickened sclerotic cortex; right, an osteochondroma projecting from the metaphysis with cortex and marrow continuous with the host bone and a cartilage cap pointing away from the joint" font-family="sans-serif" fill="#0f172a"><title>Two schematic radiographs: left, an osteoid osteoma with a small round lucent nidus in thickened sclerotic cortex; right, an osteochondroma projecting from the metaphysis with cortex and marrow continuous with the host bone and a cartilage cap pointing away from the joint</title><rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380" y="30" font-size="18" text-anchor="middle" font-weight="bold">Two benign lesions recognised on imaging</text>
<text x="190" y="62" font-size="15" text-anchor="middle" font-weight="bold">Osteoid osteoma</text>
<rect x="150" y="80" width="80" height="280" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<rect x="165" y="80" width="50" height="280" fill="#ffffff" stroke="#0f172a"/>
<path d="M150 170 Q120 220 150 270 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
<rect x="138" y="180" width="27" height="80" fill="#94a3b8" stroke="none"/>
<circle cx="150" cy="220" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<line x1="141" y1="220" x2="100" y2="160" stroke="#0f172a"/>
<text x="20" y="135" font-size="13">Lucent nidus</text>
<text x="20" y="151" font-size="13">(under ~2 cm)</text>
<line x1="128" y1="250" x2="60" y2="290" stroke="#0f172a"/>
<text x="20" y="305" font-size="13">Dense reactive</text>
<text x="20" y="321" font-size="13">cortical sclerosis</text>
<text x="190" y="390" font-size="13" text-anchor="middle">Best seen on thin-section CT</text>
<text x="190" y="408" font-size="13" text-anchor="middle">Night pain relieved by NSAIDs</text>
<text x="560" y="62" font-size="15" text-anchor="middle" font-weight="bold">Osteochondroma</text>
<rect x="490" y="80" width="140" height="50" rx="20" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="560" y="110" font-size="12" text-anchor="middle">joint end</text>
<path d="M495 135 L625 135 L605 200 L605 360 L515 360 L515 200 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<path d="M605 205 L680 260 L670 278 L605 240 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<path d="M680 260 Q700 268 670 278" fill="#cbd5e1" stroke="#0f172a" stroke-width="3"/>
<line x1="688" y1="268" x2="720" y2="300" stroke="#0f172a"/>
<text x="650" y="318" font-size="13">Cartilage cap</text>
<text x="650" y="334" font-size="13">(over ~2 cm in an</text>
<text x="650" y="350" font-size="13">adult: worry)</text>
<line x1="630" y1="235" x2="670" y2="172" stroke="#0f172a"/>
<text x="650" y="150" font-size="13">Stalk points</text>
<text x="650" y="166" font-size="13">away from joint</text>
<text x="560" y="390" font-size="13" text-anchor="middle">Cortex and marrow continuous with host bone</text>
<text x="560" y="408" font-size="13" text-anchor="middle">Grows until skeletal maturity, then stops</text>
</svg>
