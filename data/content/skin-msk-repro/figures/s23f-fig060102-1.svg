<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Schematic of the epidermis and dermis showing the level of blister formation and target antigen in pemphigus foliaceus, staphylococcal scalded skin, pemphigus vulgaris, bullous pemphigoid, dermatitis herpetiformis and epidermolysis bullosa acquisita" font-family="sans-serif">
<title>Schematic of the epidermis and dermis showing the level of blister formation and target antigen in pemphigus foliaceus, staphylococcal scalded skin, pemphigus vulgaris, bullous pemphigoid, dermatitis herpetiformis and epidermolysis bullosa acquisita</title>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="16" font-weight="bold" fill="#0f172a">Where the blister forms: level of split and target antigen</text>
<rect x="30" y="60" width="260" height="25" fill="#f1e4c8" stroke="#475569"/>
<text x="40" y="77.5" font-size="13" fill="#0f172a">Stratum corneum</text>
<rect x="30" y="85" width="260" height="35" fill="#f3dcc0" stroke="#475569"/>
<text x="40" y="107.5" font-size="13" fill="#0f172a">Granular layer</text>
<rect x="30" y="120" width="260" height="95" fill="#f6d9b8" stroke="#475569"/>
<text x="40" y="172.5" font-size="13" fill="#0f172a">Spinous layer</text>
<rect x="30" y="215" width="260" height="30" fill="#eec39f" stroke="#475569"/>
<text x="40" y="235.0" font-size="13" fill="#0f172a">Basal layer</text>
<rect x="30" y="245" width="260" height="11" fill="#e2e8f0" stroke="#475569"/>
<rect x="30" y="256" width="260" height="9" fill="#94a3b8" stroke="#475569"/>
<rect x="30" y="265" width="260" height="65" fill="#f3c6b1" stroke="#475569"/>
<text x="40" y="302.5" font-size="13" fill="#0f172a">Papillary dermis</text>
<rect x="30" y="330" width="260" height="70" fill="#eab3a0" stroke="#475569"/>
<text x="40" y="370.0" font-size="13" fill="#0f172a">Reticular dermis</text>
<line x1="290" y1="100" x2="320" y2="100" stroke="#0f172a" stroke-width="2"/>
<polyline points="320,100 335,87" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="290" cy="100" r="4" fill="#0f172a"/>
<text x="340" y="86" font-size="13" font-weight="bold" fill="#0f172a">Pemphigus foliaceus; SSSS / bullous impetigo</text>
<text x="340" y="104" font-size="12" fill="#0f172a">Subcorneal or granular split; desmoglein-1 (antibody or toxin)</text>
<line x1="290" y1="213" x2="320" y2="213" stroke="#0f172a" stroke-width="2"/>
<polyline points="320,213 335,163" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="290" cy="213" r="4" fill="#0f172a"/>
<text x="340" y="162" font-size="13" font-weight="bold" fill="#0f172a">Pemphigus vulgaris</text>
<text x="340" y="180" font-size="12" fill="#0f172a">Suprabasal split; desmoglein-3 (+/- 1); intercellular IgG</text>
<line x1="290" y1="250" x2="320" y2="250" stroke="#0f172a" stroke-width="2"/>
<polyline points="320,250 335,239" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="290" cy="250" r="4" fill="#0f172a"/>
<text x="340" y="238" font-size="13" font-weight="bold" fill="#0f172a">Bullous pemphigoid; mucous membrane pemphigoid</text>
<text x="340" y="256" font-size="12" fill="#0f172a">Subepidermal, lamina lucida; BP180, BP230; linear IgG/C3 on DIF</text>
<line x1="290" y1="272" x2="320" y2="272" stroke="#0f172a" stroke-width="2"/>
<polyline points="320,272 335,381" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="290" cy="272" r="4" fill="#0f172a"/>
<text x="340" y="380" font-size="13" font-weight="bold" fill="#0f172a">Dermatitis herpetiformis</text>
<text x="340" y="398" font-size="12" fill="#0f172a">Dermal papillary tips; epidermal transglutaminase; granular IgA</text>
<line x1="290" y1="261" x2="320" y2="261" stroke="#0f172a" stroke-width="2"/>
<polyline points="320,261 335,311" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="290" cy="261" r="4" fill="#0f172a"/>
<text x="340" y="310" font-size="13" font-weight="bold" fill="#0f172a">Epidermolysis bullosa acquisita</text>
<text x="340" y="328" font-size="12" fill="#0f172a">Below lamina densa; type VII collagen; linear IgG</text>
<text x="34" y="254" font-size="12" fill="#0f172a">Basement membrane: lucida / densa</text>
<text x="30" y="430" font-size="12" fill="#0f172a">Higher split = thinner, flaccid roof that ruptures (positive Nikolsky sign). Lower split = tense blister.</text>
<text x="30" y="450" font-size="12" fill="#0f172a">DIF = direct immunofluorescence of perilesional skin. Schematic, not to scale.</text>
</svg>
