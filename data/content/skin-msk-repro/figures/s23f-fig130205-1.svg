<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Schematic of a 28-day cycle. FSH rises early in the follicular phase, dips mid-follicular, and has a small peak with the LH surge. LH is low until a sharp surge at about day 13 to 14, followed by ovulation. Estradiol rises through the follicular phase to a peak just before the LH surge, falls, then has a smaller second rise in the luteal phase. Progesterone is low in the follicular phase and peaks about day 21. Phase labels: follicular phase days 1 to 14 with menses then proliferative endometrium; luteal phase days 15 to 28 with secretory endometrium." font-family="sans-serif">
<title>Menstrual cycle hormone curves</title>
<desc>Schematic of a 28-day cycle. FSH rises early in the follicular phase, dips mid-follicular, and has a small peak with the LH surge. LH is low until a sharp surge at about day 13 to 14, followed by ovulation. Estradiol rises through the follicular phase to a peak just before the LH surge, falls, then has a smaller second rise in the luteal phase. Progesterone is low in the follicular phase and peaks about day 21. Phase labels: follicular phase days 1 to 14 with menses then proliferative endometrium; luteal phase days 15 to 28 with secretory endometrium.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380" y="28" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Menstrual cycle: relative hormone levels (idealised 28 days)</text>
<line x1="80" y1="330" x2="720" y2="330" stroke="#0f172a" stroke-width="1.5"/>
<line x1="80" y1="330" x2="80" y2="60" stroke="#0f172a" stroke-width="1.5"/>
<line x1="80.0" y1="330" x2="80.0" y2="336" stroke="#0f172a" stroke-width="1.5"/>
<text x="80.0" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Day 1</text>
<line x1="222.22222222222223" y1="330" x2="222.22222222222223" y2="336" stroke="#0f172a" stroke-width="1.5"/>
<text x="222.22222222222223" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Day 7</text>
<line x1="388.14814814814815" y1="330" x2="388.14814814814815" y2="336" stroke="#0f172a" stroke-width="1.5"/>
<text x="388.14814814814815" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Day 14</text>
<line x1="554.074074074074" y1="330" x2="554.074074074074" y2="336" stroke="#0f172a" stroke-width="1.5"/>
<text x="554.074074074074" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Day 21</text>
<line x1="720.0" y1="330" x2="720.0" y2="336" stroke="#0f172a" stroke-width="1.5"/>
<text x="720.0" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Day 28</text>
<text x="30" y="200" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Level</text>
<polyline points="80.0,297.6 174.8,303.0 269.6,303.0 340.7,276.0 364.4,73.5 388.1,141.0 411.9,289.5 530.4,308.4 720.0,303.0" fill="none" stroke="#0f172a" stroke-width="3"/>
<text x="372.44444444444446" y="77.5" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">LH surge</text>
<polyline points="80.0,249.0 151.1,240.9 245.9,270.6 340.7,276.0 376.3,227.4 411.9,281.4 625.2,297.6 720.0,254.4" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="3 4"/>
<text x="103.7037037037037" y="226.8" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">FSH</text>
<polyline points="80.0,303.0 198.5,276.0 293.3,208.5 352.6,135.6 388.1,235.5 459.3,249.0 554.1,200.4 648.9,249.0 720.0,303.0" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="10 5"/>
<text x="183.03703703703704" y="162.6" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">Estradiol</text>
<polyline points="80.0,319.2 364.4,316.5 411.9,289.5 483.0,195.0 554.1,162.6 625.2,208.5 720.0,316.5" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="2 3 8 3"/>
<text x="562.074074074074" y="151.79999999999998" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">Progesterone</text>
<line x1="388.14814814814815" y1="60" x2="388.14814814814815" y2="330" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
<text x="388.14814814814815" y="52" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Ovulation</text>
<rect x="80" y="362" width="304.14814814814815" height="36" rx="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
<text x="232.07407407407408" y="384.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">FOLLICULAR PHASE (length varies)</text>
<rect x="392.14814814814815" y="362" width="327.85185185185185" height="36" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="556.0740740740741" y="384.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">LUTEAL PHASE (about 14 days)</text>
<rect x="80" y="406" width="90.81481481481481" height="44" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="125.4074074074074" y="432.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Menses</text>
<rect x="174.8148148148148" y="406" width="209.33333333333334" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="279.48148148148147" y="424.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="279.48148148148147" dy="0">Proliferative endometrium</tspan><tspan x="279.48148148148147" dy="15">(estradiol)</tspan></text>
<rect x="392.14814814814815" y="406" width="327.85185185185185" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="556.0740740740741" y="432.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Secretory endometrium (progesterone)</text>
</svg>
