<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Flow diagram of the tampon dye test: bladder dye staining the tampon indicates a vesicovaginal fistula; an unstained tampon that turns orange after oral phenazopyridine indicates a ureterovaginal fistula." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Flow diagram of the tampon dye test: bladder dye staining the tampon indicates a vesicovaginal fistula; an unstained tampon that turns orange after oral phenazopyridine indicates a ureterovaginal fistula.</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold">Tampon (dye) test for suspected urinary fistula</text>
<rect x="240" y="55" width="280" height="60" rx="8" fill="#f1f5f9" stroke="#0f172a"/>
<text x="380" y="80" text-anchor="middle">Tampon in vagina; blue dye instilled</text>
<text x="380" y="100" text-anchor="middle">into the bladder by catheter</text>
<defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<line x1="320" y1="115" x2="170" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#a2)"/>
<line x1="440" y1="115" x2="590" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="180" width="260" height="80" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="170" y="205" text-anchor="middle" font-weight="bold">Tampon stained BLUE</text>
<text x="170" y="228" text-anchor="middle">bladder urine reaches vagina:</text>
<text x="170" y="248" text-anchor="middle">VESICOVAGINAL fistula</text>
<rect x="460" y="180" width="260" height="80" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 3"/>
<text x="590" y="205" text-anchor="middle" font-weight="bold">Tampon NOT blue but wet</text>
<text x="590" y="228" text-anchor="middle">give oral phenazopyridine,</text>
<text x="590" y="248" text-anchor="middle">replace tampon</text>
<line x1="590" y1="260" x2="590" y2="300" stroke="#0f172a" stroke-width="2" marker-end="url(#a2)"/>
<rect x="460" y="305" width="260" height="80" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="590" y="330" text-anchor="middle" font-weight="bold">Tampon stained ORANGE</text>
<text x="590" y="353" text-anchor="middle">urine from above the bladder:</text>
<text x="590" y="373" text-anchor="middle">URETEROVAGINAL fistula</text>
<text x="40" y="330" font-size="13">Both paths: confirm with cystoscopy</text>
<text x="40" y="350" font-size="13">and CT urography before repair.</text>
<text x="40" y="420" font-size="12">Words carry the result; the colour names refer to the dyes, not to the drawing.</text>

</svg>
