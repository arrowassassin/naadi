<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Diagram of burn depth showing superficial, superficial partial-thickness, deep partial-thickness and full-thickness burns against the skin layers, with appearance and healing time for each" font-family="sans-serif">
<title>Diagram of burn depth showing superficial, superficial partial-thickness, deep partial-thickness and full-thickness burns against the skin layers, with appearance and healing time for each</title>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Burn depth: what is destroyed and how it looks</text>
<rect x="20" y="50" width="170" height="30" fill="#f6d9b8" stroke="#475569"/>
<text x="28" y="70.0" font-size="13" fill="#0f172a">Epidermis</text>
<rect x="20" y="80" width="170" height="40" fill="#f3c6b1" stroke="#475569"/>
<text x="28" y="105.0" font-size="13" fill="#0f172a">Papillary dermis</text>
<rect x="20" y="120" width="170" height="80" fill="#eab3a0" stroke="#475569"/>
<text x="28" y="165.0" font-size="13" fill="#0f172a">Reticular dermis</text>
<rect x="20" y="200" width="170" height="60" fill="#fbefb4" stroke="#475569"/>
<text x="28" y="235.0" font-size="13" fill="#0f172a">Subcutaneous fat</text>
<rect x="260" y="50" width="22" height="210" fill="#f1f5f9" stroke="#475569"/>
<rect x="260" y="50" width="22" height="30" fill="#334155"/>
<text x="210" y="282" font-size="12" font-weight="bold" fill="#0f172a">Superficial</text>
<text x="210" y="299" font-size="12" fill="#0f172a">Epidermis only</text>
<text x="210" y="315" font-size="12" fill="#0f172a">Red, dry, painful</text>
<text x="210" y="331" font-size="12" fill="#0f172a">No blisters</text>
<text x="210" y="351" font-size="12" font-weight="bold" fill="#0f172a">Heals in ~1 week</text>
<rect x="395" y="50" width="22" height="210" fill="#f1f5f9" stroke="#475569"/>
<rect x="395" y="50" width="22" height="70" fill="#334155"/>
<text x="345" y="282" font-size="12" font-weight="bold" fill="#0f172a">Superficial partial</text>
<text x="345" y="299" font-size="12" fill="#0f172a">Into papillary dermis</text>
<text x="345" y="315" font-size="12" fill="#0f172a">Blisters, moist</text>
<text x="345" y="331" font-size="12" fill="#0f172a">Very painful</text>
<text x="345" y="351" font-size="12" font-weight="bold" fill="#0f172a">Heals in 2-3 weeks</text>
<rect x="530" y="50" width="22" height="210" fill="#f1f5f9" stroke="#475569"/>
<rect x="530" y="50" width="22" height="140" fill="#334155"/>
<text x="480" y="282" font-size="12" font-weight="bold" fill="#0f172a">Deep partial</text>
<text x="480" y="299" font-size="12" fill="#0f172a">Into reticular dermis</text>
<text x="480" y="315" font-size="12" fill="#0f172a">Blotchy, less pain</text>
<text x="480" y="331" font-size="12" fill="#0f172a">Slow refill</text>
<text x="480" y="351" font-size="12" font-weight="bold" fill="#0f172a">Over 3 weeks; graft</text>
<rect x="665" y="50" width="22" height="210" fill="#f1f5f9" stroke="#475569"/>
<rect x="665" y="50" width="22" height="210" fill="#334155"/>
<text x="615" y="282" font-size="12" font-weight="bold" fill="#0f172a">Full thickness</text>
<text x="615" y="299" font-size="12" fill="#0f172a">Through the dermis</text>
<text x="615" y="315" font-size="12" fill="#0f172a">White or leathery</text>
<text x="615" y="331" font-size="12" fill="#0f172a">Painless</text>
<text x="615" y="351" font-size="12" font-weight="bold" fill="#0f172a">Excise and graft</text>
<text x="20" y="380" font-size="12" fill="#0f172a">Dark bar = depth of tissue destroyed. Superficial burns are not counted in burned body surface area.</text>
</svg>
