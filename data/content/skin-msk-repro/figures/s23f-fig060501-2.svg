<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Six schematic rows of epidermis comparing melanocyte number with melanin content: normal skin; vitiligo and piebaldism with no melanocytes; albinism with melanocytes that lack pigment; freckle and melasma with normal melanocyte number and extra melanin; solar lentigo with more melanocytes along elongated rete ridges; and dermal pigment held in melanophages.">
