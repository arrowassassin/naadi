<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Four schematic bone cortices showing periosteal reactions: solid, lamellated onion-skin, spiculated sunburst and Codman triangle, each labelled with its usual meaning" font-family="sans-serif" fill="#0f172a"><title>Four schematic bone cortices showing periosteal reactions: solid, lamellated onion-skin, spiculated sunburst and Codman triangle, each labelled with its usual meaning</title><rect x="0" y="0" width="760" height="450" fill="#ffffff"/><text x="380" y="30" font-size="18" text-anchor="middle" font-weight="bold">Periosteal reaction: slow versus aggressive</text><text x="80" y="70" font-size="15" text-anchor="middle" font-weight="bold">Solid</text><rect x="60" y="90" width="40" height="260" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><path d="M60 150 Q42 220 60 290" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/><text x="80" y="380" font-size="13" text-anchor="middle">Thick, smooth</text><text x="80" y="398" font-size="13" text-anchor="middle">Slow process: benign</text><text x="80" y="416" font-size="13" text-anchor="middle">tumour, healing, chronic</text><text x="265" y="70" font-size="15" text-anchor="middle" font-weight="bold">Lamellated</text><rect x="245" y="90" width="40" height="260" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><path d="M245 140 Q235 220 245 300" fill="none" stroke="#0f172a" stroke-width="2"/><path d="M245 140 Q228 220 245 300" fill="none" stroke="#0f172a" stroke-width="2"/><path d="M245 140 Q221 220 245 300" fill="none" stroke="#0f172a" stroke-width="2"/><path d="M245 140 Q214 220 245 300" fill="none" stroke="#0f172a" stroke-width="2"/><text x="265" y="380" font-size="13" text-anchor="middle">Onion-skin layers</text><text x="265" y="398" font-size="13" text-anchor="middle">Ewing sarcoma;</text><text x="265" y="416" font-size="13" text-anchor="middle">also osteomyelitis</text><text x="450" y="70" font-size="15" text-anchor="middle" font-weight="bold">Spiculated</text><rect x="430" y="90" width="40" height="260" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="160" x2="395" y2="140" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="175" x2="395" y2="160" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="190" x2="395" y2="180" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="205" x2="395" y2="200" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="220" x2="395" y2="220" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="235" x2="395" y2="240" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="250" x2="395" y2="260" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="265" x2="395" y2="280" stroke="#0f172a" stroke-width="2"/><line x1="430" y1="280" x2="395" y2="300" stroke="#0f172a" stroke-width="2"/><text x="450" y="380" font-size="13" text-anchor="middle">Sunburst spicules</text><text x="450" y="398" font-size="13" text-anchor="middle">Osteosarcoma</text><text x="635" y="70" font-size="15" text-anchor="middle" font-weight="bold">Codman triangle</text><rect x="615" y="90" width="40" height="260" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><path d="M615 130 L593 175 L615 175 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/><path d="M615 180 Q570 230 615 300" fill="#e2e8f0" stroke="#0f172a" stroke-dasharray="5 4"/><text x="579" y="245" font-size="12">mass</text><text x="635" y="380" font-size="13" text-anchor="middle">Periosteum lifted at the</text><text x="635" y="398" font-size="13" text-anchor="middle">edge of a fast mass:</text><text x="635" y="416" font-size="13" text-anchor="middle">osteosarcoma, Ewing</text></svg>
