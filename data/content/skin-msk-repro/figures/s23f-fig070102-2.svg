<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Two hand joint maps: rheumatoid arthritis involves wrist, MCP and PIP joints and spares DIP joints; osteoarthritis involves DIP and PIP joints and the thumb base and spares MCP joints and wrist" font-family="sans-serif" fill="#0f172a"><title>Two hand joint maps: rheumatoid arthritis involves wrist, MCP and PIP joints and spares DIP joints; osteoarthritis involves DIP and PIP joints and the thumb base and spares MCP joints and wrist</title><rect x="0" y="0" width="760" height="380" fill="#ffffff"/><text x="380" y="28" font-size="18" text-anchor="middle" font-weight="bold">Which hand joints? Filled circle = typically involved</text><text x="150" y="60" font-size="16" text-anchor="middle" font-weight="bold">Rheumatoid arthritis</text><text x="40" y="95" font-size="13">DIP</text><circle cx="100" cy="90" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="134" cy="90" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="168" cy="90" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="202" cy="90" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="240" y="95" font-size="13">spared</text><text x="40" y="145" font-size="13">PIP</text><circle cx="100" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="134" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="168" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="202" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="240" y="145" font-size="13">involved</text><text x="40" y="200" font-size="13">MCP</text><circle cx="100" cy="195" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="134" cy="195" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="168" cy="195" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="202" cy="195" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="240" y="200" font-size="13">involved</text><text x="40" y="260" font-size="13">Wrist</text><circle cx="151" cy="255" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="240" y="260" font-size="13">involved</text><text x="40" y="300" font-size="13">Thumb base (CMC)</text><circle cx="180" cy="296" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="200" y="300" font-size="13">usually spared</text><text x="530" y="60" font-size="16" text-anchor="middle" font-weight="bold">Osteoarthritis (comparison)</text><text x="420" y="95" font-size="13">DIP</text><circle cx="480" cy="90" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="514" cy="90" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="548" cy="90" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="582" cy="90" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="620" y="95" font-size="13">involved</text><text x="420" y="145" font-size="13">PIP</text><circle cx="480" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="514" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="548" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><circle cx="582" cy="140" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="620" y="145" font-size="13">involved</text><text x="420" y="200" font-size="13">MCP</text><circle cx="480" cy="195" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="514" cy="195" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="548" cy="195" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="582" cy="195" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="620" y="200" font-size="13">spared</text><text x="420" y="260" font-size="13">Wrist</text><circle cx="531" cy="255" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="620" y="260" font-size="13">spared</text><text x="420" y="300" font-size="13">Thumb base (CMC)</text><circle cx="560" cy="296" r="11" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="580" y="300" font-size="13">involved</text><text x="380" y="345" font-size="13" text-anchor="middle">RA: symmetric, soft swelling, morning stiffness over 1 hour. OA: bony enlargement</text><text x="380" y="365" font-size="13" text-anchor="middle">(Heberden nodes at DIP, Bouchard nodes at PIP), brief stiffness, pain with use.</text></svg>
