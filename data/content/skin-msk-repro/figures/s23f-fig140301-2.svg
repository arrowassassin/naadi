<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Schematic of the male hypothalamic-pituitary-gonadal axis showing GnRH, LH to Leydig cells, FSH to Sertoli cells, testosterone and inhibin feedback, and drug sites for clomiphene, GnRH agonists, hCG, FSH, cabergoline and exogenous testosterone." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Schematic of the male hypothalamic-pituitary-gonadal axis showing GnRH, LH to Leydig cells, FSH to Sertoli cells, testosterone and inhibin feedback, and drug sites for clomiphene, GnRH agonists, hCG, FSH, cabergoline and exogenous testosterone.</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

<text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold">Male hypothalamic-pituitary-gonadal axis and drug sites</text>
<defs><marker id="m3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f172a"/></marker></defs>
<g font-size="14">
<rect x="280" y="55" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#0f172a"/><text x="380" y="80" text-anchor="middle">Hypothalamus (GnRH pulses)</text>
<rect x="280" y="140" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#0f172a"/><text x="380" y="165" text-anchor="middle">Anterior pituitary</text>
<rect x="120" y="250" width="200" height="50" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="220" y="272" text-anchor="middle">Leydig cells</text><text x="220" y="290" text-anchor="middle" font-size="12">make testosterone</text>
<rect x="440" y="250" width="200" height="50" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="540" y="272" text-anchor="middle">Sertoli cells</text><text x="540" y="290" text-anchor="middle" font-size="12">support sperm; inhibin B</text>
<rect x="250" y="350" width="260" height="40" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="380" y="375" text-anchor="middle">Spermatogenesis (needs high local testosterone)</text>
</g>
<g stroke="#0f172a" stroke-width="2" marker-end="url(#m3)">
<line x1="380" y1="95" x2="380" y2="138"/>
<line x1="330" y1="180" x2="240" y2="248"/><line x1="430" y1="180" x2="520" y2="248"/>
<line x1="250" y1="300" x2="320" y2="348"/><line x1="510" y1="300" x2="440" y2="348"/>
</g>
<g stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#m3)">
<path d="M120 270 Q40 160 278 75"/>
<path d="M640 270 Q720 200 482 160"/>
</g>
<g font-size="12">
<text x="300" y="215">LH</text><text x="470" y="215">FSH</text>
<text x="20" y="150">testosterone and estradiol</text><text x="20" y="166">feedback (dashed, inhibits)</text>
<text x="640" y="200">inhibin B</text><text x="640" y="216">feedback (dashed)</text>
<text x="500" y="70">clomiphene blocks estrogen</text><text x="500" y="86">feedback here</text>
<text x="500" y="125">GnRH agonist (continuous)</text><text x="500" y="141">desensitises pituitary</text>
<text x="20" y="320">hCG acts like LH on Leydig cells</text>
<text x="20" y="410">Exogenous testosterone: strengthens feedback, LH and FSH fall, local testosterone and sperm output drop.</text>
<text x="20" y="428">Recombinant FSH acts on Sertoli cells. Cabergoline lowers prolactin, restoring GnRH pulses.</text>
</g>

</svg>
