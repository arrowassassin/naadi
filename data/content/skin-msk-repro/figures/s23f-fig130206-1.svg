<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Schematic of neural control of female genital response: T11 to L2 sympathetic fibres via the hypogastric nerve to orgasm-phase smooth muscle; S2 to S4 parasympathetic pelvic splanchnic nerves to arousal and lubrication; pudendal nerve to pelvic floor contractions and clitoral sensation." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Schematic of neural control of female genital response: T11 to L2 sympathetic fibres via the hypogastric nerve to orgasm-phase smooth muscle; S2 to S4 parasympathetic pelvic splanchnic nerves to arousal and lubrication; pudendal nerve to pelvic floor contractions and clitoral sensation.</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

<text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold">Neural control of the genital sexual response</text>
<rect x="30" y="60" width="200" height="320" rx="10" fill="#f1f5f9" stroke="#0f172a"/>
<text x="130" y="86" text-anchor="middle" font-weight="bold">Spinal cord</text>
<rect x="55" y="110" width="150" height="70" rx="6" fill="#e2e8f0" stroke="#0f172a"/>
<text x="130" y="138" text-anchor="middle">T11&#8211;L2</text>
<text x="130" y="160" text-anchor="middle">sympathetic</text>
<rect x="55" y="270" width="150" height="80" rx="6" fill="#e2e8f0" stroke="#0f172a"/>
<text x="130" y="296" text-anchor="middle">S2&#8211;S4</text>
<text x="130" y="316" text-anchor="middle">parasympathetic</text>
<text x="130" y="336" text-anchor="middle">and somatic</text>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<line x1="205" y1="145" x2="470" y2="145" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="8 4"/>
<text x="330" y="135" text-anchor="middle">hypogastric nerve (dashed)</text>
<line x1="205" y1="290" x2="470" y2="250" stroke="#0f172a" stroke-width="3" marker-end="url(#ar)"/>
<text x="330" y="255" text-anchor="middle">pelvic splanchnic nerves (thick)</text>
<line x1="205" y1="330" x2="470" y2="345" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="2 4"/>
<text x="330" y="360" text-anchor="middle">pudendal nerve (dotted)</text>
<rect x="480" y="105" width="250" height="80" rx="8" fill="#ffffff" stroke="#0f172a"/>
<text x="605" y="130" text-anchor="middle" font-weight="bold">ORGASM / emission phase</text>
<text x="605" y="152" text-anchor="middle">smooth muscle contraction</text>
<text x="605" y="172" text-anchor="middle">of reproductive tract</text>
<rect x="480" y="205" width="250" height="90" rx="8" fill="#ffffff" stroke="#0f172a"/>
<text x="605" y="230" text-anchor="middle" font-weight="bold">AROUSAL</text>
<text x="605" y="252" text-anchor="middle">NO and VIP release, clitoral</text>
<text x="605" y="272" text-anchor="middle">engorgement, lubrication</text>
<rect x="480" y="315" width="250" height="90" rx="8" fill="#ffffff" stroke="#0f172a"/>
<text x="605" y="340" text-anchor="middle" font-weight="bold">ORGASM / sensation</text>
<text x="605" y="362" text-anchor="middle">pelvic floor contractions;</text>
<text x="605" y="382" text-anchor="middle">clitoral touch (dorsal nerve)</text>
<text x="30" y="420" font-size="12">Schematic, not to scale. Line style, not colour, identifies each pathway.</text>

</svg>
