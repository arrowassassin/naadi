<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" width="760" height="545" role="img" aria-label="Axial schematic of the prostate: anterior fibromuscular stroma at the front, two transition-zone lobes around the prostatic urethra where BPH arises, the central zone behind the urethra around the ejaculatory ducts, and the peripheral zone forming the posterior and lateral gland against the rectum, where most cancers arise.">
<title>Axial schematic of the prostate: anterior fibromuscular stroma at the front, two transition-zone lobes around the prostatic urethra where BPH arises, the central zone behind the urethra around the ejaculatory ducts, and the peripheral zone forming the posterior and lateral gland against the rectum, where most cancers arise.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="545" fill="#ffffff"/>
<text x="380" y="30" font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Prostate zones (axial view, schematic)</text>
<text x="380" y="60" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">ANTERIOR (pubic symphysis)</text>
<ellipse cx="380" cy="250" rx="200" ry="160" fill="#dbeafe" stroke="#0f172a" stroke-width="2"/>
<path d="M 230 150 Q 380 60 530 150 L 470 190 Q 380 150 290 190 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<ellipse cx="335" cy="230" rx="55" ry="45" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/>
<ellipse cx="425" cy="230" rx="55" ry="45" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/>
<path d="M 320 290 Q 380 270 440 290 L 410 345 Q 380 355 350 345 Z" fill="#ede9fe" stroke="#0f172a" stroke-width="1.5"/>
<circle cx="380" cy="235" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="380" y="240" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">U</text>
<ellipse cx="380" cy="470" rx="90" ry="28" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
<text x="380" y="475" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">Rectum</text>
<text x="380" y="520" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">POSTERIOR: the peripheral zone lies against the rectum, so its tumours can be felt on rectal examination</text>
<line x1="250" y1="165" x2="120" y2="110" stroke="#0f172a" stroke-width="1.5"/>
<text x="20" y="92" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">Anterior fibromuscular</text>
<text x="20" y="106" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">stroma (no glands)</text>
<line x1="300" y1="220" x2="150" y2="205" stroke="#0f172a" stroke-width="1.5"/>
<text x="20" y="190" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">TRANSITION zone</text>
<text x="20" y="205" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">around the urethra:</text>
<text x="20" y="219" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">BPH nodules arise here</text>
<line x1="380" y1="330" x2="150" y2="330" stroke="#0f172a" stroke-width="1.5"/>
<text x="20" y="315" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">CENTRAL zone</text>
<text x="20" y="330" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">around the ejaculatory</text>
<text x="20" y="344" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">ducts at the base</text>
<line x1="560" y1="300" x2="600" y2="320" stroke="#0f172a" stroke-width="1.5"/>
<text x="605" y="300" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">PERIPHERAL zone</text>
<text x="605" y="315" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">largest glandular</text>
<text x="605" y="330" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">zone; about 70% of</text>
<text x="605" y="345" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">cancers arise here</text>
<line x1="394" y1="235" x2="600" y2="190" stroke="#0f172a" stroke-width="1.5"/>
<text x="605" y="180" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">U = prostatic</text>
<text x="605" y="195" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">urethra (compressed</text>
<text x="605" y="210" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="normal">by BPH)</text>
</svg>
