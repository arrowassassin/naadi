<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Flow diagram of infection routes in the male genital tract. Ascending route: urethra to prostatic urethra and ejaculatory ducts to vas deferens to epididymis to testis, with reflux into the prostate; caused by sexually transmitted organisms or enteric gram-negative rods. Hematogenous route: bloodstream to testis, as in mumps orchitis.">
<title>Flow diagram of infection routes in the male genital tract. Ascending route: urethra to prostatic urethra and ejaculatory ducts to vas deferens to epididymis to testis, with reflux into the prostate; caused by sexually transmitted organisms or enteric gram-negative rods. Hematogenous route: bloodstream to testis, as in mumps orchitis.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
<text x="380" y="32" font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">How infection reaches the male genital organs</text>
<rect x="30" y="70" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="130.0" y="101.2" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="130.0" dy="0">Urethra</tspan><tspan x="130.0" dy="18">(first site of STI)</tspan></text>
<rect x="280" y="70" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="101.2" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="380.0" dy="0">Prostatic urethra and</tspan><tspan x="380.0" dy="18">ejaculatory ducts</tspan></text>
<rect x="530" y="70" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="630.0" y="109.9" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">Vas deferens</text>
<line x1="230" y1="105" x2="278" y2="105" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="480" y1="105" x2="528" y2="105" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="530" y="200" width="200" height="70" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="630.0" y="231.2" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="630.0" dy="0">Epididymis</tspan><tspan x="630.0" dy="18">(tail first, then head)</tspan></text>
<line x1="630" y1="140" x2="630" y2="198" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="200" width="200" height="70" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="231.2" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="380.0" dy="0">Testis</tspan><tspan x="380.0" dy="18">(epididymo-orchitis)</tspan></text>
<line x1="530" y1="235" x2="482" y2="235" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="200" width="200" height="70" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="130.0" y="231.2" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="130.0" dy="0">Prostate gland</tspan><tspan x="130.0" dy="18">(reflux of urine)</tspan></text>
<line x1="330" y1="140" x2="160" y2="198" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<text x="380" y="310" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">ASCENDING route (solid arrows): the usual path for bacteria</text>
<text x="380" y="334" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Sexually transmitted: N. gonorrhoeae, C. trachomatis, M. genitalium</text>
<text x="380" y="356" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Enteric gram-negative rods: outlet obstruction, catheter or instrumentation, insertive anal sex</text>
<rect x="280" y="390" width="200" height="60" rx="8" fill="#ede9fe" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="380.0" y="416.1" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="380.0" dy="0">Bloodstream</tspan><tspan x="380.0" dy="18">(viremia)</tspan></text>
<line x1="380" y1="390" x2="380" y2="272" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 4"/>
<text x="380" y="478" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">HEMATOGENOUS route (dashed arrow): mumps orchitis, which usually involves the testis</text>
<text x="380" y="498" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">with little epididymal involvement, days after parotitis</text>
</svg>
