<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="Schematic of skin layers from stratum corneum to muscle, with bars showing the depth of impetigo, ecthyma, erysipelas, cellulitis, necrotizing fasciitis and myonecrosis" font-family="sans-serif">
<title>Schematic of skin layers from stratum corneum to muscle, with bars showing the depth of impetigo, ecthyma, erysipelas, cellulitis, necrotizing fasciitis and myonecrosis</title>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<rect x="40" y="50" width="380" height="12" fill="#f1e4c8" stroke="#475569" stroke-width="1"/>
<text x="52" y="60" font-size="12" fill="#0f172a">Stratum corneum</text>
<rect x="40" y="62" width="380" height="48" fill="#f6d9b8" stroke="#475569" stroke-width="1"/>
<text x="52" y="91.0" font-size="14" fill="#0f172a">Epidermis</text>
<rect x="40" y="110" width="380" height="40" fill="#f3c6b1" stroke="#475569" stroke-width="1"/>
<text x="52" y="135.0" font-size="14" fill="#0f172a">Papillary dermis</text>
<rect x="40" y="150" width="380" height="80" fill="#eab3a0" stroke="#475569" stroke-width="1"/>
<text x="52" y="195.0" font-size="14" fill="#0f172a">Reticular dermis</text>
<rect x="40" y="230" width="380" height="100" fill="#fbefb4" stroke="#475569" stroke-width="1"/>
<text x="52" y="285.0" font-size="14" fill="#0f172a">Subcutaneous fat</text>
<rect x="40" y="330" width="380" height="16" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
<text x="52" y="343.0" font-size="12" fill="#0f172a">Deep fascia</text>
<rect x="40" y="346" width="380" height="94" fill="#e7a2a2" stroke="#475569" stroke-width="1"/>
<text x="52" y="398.0" font-size="14" fill="#0f172a">Muscle</text>
<text x="40" y="34" font-size="16" font-weight="bold" fill="#0f172a">Depth of skin and soft-tissue infections</text>
<line x1="440" y1="62" x2="440" y2="92" stroke="#0f172a" stroke-width="4"/>
<line x1="434" y1="62" x2="446" y2="62" stroke="#0f172a" stroke-width="2"/>
<line x1="434" y1="92" x2="446" y2="92" stroke="#0f172a" stroke-width="2"/>
<polyline points="440,77.0 530,77.0 536,66" fill="none" stroke="#64748b" stroke-width="1"/>
<text x="540" y="66" font-size="13" font-weight="bold" fill="#0f172a">Impetigo</text>
<text x="540" y="82" font-size="12" fill="#0f172a">(upper epidermis)</text>
<line x1="455" y1="62" x2="455" y2="150" stroke="#0f172a" stroke-width="4"/>
<line x1="449" y1="62" x2="461" y2="62" stroke="#0f172a" stroke-width="2"/>
<line x1="449" y1="150" x2="461" y2="150" stroke="#0f172a" stroke-width="2"/>
<polyline points="455,106.0 530,106.0 536,108" fill="none" stroke="#64748b" stroke-width="1"/>
<text x="540" y="108" font-size="13" font-weight="bold" fill="#0f172a">Ecthyma</text>
<text x="540" y="124" font-size="12" fill="#0f172a">(ulcer into dermis)</text>
<line x1="470" y1="110" x2="470" y2="162" stroke="#0f172a" stroke-width="4"/>
<line x1="464" y1="110" x2="476" y2="110" stroke="#0f172a" stroke-width="2"/>
<line x1="464" y1="162" x2="476" y2="162" stroke="#0f172a" stroke-width="2"/>
<polyline points="470,136.0 530,136.0 536,150" fill="none" stroke="#64748b" stroke-width="1"/>
<text x="540" y="150" font-size="13" font-weight="bold" fill="#0f172a">Erysipelas</text>
<text x="540" y="166" font-size="12" fill="#0f172a">(upper dermis, lymphatics)</text>
<line x1="485" y1="110" x2="485" y2="330" stroke="#0f172a" stroke-width="4"/>
<line x1="479" y1="110" x2="491" y2="110" stroke="#0f172a" stroke-width="2"/>
<line x1="479" y1="330" x2="491" y2="330" stroke="#0f172a" stroke-width="2"/>
<polyline points="485,220.0 530,220.0 536,216" fill="none" stroke="#64748b" stroke-width="1"/>
<text x="540" y="216" font-size="13" font-weight="bold" fill="#0f172a">Cellulitis</text>
<text x="540" y="232" font-size="12" fill="#0f172a">(deep dermis and fat)</text>
<line x1="500" y1="322" x2="500" y2="352" stroke="#0f172a" stroke-width="4"/>
<line x1="494" y1="322" x2="506" y2="322" stroke="#0f172a" stroke-width="2"/>
<line x1="494" y1="352" x2="506" y2="352" stroke="#0f172a" stroke-width="2"/>
<polyline points="500,337.0 530,337.0 536,296" fill="none" stroke="#64748b" stroke-width="1"/>
<text x="540" y="296" font-size="13" font-weight="bold" fill="#0f172a">Necrotizing fasciitis</text>
<text x="540" y="312" font-size="12" fill="#0f172a">(along fascia)</text>
<line x1="515" y1="346" x2="515" y2="440" stroke="#0f172a" stroke-width="4"/>
<line x1="509" y1="346" x2="521" y2="346" stroke="#0f172a" stroke-width="2"/>
<line x1="509" y1="440" x2="521" y2="440" stroke="#0f172a" stroke-width="2"/>
<polyline points="515,393.0 530,393.0 536,396" fill="none" stroke="#64748b" stroke-width="1"/>
<text x="540" y="396" font-size="13" font-weight="bold" fill="#0f172a">Myonecrosis / gas gangrene</text>
<text x="540" y="412" font-size="12" fill="#0f172a">(muscle)</text>
<text x="40" y="465" font-size="12" fill="#0f172a">Deeper level = more systemic toxicity and more need for surgery. Schematic, not to scale.</text>
</svg>
