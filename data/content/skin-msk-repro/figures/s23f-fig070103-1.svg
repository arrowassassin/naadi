<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Cross-section schematic of the six dorsal extensor compartments of the wrist with their tendons; the first compartment containing abductor pollicis longus and extensor pollicis brevis is shaded" font-family="sans-serif" fill="#0f172a"><title>Cross-section schematic of the six dorsal extensor compartments of the wrist with their tendons; the first compartment containing abductor pollicis longus and extensor pollicis brevis is shaded</title><rect x="0" y="0" width="760" height="420" fill="#ffffff"/><text x="380" y="30" font-size="18" text-anchor="middle" font-weight="bold">Dorsal extensor compartments of the right wrist</text><text x="380" y="52" font-size="13" text-anchor="middle">Viewed from the back of the hand; thumb (radial) side on the left</text><path d="M60 230 Q380 120 700 230 L700 290 L60 290 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><text x="120" y="282" font-size="13">Radius</text><text x="610" y="282" font-size="13">Ulna</text><rect x="57" y="160" width="96" height="60" rx="12" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/><text x="105" y="186" font-size="15" text-anchor="middle" font-weight="bold">1</text><text x="105" y="206" font-size="12" text-anchor="middle">APL, EPB</text><rect x="167" y="160" width="96" height="60" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="215" y="186" font-size="15" text-anchor="middle" font-weight="bold">2</text><text x="215" y="206" font-size="12" text-anchor="middle">ECRL, ECRB</text><rect x="277" y="160" width="96" height="60" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="325" y="186" font-size="15" text-anchor="middle" font-weight="bold">3</text><text x="325" y="206" font-size="12" text-anchor="middle">EPL</text><rect x="387" y="160" width="96" height="60" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="435" y="186" font-size="15" text-anchor="middle" font-weight="bold">4</text><text x="435" y="206" font-size="12" text-anchor="middle">EDC, EIP</text><rect x="497" y="160" width="96" height="60" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="545" y="186" font-size="15" text-anchor="middle" font-weight="bold">5</text><text x="545" y="206" font-size="12" text-anchor="middle">EDM</text><rect x="607" y="160" width="96" height="60" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="655" y="186" font-size="15" text-anchor="middle" font-weight="bold">6</text><text x="655" y="206" font-size="12" text-anchor="middle">ECU</text><polygon points="265,232 275,214 285,232" fill="#0f172a"/><text x="275" y="250" font-size="12" text-anchor="middle">Lister tubercle</text><text x="40" y="330" font-size="13">1 (shaded): abductor pollicis longus, extensor pollicis brevis: De Quervain tenosynovitis</text><text x="40" y="350" font-size="13">2: extensor carpi radialis longus and brevis; 3: extensor pollicis longus (turns around Lister tubercle);</text><text x="40" y="370" font-size="13">4: extensor digitorum and extensor indicis; 5: extensor digiti minimi; 6: extensor carpi ulnaris.</text><text x="40" y="400" font-size="13">Test: wrist ulnar deviation with the thumb held in the fist stretches compartment 1 and reproduces pain.</text></svg>
