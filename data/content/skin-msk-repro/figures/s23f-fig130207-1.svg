<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Schematic of three levels of vaginal support: level I uterosacral and cardinal ligaments suspending the apex, failure causing uterine or vault prolapse; level II lateral attachment to the arcus tendineus, failure causing cystocele or rectocele; level III perineal body and membrane, failure causing a gaping introitus or low rectocele." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Schematic of three levels of vaginal support: level I uterosacral and cardinal ligaments suspending the apex, failure causing uterine or vault prolapse; level II lateral attachment to the arcus tendineus, failure causing cystocele or rectocele; level III perineal body and membrane, failure causing a gaping introitus or low rectocele.</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

<text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold">Three levels of vaginal support (schematic)</text>
<rect x="330" y="60" width="100" height="320" rx="30" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="380" y="220" text-anchor="middle" transform="rotate(-90 380 220)">VAGINA</text>
<line x1="70" y1="60" x2="730" y2="60" stroke="#0f172a" stroke-dasharray="4 4"/>
<text x="380" y="54" text-anchor="middle" font-size="12">cervix / vaginal apex</text>
<rect x="330" y="62" width="100" height="90" fill="none" stroke="#0f172a" stroke-width="4"/>
<line x1="330" y1="90" x2="150" y2="80" stroke="#0f172a" stroke-width="3"/>
<line x1="430" y1="90" x2="580" y2="80" stroke="#0f172a" stroke-width="3"/>
<text x="30" y="90" font-weight="bold">LEVEL I</text>
<text x="30" y="110">uterosacral&#8211;cardinal</text>
<text x="30" y="128">ligaments: suspend apex</text>
<text x="590" y="90" font-size="13" font-weight="bold">Failure:</text>
<text x="590" y="110" font-size="13">uterine / vault</text>
<text x="590" y="128" font-size="13">prolapse</text>
<line x1="330" y1="230" x2="160" y2="230" stroke="#0f172a" stroke-width="3"/>
<line x1="430" y1="230" x2="580" y2="230" stroke="#0f172a" stroke-width="3"/>
<text x="30" y="210" font-weight="bold">LEVEL II</text>
<text x="30" y="230">lateral attachment to</text>
<text x="30" y="248">arcus tendineus</text>
<text x="590" y="210" font-size="13" font-weight="bold">Failure:</text>
<text x="590" y="230" font-size="13">cystocele (anterior)</text>
<text x="590" y="248" font-size="13">rectocele (posterior)</text>
<rect x="300" y="330" width="160" height="40" rx="6" fill="#e2e8f0" stroke="#0f172a"/>
<text x="380" y="355" text-anchor="middle" font-size="13">perineal body</text>
<text x="30" y="335" font-weight="bold">LEVEL III</text>
<text x="30" y="355">perineal body and</text>
<text x="30" y="373">perineal membrane</text>
<text x="590" y="335" font-size="13" font-weight="bold">Failure:</text>
<text x="590" y="355" font-size="13">gaping introitus,</text>
<text x="590" y="373" font-size="13">low rectocele</text>
<text x="380" y="408" text-anchor="middle" font-size="13">The levator ani closes the hiatus below; when it fails,</text>
<text x="380" y="426" text-anchor="middle" font-size="13">these connective-tissue supports carry the load.</text>

</svg>
