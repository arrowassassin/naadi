<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Cross-section of the epidermis and basement membrane zone with three numbered split levels: 1 within basal keratinocytes in epidermolysis bullosa simplex, 2 in the lamina lucida in junctional epidermolysis bullosa, and 3 below the lamina densa at the anchoring fibrils in dystrophic epidermolysis bullosa, with the proteins and main clinical features of each.">
<title>Cross-section of the epidermis and basement membrane zone with three numbered split levels: 1 within basal keratinocytes in epidermolysis bullosa simplex, 2 in the lamina lucida in junctional epidermolysis bullosa, and 3 below the lamina densa at the anchoring fibrils in dystrophic epidermolysis bullosa, with the proteins and main clinical features of each.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380" y="26" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">Inherited epidermolysis bullosa: where the skin splits</text>
<rect x="110" y="50" width="320" height="34" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
<text x="118" y="72" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">upper epidermis</text>
<rect x="110" y="84" width="320" height="60" rx="0" fill="#f8fafc" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="132" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="176" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="220" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="264" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="308" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="352" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="396" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="440" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="484" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<text x="118" y="100" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">basal keratinocytes (keratins 5 and 14)</text>
<rect x="110" y="144" width="320" height="10" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
<rect x="110" y="154" width="320" height="8" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="0.8"/>
<rect x="110" y="162" width="320" height="70" rx="0" fill="#fefce8" stroke="#0f172a" stroke-width="1"/>
<path d="M130 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M170 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M210 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M250 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M290 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M330 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M370 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M410 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M450 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M490 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="118" y="250" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">dermis with anchoring fibrils (type VII collagen)</text>
<circle cx="448" cy="128" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="448" y="133" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">1</text>
<line x1="410" y1="128" x2="436" y2="128" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
<circle cx="448" cy="149" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="448" y="154" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">2</text>
<line x1="410" y1="149" x2="436" y2="149" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
<circle cx="448" cy="176" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="448" y="181" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">3</text>
<line x1="410" y1="176" x2="436" y2="176" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="104" y="153" font-family="sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">lamina lucida</text>
<text x="104" y="170" font-family="sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">lamina densa</text>
<text x="494" y="60" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">1. EB simplex</text>
<text x="494" y="78" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Split within basal keratinocytes</text>
<text x="494" y="94" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">(KRT5, KRT14). Hands and feet,</text>
<text x="494" y="110" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">friction, heat; heals without scars.</text>
<text x="494" y="140" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">2. Junctional EB</text>
<text x="494" y="158" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Split in the lamina lucida (laminin-332,</text>
<text x="494" y="174" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">type XVII collagen, integrin α6β4).</text>
<text x="494" y="190" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Severe forms lethal in infancy; enamel</text>
<text x="494" y="206" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">defects; pyloric atresia (α6β4).</text>
<text x="494" y="236" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">3. Dystrophic EB</text>
<text x="494" y="254" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Split below the lamina densa (COL7A1,</text>
<text x="494" y="270" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">anchoring fibrils). Scars, milia, nail</text>
<text x="494" y="286" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">loss, mitten hands, oesophageal</text>
<text x="494" y="302" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">strictures; recessive form: aggressive SCC.</text>
<line x1="20" y1="330" x2="740" y2="330" stroke="#94a3b8" stroke-width="1"/>
<text x="20" y="356" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Kindler EB (FERMT1) splits at more than one level and adds photosensitivity and poikiloderma.</text>
<text x="20" y="376" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Diagnosis: biopsy of a fresh, induced blister for immunofluorescence mapping or electron microscopy, plus genetic testing.</text>
<text x="20" y="396" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Autoimmune blistering diseases target some of the same proteins (for example, type XVII and type VII collagen).</text>
</svg>
