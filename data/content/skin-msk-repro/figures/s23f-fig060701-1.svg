<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="Cross-section of the epidermis and basement membrane zone with three numbered split levels: 1 within basal keratinocytes in epidermolysis bullosa simplex, 2 in the lamina lucida in junctional epidermolysis bullosa, and 3 below the lamina densa at the anchoring fibrils in dystrophic epidermolysis bullosa, with the proteins and main clinical features of each.">
<title>Cross-section of the epidermis and basement membrane zone with three numbered split levels: 1 within basal keratinocytes in epidermolysis bullosa simplex, 2 in the lamina lucida in junctional epidermolysis bullosa, and 3 below the lamina densa at the anchoring fibrils in dystrophic epidermolysis bullosa, with the proteins and main clinical features of each.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#ffffff"/>
<text x="380" y="26" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">Inherited epidermolysis bullosa: where the skin splits</text>
<rect x="40" y="50" width="400" height="34" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
<text x="48" y="72" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">upper epidermis</text>
<rect x="40" y="84" width="400" height="60" rx="0" fill="#f8fafc" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="62" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="106" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="150" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="194" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="238" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="282" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="326" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="370" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<ellipse cx="414" cy="128" rx="18" ry="14" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<text x="48" y="100" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">basal keratinocytes (keratin 5 and 14)</text>
<rect x="40" y="144" width="400" height="10" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
<rect x="40" y="154" width="400" height="8" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="0.8"/>
<rect x="40" y="162" width="400" height="70" rx="0" fill="#fefce8" stroke="#0f172a" stroke-width="1"/>
<path d="M60 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M100 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M140 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M180 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M220 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M260 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M300 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M340 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M380 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M420 162 q6 14 0 28 q-6 14 0 28" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="48" y="250" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">dermis with anchoring fibrils (type VII collagen)</text>
<circle cx="458" cy="128" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="458" y="133" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">1</text>
<line x1="340" y1="128" x2="446" y2="128" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
<circle cx="458" cy="149" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="458" y="154" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">2</text>
<line x1="340" y1="149" x2="446" y2="149" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
<circle cx="458" cy="176" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="458" y="181" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">3</text>
<line x1="340" y1="176" x2="446" y2="176" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="432" y="152" font-family="sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">lamina lucida</text>
<text x="432" y="172" font-family="sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">lamina densa</text>
<text x="478" y="60" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">1. EB simplex</text>
<text x="478" y="78" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Split within basal keratinocytes (KRT5, KRT14).</text>
<text x="478" y="94" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Hands and feet, friction and heat; heals without scars.</text>
<text x="478" y="130" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">2. Junctional EB</text>
<text x="478" y="148" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Split in the lamina lucida (laminin-332, type XVII</text>
<text x="478" y="164" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">collagen, integrin α6β4). Severe forms are lethal in</text>
<text x="478" y="180" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">infancy; dental enamel defects; pyloric atresia (α6β4).</text>
<text x="478" y="216" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">3. Dystrophic EB</text>
<text x="478" y="234" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Split below the lamina densa (COL7A1, anchoring</text>
<text x="478" y="250" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">fibrils). Scarring, milia, nail loss, mitten hands,</text>
<text x="478" y="266" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">oesophageal strictures; recessive form: aggressive SCC.</text>
<line x1="20" y1="290" x2="740" y2="290" stroke="#94a3b8" stroke-width="1"/>
<text x="40" y="316" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Kindler EB (FERMT1) splits at more than one level and adds photosensitivity and poikiloderma.</text>
<text x="40" y="336" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Diagnosis: biopsy of a fresh, induced blister for immunofluorescence mapping or electron microscopy, plus genetic testing.</text>
<text x="40" y="356" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Autoimmune blistering diseases target some of the same proteins (for example, type XVII and type VII collagen).</text>
</svg>
