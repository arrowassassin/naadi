<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Schematic comparing needle-shaped monosodium urate crystals, yellow when parallel and blue when perpendicular to the compensator axis, with rhomboid calcium pyrophosphate crystals, blue when parallel and yellow when perpendicular" font-family="sans-serif" fill="#0f172a">
<title>Schematic comparing needle-shaped monosodium urate crystals, yellow when parallel and blue when perpendicular to the compensator axis, with rhomboid calcium pyrophosphate crystals, blue when parallel and yellow when perpendicular</title>
<rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
<text x="380" y="30" font-size="18" font-weight="bold" text-anchor="middle">Crystals under compensated polarized light</text>
<defs><marker id="ax" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<line x1="250" y1="62" x2="510" y2="62" stroke="#0f172a" stroke-width="3" marker-end="url(#ax)"/>
<text x="380" y="88" font-size="14" text-anchor="middle">Slow axis of the compensator (horizontal)</text>
<rect x="30" y="110" width="330" height="330" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="195" y="138" font-size="16" font-weight="bold" text-anchor="middle">Monosodium urate (gout)</text>
<text x="195" y="160" font-size="13" text-anchor="middle">needles, strong NEGATIVE birefringence</text>
<rect x="400" y="110" width="330" height="330" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="565" y="138" font-size="16" font-weight="bold" text-anchor="middle">Calcium pyrophosphate (CPPD)</text>
<text x="565" y="160" font-size="13" text-anchor="middle">rhomboids, weak POSITIVE birefringence</text>
<line x1="60" y1="205" x2="180" y2="205" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
<line x1="70" y1="227" x2="190" y2="227" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
<line x1="80" y1="249" x2="200" y2="249" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
<text x="230" y="215" font-size="13">parallel:</text><text x="230" y="233" font-size="13" font-weight="bold">YELLOW</text>
<line x1="80" y1="300" x2="80" y2="410" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<line x1="110" y1="300" x2="110" y2="410" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<line x1="140" y1="300" x2="140" y2="410" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<text x="200" y="350" font-size="13">perpendicular:</text><text x="200" y="368" font-size="13" font-weight="bold">BLUE</text>
<polygon points="456.0,216.0 492.0,216.0 484.0,234.0 448.0,234.0" fill="#2563eb" fill-opacity="0.55" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="506.0,216.0 542.0,216.0 534.0,234.0 498.0,234.0" fill="#2563eb" fill-opacity="0.55" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="556.0,216.0 592.0,216.0 584.0,234.0 548.0,234.0" fill="#2563eb" fill-opacity="0.55" stroke="#0f172a" stroke-width="1.5"/>
<text x="630" y="215" font-size="13">parallel:</text><text x="630" y="233" font-size="13" font-weight="bold">BLUE</text>
<polygon points="459.0,333.0 469.0,333.0 461.0,377.0 451.0,377.0" fill="#ca8a04" fill-opacity="0.55" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="499.0,333.0 509.0,333.0 501.0,377.0 491.0,377.0" fill="#ca8a04" fill-opacity="0.55" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="539.0,333.0 549.0,333.0 541.0,377.0 531.0,377.0" fill="#ca8a04" fill-opacity="0.55" stroke="#0f172a" stroke-width="1.5"/>
<text x="590" y="350" font-size="13">perpendicular:</text><text x="590" y="368" font-size="13" font-weight="bold">YELLOW</text>
<text x="380" y="472" font-size="14" text-anchor="middle">Naadi memory aid: a urate needle lying along the axis looks yellow, like a straw laid flat.</text>
<text x="380" y="494" font-size="13" text-anchor="middle">Colour words are printed because colour alone should not carry the meaning.</text>
</svg>
