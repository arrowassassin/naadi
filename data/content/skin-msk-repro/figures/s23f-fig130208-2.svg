<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Steroid pathway schematic from cholesterol through mineralocorticoid, glucocorticoid and sex-steroid branches, marking 17-alpha-hydroxylase, 21-hydroxylase, 11-beta-hydroxylase, 5-alpha-reductase and aromatase steps." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Steroid pathway schematic from cholesterol through mineralocorticoid, glucocorticoid and sex-steroid branches, marking 17-alpha-hydroxylase, 21-hydroxylase, 11-beta-hydroxylase, 5-alpha-reductase and aromatase steps.</title>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">Adrenal and gonadal steroid pathways: CAH enzyme blocks</text>
<g font-size="13">
<rect x="20" y="50" width="130" height="34" rx="5" fill="#f1f5f9" stroke="#0f172a"/><text x="85" y="72" text-anchor="middle">Cholesterol</text>
<rect x="20" y="110" width="130" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="85" y="132" text-anchor="middle">Pregnenolone</text>
<rect x="20" y="190" width="130" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="85" y="212" text-anchor="middle">Progesterone</text>
<rect x="20" y="270" width="130" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="85" y="292" text-anchor="middle">11-Deoxycorticosterone</text>
<rect x="20" y="350" width="130" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="85" y="372" text-anchor="middle">Aldosterone</text>
<rect x="290" y="110" width="170" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="375" y="132" text-anchor="middle">17-OH-pregnenolone</text>
<rect x="290" y="190" width="170" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="375" y="212" text-anchor="middle">17-OH-progesterone</text>
<rect x="290" y="270" width="170" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="375" y="292" text-anchor="middle">11-Deoxycortisol</text>
<rect x="290" y="350" width="170" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="375" y="372" text-anchor="middle">Cortisol</text>
<rect x="580" y="110" width="160" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="660" y="132" text-anchor="middle">DHEA</text>
<rect x="580" y="190" width="160" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="660" y="212" text-anchor="middle">Androstenedione</text>
<rect x="580" y="270" width="160" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="660" y="292" text-anchor="middle">Testosterone</text>
<rect x="520" y="350" width="105" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="572" y="372" text-anchor="middle">DHT</text>
<rect x="640" y="350" width="105" height="34" rx="5" fill="#ffffff" stroke="#0f172a"/><text x="692" y="372" text-anchor="middle">Estradiol</text>
</g>
<defs><marker id="m2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f172a"/></marker></defs>
<g stroke="#0f172a" stroke-width="2" marker-end="url(#m2)">
<line x1="85" y1="84" x2="85" y2="108"/><line x1="85" y1="144" x2="85" y2="188"/><line x1="85" y1="224" x2="85" y2="268"/><line x1="85" y1="304" x2="85" y2="348"/>
<line x1="150" y1="127" x2="288" y2="127"/><line x1="150" y1="207" x2="288" y2="207"/>
<line x1="375" y1="144" x2="375" y2="188"/><line x1="375" y1="224" x2="375" y2="268"/><line x1="375" y1="304" x2="375" y2="348"/>
<line x1="460" y1="127" x2="578" y2="127"/><line x1="460" y1="207" x2="578" y2="207"/>
<line x1="660" y1="144" x2="660" y2="188"/><line x1="660" y1="224" x2="660" y2="268"/>
<line x1="640" y1="304" x2="580" y2="348"/><line x1="680" y1="304" x2="690" y2="348"/>
</g>
<g font-size="12" font-weight="bold">
<rect x="185" y="102" width="70" height="20" fill="#ffffff"/><text x="220" y="117" text-anchor="middle">17-alpha</text>
<rect x="185" y="182" width="70" height="20" fill="#ffffff"/><text x="220" y="197" text-anchor="middle">17-alpha</text>
<rect x="92" y="236" width="70" height="20" fill="#ffffff"/><text x="127" y="251" text-anchor="middle">21-OH</text>
<rect x="382" y="236" width="70" height="20" fill="#ffffff"/><text x="417" y="251" text-anchor="middle">21-OH</text>
<rect x="92" y="316" width="70" height="20" fill="#ffffff"/><text x="127" y="331" text-anchor="middle">11-beta</text>
<rect x="382" y="316" width="70" height="20" fill="#ffffff"/><text x="417" y="331" text-anchor="middle">11-beta</text>
<text x="500" y="330" text-anchor="middle">5-alpha-reductase</text>
<text x="722" y="325" text-anchor="middle">aromatase</text>
</g>
<text x="20" y="415" font-size="13">A block raises ACTH and pushes precursors into the open branches.</text>
<text x="20" y="433" font-size="13">21-OH or 11-beta block: precursors feed androgens (virilisation).</text>
<text x="20" y="451" font-size="13">17-alpha block: no cortisol or sex steroids; 11-deoxycorticosterone excess (hypertension).</text>

</svg>
