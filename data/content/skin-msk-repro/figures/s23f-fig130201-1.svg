<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Decision schematic for genital ulcers. A painful ulcer with grouped vesicles and tender nodes suggests herpes simplex; a painful ragged purulent ulcer with suppurative buboes suggests chancroid. A painless indurated clean ulcer with firm rubbery nontender nodes suggests primary syphilis; a painless beefy red friable ulcer without true nodes suggests granuloma inguinale; a small transient papule followed by painful matted nodes suggests lymphogranuloma venereum. All patients need lesion HSV PCR, syphilis serology and HIV testing." font-family="sans-serif">
<title>Genital ulcer sorting schematic</title>
<desc>Decision schematic for genital ulcers. A painful ulcer with grouped vesicles and tender nodes suggests herpes simplex; a painful ragged purulent ulcer with suppurative buboes suggests chancroid. A painless indurated clean ulcer with firm rubbery nontender nodes suggests primary syphilis; a painless beefy red friable ulcer without true nodes suggests granuloma inguinale; a small transient papule followed by painful matted nodes suggests lymphogranuloma venereum. All patients need lesion HSV PCR, syphilis serology and HIV testing.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380" y="32" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Genital ulcer: first ask whether it hurts</text>
<rect x="270" y="50" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="76.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">Genital ulcer or papule</text>
<line x1="330" y1="94" x2="190" y2="140" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="430" y1="94" x2="570" y2="140" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="80" y="140" width="220" height="40" rx="8" fill="#fde2e2" stroke="#334155" stroke-width="1.5"/>
<text x="190.0" y="164.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">PAINFUL ulcer</text>
<rect x="460" y="140" width="220" height="40" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
<text x="570.0" y="164.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">PAINLESS ulcer or papule</text>
<line x1="150" y1="180" x2="100" y2="220" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="230" y1="180" x2="280" y2="220" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="20" y="220" width="175" height="110" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="107.5" y="247.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="107.5" dy="0">Grouped vesicles,</tspan><tspan x="107.5" dy="16">shallow erosions;</tspan><tspan x="107.5" dy="16">tender bilateral nodes</tspan><tspan x="107.5" dy="16"></tspan><tspan x="107.5" dy="16">HERPES SIMPLEX</tspan></text>
<rect x="205" y="220" width="175" height="110" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="292.5" y="247.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="292.5" dy="0">Ragged, undermined,</tspan><tspan x="292.5" dy="16">purulent base;</tspan><tspan x="292.5" dy="16">suppurative buboes</tspan><tspan x="292.5" dy="16"></tspan><tspan x="292.5" dy="16">CHANCROID</tspan></text>
<line x1="500" y1="180" x2="445" y2="220" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="570" y1="180" x2="575" y2="220" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="640" y1="180" x2="700" y2="220" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="390" y="220" width="120" height="110" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="450.0" y="249.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="450.0" dy="0">Single,</tspan><tspan x="450.0" dy="15">indurated,</tspan><tspan x="450.0" dy="15">clean base;</tspan><tspan x="450.0" dy="15">rubbery nodes</tspan><tspan x="450.0" dy="15">SYPHILIS</tspan></text>
<rect x="518" y="220" width="116" height="110" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="576.0" y="241.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="576.0" dy="0">Beefy red,</tspan><tspan x="576.0" dy="15">bleeds easily;</tspan><tspan x="576.0" dy="15">no true</tspan><tspan x="576.0" dy="15">nodes</tspan><tspan x="576.0" dy="15">GRANULOMA</tspan><tspan x="576.0" dy="15">INGUINALE</tspan></text>
<rect x="642" y="220" width="112" height="110" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="698.0" y="249.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="698.0" dy="0">Transient</tspan><tspan x="698.0" dy="15">papule, then</tspan><tspan x="698.0" dy="15">painful matted</tspan><tspan x="698.0" dy="15">nodes</tspan><tspan x="698.0" dy="15">LGV</tspan></text>
<rect x="60" y="370" width="640" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380.0" y="401.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="380.0" dy="0">Everyone: lesion HSV PCR, syphilis serology (both test types), HIV test.</tspan><tspan x="380.0" dy="16">Treat typical cases empirically; serology can lag in early primary syphilis.</tspan></text>
</svg>
