<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Schematic of the testicular descent path from abdomen through the internal ring and inguinal canal to the scrotum, with labelled abnormal positions including intra-abdominal, inguinal and ectopic, and a note on retractile testis." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Schematic of the testicular descent path from abdomen through the internal ring and inguinal canal to the scrotum, with labelled abnormal positions including intra-abdominal, inguinal and ectopic, and a note on retractile testis.</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

<text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold">Where a testis can lie: descent path and abnormal positions</text>
<g stroke="#0f172a" stroke-width="2" fill="none">
<path d="M120 70 Q140 200 260 250 Q330 280 360 330 Q375 370 380 400" stroke-dasharray="8 5"/>
</g>
<g stroke="#0f172a" stroke-width="2" fill="#ffffff">
<ellipse cx="125" cy="85" rx="22" ry="14"/>
<ellipse cx="200" cy="215" rx="22" ry="14"/>
<ellipse cx="300" cy="265" rx="22" ry="14"/>
<ellipse cx="380" cy="395" rx="26" ry="18" stroke-width="3"/>
<ellipse cx="560" cy="250" rx="22" ry="14" stroke-dasharray="4 3"/>
</g>
<rect x="240" y="235" width="120" height="60" fill="none" stroke="#0f172a" stroke-width="1.5"/>
<text x="160" y="90" font-size="13">1 intra-abdominal (non-palpable)</text>
<text x="20" y="190" font-size="13">2 at internal ring /</text>
<text x="20" y="206" font-size="13">peeping (may be palpable)</text>
<text x="370" y="230" font-size="13">3 inguinal canal (boxed)</text>
<text x="420" y="400" font-size="13">4 scrotum (normal final position)</text>
<text x="590" y="245" font-size="13">5 ectopic: off the</text>
<text x="590" y="261" font-size="13">normal path (perineal,</text>
<text x="590" y="277" font-size="13">femoral, suprapubic)</text>
<text x="20" y="330" font-size="13">Dashed curve: normal path of descent.</text>
<text x="20" y="348" font-size="13">Retractile testis: reaches position 4 on</text>
<text x="20" y="366" font-size="13">traction and stays after release.</text>
<text x="20" y="430" font-size="12">Schematic only; not to scale.</text>

</svg>
