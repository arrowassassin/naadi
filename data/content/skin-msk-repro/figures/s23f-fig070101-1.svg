<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Schematic of a child's long bone showing epiphysis, physis, metaphyseal sinusoidal loops where bacteria settle, a subperiosteal abscess, a sequestrum, an involucrum and a cloaca draining to a skin sinus" font-family="sans-serif" fill="#0f172a"><title>Schematic of a child's long bone showing epiphysis, physis, metaphyseal sinusoidal loops where bacteria settle, a subperiosteal abscess, a sequestrum, an involucrum and a cloaca draining to a skin sinus</title><rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
<text x="380" y="30" font-size="18" text-anchor="middle" font-weight="bold">Hematogenous osteomyelitis of a long bone (child)</text>
<rect x="250" y="60" width="160" height="70" rx="30" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="330" y="100" font-size="13" text-anchor="middle">Epiphysis</text>
<rect x="250" y="132" width="160" height="10" fill="#94a3b8" stroke="#0f172a"/>
<line x1="410" y1="137" x2="520" y2="110" stroke="#0f172a"/>
<text x="525" y="112" font-size="13">Physis (growth plate)</text>
<path d="M255 145 L405 145 L380 215 L280 215 Z" fill="#fde68a" stroke="#0f172a" stroke-width="2"/>
<path d="M285 160 q10 20 20 0 q10 20 20 0 q10 20 20 0 q10 20 20 0" fill="none" stroke="#b91c1c" stroke-width="2"/>
<circle cx="330" cy="190" r="12" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
<line x1="405" y1="175" x2="520" y2="160" stroke="#0f172a"/>
<text x="525" y="157" font-size="13">Metaphysis: capillary loops open into</text>
<text x="525" y="174" font-size="13">slow, turbulent sinusoids; bacteria settle</text>
<rect x="290" y="215" width="80" height="210" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="330" y="440" font-size="13" text-anchor="middle">Diaphysis</text>
<path d="M290 225 L262 232 L262 300 L290 310 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
<line x1="262" y1="262" x2="160" y2="250" stroke="#0f172a"/>
<text x="20" y="235" font-size="13">Subperiosteal abscess:</text>
<text x="20" y="252" font-size="13">pus lifts the periosteum</text>
<rect x="310" y="250" width="40" height="40" fill="#475569" stroke="#0f172a" stroke-width="2"/>
<text x="330" y="275" font-size="12" text-anchor="middle" fill="#ffffff">dead</text>
<line x1="350" y1="270" x2="520" y2="250" stroke="#0f172a"/>
<text x="525" y="247" font-size="13">Sequestrum: necrotic bone fragment</text>
<path d="M370 230 L398 238 L398 380 L370 390" fill="none" stroke="#0f172a" stroke-width="5"/>
<line x1="398" y1="330" x2="520" y2="320" stroke="#0f172a"/>
<text x="525" y="317" font-size="13">Involucrum: new periosteal bone</text>
<rect x="392" y="355" width="12" height="14" fill="#ffffff" stroke="#0f172a"/>
<path d="M404 362 L470 380" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="470" y1="380" x2="520" y2="385" stroke="#0f172a"/>
<text x="525" y="382" font-size="13">Cloaca and sinus tract to skin</text>
<text x="20" y="150" font-size="13">Infant under ~18 months:</text>
<text x="20" y="167" font-size="13">vessels cross the physis, so</text>
<text x="20" y="184" font-size="13">infection reaches the epiphysis</text>
<text x="20" y="201" font-size="13">and joint</text>
</svg>
