<line x1="240" y1="120" x2="440" y2="210" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="244" y="92" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Lactational mastitis</text>
<text x="244" y="108" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">and abscess: milk stasis in</text>
<text x="244" y="124" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">lobules and ducts, often</text>
<text x="244" y="140" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">S. aureus</text>
<line x1="740" y1="96" x2="640" y2="266" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="736" y="76" font-size="13" font-weight="bold" text-anchor="end" fill="#0f172a">Periductal mastitis:</text>
<text x="736" y="92" font-size="13" font-weight="normal" text-anchor="end" fill="#0f172a">squamous metaplasia of</text>
<text x="736" y="108" font-size="13" font-weight="normal" text-anchor="end" fill="#0f172a">subareolar ducts (smoking)</text>
<line x1="740" y1="452" x2="600" y2="300" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="736" y="432" font-size="13" font-weight="bold" text-anchor="end" fill="#0f172a">Duct ectasia:</text>
<text x="736" y="448" font-size="13" font-weight="normal" text-anchor="end" fill="#0f172a">dilated subareolar ducts,</text>
<text x="736" y="464" font-size="13" font-weight="normal" text-anchor="end" fill="#0f172a">older parous patients</text>
<line x1="120" y1="500" x2="420" y2="382" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="124" y="480" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Fat necrosis: injured</text>
<text x="124" y="496" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">fat in the stroma (trauma,</text>
<text x="124" y="512" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">surgery, radiation)</text>
<text x="20" y="540" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Schematic, not to scale. Nipple on the right; lactiferous ducts branch toward the lobules on the left.</text>
<text x="20" y="560" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Lesions near the nipple (periductal mastitis, duct ectasia) cause discharge, retraction and fistulas;</text>
<text x="20" y="580" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">lactational mastitis usually affects a wedge of breast tissue away from the nipple.</text>
</svg>
