<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Schematic of cavernosal smooth-muscle signalling: nitric oxide activates guanylyl cyclase to make cGMP, which PDE-5 degrades; alprostadil raises cAMP; norepinephrine acts at alpha-1 receptors to raise calcium; drug sites for sildenafil, nitrates, phenylephrine and trazodone are labelled." font-family="sans-serif" font-size="14" fill="#0f172a">
<title>Schematic of cavernosal smooth-muscle signalling: nitric oxide activates guanylyl cyclase to make cGMP, which PDE-5 degrades; alprostadil raises cAMP; norepinephrine acts at alpha-1 receptors to raise calcium; drug sites for sildenafil, nitrates, phenylephrine and trazodone are labelled.</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

<text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold">Smooth-muscle signalling in the corpus cavernosum</text>
<defs><marker id="m1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f172a"/></marker></defs>
<g font-size="13">
<rect x="20" y="60" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#0f172a"/><text x="120" y="85" text-anchor="middle">Parasympathetic nerve, endothelium</text>
<rect x="60" y="130" width="120" height="34" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="120" y="152" text-anchor="middle">Nitric oxide</text>
<rect x="40" y="195" width="160" height="34" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="120" y="217" text-anchor="middle">Guanylyl cyclase</text>
<rect x="70" y="260" width="100" height="34" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="120" y="282" text-anchor="middle" font-weight="bold">cGMP</text>
<rect x="230" y="260" width="130" height="34" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="295" y="282" text-anchor="middle">PDE-5 breaks down</text>
<rect x="280" y="60" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#0f172a"/><text x="380" y="85" text-anchor="middle">Alprostadil (PGE1)</text>
<rect x="310" y="130" width="140" height="34" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="380" y="152" text-anchor="middle">Adenylyl cyclase</text>
<rect x="330" y="195" width="100" height="34" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="380" y="217" text-anchor="middle" font-weight="bold">cAMP</text>
<rect x="540" y="60" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#0f172a"/><text x="640" y="85" text-anchor="middle">Sympathetic norepinephrine</text>
<rect x="570" y="130" width="140" height="34" rx="6" fill="#ffffff" stroke="#0f172a"/><text x="640" y="152" text-anchor="middle">Alpha-1 receptor</text>
<rect x="160" y="340" width="440" height="40" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/><text x="380" y="365" text-anchor="middle" font-weight="bold">Intracellular calcium: down = RELAX (erection); up = CONTRACT (detumescence)</text>
</g>
<g stroke="#0f172a" stroke-width="2" marker-end="url(#m1)">
<line x1="120" y1="100" x2="120" y2="128"/><line x1="120" y1="164" x2="120" y2="193"/><line x1="120" y1="229" x2="120" y2="258"/>
<line x1="170" y1="277" x2="228" y2="277"/>
<line x1="120" y1="294" x2="250" y2="338"/>
<line x1="380" y1="100" x2="380" y2="128"/><line x1="380" y1="164" x2="380" y2="193"/><line x1="380" y1="229" x2="380" y2="338"/>
<line x1="640" y1="100" x2="640" y2="128"/><line x1="640" y1="164" x2="520" y2="338"/>
</g>
<g font-size="12">
<text x="235" y="250">sildenafil, tadalafil block PDE-5</text>
<text x="235" y="312">nitrates add NO (hypotension)</text>
<text x="600" y="210">phenylephrine stimulates</text>
<text x="600" y="228">trazodone blocks (priapism)</text>
</g>
<text x="20" y="420" font-size="12">Schematic. Arrows show the direction of signalling; drug sites are named in text.</text>

</svg>
