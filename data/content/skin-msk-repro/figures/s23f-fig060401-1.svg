<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" width="760" height="505" role="img" aria-label="Decision diagram for white or red oral lesions: lesions that wipe off suggest candidiasis; fixed lesions are sorted into lichen planus, oral hairy leukoplakia, leukoplakia and erythroplakia, with biopsy for leukoplakia and erythroplakia" font-family="sans-serif">
<title>Decision diagram for white or red oral lesions: lesions that wipe off suggest candidiasis; fixed lesions are sorted into lichen planus, oral hairy leukoplakia, leukoplakia and erythroplakia, with biopsy for leukoplakia and erythroplakia</title>
<rect x="0" y="0" width="760" height="505" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Approach to a white or red patch in the mouth</text>
<rect x="250" y="50" width="260" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="260" y="70" font-size="13" font-weight="bold" fill="#0f172a">White or red oral patch</text>
<text x="260" y="87" font-size="13" fill="#0f172a">Try to wipe it with gauze</text>
<line x1="320" y1="94" x2="140" y2="140" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="160" y="118" font-size="12" font-weight="bold" fill="#0f172a">Wipes off</text>
<line x1="440" y1="94" x2="560" y2="140" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="500" y="118" font-size="12" font-weight="bold" fill="#0f172a">Does not wipe off</text>
<rect x="20" y="140" width="250" height="78" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="160" font-size="13" font-weight="bold" fill="#0f172a">Pseudomembranous candidiasis</text>
<text x="30" y="177" font-size="13" fill="#0f172a">Red base underneath; KOH shows</text>
<text x="30" y="194" font-size="13" fill="#0f172a">pseudohyphae. Look for a cause:</text>
<text x="30" y="211" font-size="13" fill="#0f172a">inhaled steroid, dentures, HIV, diabetes</text>
<rect x="400" y="140" width="340" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="410" y="160" font-size="13" font-weight="bold" fill="#0f172a">Where is it and what does it look like?</text>
<line x1="570" y1="184" x2="570" y2="200" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="400" y="200" width="340" height="58" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="410" y="220" font-size="13" font-weight="bold" fill="#0f172a">Lacy white striae, both cheeks</text>
<text x="410" y="237" font-size="13" fill="#0f172a">Lichen planus: test for hepatitis C;</text>
<text x="410" y="254" font-size="13" fill="#0f172a">biopsy if erosive or atypical</text>
<rect x="400" y="270" width="340" height="58" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="410" y="290" font-size="13" font-weight="bold" fill="#0f172a">Vertical white ridges, lateral tongue</text>
<text x="410" y="307" font-size="13" fill="#0f172a">Oral hairy leukoplakia (EBV): suggests</text>
<text x="410" y="324" font-size="13" fill="#0f172a">immunosuppression; test for HIV</text>
<rect x="400" y="340" width="340" height="58" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="410" y="360" font-size="13" font-weight="bold" fill="#0f172a">Fixed white plaque, no other cause</text>
<text x="410" y="377" font-size="13" fill="#0f172a">Leukoplakia: biopsy; stop tobacco,</text>
<text x="410" y="394" font-size="13" fill="#0f172a">alcohol and betel; follow up</text>
<rect x="400" y="410" width="340" height="58" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="410" y="430" font-size="13" font-weight="bold" fill="#0f172a">Red velvety patch (erythroplakia) or</text>
<text x="410" y="447" font-size="13" fill="#0f172a">mixed red-white, ulcer, induration</text>
<text x="410" y="464" font-size="13" fill="#0f172a">Highest risk: biopsy promptly</text>
<line x1="390" y1="258" x2="390" y2="299" stroke="#0f172a" stroke-width="1.5"/>
<line x1="390" y1="328" x2="390" y2="369" stroke="#0f172a" stroke-width="1.5"/>
<line x1="390" y1="398" x2="390" y2="439" stroke="#0f172a" stroke-width="1.5"/>
<line x1="390" y1="184" x2="390" y2="258" stroke="#0f172a" stroke-width="1.5"/>
<line x1="390" y1="229" x2="398" y2="229" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="390" y1="299" x2="398" y2="299" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="390" y1="369" x2="398" y2="369" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="390" y1="439" x2="398" y2="439" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="390" y1="162" x2="390" y2="439" stroke="#0f172a" stroke-width="1.5"/>
<text x="20" y="260" font-size="12" fill="#0f172a">Any lesion that does not resolve within</text>
<text x="20" y="276" font-size="12" fill="#0f172a">2 to 3 weeks after removing a cause</text>
<text x="20" y="292" font-size="12" fill="#0f172a">needs a biopsy.</text>
<line x1="390" y1="162" x2="400" y2="162" stroke="#0f172a" stroke-width="1.5"/>
<text x="20" y="490" font-size="12" fill="#0f172a">Schematic decision aid; not a substitute for examination and histology.</text>
</svg>
