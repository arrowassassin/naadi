<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" width="760" height="572" role="img" aria-label="Flow diagram of the bilirubin pathway from heme to the intestine with the neonatal disorders that act at each step" font-family="sans-serif">
<title>Flow diagram of the bilirubin pathway from heme to the intestine with the neonatal disorders that act at each step</title>
<rect x="0" y="0" width="760" height="572" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<text x="380" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Bilirubin pathway in the newborn and where disorders act</text>
<rect x="30" y="40" width="300" height="56" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="44" y="73" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Red cells (heme)</text>
<line x1="332" y1="68" x2="380" y2="68" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<rect x="384" y="40" width="350" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="396" y="64" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Hemolysis raises load: Rh or ABO</text>
<text x="396" y="84" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">disease, G6PD deficiency, spherocytosis</text>
<rect x="30" y="130" width="300" height="56" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="44" y="163" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Unconjugated bilirubin on albumin</text>
<line x1="332" y1="158" x2="380" y2="158" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<rect x="384" y="130" width="350" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="396" y="154" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Sulfonamides and ceftriaxone displace it;</text>
<text x="396" y="174" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">low albumin raises the free fraction</text>
<rect x="30" y="220" width="300" height="56" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="44" y="253" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Hepatocyte: UGT1A1 conjugation</text>
<line x1="332" y1="248" x2="380" y2="248" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<rect x="384" y="220" width="350" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="396" y="244" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Immature in all newborns (physiologic);</text>
<text x="396" y="264" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">absent or low in Crigler-Najjar, mild in Gilbert</text>
<rect x="30" y="310" width="300" height="56" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="44" y="343" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Biliary excretion (conjugated)</text>
<line x1="332" y1="338" x2="380" y2="338" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<rect x="384" y="310" width="350" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="396" y="334" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Biliary atresia blocks excretion:</text>
<text x="396" y="354" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">conjugated (direct) jaundice, pale stools</text>
<rect x="30" y="400" width="300" height="56" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="44" y="433" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Intestine</text>
<line x1="332" y1="428" x2="380" y2="428" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<rect x="384" y="400" width="350" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="396" y="424" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Beta-glucuronidase deconjugates; low intake</text>
<text x="396" y="444" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">or slow stooling increases reabsorption</text>
<line x1="180" y1="96" x2="180" y2="130" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="180" y1="186" x2="180" y2="220" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="180" y1="276" x2="180" y2="310" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="180" y1="366" x2="180" y2="400" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 30 428 C 4 380, 4 200, 30 170" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>
<text x="30" y="486" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Dashed curve: enterohepatic recirculation of deconjugated bilirubin back to the blood.</text>
<text x="30" y="508" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Skin: phototherapy makes water-soluble isomers (lumirubin), excreted unconjugated.</text>
<text x="30" y="530" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Brain: free unconjugated bilirubin crosses into the basal ganglia and brainstem (kernicterus).</text>
<text x="30" y="552" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Solid boxes: normal steps. Dashed boxes: what goes wrong at that step.</text>
</svg>
