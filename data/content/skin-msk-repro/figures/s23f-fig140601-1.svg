<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Schematic of the male axis. Hypothalamus secretes GnRH, inhibited by opioids and by prolactin raised by D2-blocking antipsychotics. Pituitary secretes LH to Leydig cells and FSH to Sertoli cells; exogenous testosterone and anabolic steroids, GnRH agonists and estradiol suppress it by feedback. Leydig cells make testosterone; ketoconazole and alcohol reduce synthesis. In tissues, 5-alpha-reductase converts testosterone to DHT, blocked by finasteride and dutasteride; aromatase converts testosterone to estradiol, increased in cirrhosis and obesity. Spironolactone and cimetidine block androgen receptors. A higher estrogen to androgen effect causes gynecomastia." font-family="sans-serif">
<title>Male reproductive axis drug sites</title>
<desc>Schematic of the male axis. Hypothalamus secretes GnRH, inhibited by opioids and by prolactin raised by D2-blocking antipsychotics. Pituitary secretes LH to Leydig cells and FSH to Sertoli cells; exogenous testosterone and anabolic steroids, GnRH agonists and estradiol suppress it by feedback. Leydig cells make testosterone; ketoconazole and alcohol reduce synthesis. In tissues, 5-alpha-reductase converts testosterone to DHT, blocked by finasteride and dutasteride; aromatase converts testosterone to estradiol, increased in cirrhosis and obesity. Spironolactone and cimetidine block androgen receptors. A higher estrogen to androgen effect causes gynecomastia.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Male reproductive axis: where drugs act</text>
<rect x="280" y="50" width="200" height="40" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="74.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">Hypothalamus: GnRH</text>
<rect x="280" y="135" width="200" height="40" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="159.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">Pituitary: LH, FSH</text>
<rect x="270" y="214" width="220" height="58" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="232.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#0f172a"><tspan x="380.0" dy="0">Testis: Leydig cells make</tspan><tspan x="380.0" dy="15">testosterone; Sertoli</tspan><tspan x="380.0" dy="15">cells support sperm</tspan></text>
<rect x="250" y="320" width="260" height="52" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="335.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#0f172a"><tspan x="380.0" dy="0">Tissues: testosterone to DHT</tspan><tspan x="380.0" dy="15">(5-alpha-reductase) and to</tspan><tspan x="380.0" dy="15">estradiol (aromatase)</tspan></text>
<line x1="380" y1="90" x2="380" y2="133" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="380" y1="175" x2="380" y2="218" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="380" y1="266" x2="380" y2="318" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="15" y="45" width="220" height="50" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="125.0" y="59.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="125.0" dy="0">Opioids; high prolactin from</tspan><tspan x="125.0" dy="15">D2-blocking antipsychotics:</tspan><tspan x="125.0" dy="15">suppress GnRH</tspan></text>
<line x1="235" y1="70" x2="278" y2="70" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="15" y="125" width="220" height="60" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="125.0" y="136.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="125.0" dy="0">Exogenous testosterone,</tspan><tspan x="125.0" dy="15">anabolic steroids, estradiol,</tspan><tspan x="125.0" dy="15">GnRH agonists: suppress</tspan><tspan x="125.0" dy="15">LH and FSH</tspan></text>
<line x1="235" y1="155" x2="278" y2="155" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="15" y="215" width="220" height="56" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="125.0" y="232.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="125.0" dy="0">Ketoconazole, chronic</tspan><tspan x="125.0" dy="15">alcohol: reduce testosterone</tspan><tspan x="125.0" dy="15">synthesis</tspan></text>
<line x1="235" y1="243" x2="278" y2="243" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="530" y="300" width="220" height="46" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="640.0" y="319.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="640.0" dy="0">Finasteride, dutasteride:</tspan><tspan x="640.0" dy="15">block DHT formation</tspan></text>
<line x1="530" y1="323" x2="512" y2="335" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="530" y="360" width="220" height="46" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="640.0" y="379.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="640.0" dy="0">Cirrhosis, obesity:</tspan><tspan x="640.0" dy="15">more aromatisation</tspan></text>
<line x1="530" y1="383" x2="512" y2="360" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="15" y="320" width="220" height="56" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="125.0" y="337.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="125.0" dy="0">Spironolactone, cimetidine,</tspan><tspan x="125.0" dy="15">antiandrogens: block</tspan><tspan x="125.0" dy="15">androgen receptor</tspan></text>
<line x1="235" y1="348" x2="248" y2="348" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="120" y="410" width="520" height="46" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380.0" y="437.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Gynecomastia = estrogen effect rises relative to androgen effect</text>
<path d="M482 240 C 560 240, 560 155, 482 155" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="575" y="200" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">feedback (-)</text>
</svg>
