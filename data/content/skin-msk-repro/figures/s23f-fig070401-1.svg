<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" role="img" aria-label="Five schematic growth-plate diagrams showing Salter-Harris fracture types: I through the physis only, II through physis and metaphysis, III through physis and epiphysis, IV across metaphysis, physis and epiphysis, and V a crush of the physis" font-family="sans-serif" fill="#0f172a">
<title>Five schematic growth-plate diagrams showing Salter-Harris fracture types: I through the physis only, II through physis and metaphysis, III through physis and epiphysis, IV across metaphysis, physis and epiphysis, and V a crush of the physis</title>
<rect x="0" y="0" width="760" height="385" fill="#ffffff"/>
<text x="380" y="28" font-size="18" font-weight="bold" text-anchor="middle">Salter–Harris physeal fractures</text>
<path d="M35,120 Q90.0,62 145,120 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="35" y="120" width="110" height="16" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
<path d="M35,136 L145,136 L130,260 L50,260 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<line x1="32" y1="128" x2="148" y2="128" stroke="#b91c1c" stroke-width="4" fill="none"/>
<text x="90.0" y="290" font-size="15" font-weight="bold" text-anchor="middle">Type I</text>
<text x="90.0" y="310" font-size="12" text-anchor="middle">through physis only</text>
<path d="M183,120 Q238.0,62 293,120 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="183" y="120" width="110" height="16" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
<path d="M183,136 L293,136 L278,260 L198,260 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<polyline points="180,128 253,128 286,190" stroke="#b91c1c" stroke-width="4" fill="none"/>
<text x="238.0" y="290" font-size="15" font-weight="bold" text-anchor="middle">Type II</text>
<text x="238.0" y="310" font-size="12" text-anchor="middle">physis + metaphysis</text>
<path d="M331,120 Q386.0,62 441,120 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="331" y="120" width="110" height="16" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
<path d="M331,136 L441,136 L426,260 L346,260 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<polyline points="328,128 396,128 396,74" stroke="#b91c1c" stroke-width="4" fill="none"/>
<text x="386.0" y="290" font-size="15" font-weight="bold" text-anchor="middle">Type III</text>
<text x="386.0" y="310" font-size="12" text-anchor="middle">physis + epiphysis</text>
<path d="M479,120 Q534.0,62 589,120 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="479" y="120" width="110" height="16" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
<path d="M479,136 L589,136 L574,260 L494,260 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<line x1="539" y1="70" x2="559" y2="200" stroke="#b91c1c" stroke-width="4" fill="none"/>
<text x="534.0" y="290" font-size="15" font-weight="bold" text-anchor="middle">Type IV</text>
<text x="534.0" y="310" font-size="12" text-anchor="middle">metaphysis, physis, epiphysis</text>
<path d="M627,120 Q682.0,62 737,120 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="627" y="120" width="110" height="16" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
<path d="M627,136 L737,136 L722,260 L642,260 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<polyline points="637,121 642,135 647,121" stroke="#b91c1c" stroke-width="3" fill="none"/>
<polyline points="657,121 662,135 667,121" stroke="#b91c1c" stroke-width="3" fill="none"/>
<polyline points="677,121 682,135 687,121" stroke="#b91c1c" stroke-width="3" fill="none"/>
<polyline points="697,121 702,135 707,121" stroke="#b91c1c" stroke-width="3" fill="none"/>
<polyline points="717,121 722,135 727,121" stroke="#b91c1c" stroke-width="3" fill="none"/>
<text x="682.0" y="290" font-size="15" font-weight="bold" text-anchor="middle">Type V</text>
<text x="682.0" y="310" font-size="12" text-anchor="middle">crush of physis</text>
<line x1="160" y1="128" x2="760" y2="128" stroke="#ffffff" stroke-width="0"/>
<text x="380" y="345" font-size="13" text-anchor="middle">Bands from top: epiphysis (joint side), physis (growth plate), metaphysis. Thick dark lines show the fracture.</text>
<text x="380" y="365" font-size="13" text-anchor="middle">Risk of growth disturbance rises from type I to type V; III and IV enter the joint.</text>
</svg>
