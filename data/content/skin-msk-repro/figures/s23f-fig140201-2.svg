<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-label="Flow diagram of the hypothalamic-pituitary-testicular axis down to the androgen receptor, labelled with sites of action: GnRH agonists and antagonists at the pituitary, abiraterone at androgen synthesis by CYP17A1, 5-alpha-reductase inhibitors at DHT formation, and androgen receptor antagonists at the receptor.">
<title>Flow diagram of the hypothalamic-pituitary-testicular axis down to the androgen receptor, labelled with sites of action: GnRH agonists and antagonists at the pituitary, abiraterone at androgen synthesis by CYP17A1, 5-alpha-reductase inhibitors at DHT formation, and androgen receptor antagonists at the receptor.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="580" fill="#ffffff"/>
<text x="380" y="30" font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Androgen axis and where prostate cancer drugs act</text>
<rect x="270" y="55" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="84.9" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">Hypothalamus: GnRH pulses</text>
<rect x="270" y="145" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="174.9" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">Anterior pituitary: LH</text>
<rect x="270" y="235" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="256.1" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="380.0" dy="0">Testis (Leydig cells):</tspan><tspan x="380.0" dy="18">testosterone</tspan></text>
<rect x="270" y="330" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="351.1" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="380.0" dy="0">Prostate cell: 5-alpha-</tspan><tspan x="380.0" dy="18">reductase makes DHT</tspan></text>
<rect x="270" y="425" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="446.1" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="380.0" dy="0">Androgen receptor in</tspan><tspan x="380.0" dy="18">nucleus: growth genes</tspan></text>
<line x1="380" y1="105" x2="380" y2="143" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="380" y1="195" x2="380" y2="233" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="380" y1="285" x2="380" y2="328" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="380" y1="380" x2="380" y2="423" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="560" y="50" width="190" height="120" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="655.0" y="84.2" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="655.0" dy="0">GnRH AGONISTS</tspan><tspan x="655.0" dy="15">(leuprolide, goserelin):</tspan><tspan x="655.0" dy="15">continuous use first</tspan><tspan x="655.0" dy="15">raises LH (flare), then</tspan><tspan x="655.0" dy="15">desensitises</tspan></text>
<line x1="560" y1="130" x2="492" y2="162" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="560" y="182" width="190" height="90" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="655.0" y="208.7" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="655.0" dy="0">GnRH ANTAGONISTS</tspan><tspan x="655.0" dy="15">(degarelix, relugolix):</tspan><tspan x="655.0" dy="15">immediate fall in LH,</tspan><tspan x="655.0" dy="15">no flare</tspan></text>
<line x1="560" y1="226" x2="492" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="10" y="200" width="200" height="110" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="110.0" y="229.2" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="110.0" dy="0">CYP17A1 INHIBITOR</tspan><tspan x="110.0" dy="15">(abiraterone): blocks</tspan><tspan x="110.0" dy="15">androgen synthesis in</tspan><tspan x="110.0" dy="15">testis, adrenal, tumour;</tspan><tspan x="110.0" dy="15">give with prednisone</tspan></text>
<line x1="210" y1="255" x2="268" y2="260" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="10" y="330" width="200" height="70" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="110.0" y="354.2" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="110.0" dy="0">5-ALPHA-REDUCTASE</tspan><tspan x="110.0" dy="15">INHIBITORS (finasteride):</tspan><tspan x="110.0" dy="15">lower DHT; halve PSA</tspan></text>
<line x1="210" y1="360" x2="268" y2="355" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="530" y="405" width="220" height="105" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="1.5"/><text x="640.0" y="431.7" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="640.0" dy="0">AR ANTAGONISTS: first</tspan><tspan x="640.0" dy="15">generation (bicalutamide);</tspan><tspan x="640.0" dy="15">next generation</tspan><tspan x="640.0" dy="15">(enzalutamide, apalutamide,</tspan><tspan x="640.0" dy="15">darolutamide)</tspan></text>
<line x1="530" y1="450" x2="492" y2="450" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="10" y="425" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/><text x="110.0" y="446.7" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="normal"><tspan x="110.0" dy="0">Adrenal androgens</tspan><tspan x="110.0" dy="15">(DHEA) feed the pool</tspan></text>
<line x1="210" y1="450" x2="268" y2="350" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="380" y="540" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Solid arrows: normal signalling. Boxes with capitals: drug classes, with arrows to their site of action.</text>
<text x="380" y="562" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Orchiectomy removes testicular testosterone (surgical castration).</text>
</svg>
