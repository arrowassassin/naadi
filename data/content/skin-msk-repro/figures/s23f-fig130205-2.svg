<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Two-column schematic. Left, feminizing therapy: hypothalamus GnRH to pituitary LH and FSH to testes making testosterone, converted by 5-alpha-reductase to DHT acting on androgen receptors. GnRH agonists (continuous) and estradiol feedback suppress the pituitary; spironolactone blocks androgen receptors; 5-alpha-reductase inhibitors block DHT formation; estradiol acts on estrogen receptors for breast growth. Right, masculinizing therapy: testosterone acts on androgen receptors and suppresses LH and FSH by feedback, usually stopping ovulation and menses; it raises erythropoietin. Bottom: GnRH agonist for puberty suppression acts at the pituitary in either sex." font-family="sans-serif">
<title>Gender-affirming hormone therapy drug sites</title>
<desc>Two-column schematic. Left, feminizing therapy: hypothalamus GnRH to pituitary LH and FSH to testes making testosterone, converted by 5-alpha-reductase to DHT acting on androgen receptors. GnRH agonists (continuous) and estradiol feedback suppress the pituitary; spironolactone blocks androgen receptors; 5-alpha-reductase inhibitors block DHT formation; estradiol acts on estrogen receptors for breast growth. Right, masculinizing therapy: testosterone acts on androgen receptors and suppresses LH and FSH by feedback, usually stopping ovulation and menses; it raises erythropoietin. Bottom: GnRH agonist for puberty suppression acts at the pituitary in either sex.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Gender-affirming hormones: where they act</text>
<text x="190" y="58" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">FEMINIZING</text>
<text x="570" y="58" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">MASCULINIZING</text>
<line x1="380" y1="45" x2="380" y2="395" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="110" y="72" width="160" height="34" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="190.0" y="93.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Hypothalamus</text>
<rect x="110" y="138" width="160" height="34" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="190.0" y="159.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Pituitary: LH, FSH</text>
<rect x="110" y="204" width="160" height="34" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="190.0" y="225.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Testes: testosterone</text>
<rect x="110" y="270" width="160" height="46" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="190.0" y="289.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="190.0" dy="0">Tissues: T to DHT;</tspan><tspan x="190.0" dy="15">androgen receptor</tspan></text>
<line x1="190" y1="106" x2="190" y2="136" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="190" y1="172" x2="190" y2="202" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="190" y1="238" x2="190" y2="268" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="5" y="128" width="100" height="54" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="55.0" y="144.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="55.0" dy="0">GnRH agonist</tspan><tspan x="55.0" dy="15">(continuous):</tspan><tspan x="55.0" dy="15">suppresses</tspan></text>
<line x1="105" y1="155" x2="108" y2="155" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="278" y="122" width="98" height="66" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="327.0" y="136.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="327.0" dy="0">Estradiol:</tspan><tspan x="327.0" dy="15">feedback (-)</tspan><tspan x="327.0" dy="15">and estrogen</tspan><tspan x="327.0" dy="15">receptors</tspan></text>
<line x1="278" y1="155" x2="272" y2="155" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="2" y="260" width="104" height="66" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="54.0" y="274.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="54.0" dy="0">Spirono-</tspan><tspan x="54.0" dy="15">lactone:</tspan><tspan x="54.0" dy="15">blocks andro-</tspan><tspan x="54.0" dy="15">gen receptor</tspan></text>
<line x1="105" y1="293" x2="108" y2="293" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="278" y="266" width="98" height="54" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="327.0" y="282.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="327.0" dy="0">5-alpha-</tspan><tspan x="327.0" dy="15">reductase</tspan><tspan x="327.0" dy="15">inhibitor</tspan></text>
<line x1="278" y1="293" x2="272" y2="293" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="470" y="72" width="200" height="34" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="570.0" y="93.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Hypothalamus</text>
<rect x="470" y="138" width="200" height="34" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="570.0" y="159.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Pituitary: LH, FSH (-)</text>
<rect x="470" y="204" width="200" height="46" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="570.0" y="223.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="570.0" dy="0">Ovaries: ovulation usually</tspan><tspan x="570.0" dy="15">stops (not reliable)</tspan></text>
<line x1="570" y1="106" x2="570" y2="136" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="570" y1="172" x2="570" y2="202" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="470" y="270" width="200" height="60" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="570.0" y="289.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="570.0" dy="0">Testosterone: androgen</tspan><tspan x="570.0" dy="15">receptors; raises EPO and</tspan><tspan x="570.0" dy="15">hematocrit; aromatised</tspan></text>
<path d="M672 300 C 740 300, 740 155, 672 155" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="700" y="232" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">feedback</text>
<rect x="70" y="405" width="620" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380.0" y="426.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a"><tspan x="380.0" dy="0">Puberty suppression (adolescents, Tanner 2 or later): continuous GnRH agonist</tspan><tspan x="380.0" dy="15">at the pituitary lowers LH, FSH and sex steroids; pauses (does not reverse) puberty</tspan></text>
</svg>
