<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Algorithm sorting white and red oral lesions into candidiasis, oral hairy leukoplakia, leukoplakia and erythroplakia" font-family="sans-serif" font-size="13">
<rect x="210" y="12" width="300" height="40" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="360" y="37" text-anchor="middle" fill="#0f172a" font-weight="bold">White or red patch in the mouth</text>
<line x1="360" y1="52" x2="90" y2="150" stroke="#334155"/>
<line x1="360" y1="52" x2="270" y2="150" stroke="#334155"/>
<line x1="360" y1="52" x2="450" y2="150" stroke="#334155"/>
<line x1="360" y1="52" x2="630" y2="150" stroke="#334155"/>
<rect x="10" y="150" width="160" height="78" rx="8" fill="#e0f2fe" stroke="#334155"/>
<text x="90" y="172" text-anchor="middle" fill="#0f172a">Wipes off with</text>
<text x="90" y="190" text-anchor="middle" fill="#0f172a">gauze</text>
<text x="90" y="214" text-anchor="middle" fill="#0f172a" font-weight="bold">Candidiasis</text>
<rect x="190" y="150" width="160" height="78" rx="8" fill="#ede9fe" stroke="#334155"/>
<text x="270" y="172" text-anchor="middle" fill="#0f172a">Fixed, ridged,</text>
<text x="270" y="190" text-anchor="middle" fill="#0f172a">lateral tongue</text>
<text x="270" y="214" text-anchor="middle" fill="#0f172a" font-weight="bold">Hairy leukoplakia</text>
<rect x="370" y="150" width="160" height="78" rx="8" fill="#fef3c7" stroke="#334155"/>
<text x="450" y="172" text-anchor="middle" fill="#0f172a">Fixed white</text>
<text x="450" y="190" text-anchor="middle" fill="#0f172a">plaque</text>
<text x="450" y="214" text-anchor="middle" fill="#0f172a" font-weight="bold">Leukoplakia</text>
<rect x="550" y="150" width="160" height="78" rx="8" fill="#fce7f3" stroke="#334155"/>
<text x="630" y="172" text-anchor="middle" fill="#0f172a">Fixed velvety</text>
<text x="630" y="190" text-anchor="middle" fill="#0f172a">red patch</text>
<text x="630" y="214" text-anchor="middle" fill="#0f172a" font-weight="bold">Erythroplakia</text>
<line x1="90" y1="228" x2="90" y2="260" stroke="#334155"/>
<line x1="270" y1="228" x2="270" y2="260" stroke="#334155"/>
<line x1="450" y1="228" x2="450" y2="260" stroke="#334155"/>
<line x1="630" y1="228" x2="630" y2="260" stroke="#334155"/>
<rect x="10" y="260" width="160" height="72" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="90" y="282" text-anchor="middle" fill="#0f172a">Not premalignant</text>
<text x="90" y="300" text-anchor="middle" fill="#0f172a">Topical or oral</text>
<text x="90" y="318" text-anchor="middle" fill="#0f172a">antifungal</text>
<rect x="190" y="260" width="160" height="72" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="270" y="282" text-anchor="middle" fill="#0f172a">EBV; not</text>
<text x="270" y="300" text-anchor="middle" fill="#0f172a">premalignant;</text>
<text x="270" y="318" text-anchor="middle" fill="#0f172a">test for HIV</text>
<rect x="370" y="260" width="160" height="72" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="450" y="282" text-anchor="middle" fill="#0f172a">Premalignant</text>
<text x="450" y="300" text-anchor="middle" fill="#0f172a">Biopsy if it</text>
<text x="450" y="318" text-anchor="middle" fill="#0f172a">persists</text>
<rect x="550" y="260" width="160" height="72" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="630" y="282" text-anchor="middle" fill="#0f172a">Highest risk of</text>
<text x="630" y="300" text-anchor="middle" fill="#0f172a">dysplasia</text>
<text x="630" y="318" text-anchor="middle" fill="#0f172a">Biopsy</text>
<text x="360" y="372" text-anchor="middle" fill="#0f172a">Tobacco and alcohol raise risk for leukoplakia and erythroplakia</text>
</svg>
