<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Acetaminophen metabolism showing conjugation, CYP2E1 formation of NAPQI, glutathione detoxification and the action of N-acetylcysteine" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
<rect x="250" y="20" width="180" height="40" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="340" y="45" font-size="14" fill="#0f172a" text-anchor="middle">Acetaminophen</text>
<line x1="300" y1="60" x2="172" y2="106" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="380" y1="60" x2="508" y2="106" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="110" width="280" height="50" rx="6" fill="#dcfce7" stroke="#334155"/>
<text x="160" y="131" font-size="13" fill="#0f172a" text-anchor="middle">Glucuronidation + sulfation</text>
<text x="160" y="150" font-size="13" fill="#0f172a" text-anchor="middle">(main route; saturates in overdose)</text>
<rect x="380" y="110" width="280" height="50" rx="6" fill="#fef3c7" stroke="#334155"/>
<text x="520" y="131" font-size="13" fill="#0f172a" text-anchor="middle">CYP2E1 oxidation (minor route)</text>
<text x="520" y="150" font-size="13" fill="#0f172a" text-anchor="middle">induced by chronic alcohol</text>
<line x1="160" y1="160" x2="160" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="200" width="280" height="40" rx="6" fill="#dcfce7" stroke="#334155"/>
<text x="160" y="225" font-size="13" fill="#0f172a" text-anchor="middle">Nontoxic conjugates in urine</text>
<line x1="520" y1="160" x2="520" y2="186" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="380" y="190" width="280" height="40" rx="6" fill="#fce7f3" stroke="#334155"/>
<text x="520" y="215" font-size="13" fill="#0f172a" text-anchor="middle">NAPQI (reactive metabolite)</text>
<line x1="480" y1="230" x2="382" y2="267" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="560" y1="230" x2="556" y2="266" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="230" y="270" width="200" height="50" rx="6" fill="#e0f2fe" stroke="#334155"/>
<text x="330" y="291" font-size="13" fill="#0f172a" text-anchor="middle">Glutathione present:</text>
<text x="330" y="310" font-size="13" fill="#0f172a" text-anchor="middle">safe excretion</text>
<rect x="450" y="270" width="210" height="50" rx="6" fill="#fce7f3" stroke="#334155"/>
<text x="555" y="291" font-size="13" fill="#0f172a" text-anchor="middle">Glutathione depleted:</text>
<text x="555" y="310" font-size="13" fill="#0f172a" text-anchor="middle">zone 3 necrosis</text>
<rect x="20" y="270" width="185" height="50" rx="6" fill="#ede9fe" stroke="#334155"/>
<text x="112" y="291" font-size="13" fill="#0f172a" text-anchor="middle">N-acetylcysteine</text>
<text x="112" y="310" font-size="13" fill="#0f172a" text-anchor="middle">restores glutathione</text>
<line x1="205" y1="295" x2="226" y2="295" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
