<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Foregut, midgut and hindgut with their arteries and main derivatives" font-family="sans-serif">
<rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="200" height="230" rx="8" fill="#e0f2fe" stroke="#334155"/>
<rect x="240" y="20" width="200" height="230" rx="8" fill="#dcfce7" stroke="#334155"/>
<rect x="460" y="20" width="200" height="230" rx="8" fill="#fef3c7" stroke="#334155"/>
<text x="120" y="46" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">Foregut</text>
<text x="120" y="66" font-size="13" fill="#0f172a" text-anchor="middle">Celiac trunk</text>
<text x="340" y="46" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">Midgut</text>
<text x="340" y="66" font-size="13" fill="#0f172a" text-anchor="middle">Superior mesenteric a.</text>
<text x="560" y="46" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">Hindgut</text>
<text x="560" y="66" font-size="13" fill="#0f172a" text-anchor="middle">Inferior mesenteric a.</text>
<line x1="35" y1="78" x2="205" y2="78" stroke="#334155"/>
<line x1="255" y1="78" x2="425" y2="78" stroke="#334155"/>
<line x1="475" y1="78" x2="645" y2="78" stroke="#334155"/>
<text x="32" y="102" font-size="13" fill="#0f172a">Esophagus</text>
<text x="32" y="124" font-size="13" fill="#0f172a">Stomach</text>
<text x="32" y="146" font-size="13" fill="#0f172a">Duodenum to papilla</text>
<text x="32" y="168" font-size="13" fill="#0f172a">Liver, gallbladder</text>
<text x="32" y="190" font-size="13" fill="#0f172a">Pancreas</text>
<text x="32" y="212" font-size="13" fill="#0f172a">Pain: epigastric</text>
<text x="252" y="102" font-size="13" fill="#0f172a">Duodenum past papilla</text>
<text x="252" y="124" font-size="13" fill="#0f172a">Jejunum, ileum</text>
<text x="252" y="146" font-size="13" fill="#0f172a">Cecum, appendix</text>
<text x="252" y="168" font-size="13" fill="#0f172a">Ascending colon</text>
<text x="252" y="190" font-size="13" fill="#0f172a">Proximal 2/3 transverse</text>
<text x="252" y="212" font-size="13" fill="#0f172a">Pain: periumbilical</text>
<text x="472" y="102" font-size="13" fill="#0f172a">Distal 1/3 transverse</text>
<text x="472" y="124" font-size="13" fill="#0f172a">Descending colon</text>
<text x="472" y="146" font-size="13" fill="#0f172a">Sigmoid colon, rectum</text>
<text x="472" y="168" font-size="13" fill="#0f172a">Anal canal above</text>
<text x="472" y="190" font-size="13" fill="#0f172a">pectinate line</text>
<text x="472" y="212" font-size="13" fill="#0f172a">Pain: hypogastric</text>
<rect x="20" y="265" width="640" height="52" rx="8" fill="#ede9fe" stroke="#334155"/>
<text x="340" y="287" font-size="13" fill="#0f172a" text-anchor="middle">Midgut herniates into the cord about week 6 and returns about week 10,</text>
<text x="340" y="306" font-size="13" fill="#0f172a" text-anchor="middle">rotating 270 degrees counterclockwise around the superior mesenteric artery.</text>
</svg>
