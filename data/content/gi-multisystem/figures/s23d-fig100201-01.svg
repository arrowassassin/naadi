<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Two molecular pathways from normal colon to colorectal cancer" font-family="sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="20" y="34" font-size="13" fill="#0f172a">Conventional adenoma pathway (chromosomal instability)</text><rect x="20" y="50" width="130" height="56" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="85" y="83" font-size="13" text-anchor="middle" fill="#0f172a">Normal</text><rect x="200" y="50" width="130" height="56" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="265" y="83" font-size="13" text-anchor="middle" fill="#0f172a">Adenoma</text><rect x="380" y="50" width="130" height="56" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="445" y="74" font-size="13" text-anchor="middle" fill="#0f172a">Advanced</text><text x="445" y="92" font-size="13" text-anchor="middle" fill="#0f172a">adenoma</text><rect x="560" y="50" width="130" height="56" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="625" y="74" font-size="13" text-anchor="middle" fill="#0f172a">Carcinoma</text><text x="625" y="92" font-size="13" text-anchor="middle" fill="#0f172a">(CIN)</text><line x1="152" y1="78" x2="196" y2="78" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><text x="174" y="70" font-size="12" text-anchor="middle" fill="#0f172a">APC</text><line x1="332" y1="78" x2="376" y2="78" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><text x="354" y="70" font-size="12" text-anchor="middle" fill="#0f172a">KRAS</text><line x1="512" y1="78" x2="556" y2="78" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><text x="534" y="70" font-size="12" text-anchor="middle" fill="#0f172a">TP53</text><text x="20" y="164" font-size="13" fill="#0f172a">Serrated pathway (CpG island methylation)</text><rect x="20" y="180" width="130" height="56" rx="8" fill="#fef3c7" stroke="#334155"/><text x="85" y="213" font-size="13" text-anchor="middle" fill="#0f172a">Normal</text><rect x="200" y="180" width="130" height="56" rx="8" fill="#fef3c7" stroke="#334155"/><text x="265" y="204" font-size="13" text-anchor="middle" fill="#0f172a">Sessile serrated</text><text x="265" y="222" font-size="13" text-anchor="middle" fill="#0f172a">lesion</text><rect x="380" y="180" width="130" height="56" rx="8" fill="#fef3c7" stroke="#334155"/><text x="445" y="204" font-size="13" text-anchor="middle" fill="#0f172a">SSL with</text><text x="445" y="222" font-size="13" text-anchor="middle" fill="#0f172a">dysplasia</text><rect x="560" y="180" width="130" height="56" rx="8" fill="#fef3c7" stroke="#334155"/><text x="625" y="204" font-size="13" text-anchor="middle" fill="#0f172a">Carcinoma</text><text x="625" y="222" font-size="13" text-anchor="middle" fill="#0f172a">(MSI-high)</text><line x1="152" y1="208" x2="196" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><text x="174" y="200" font-size="12" text-anchor="middle" fill="#0f172a">BRAF</text><line x1="332" y1="208" x2="376" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><text x="354" y="200" font-size="12" text-anchor="middle" fill="#0f172a">CIMP</text><line x1="512" y1="208" x2="556" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><text x="534" y="200" font-size="12" text-anchor="middle" fill="#0f172a">MLH1</text><text x="20" y="266" font-size="12" fill="#0f172a">CIMP: CpG island methylator phenotype; MLH1 is silenced by promoter methylation</text></svg>
