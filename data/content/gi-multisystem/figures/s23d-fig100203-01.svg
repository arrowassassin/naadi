<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="Routes of spread of gastrointestinal cancer" font-family="sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="350" y="22" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="bold">How GI carcinomas spread</text>
<rect x="260" y="150" width="180" height="56" rx="8" fill="#fce7f3" stroke="#334155"/><text x="350" y="174" text-anchor="middle" font-size="14" fill="#0f172a">Primary tumour</text><text x="350" y="194" text-anchor="middle" font-size="12" fill="#0f172a">stomach, colon, pancreas</text>
<rect x="20" y="50" width="200" height="56" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="120" y="74" text-anchor="middle" font-size="13" fill="#0f172a">Lymphatic</text><text x="120" y="94" text-anchor="middle" font-size="12" fill="#0f172a">nodes, thoracic duct</text>
<rect x="20" y="130" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="120" y="155" text-anchor="middle" font-size="12" fill="#0f172a">Left supraclavicular node</text>
<rect x="480" y="50" width="200" height="56" rx="8" fill="#fef3c7" stroke="#334155"/><text x="580" y="74" text-anchor="middle" font-size="13" fill="#0f172a">Hematogenous</text><text x="580" y="94" text-anchor="middle" font-size="12" fill="#0f172a">via the portal vein</text>
<rect x="480" y="130" width="200" height="40" rx="8" fill="#fef3c7" stroke="#334155"/><text x="580" y="155" text-anchor="middle" font-size="12" fill="#0f172a">Liver first; then lung, bone</text>
<rect x="250" y="250" width="200" height="56" rx="8" fill="#dcfce7" stroke="#334155"/><text x="350" y="274" text-anchor="middle" font-size="13" fill="#0f172a">Transcoelomic</text><text x="350" y="294" text-anchor="middle" font-size="12" fill="#0f172a">shed into peritoneal cavity</text>
<rect x="20" y="300" width="200" height="40" rx="8" fill="#dcfce7" stroke="#334155"/><text x="120" y="325" text-anchor="middle" font-size="12" fill="#0f172a">Omentum, pelvic pouch</text>
<rect x="480" y="300" width="200" height="40" rx="8" fill="#dcfce7" stroke="#334155"/><text x="580" y="325" text-anchor="middle" font-size="12" fill="#0f172a">Ovaries (Krukenberg)</text>
<g stroke="#334155" stroke-width="2" marker-end="url(#m)"><line x1="260" y1="165" x2="222" y2="100"/><line x1="440" y1="165" x2="478" y2="100"/><line x1="350" y1="208" x2="350" y2="248"/><line x1="120" y1="108" x2="120" y2="128"/><line x1="580" y1="108" x2="580" y2="128"/><line x1="250" y1="290" x2="222" y2="310"/><line x1="450" y1="290" x2="478" y2="310"/></g></svg>
