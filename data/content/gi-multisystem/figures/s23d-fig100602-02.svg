<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Flowchart for suspected common bile duct stone: high likelihood goes to ERCP, intermediate to MRCP or endoscopic ultrasound, low to cholecystectomy" font-family="sans-serif">
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="190" y="16" width="340" height="50" rx="8" fill="#e0f2fe" stroke="#334155"/>
<text x="360" y="37" font-size="14" text-anchor="middle" fill="#0f172a">Gallstones and suspected duct stone</text>
<text x="360" y="56" font-size="12" text-anchor="middle" fill="#0f172a">liver tests plus ultrasound</text>
<line x1="270" y1="66" x2="125" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="360" y1="66" x2="360" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="450" y1="66" x2="595" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
<rect x="20" y="110" width="210" height="96" rx="8" fill="#fce7f3" stroke="#334155"/>
<text x="125" y="132" font-size="14" text-anchor="middle" fill="#0f172a">High likelihood</text>
<text x="32" y="154" font-size="12" fill="#0f172a">Duct stone seen on imaging,</text>
<text x="32" y="172" font-size="12" fill="#0f172a">or clinical cholangitis</text>
<rect x="255" y="110" width="210" height="96" rx="8" fill="#fef3c7" stroke="#334155"/>
<text x="360" y="132" font-size="14" text-anchor="middle" fill="#0f172a">Intermediate likelihood</text>
<text x="267" y="154" font-size="12" fill="#0f172a">Dilated duct or abnormal</text>
<text x="267" y="172" font-size="12" fill="#0f172a">liver tests, no stone seen</text>
<rect x="490" y="110" width="210" height="96" rx="8" fill="#dcfce7" stroke="#334155"/>
<text x="595" y="132" font-size="14" text-anchor="middle" fill="#0f172a">Low likelihood</text>
<text x="502" y="154" font-size="12" fill="#0f172a">Normal duct and normal</text>
<text x="502" y="172" font-size="12" fill="#0f172a">liver tests</text>
<line x1="125" y1="206" x2="125" y2="238" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="360" y1="206" x2="360" y2="238" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="595" y1="206" x2="595" y2="238" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
<rect x="20" y="240" width="210" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="125" y="264" font-size="13" text-anchor="middle" fill="#0f172a">ERCP: clear the duct,</text>
<text x="125" y="284" font-size="13" text-anchor="middle" fill="#0f172a">then cholecystectomy</text>
<rect x="255" y="240" width="210" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="360" y="264" font-size="13" text-anchor="middle" fill="#0f172a">MRCP or EUS first;</text>
<text x="360" y="284" font-size="13" text-anchor="middle" fill="#0f172a">ERCP only if stone found</text>
<rect x="490" y="240" width="210" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/>
<text x="595" y="264" font-size="13" text-anchor="middle" fill="#0f172a">Cholecystectomy</text>
<text x="595" y="284" font-size="13" text-anchor="middle" fill="#0f172a">if symptomatic</text>
<text x="20" y="322" font-size="12" fill="#0f172a">Cholangitis also needs blood cultures and antibiotics before drainage.</text>
</svg>
