<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Approach to new ascites in a patient with cancer" font-family="sans-serif"><defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="340" y="22" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="bold">New ascites in a patient with cancer</text>
<rect x="150" y="40" width="380" height="44" rx="6" fill="#e0f2fe" stroke="#334155"/><text x="340" y="67" text-anchor="middle" font-size="13" fill="#0f172a">Diagnostic paracentesis: SAAG, protein, cytology</text>
<g stroke="#334155" stroke-width="2" marker-end="url(#n)"><line x1="280" y1="86" x2="170" y2="126"/><line x1="400" y1="86" x2="510" y2="126"/></g>
<rect x="20" y="128" width="300" height="58" rx="6" fill="#fef3c7" stroke="#334155"/><text x="170" y="152" text-anchor="middle" font-size="13" fill="#0f172a">SAAG below 1.1, high protein,</text><text x="170" y="172" text-anchor="middle" font-size="13" fill="#0f172a">positive cytology: carcinomatosis</text>
<rect x="360" y="128" width="300" height="58" rx="6" fill="#ede9fe" stroke="#334155"/><text x="510" y="152" text-anchor="middle" font-size="13" fill="#0f172a">SAAG 1.1 or more, negative cytology:</text><text x="510" y="172" text-anchor="middle" font-size="13" fill="#0f172a">portal hypertension (liver mets)</text>
<g stroke="#334155" stroke-width="2" marker-end="url(#n)"><line x1="170" y1="188" x2="170" y2="226"/><line x1="510" y1="188" x2="510" y2="226"/></g>
<rect x="20" y="228" width="300" height="58" rx="6" fill="#dcfce7" stroke="#334155"/><text x="170" y="252" text-anchor="middle" font-size="13" fill="#0f172a">Therapeutic paracentesis;</text><text x="170" y="272" text-anchor="middle" font-size="13" fill="#0f172a">indwelling catheter if recurrent</text>
<rect x="360" y="228" width="300" height="58" rx="6" fill="#dcfce7" stroke="#334155"/><text x="510" y="252" text-anchor="middle" font-size="13" fill="#0f172a">Diuretics may help;</text><text x="510" y="272" text-anchor="middle" font-size="13" fill="#0f172a">paracentesis for tense ascites</text>
<text x="340" y="314" text-anchor="middle" font-size="12" fill="#0f172a">Treat the cancer and align care with the patient's goals</text></svg>
