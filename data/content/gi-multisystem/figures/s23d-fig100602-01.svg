<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Biliary tree with the site of stone impaction for each gallstone complication" font-family="sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="230" y="20" width="200" height="44" rx="8" fill="#dcfce7" stroke="#334155"/>
<text x="330" y="47" font-size="14" text-anchor="middle" fill="#0f172a">Liver and hepatic ducts</text>
<line x1="330" y1="64" x2="330" y2="98" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="100" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#334155"/>
<text x="330" y="125" font-size="14" text-anchor="middle" fill="#0f172a">Common hepatic duct</text>
<line x1="330" y1="140" x2="330" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="160" width="170" height="44" rx="20" fill="#fef3c7" stroke="#334155"/>
<text x="105" y="187" font-size="14" text-anchor="middle" fill="#0f172a">Gallbladder</text>
<line x1="190" y1="182" x2="328" y2="196" stroke="#334155" stroke-width="2"/>
<text x="212" y="220" font-size="12" fill="#0f172a">cystic duct</text>
<rect x="230" y="230" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#334155"/>
<text x="330" y="255" font-size="14" text-anchor="middle" fill="#0f172a">Common bile duct</text>
<line x1="330" y1="270" x2="330" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="320" width="170" height="44" rx="8" fill="#fce7f3" stroke="#334155"/>
<text x="105" y="347" font-size="14" text-anchor="middle" fill="#0f172a">Pancreatic duct</text>
<line x1="190" y1="342" x2="228" y2="342" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="320" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#334155"/>
<text x="330" y="340" font-size="14" text-anchor="middle" fill="#0f172a">Ampulla of Vater</text>
<text x="330" y="357" font-size="12" text-anchor="middle" fill="#0f172a">opens into duodenum</text>
<rect x="455" y="14" width="255" height="56" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="465" y="36" font-size="12" fill="#0f172a">Small intrahepatic ducts: PBC</text>
<text x="465" y="56" font-size="12" fill="#0f172a">Ducts of all sizes: PSC (beading)</text>
<rect x="455" y="146" width="255" height="70" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="465" y="166" font-size="12" fill="#0f172a">Stone in cystic duct</text>
<text x="465" y="186" font-size="12" fill="#0f172a">Brief: biliary colic, normal labs</text>
<text x="465" y="206" font-size="12" fill="#0f172a">Persistent: acute cholecystitis</text>
<rect x="455" y="226" width="255" height="70" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="465" y="246" font-size="12" fill="#0f172a">Stone in common bile duct</text>
<text x="465" y="266" font-size="12" fill="#0f172a">Jaundice, high ALP and bilirubin</text>
<text x="465" y="286" font-size="12" fill="#0f172a">Plus infection: acute cholangitis</text>
<rect x="455" y="310" width="255" height="56" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="465" y="332" font-size="12" fill="#0f172a">Stone at ampulla</text>
<text x="465" y="352" font-size="12" fill="#0f172a">Blocks outflow: pancreatitis</text>
<line x1="430" y1="42" x2="453" y2="42" stroke="#334155" stroke-dasharray="4 3"/>
<line x1="334" y1="190" x2="453" y2="182" stroke="#334155" stroke-dasharray="4 3"/>
<line x1="430" y1="252" x2="453" y2="258" stroke="#334155" stroke-dasharray="4 3"/>
<line x1="430" y1="340" x2="453" y2="338" stroke="#334155" stroke-dasharray="4 3"/>
<text x="20" y="392" font-size="12" fill="#0f172a">Arrows show the direction of bile flow; dashed lines link each site to its disease.</text>
</svg>
