<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="Inputs to the vomiting centre and antiemetic targets" font-family="sans-serif"><defs><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="350" y="22" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="bold">Emetic inputs, receptors and blocking drugs</text>
<rect x="20" y="40" width="260" height="66" rx="6" fill="#e0f2fe" stroke="#334155"/><text x="150" y="62" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">Area postrema (CTZ)</text><text x="150" y="80" text-anchor="middle" font-size="12" fill="#0f172a">D2, 5-HT3, NK1 receptors</text><text x="150" y="97" text-anchor="middle" font-size="12" fill="#0f172a">Drugs, toxins, uraemia</text>
<rect x="420" y="40" width="260" height="66" rx="6" fill="#fef3c7" stroke="#334155"/><text x="550" y="62" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">Gut vagal afferents</text><text x="550" y="80" text-anchor="middle" font-size="12" fill="#0f172a">5-HT3 receptors</text><text x="550" y="97" text-anchor="middle" font-size="12" fill="#0f172a">Chemotherapy, gut distension</text>
<rect x="20" y="130" width="260" height="66" rx="6" fill="#dcfce7" stroke="#334155"/><text x="150" y="152" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">Vestibular system</text><text x="150" y="170" text-anchor="middle" font-size="12" fill="#0f172a">H1 and muscarinic receptors</text><text x="150" y="187" text-anchor="middle" font-size="12" fill="#0f172a">Motion sickness</text>
<rect x="420" y="130" width="260" height="66" rx="6" fill="#fce7f3" stroke="#334155"/><text x="550" y="152" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">Cortex and limbic system</text><text x="550" y="170" text-anchor="middle" font-size="12" fill="#0f172a">Anticipation, smell, raised ICP</text><text x="550" y="187" text-anchor="middle" font-size="12" fill="#0f172a">Benzodiazepines for anticipatory</text>
<rect x="220" y="236" width="260" height="50" rx="8" fill="#ede9fe" stroke="#334155"/><text x="350" y="258" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">Medullary vomiting centre</text><text x="350" y="276" text-anchor="middle" font-size="12" fill="#0f172a">nucleus tractus solitarius network</text>
<g stroke="#334155" stroke-width="2" marker-end="url(#v)"><line x1="282" y1="73" x2="320" y2="232"/><line x1="418" y1="73" x2="380" y2="232"/><line x1="282" y1="163" x2="290" y2="232"/><line x1="418" y1="163" x2="410" y2="232"/></g>
<rect x="20" y="304" width="660" height="66" rx="6" fill="#f1f5f9" stroke="#334155"/>
<g font-size="12" fill="#0f172a"><text x="34" y="324">5-HT3: ondansetron, granisetron (QT prolongation)</text><text x="370" y="324">NK1: aprepitant (CYP3A4 interactions)</text><text x="34" y="344">D2: metoclopramide, prochlorperazine (dystonia)</text><text x="370" y="344">H1: meclizine, dimenhydrinate (sedation)</text><text x="34" y="362">Muscarinic: scopolamine (urinary retention)</text><text x="370" y="362">Adjuncts: dexamethasone, dronabinol</text></g></svg>
