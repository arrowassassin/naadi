<text x="40" y="522" font-size="13" font-weight="bold">A</text>
<text x="62" y="522" font-size="12">Dura over the convexity</text>
<text x="400" y="522" font-size="12" font-weight="bold">Meningioma (adult)</text>
<text x="40" y="542" font-size="13" font-weight="bold">B</text>
<text x="62" y="542" font-size="12">Hemispheric white matter, across the corpus callosum</text>
<text x="400" y="542" font-size="12" font-weight="bold">Glioblastoma (adult)</text>
<text x="40" y="562" font-size="13" font-weight="bold">C</text>
<text x="62" y="562" font-size="12">Sella and suprasellar region</text>
<text x="400" y="562" font-size="12" font-weight="bold">Pituitary adenoma (adult); craniopharyngioma (child)</text>
<text x="40" y="582" font-size="13" font-weight="bold">D</text>
<text x="62" y="582" font-size="12">Pineal region</text>
<text x="400" y="582" font-size="12" font-weight="bold">Germ cell tumour, germinoma (child, young adult)</text>
<text x="40" y="602" font-size="13" font-weight="bold">E</text>
<text x="62" y="602" font-size="12">Cerebellar hemisphere</text>
<text x="400" y="602" font-size="12" font-weight="bold">Pilocytic astrocytoma (child); hemangioblastoma (adult)</text>
<text x="40" y="622" font-size="13" font-weight="bold">F</text>
<text x="62" y="622" font-size="12">Cerebellar vermis, roof of 4th ventricle</text>
<text x="400" y="622" font-size="12" font-weight="bold">Medulloblastoma (child)</text>
<text x="40" y="642" font-size="13" font-weight="bold">G</text>
<text x="62" y="642" font-size="12">Floor of 4th ventricle</text>
<text x="400" y="642" font-size="12" font-weight="bold">Ependymoma (child)</text>
<text x="40" y="662" font-size="13" font-weight="bold">H</text>
<text x="62" y="662" font-size="12">Pons</text>
<text x="400" y="662" font-size="12" font-weight="bold">Diffuse midline glioma, H3 K27-altered (child)</text>
<text x="40" y="682" font-size="13" font-weight="bold">I</text>
<text x="62" y="682" font-size="12">Cerebellopontine angle</text>
<text x="400" y="682" font-size="12" font-weight="bold">Vestibular schwannoma (adult)</text>
<text x="40" y="708" font-size="11" fill="#334155">Adults: most primary tumours are supratentorial. Children: most are in the posterior fossa.</text>
