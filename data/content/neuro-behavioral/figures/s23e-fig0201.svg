<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-label="Midline sagittal schematic of the brain. A: Dura over the convexity, Meningioma (adult). B: Hemispheric white matter, across the corpus callosum, Glioblastoma (adult). C: Sella and suprasellar region, Pituitary adenoma (adult); craniopharyngioma (child). D: Pineal region, Germ cell tumour, germinoma (child, young adult). E: Cerebellar hemisphere, Pilocytic astrocytoma (child); hemangioblastoma (adult). F: Cerebellar vermis, roof of 4th ventricle, Medulloblastoma (child). G: Floor of 4th ventricle, Ependymoma (child). H: Pons, Diffuse midline glioma, H3 K27-altered (child). I: Cerebellopontine angle, Vestibular schwannoma (adult).">
