<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Visual pathway seen from above, from both eyes through the optic chiasm and the lateral geniculate nuclei to the visual cortex on each side, with six lesion sites labelled A to F.">
<rect x="0" y="0" width="400" height="540" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="200" y="26" font-size="15" font-weight="bold" text-anchor="middle">Visual pathway: lesion sites A–F</text>
<text x="110" y="52" font-size="12" text-anchor="middle">Left eye</text><text x="290" y="52" font-size="12" text-anchor="middle">Right eye</text>
<circle cx="110" cy="90" r="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<circle cx="110" cy="78" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<circle cx="290" cy="90" r="30" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<circle cx="290" cy="78" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<path d="M110,120 L200,200" fill="none" stroke="#334155" stroke-width="2.4"/><path d="M290,120 L200,200" fill="none" stroke="#334155" stroke-width="2.4"/>
<rect x="178" y="190" width="44" height="20" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
<text x="236" y="205" font-size="11">chiasm</text>
<path d="M200,210 L130,285" fill="none" stroke="#334155" stroke-width="2.4"/><path d="M200,210 L270,285" fill="none" stroke="#334155" stroke-width="2.4"/>
<rect x="110" y="285" width="40" height="18" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
<rect x="250" y="285" width="40" height="18" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
<text x="104" y="298" font-size="11" text-anchor="end">LGN</text><text x="296" y="298" font-size="11">LGN</text>
<path d="M120,303 C60,330 40,390 95,470" fill="none" stroke="#334155" stroke-width="2.4"/>
<path d="M135,303 C150,360 150,420 125,470" fill="none" stroke="#334155" stroke-width="2.4"/>
<path d="M280,303 C340,330 360,390 305,470" fill="none" stroke="#334155" stroke-width="2.4"/>
<path d="M265,303 C250,360 250,420 275,470" fill="none" stroke="#334155" stroke-width="2.4"/>
<rect x="80" y="470" width="70" height="26" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/><rect x="250" y="470" width="70" height="26" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
<text x="115" y="514" font-size="11" text-anchor="middle">left cortex</text><text x="285" y="514" font-size="11" text-anchor="middle">right cortex</text>
<line x1="200" y1="240" x2="200" y2="530" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="155" cy="160" r="12" fill="#0f172a"/><text x="155" y="165" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
<circle cx="200" cy="200" r="12" fill="#0f172a"/><text x="200" y="205" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
<circle cx="165" cy="248" r="12" fill="#0f172a"/><text x="165" y="253" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
<circle cx="58" cy="385" r="12" fill="#0f172a"/><text x="58" y="390" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
<circle cx="146" cy="415" r="12" fill="#0f172a"/><text x="146" y="420" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text>
<circle cx="115" cy="483" r="12" fill="#0f172a"/><text x="115" y="488" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
</g></svg>