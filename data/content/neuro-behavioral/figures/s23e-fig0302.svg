<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Schematic cross-section of the rostral medulla. On the left half, region 1 is the medial strip containing the pyramid, medial lemniscus and hypoglossal nucleus. Region 2 is the lateral wedge containing the spinothalamic tract, spinal trigeminal nucleus and tract, nucleus ambiguus, descending sympathetic fibres, vestibular nuclei and inferior cerebellar peduncle.">
