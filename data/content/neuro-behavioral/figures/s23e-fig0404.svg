<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Unlabelled schematic of the right brachial plexus: five roots join into three trunks, which divide and regroup into three cords and then five terminal branches, with two small branches arising near the roots and the upper trunk. Five sites are marked with the letters A to E.">
<rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380" y="22" font-size="16" font-weight="bold" text-anchor="middle">Brachial plexus (simplified): lettered sites</text>
<g font-size="12" font-style="italic" text-anchor="middle"><text x="65" y="430">Roots</text><text x="245" y="430">Trunks</text><text x="340" y="430">Divisions</text><text x="435" y="430">Cords</text><text x="670" y="430">Terminal branches</text></g>
<g stroke="#334155" stroke-width="2" fill="none">
