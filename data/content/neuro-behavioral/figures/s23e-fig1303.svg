<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Cycle of five stages of change, clockwise: precontemplation, contemplation, preparation, action and maintenance, each with the clinician's task, and a dashed relapse arrow from maintenance back to an earlier stage.">
<defs><marker id="s23e-fig1303-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380" y="28" font-size="16" font-weight="bold" text-anchor="middle">Stages of change and what the clinician does at each</text>
<line x1="474.1" y1="113.0" x2="523.7" y2="134.6" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig1303-arr)"/>
<line x1="595.6" y1="216.6" x2="549.1" y2="302.4" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig1303-arr)"/>
<line x1="423.9" y1="343.4" x2="336.1" y2="343.4" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig1303-arr)"/>
<line x1="210.9" y1="302.4" x2="164.4" y2="216.6" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig1303-arr)"/>
<line x1="236.3" y1="134.6" x2="285.9" y2="113.0" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#s23e-fig1303-arr)"/>
<rect x="285.0" y="39.0" width="190" height="66" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="62.0" font-size="14" font-weight="bold" text-anchor="middle">Precontemplation</text>
<text x="380.0" y="79.0" font-size="12" text-anchor="middle">not considering change</text>
<text x="380.0" y="95.0" font-size="12" font-style="italic" fill="#334155" text-anchor="middle">clinician: raise awareness</text>
<rect x="522.8" y="142.6" width="190" height="66" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="617.8" y="165.6" font-size="14" font-weight="bold" text-anchor="middle">Contemplation</text>
<text x="617.8" y="182.6" font-size="12" text-anchor="middle">ambivalent, weighing it up</text>
<text x="617.8" y="198.6" font-size="12" font-style="italic" fill="#334155" text-anchor="middle">clinician: explore ambivalence</text>
<rect x="431.9" y="310.4" width="190" height="66" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="526.9" y="333.4" font-size="14" font-weight="bold" text-anchor="middle">Preparation</text>
<text x="526.9" y="350.4" font-size="12" text-anchor="middle">intends to act soon</text>
<text x="526.9" y="366.4" font-size="12" font-style="italic" fill="#334155" text-anchor="middle">clinician: agree a concrete plan</text>
<rect x="138.1" y="310.4" width="190" height="66" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="233.1" y="333.4" font-size="14" font-weight="bold" text-anchor="middle">Action</text>
<text x="233.1" y="350.4" font-size="12" text-anchor="middle">changing behaviour</text>
<text x="233.1" y="366.4" font-size="12" font-style="italic" fill="#334155" text-anchor="middle">clinician: support and reinforce</text>
<rect x="47.2" y="142.6" width="190" height="66" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="142.2" y="165.6" font-size="14" font-weight="bold" text-anchor="middle">Maintenance</text>
<text x="142.2" y="182.6" font-size="12" text-anchor="middle">change sustained</text>
<text x="142.2" y="198.6" font-size="12" font-style="italic" fill="#334155" text-anchor="middle">clinician: prevent relapse</text>
<text x="380" y="228" font-size="13" text-anchor="middle" fill="#334155">Relapse (dashed) is common</text>
<text x="380" y="246" font-size="13" text-anchor="middle" fill="#334155">and re-enters the cycle</text>
</g></svg>
