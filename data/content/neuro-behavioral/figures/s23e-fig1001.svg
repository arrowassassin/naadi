<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Midsagittal brain schematic with four dopamine pathways. 1 nigrostriatal, substantia nigra to striatum: blockade causes parkinsonism and dystonia. 2 mesolimbic, ventral tegmental area to nucleus accumbens: blockade relieves positive symptoms. 3 mesocortical, ventral tegmental area to prefrontal cortex: blockade may worsen negative and cognitive symptoms. 4 tuberoinfundibular, hypothalamus to pituitary: blockade raises prolactin. The area postrema in the medulla contains the chemoreceptor trigger zone."><defs><marker id="s23e-fig1001-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="760" height="600" fill="#ffffff"/><g font-family="sans-serif" fill="#0f172a"><text x="380" y="30" font-size="16" font-weight="bold" text-anchor="middle">Dopamine pathways and what D2 blockade does</text><path d="M110,250 C100,120 230,60 380,62 C540,64 650,130 650,240 C650,300 610,330 560,330 L470,330 C450,300 420,292 395,300 L330,318 C260,330 200,330 160,318 C125,306 112,285 110,250 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M520,335 C560,330 640,340 645,385 C648,425 600,445 555,438 C520,432 505,400 510,370 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><path d="M395,300 C420,292 450,300 470,330 L500,470 L452,478 L420,380 C410,350 398,325 395,300 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><ellipse cx="190" cy="175" rx="62" ry="70" fill="#e2e8f0" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4"/><ellipse cx="335" cy="200" rx="58" ry="30" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/><ellipse cx="285" cy="262" rx="26" ry="15" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/><ellipse cx="330" cy="305" rx="30" ry="14" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/><line x1="318" y1="318" x2="310" y2="358" stroke="#334155" stroke-width="3"/><circle cx="308" cy="372" r="15" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/><circle cx="418" cy="312" r="6" fill="#0f172a"/><circle cx="436" cy="296" r="6" fill="#0f172a"/><circle cx="486" cy="440" r="6" fill="#0f172a"/><path d="M436,296 C420,250 400,220 392,208" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#s23e-fig1001-arr)"/><path d="M412,314 C370,300 330,280 312,268" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#s23e-fig1001-arr)"/><path d="M414,306 C380,150 300,110 250,150" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#s23e-fig1001-arr)"/><path d="M318,318 L311,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#s23e-fig1001-arr)"/><text x="110" y="470" font-size="12" font-style="italic" fill="#334155">front of head</text><text x="590" y="484" font-size="12" font-style="italic" fill="#334155">back of head</text><text x="190" y="175" font-size="12" text-anchor="middle">Prefrontal cortex</text><text x="335" y="204" font-size="12" text-anchor="middle">Striatum</text><text x="205" y="266" font-size="12" text-anchor="end">Nucleus accumbens</text><text x="250" y="310" font-size="12" text-anchor="end">Hypothalamus</text><text x="255" y="377" font-size="12" text-anchor="end">Pituitary</text><text x="452" y="300" font-size="11">SNc</text><text x="430" y="328" font-size="11">VTA</text><text x="512" y="470" font-size="11">Area postrema</text><circle cx="395" cy="250" r="14" fill="#0f172a"/><text x="395" y="255" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="362" cy="287" r="14" fill="#0f172a"/><text x="362" y="292" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="355" cy="125" r="14" fill="#0f172a"/><text x="355" y="130" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><circle cx="345" cy="340" r="14" fill="#0f172a"/><text x="345" y="345" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><line x1="40" y1="483" x2="720" y2="483" stroke="#cbd5e1"/><text x="40" y="505" font-size="12" font-weight="bold">1  Nigrostriatal (SNc to striatum)</text><text x="355" y="505" font-size="12">Parkinsonism, acute dystonia, akathisia; tardive dyskinesia later</text><text x="40" y="525" font-size="12" font-weight="bold">2  Mesolimbic (VTA to nucleus accumbens)</text><text x="355" y="525" font-size="12">Relief of hallucinations and delusions (intended effect)</text><text x="40" y="545" font-size="12" font-weight="bold">3  Mesocortical (VTA to prefrontal cortex)</text><text x="355" y="545" font-size="12">May blunt motivation and cognition (negative symptoms)</text><text x="40" y="565" font-size="12" font-weight="bold">4  Tuberoinfundibular (hypothalamus to pituitary)</text><text x="355" y="565" font-size="12">Loss of dopamine's brake: high prolactin</text><text x="40" y="589" font-size="11" fill="#334155">Dashed arrow: mesocortical. The area postrema (chemoreceptor trigger zone) is why D2 blockers are antiemetic.</text></g></svg>