<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Four schematic fundus views. Panel 1, normal: pink-orange retina, sharp optic disc, normal arteries and veins. Panel 2: pale, whitened retina with a cherry-red spot at the fovea and thin arteries. Panel 3: dilated, tortuous veins with hemorrhages in all four quadrants, cotton-wool spots and a swollen disc. Panel 4: a swollen optic disc with blurred margins and vessels hidden at the disc edge, with normal surrounding retina.">
