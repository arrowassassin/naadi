<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Schematic of the arterial circle at the base of the brain and the vertebrobasilar system. Six numbered sites are marked on the left-sided vessels: 1 on the middle cerebral artery stem, 2 on the anterior cerebral artery beyond the anterior communicating artery, 3 on the posterior cerebral artery, 4 on a lenticulostriate branch, 5 on the basilar artery and 6 on the vertebral artery at the origin of the posterior inferior cerebellar artery.">
