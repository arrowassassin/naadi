<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Decision tree with three yes or no questions and five unnamed end points lettered A to E.">
<defs><marker id="s23e-fig1103-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380.0" y="26" font-size="16" font-weight="bold" text-anchor="middle">Sorting bodily symptoms: end points A to E</text>
<rect x="180.0" y="44" width="400" height="34" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="380" y="66" font-size="13" text-anchor="middle">Are the symptoms produced or feigned on purpose?</text>
<rect x="35.0" y="140" width="330" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="200" y="162" font-size="13" text-anchor="middle">Is the main problem fear of having a disease,</text>
<text x="200" y="180" font-size="13" text-anchor="middle">with mild or no bodily symptoms?</text>
<rect x="465.0" y="140" width="250" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="590" y="162" font-size="13" text-anchor="middle">Is there an obvious</text>
<text x="590" y="180" font-size="13" text-anchor="middle">external reward?</text>
<rect x="170.0" y="262" width="270" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="305" y="284" font-size="13" text-anchor="middle">Is it a neurological symptom that</text>
<text x="305" y="302" font-size="13" text-anchor="middle">does not fit a known disease?</text>
<path d="M300,78 L220,138" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="238" y="108" font-size="12" font-style="italic" fill="#334155">no</text>
<path d="M460,78 L570,138" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="522" y="108" font-size="12" font-style="italic" fill="#334155">yes</text>
<path d="M120,192 L90,258" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="70" y="230" font-size="12" font-style="italic" fill="#334155">yes</text>
<path d="M260,192 L300,258" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="290" y="226" font-size="12" font-style="italic" fill="#334155">no</text>
<path d="M550,192 L550,258" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="526" y="230" font-size="12" font-style="italic" fill="#334155">yes</text>
<path d="M640,192 L690,258" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="676" y="226" font-size="12" font-style="italic" fill="#334155">no</text>
<path d="M255,314 L215,378" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="208" y="350" font-size="12" font-style="italic" fill="#334155">yes</text>
<path d="M355,314 L420,378" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#s23e-fig1103-arr)"/><text x="400" y="350" font-size="12" font-style="italic" fill="#334155">no</text>
