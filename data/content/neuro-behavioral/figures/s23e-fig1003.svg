<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-label="Mood over time for bipolar I (a manic episode), bipolar II (hypomania and major depression), cyclothymia (milder swings for at least 2 years) and major depressive disorder (depressive episodes only). Dotted lines mark the hypomania, mania and major depression levels."><rect x="0" y="0" width="760" height="590" fill="#ffffff"/><g font-family="sans-serif" fill="#0f172a"><text x="380.0" y="30" font-size="16" font-weight="bold" text-anchor="middle">How the course of mood separates four diagnoses</text><text x="20" y="114.0" font-size="14" font-weight="bold">Bipolar I</text><text x="20" y="132.0" font-size="11" fill="#334155">a manic episode (with or without depressions)</text><line x1="300" y1="76.0" x2="730" y2="76.0" stroke="#94a3b8" stroke-dasharray="3 4"/><text x="294" y="80.0" font-size="10" fill="#334155" text-anchor="end">mania</text><line x1="300" y1="98.0" x2="730" y2="98.0" stroke="#94a3b8" stroke-dasharray="3 4"/><text x="294" y="102.0" font-size="10" fill="#334155" text-anchor="end">hypomania</text><line x1="300" y1="153.0" x2="730" y2="153.0" stroke="#94a3b8" stroke-dasharray="3 4"/><text x="294" y="157.0" font-size="10" fill="#334155" text-anchor="end">major depression</text><line x1="300" y1="120.0" x2="730" y2="120.0" stroke="#cbd5e1"/><path d="M300.0,120.0 L341.0,120.0 L361.4,71.6 L412.6,69.4 L433.1,120.0 L504.8,120.0 L525.2,155.2 L576.4,157.4 L596.9,120.0 L730.0,120.0" fill="none" stroke="#0f172a" stroke-width="2.4"/><line x1="20" y1="180.0" x2="730" y2="180.0" stroke="#e2e8f0"/><text x="20" y="234.0" font-size="14" font-weight="bold">Bipolar II</text><text x="20" y="252.0" font-size="11" fill="#334155">hypomania plus major depression, never mania</text><line x1="300" y1="196.0" x2="730" y2="196.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="218.0" x2="730" y2="218.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="273.0" x2="730" y2="273.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="240.0" x2="730" y2="240.0" stroke="#cbd5e1"/><path d="M300.0,240.0 L341.0,240.0 L356.3,213.6 L381.9,213.6 L397.3,240.0 L453.6,240.0 L474.0,277.4 L545.7,277.4 L566.2,240.0 L637.9,240.0 L653.2,215.8 L673.7,215.8 L689.0,240.0 L730.0,240.0" fill="none" stroke="#0f172a" stroke-width="2.4"/><line x1="20" y1="300.0" x2="730" y2="300.0" stroke="#e2e8f0"/><text x="20" y="354.0" font-size="14" font-weight="bold">Cyclothymia</text><text x="20" y="372.0" font-size="11" fill="#334155">2+ years of milder ups and downs, below episode level</text><line x1="300" y1="316.0" x2="730" y2="316.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="338.0" x2="730" y2="338.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="393.0" x2="730" y2="393.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="360.0" x2="730" y2="360.0" stroke="#cbd5e1"/><path d="M300.0,360.0 L325.6,344.6 L356.3,344.6 L376.8,373.2 L412.6,375.4 L438.2,346.8 L474.0,344.6 L499.6,373.2 L535.5,373.2 L561.1,344.6 L596.9,346.8 L622.5,375.4 L658.3,373.2 L689.0,346.8 L730.0,349.0" fill="none" stroke="#0f172a" stroke-width="2.4"/><line x1="20" y1="420.0" x2="730" y2="420.0" stroke="#e2e8f0"/><text x="20" y="474.0" font-size="14" font-weight="bold">Major depression</text><text x="20" y="492.0" font-size="11" fill="#334155">depressive episodes only</text><line x1="300" y1="436.0" x2="730" y2="436.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="458.0" x2="730" y2="458.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="513.0" x2="730" y2="513.0" stroke="#94a3b8" stroke-dasharray="3 4"/><line x1="300" y1="480.0" x2="730" y2="480.0" stroke="#cbd5e1"/><path d="M300.0,480.0 L361.4,480.0 L381.9,517.4 L453.6,519.6 L474.0,480.0 L607.1,480.0 L627.6,515.2 L689.0,515.2 L709.5,480.0 L730.0,480.0" fill="none" stroke="#0f172a" stroke-width="2.4"/><text x="300" y="556" font-size="11" fill="#334155">time (years) →</text><text x="20" y="576" font-size="11" fill="#334155">Above each midline: elevated mood. Below: depressed mood. Dotted lines: episode thresholds. Schematic, not to scale.</text></g></svg>