<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Hypnogram of a normal night in a young adult. Sleep cycles last about 90 minutes. Deep sleep, stage N3, is concentrated in the first third of the night; REM periods get longer toward morning. Labelled points: A in N3 early in the night, B in a long REM period near morning, C in N1 at sleep onset, D in a brief awakening mid-night, E in N2 in the second half of the night.">
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380" y="26" font-size="16" font-weight="bold" text-anchor="middle">A normal night of sleep (young adult)</text>
<line x1="80" y1="70" x2="80" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="275" font-size="12" text-anchor="middle">0</text><line x1="160" y1="70" x2="160" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="160" y="275" font-size="12" text-anchor="middle">1</text><line x1="240" y1="70" x2="240" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="240" y="275" font-size="12" text-anchor="middle">2</text><line x1="320" y1="70" x2="320" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="320" y="275" font-size="12" text-anchor="middle">3</text><line x1="400" y1="70" x2="400" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="400" y="275" font-size="12" text-anchor="middle">4</text><line x1="480" y1="70" x2="480" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="480" y="275" font-size="12" text-anchor="middle">5</text><line x1="560" y1="70" x2="560" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="560" y="275" font-size="12" text-anchor="middle">6</text><line x1="640" y1="70" x2="640" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="640" y="275" font-size="12" text-anchor="middle">7</text><line x1="720" y1="70" x2="720" y2="255" stroke="#e2e8f0" stroke-width="1"/><text x="720" y="275" font-size="12" text-anchor="middle">8</text><text x="70" y="84" font-size="13" text-anchor="end">Wake</text><text x="70" y="124" font-size="13" text-anchor="end">REM</text><text x="70" y="164" font-size="13" text-anchor="end">N1</text><text x="70" y="204" font-size="13" text-anchor="end">N2</text><text x="70" y="244" font-size="13" text-anchor="end">N3</text><rect x="192" y="113" width="12" height="14" fill="#cbd5e1"/><rect x="292" y="113" width="24" height="14" fill="#cbd5e1"/><rect x="400" y="113" width="32" height="14" fill="#cbd5e1"/><rect x="504" y="113" width="40" height="14" fill="#cbd5e1"/><rect x="608" y="113" width="60" height="14" fill="#cbd5e1"/><rect x="692" y="113" width="16" height="14" fill="#cbd5e1"/>
<path d="M80,80 L88,80 L88,160 L96,160 L96,200 L120,200 L120,240 L176,240 L176,200 L192,200 L192,120 L204,120 L204,200 L220,200 L220,240 L264,240 L264,200 L292,200 L292,120 L316,120 L316,200 L352,200 L352,240 L372,240 L372,200 L400,200 L400,120 L432,120 L432,80 L440,80 L440,200 L504,200 L504,120 L544,120 L544,200 L608,200 L608,120 L668,120 L668,200 L692,200 L692,120 L708,120 L708,80 L720,80 L720,80" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="640" y1="101" x2="640" y2="117" stroke="#0f172a" stroke-width="1.5"/><circle cx="640" cy="90" r="12" fill="#0f172a"/><text x="640" y="95" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text><circle cx="436" cy="56" r="12" fill="#0f172a"/><text x="436" y="61" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text><line x1="436" y1="68" x2="436" y2="77" stroke="#0f172a" stroke-width="1.5"/><line x1="480" y1="241" x2="480" y2="203" stroke="#0f172a" stroke-width="1.5"/><circle cx="480" cy="230" r="12" fill="#0f172a"/><text x="480" y="235" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text>
<text x="400" y="298" font-size="12" text-anchor="middle">Hours after lights out</text>
<text x="40" y="330" font-size="12">• N3 (slow-wave sleep) dominates the first third of the night and shrinks with age.</text>
<text x="40" y="350" font-size="12">• REM periods (shaded) recur about every 90 minutes and lengthen toward morning.</text>
<text x="40" y="370" font-size="12">• Brief awakenings are normal; most are not remembered.</text>
<line x1="148" y1="216" x2="148" y2="237" stroke="#0f172a" stroke-width="1.5"/><circle cx="148" cy="216" r="12" fill="#0f172a"/><text x="148" y="221" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text><line x1="132" y1="146" x2="95" y2="159" stroke="#0f172a" stroke-width="1.5"/><circle cx="132" cy="146" r="12" fill="#0f172a"/><text x="132" y="151" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text></g></svg>