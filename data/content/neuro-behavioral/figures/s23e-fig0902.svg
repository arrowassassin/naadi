<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Weber and Rinne interpretation. Normal hearing: Weber midline, Rinne air louder than bone. Left conductive loss: Weber heard in the left ear, left Rinne bone louder than air. Left sensorineural loss: Weber heard in the right ear, left Rinne air louder than bone.">
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/><g font-family="sans-serif" fill="#0f172a">
<text x="380" y="26" font-size="16" font-weight="bold" text-anchor="middle">Tuning-fork tests (512 Hz): reading Weber and Rinne together</text>
<rect x="20" y="44" width="720" height="34" fill="#f1f5f9" stroke="#334155"/>
<text x="130" y="66" font-size="13" font-weight="bold" text-anchor="middle">Hearing</text>
<text x="375" y="66" font-size="13" font-weight="bold" text-anchor="middle">Weber (fork on forehead)</text>
<text x="625" y="66" font-size="13" font-weight="bold" text-anchor="middle">Rinne (mastoid vs ear canal)</text>
<rect x="20" y="78" width="720" height="70" fill="#ffffff" stroke="#334155"/>
<text x="130" y="118" font-size="13" text-anchor="middle">Normal</text>
<circle cx="300" cy="113" r="20" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="270" y="117" font-size="10" text-anchor="middle">R</text><text x="330" y="117" font-size="10" text-anchor="middle">L</text>
<circle cx="300" cy="113" r="5" fill="#0f172a"/>
<text x="350" y="118" font-size="12">Midline</text>
<text x="625" y="118" font-size="12" text-anchor="middle">AC > BC both ears</text>
<rect x="20" y="148" width="720" height="70" fill="#ffffff" stroke="#334155"/>
<text x="130" y="188" font-size="13" text-anchor="middle">Conductive loss, LEFT</text>
<circle cx="300" cy="183" r="20" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="270" y="187" font-size="10" text-anchor="middle">R</text><text x="330" y="187" font-size="10" text-anchor="middle">L</text>
<circle cx="320" cy="183" r="6" fill="#0f172a"/>
<text x="350" y="188" font-size="12">Lateralizes to LEFT (affected)</text>
<text x="625" y="188" font-size="12" text-anchor="middle">Left: BC > AC (negative)</text>
<rect x="20" y="218" width="720" height="70" fill="#ffffff" stroke="#334155"/>
<text x="130" y="258" font-size="13" text-anchor="middle">Sensorineural loss, LEFT</text>
<circle cx="300" cy="253" r="20" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="270" y="257" font-size="10" text-anchor="middle">R</text><text x="330" y="257" font-size="10" text-anchor="middle">L</text>
<circle cx="280" cy="253" r="6" fill="#0f172a"/>
<text x="350" y="258" font-size="12">Lateralizes to RIGHT (better ear)</text>
<text x="625" y="258" font-size="12" text-anchor="middle">Left: AC > BC (positive)</text>
<text x="20" y="312" font-size="11.5" fill="#334155">Dot = where the sound is heard. Conductive loss: sound goes to the bad ear. Sensorineural loss: sound goes to the good ear.</text>
</g></svg>