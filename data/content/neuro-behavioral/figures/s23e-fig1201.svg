<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Age rules in childhood diagnoses on a timeline from birth to age 20. Encopresis is diagnosed from a developmental age of 4 and enuresis from 5. ADHD needs several symptoms before age 12. Disruptive mood dysregulation disorder needs onset before 10 and is first diagnosed only between ages 6 and 18. Conduct disorder is childhood-onset type if a symptom appears before 10. Antisocial personality disorder is diagnosed only from age 18 and needs conduct disorder that began before 15.">
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380.0" y="28" font-size="16" font-weight="bold" text-anchor="middle">Age rules written into childhood diagnoses</text>
<line x1="210.0" y1="50" x2="210.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="210.0" y="420" font-size="12" text-anchor="middle">0</text>
<line x1="262.0" y1="50" x2="262.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="262.0" y="420" font-size="12" text-anchor="middle">2</text>
<line x1="314.0" y1="50" x2="314.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="314.0" y="420" font-size="12" text-anchor="middle">4</text>
<line x1="366.0" y1="50" x2="366.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="366.0" y="420" font-size="12" text-anchor="middle">6</text>
<line x1="418.0" y1="50" x2="418.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="418.0" y="420" font-size="12" text-anchor="middle">8</text>
<line x1="470.0" y1="50" x2="470.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="470.0" y="420" font-size="12" text-anchor="middle">10</text>
<line x1="522.0" y1="50" x2="522.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="522.0" y="420" font-size="12" text-anchor="middle">12</text>
<line x1="574.0" y1="50" x2="574.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="574.0" y="420" font-size="12" text-anchor="middle">14</text>
<line x1="626.0" y1="50" x2="626.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="626.0" y="420" font-size="12" text-anchor="middle">16</text>
<line x1="678.0" y1="50" x2="678.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="678.0" y="420" font-size="12" text-anchor="middle">18</text>
<line x1="730.0" y1="50" x2="730.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="730.0" y="420" font-size="12" text-anchor="middle">20</text>
<text x="470.0" y="442" font-size="12" text-anchor="middle">Age (years)</text>
<text x="20" y="83" font-size="13" font-weight="bold">Encopresis</text>
<rect x="314.0" y="71" width="416.0" height="14" rx="3" fill="#334155"/>
<text x="724.0" y="82" font-size="11" text-anchor="end" fill="#ffffff">diagnosable from age 4</text>
<text x="20" y="141" font-size="13" font-weight="bold">Enuresis</text>
<rect x="340.0" y="129" width="390.0" height="14" rx="3" fill="#334155"/>
<text x="724.0" y="140" font-size="11" text-anchor="end" fill="#ffffff">diagnosable from age 5</text>
<text x="20" y="199" font-size="13" font-weight="bold">ADHD</text>
<rect x="210.0" y="187" width="312.0" height="14" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="216.0" y="198" font-size="11" text-anchor="start" fill="#0f172a">several symptoms before 12</text>
<text x="20" y="257" font-size="13" font-weight="bold">DMDD</text>
<rect x="210.0" y="234" width="260.0" height="14" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="216.0" y="245" font-size="11" text-anchor="start" fill="#0f172a">onset before 10</text>
<rect x="366.0" y="256" width="312.0" height="14" rx="3" fill="#334155"/>
<text x="672.0" y="267" font-size="11" text-anchor="end" fill="#ffffff">first diagnosis 6 to 18</text>
<text x="20" y="315" font-size="13" font-weight="bold">Conduct disorder</text>
<rect x="210.0" y="303" width="260.0" height="14" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="216.0" y="314" font-size="11" text-anchor="start" fill="#0f172a">childhood-onset type if before 10</text>
<text x="20" y="373" font-size="13" font-weight="bold">Antisocial PD</text>
<rect x="210.0" y="350" width="390.0" height="14" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="216.0" y="361" font-size="11" text-anchor="start" fill="#0f172a">conduct disorder before 15</text>
<rect x="678.0" y="372" width="52.0" height="14" rx="3" fill="#334155"/>
<text x="672.0" y="383" font-size="11" text-anchor="end" fill="#0f172a">from 18</text>
<rect x="20" y="452" width="26" height="12" rx="3" fill="#334155"/><text x="52" y="462" font-size="11">age range in which the diagnosis can be made</text>
<rect x="380" y="452" width="26" height="12" rx="3" fill="#ffffff" stroke="#334155" stroke-dasharray="6 4"/><text x="412" y="462" font-size="11">when symptoms must have begun</text>
</g></svg>