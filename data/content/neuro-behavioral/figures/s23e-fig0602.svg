<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Timeline of treatment for convulsive status epilepticus. 0 to 5 minutes: stabilise airway, breathing and circulation, check glucose. 5 to 20 minutes: a benzodiazepine, IV lorazepam or IM midazolam, repeated once if needed. 20 to 40 minutes: a second-line IV drug, levetiracetam, fosphenytoin or valproate. After 40 minutes: refractory status, intubation, anaesthetic infusion and continuous EEG.">
<defs><marker id="s23e-fig0602-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380" y="30" font-size="16" font-weight="bold" text-anchor="middle">Convulsive status epilepticus: treat by the clock</text>
<rect x="14" y="90" width="172" height="170" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="100" y="80" font-size="13" font-weight="bold" text-anchor="middle">0–5 min</text><text x="100" y="120" font-size="14" font-weight="bold" text-anchor="middle">Stabilise</text><text x="26" y="152" font-size="12">Airway, breathing,</text><text x="26" y="174" font-size="12">circulation; check glucose</text><text x="26" y="196" font-size="12">(thiamine first if at risk);</text><text x="26" y="218" font-size="12">IV access, monitoring</text><path d="M187,175 L199,175" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig0602-arr)"/><rect x="200" y="90" width="172" height="170" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="286" y="80" font-size="13" font-weight="bold" text-anchor="middle">5–20 min</text><text x="286" y="120" font-size="14" font-weight="bold" text-anchor="middle">Benzodiazepine</text><text x="212" y="152" font-size="12">IV lorazepam, or IM</text><text x="212" y="174" font-size="12">midazolam if there is</text><text x="212" y="196" font-size="12">no IV access;</text><text x="212" y="218" font-size="12">may repeat once</text><path d="M373,175 L385,175" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig0602-arr)"/><rect x="386" y="90" width="172" height="170" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="472" y="80" font-size="13" font-weight="bold" text-anchor="middle">20–40 min</text><text x="472" y="120" font-size="14" font-weight="bold" text-anchor="middle">Second-line drug</text><text x="398" y="152" font-size="12">IV levetiracetam,</text><text x="398" y="174" font-size="12">fosphenytoin or</text><text x="398" y="196" font-size="12">valproate (similar</text><text x="398" y="218" font-size="12">efficacy): give one</text><path d="M559,175 L571,175" stroke="#334155" stroke-width="2" marker-end="url(#s23e-fig0602-arr)"/><rect x="572" y="90" width="172" height="170" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="658" y="80" font-size="13" font-weight="bold" text-anchor="middle">40+ min</text><text x="658" y="120" font-size="14" font-weight="bold" text-anchor="middle">Refractory</text><text x="584" y="152" font-size="12">Intubate; infusion of</text><text x="584" y="174" font-size="12">midazolam, propofol</text><text x="584" y="196" font-size="12">or pentobarbital;</text><text x="584" y="218" font-size="12">continuous EEG</text>
<text x="380" y="292" font-size="12" text-anchor="middle">Status epilepticus = a seizure lasting 5 minutes or more, or repeated seizures without recovery in between.</text>
<text x="380" y="312" font-size="12" text-anchor="middle">If the patient does not wake after the movements stop, suspect nonconvulsive status and get an EEG.</text>
</g></svg>