<text x="44" y="258.0" font-size="11" text-anchor="end">80</text>
<line x1="50" x2="260" y1="300.0" y2="300.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="304.0" font-size="11" text-anchor="end">100</text>
<rect x="50" y="70" width="210" height="57.5" fill="#e2e8f0" opacity="0.6"/>
<text x="65.0" y="316" font-size="10" text-anchor="middle">250</text>
<text x="101.0" y="316" font-size="10" text-anchor="middle">500</text>
<text x="137.0" y="316" font-size="10" text-anchor="middle">1k</text>
