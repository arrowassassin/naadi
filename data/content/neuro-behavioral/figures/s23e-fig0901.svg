<path d="M459.0,213.5 L450.0,219.5 L459.0,225.5" fill="none" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="336" font-size="11.5" text-anchor="middle">Air and bone fall together,</text>
<text x="400.0" y="351" font-size="11.5" text-anchor="middle">no gap; high tones worst</text>
<text x="645.0" y="42" font-size="14" font-weight="bold" text-anchor="middle">Noise-induced</text>
