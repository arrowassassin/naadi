<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Three schematic right-ear audiograms. Conductive loss: bone conduction normal, air conduction about 40 dB with an air-bone gap. Sensorineural loss: air and bone conduction both fall together at high frequencies, no gap. Noise-induced loss: both dip at 4000 Hz with recovery at 8000 Hz.">
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="380" y="22" font-size="16" font-weight="bold" text-anchor="middle">Three audiogram patterns (right ear)</text>
<text x="14" y="190" font-size="11" transform="rotate(-90 14 190)" text-anchor="middle">Hearing level (dB HL), worse downward</text>
<text x="155.0" y="42" font-size="14" font-weight="bold" text-anchor="middle">Conductive</text>
<rect x="50" y="70" width="210" height="230" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<line x1="50" x2="260" y1="70.0" y2="70.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="74.0" font-size="11" text-anchor="end">0</text>
<line x1="50" x2="260" y1="116.0" y2="116.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="120.0" font-size="11" text-anchor="end">20</text>
<line x1="50" x2="260" y1="162.0" y2="162.0" stroke="#cbd5e1" stroke-width="1"/>
