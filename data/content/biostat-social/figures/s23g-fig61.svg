<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" width="720" height="630" role="img" aria-label="Flow chart for assessing decision-making capacity: name the specific decision, look for and treat reversible causes, test four abilities at a level matched to the stakes, then either the patient decides or a surrogate decides, with reassessment when the condition changes.">
  <title>Assessing decision-making capacity, step by step</title>
  <defs>
    <marker id="s23g-fig61-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="630" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <!-- Step 1 -->
    <rect x="160" y="16" width="400" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="360" y="40" font-size="15" font-weight="bold" text-anchor="middle">1. Name the decision</text>
    <text x="360" y="60" font-size="13" text-anchor="middle">Capacity is judged for this choice, at this time</text>
    <line x1="360" y1="72" x2="360" y2="96" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig61-arrow)"/>
    <!-- Step 2 -->
    <rect x="110" y="98" width="500" height="74" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="360" y="122" font-size="15" font-weight="bold" text-anchor="middle">2. Look for reversible causes (dashed = fix first)</text>
    <text x="360" y="142" font-size="13" text-anchor="middle">Delirium, hypoxia, hypoglycemia, intoxication, pain, sedating drugs,</text>
    <text x="360" y="160" font-size="13" text-anchor="middle">hearing loss or no interpreter: treat, then reassess if time allows</text>
    <line x1="360" y1="172" x2="360" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig61-arrow)"/>
    <!-- Step 3 -->
    <text x="360" y="214" font-size="15" font-weight="bold" text-anchor="middle">3. Test the four abilities</text>
    <rect x="20" y="226" width="160" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="100" y="250" font-size="14" font-weight="bold" text-anchor="middle">Choice</text>
    <text x="100" y="270" font-size="12" text-anchor="middle">States a clear,</text>
    <text x="100" y="286" font-size="12" text-anchor="middle">stable preference</text>
    <rect x="195" y="226" width="160" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="275" y="250" font-size="14" font-weight="bold" text-anchor="middle">Understand</text>
    <text x="275" y="270" font-size="12" text-anchor="middle">Explains the facts</text>
    <text x="275" y="286" font-size="12" text-anchor="middle">in own words</text>
    <rect x="370" y="226" width="160" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="250" font-size="14" font-weight="bold" text-anchor="middle">Appreciate</text>
    <text x="450" y="270" font-size="12" text-anchor="middle">Accepts the facts</text>
    <text x="450" y="286" font-size="12" text-anchor="middle">apply to self</text>
    <rect x="545" y="226" width="160" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="625" y="250" font-size="14" font-weight="bold" text-anchor="middle">Reason</text>
    <text x="625" y="270" font-size="12" text-anchor="middle">Weighs options</text>
    <text x="625" y="286" font-size="12" text-anchor="middle">against own values</text>
    <line x1="360" y1="296" x2="360" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig61-arrow)"/>
    <!-- Decision -->
    <polygon points="360,322 560,372 360,422 160,372" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="360" y="366" font-size="13" font-weight="bold" text-anchor="middle">All four present, at the level</text>
    <text x="360" y="384" font-size="13" font-weight="bold" text-anchor="middle">the stakes demand?</text>
    <!-- Yes -->
    <line x1="160" y1="372" x2="110" y2="372" stroke="#334155" stroke-width="2"/>
    <line x1="110" y1="372" x2="110" y2="448" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig61-arrow)"/>
    <text x="126" y="362" font-size="13" font-weight="bold" text-anchor="middle">YES</text>
    <rect x="20" y="450" width="300" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="170" y="474" font-size="14" font-weight="bold" text-anchor="middle">Patient decides</text>
    <text x="170" y="494" font-size="12" text-anchor="middle">Consent or informed refusal, even if unwise;</text>
    <text x="170" y="512" font-size="12" text-anchor="middle">document the discussion and keep the door open</text>
    <!-- No -->
    <line x1="560" y1="372" x2="610" y2="372" stroke="#334155" stroke-width="2"/>
    <line x1="610" y1="372" x2="610" y2="448" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#s23g-fig61-arrow)"/>
    <text x="594" y="362" font-size="13" font-weight="bold" text-anchor="middle">NO</text>
    <rect x="400" y="450" width="300" height="80" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="3" stroke-dasharray="7 4"/>
    <text x="550" y="474" font-size="14" font-weight="bold" text-anchor="middle">Someone else decides</text>
    <text x="550" y="494" font-size="12" text-anchor="middle">Advance directive, then agent or surrogate;</text>
    <text x="550" y="512" font-size="12" text-anchor="middle">true emergency with no one: treat now</text>
    <!-- Reassess -->
    <text x="360" y="566" font-size="13" text-anchor="middle">Capacity can return or be lost: reassess whenever the condition or the decision changes.</text>
    <text x="360" y="588" font-size="12" text-anchor="middle">Any treating physician may assess; ask psychiatry when the picture is unclear.</text>
    <text x="360" y="608" font-size="12" text-anchor="middle">Competence (incompetence) is a court's ruling, not a bedside finding.</text>
  </g>
</svg>
