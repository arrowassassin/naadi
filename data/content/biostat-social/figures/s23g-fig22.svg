<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" width="740" height="520" role="img" aria-label="Flow diagram of a parallel randomized trial with crossover and loss to follow-up" font-family="sans-serif"><title>Flow diagram of a parallel randomized trial with crossover and loss to follow-up</title><rect x="0" y="0" width="740" height="520" fill="#ffffff"/><defs><marker id="s23g-fig22-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="250" y="12" width="240" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="370.0" y="36.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Assessed and eligible (n = 1,000)</text><line x1="370" y1="52" x2="370" y2="80" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><rect x="250" y="80" width="240" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="370.0" y="104.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Randomized (n = 1,000)</text><line x1="330" y1="120" x2="185" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><line x1="410" y1="120" x2="555" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><rect x="20" y="150" width="330" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="185.0" y="172.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Allocated to drug (n = 500)</text><text x="185.0" y="187.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">received drug 440 · never started 60</text><rect x="390" y="150" width="330" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/><text x="555.0" y="172.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Allocated to placebo (n = 500)</text><text x="555.0" y="187.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">stayed on placebo 470 · crossed to drug 30</text><line x1="185" y1="202" x2="185" y2="232" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><line x1="555" y1="202" x2="555" y2="232" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><rect x="20" y="232" width="330" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="185.0" y="256.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Lost to follow-up 25 (of the 440)</text><rect x="390" y="232" width="330" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="555.0" y="256.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Lost to follow-up 20 (of the 470)</text><line x1="185" y1="272" x2="185" y2="302" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><line x1="555" y1="272" x2="555" y2="302" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig22-arr)"/><rect x="20" y="302" width="330" height="58" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="185.0" y="320.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Intention-to-treat: all 500 analysed</text><text x="185.0" y="335.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">as drug (missing outcomes</text><text x="185.0" y="350.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">handled by a stated method)</text><rect x="390" y="302" width="330" height="58" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="555.0" y="320.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Intention-to-treat: all 500 analysed</text><text x="555.0" y="335.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">as placebo (missing outcomes</text><text x="555.0" y="350.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">handled by a stated method)</text><rect x="20" y="372" width="330" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="185.0" y="396.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Per-protocol: 415 took drug and finished</text><rect x="390" y="372" width="330" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="555.0" y="396.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Per-protocol: 450 stayed on placebo and finished</text><rect x="20" y="424" width="700" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="370.0" y="448.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">As-treated: regrouped by what people actually took (the 30 crossovers count as drug)</text><text x="20" y="488" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">Only intention-to-treat keeps the groups exactly as randomization made them.</text><text x="20" y="508" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a" font-style="italic">Solid blue border = drug arm; dashed amber border = placebo arm. Numbers are illustrative.</text></svg>