<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="The natural history of disease as a timeline of six stages, from a susceptible population through risk factors, biologic onset, a detectable preclinical phase and clinical disease to outcomes, with the five levels of prevention drawn as bars over the stages where each acts." font-family="sans-serif"><title>Levels of prevention on the natural history of disease</title><rect x="0" y="0" width="760" height="430" fill="#ffffff"/><defs><marker id="s23g-fig15-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="30.0" y="300.0" width="116.0" height="56.0" fill="#f8fafc" stroke="#334155" stroke-width="1.2" /><text x="88.0" y="323.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Healthy</text><text x="88.0" y="342.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >population</text><rect x="149.0" y="300.0" width="116.0" height="56.0" fill="#f8fafc" stroke="#334155" stroke-width="1.2" /><text x="207.0" y="323.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Risk factors</text><text x="207.0" y="342.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >or exposure</text><rect x="268.0" y="300.0" width="116.0" height="56.0" fill="#f8fafc" stroke="#334155" stroke-width="1.2" /><text x="326.0" y="323.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Biologic</text><text x="326.0" y="342.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >onset</text><rect x="387.0" y="300.0" width="116.0" height="56.0" fill="#f8fafc" stroke="#334155" stroke-width="1.2" /><text x="445.0" y="323.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Detectable</text><text x="445.0" y="342.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >preclinical</text><rect x="506.0" y="300.0" width="116.0" height="56.0" fill="#f8fafc" stroke="#334155" stroke-width="1.2" /><text x="564.0" y="323.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Clinical</text><text x="564.0" y="342.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >disease</text><rect x="625.0" y="300.0" width="116.0" height="56.0" fill="#f8fafc" stroke="#334155" stroke-width="1.2" /><text x="683.0" y="318.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Outcome</text><text x="683.0" y="335.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >recovery, disability</text><text x="683.0" y="350.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >or death</text><line x1="30" y1="380" x2="735" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig15-arrow)"/><text x="382.0" y="404.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a" >Time</text><line x1="266.5" y1="60.0" x2="266.5" y2="300.0" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/><text x="266.5" y="52.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >disease begins</text><line x1="504.5" y1="60.0" x2="504.5" y2="300.0" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/><text x="504.5" y="52.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a" >symptoms appear</text><rect x="30.0" y="78" width="116.0" height="30" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="1.2"/><text x="88.0" y="98.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Primordial</text><rect x="30.0" y="120" width="235.0" height="30" rx="4" fill="#bfdbfe" stroke="#334155" stroke-width="1.2"/><text x="147.5" y="140.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Primary</text><rect x="268.0" y="162" width="235.0" height="30" rx="4" fill="#fde68a" stroke="#334155" stroke-width="1.2"/><text x="385.5" y="182.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Secondary (screening)</text><rect x="506.0" y="204" width="235.0" height="30" rx="4" fill="#fcd34d" stroke="#334155" stroke-width="1.2"/><text x="623.5" y="224.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Tertiary</text><rect x="30.0" y="246" width="711.0" height="30" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4"/><text x="385.5" y="266.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a" >Quaternary: protect people at any stage from unnecessary or harmful care</text></svg>
