<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="Timelines showing lead-time bias and length-time bias in screening" font-family="sans-serif">
<title>Timelines showing lead-time bias and length-time bias in screening</title>
<rect x="0" y="0" width="720" height="450" fill="#ffffff"/>
<defs><marker id="s23g-fig42-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="28" font-size="15" text-anchor="start" font-weight="bold" fill="#0f172a">A. Lead-time bias: same patient, same date of death</text>
<text x="20" y="80" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Screened</text>
<line x1="180" y1="75" x2="700" y2="75" stroke="#334155" stroke-width="2"/>
<circle cx="220" cy="75" r="7" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<rect x="353" y="68" width="14" height="14" fill="#2563eb"/>
<path d="M680,67 L696,83 M696,67 L680,83" stroke="#0f172a" stroke-width="2.5"/>
<text x="360" y="61" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">screen detects</text>
<line x1="360" y1="91" x2="688" y2="91" stroke="#2563eb" stroke-width="5"/>
<text x="20" y="150" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Not screened</text>
<line x1="180" y1="145" x2="700" y2="145" stroke="#334155" stroke-width="2"/>
<circle cx="220" cy="145" r="7" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<rect x="533" y="138" width="14" height="14" fill="#b45309"/>
<path d="M680,137 L696,153 M696,137 L680,153" stroke="#0f172a" stroke-width="2.5"/>
<text x="540" y="131" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">symptoms, diagnosis</text>
<line x1="540" y1="161" x2="688" y2="161" stroke="#b45309" stroke-width="5"/>
<text x="220" y="60" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">onset</text>
<text x="688" y="60" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">death</text>
<text x="524" y="107" font-size="12" text-anchor="middle" font-weight="normal" fill="#2563eb">measured survival (long)</text>
<text x="614" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#b45309">survival (short)</text>
<line x1="360" y1="200" x2="540" y2="200" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M360,192 L360,208 M540,192 L540,208" stroke="#0f172a" stroke-width="2"/>
<text x="450" y="220" font-size="12" text-anchor="middle" font-weight="bold" fill="#0f172a">lead time: survival gained on paper only</text>
<text x="20" y="262" font-size="15" text-anchor="start" font-weight="bold" fill="#0f172a">B. Length-time bias: periodic screens catch slow tumours more often</text>
<line x1="260" y1="280" x2="260" y2="420" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="260" y="436" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">screen</text>
<line x1="420" y1="280" x2="420" y2="420" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="420" y="436" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">screen</text>
<line x1="580" y1="280" x2="580" y2="420" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="580" y="436" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">screen</text>
<line x1="190" y1="300" x2="520" y2="300" stroke="#2563eb" stroke-width="10"/>
<text x="530" y="305" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">slow (crosses a screen)</text>
<line x1="300" y1="330" x2="350" y2="330" stroke="#b45309" stroke-width="10" stroke-dasharray="6 3"/>
<text x="360" y="335" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">fast (between screens)</text>
<line x1="200" y1="360" x2="540" y2="360" stroke="#2563eb" stroke-width="10"/>
<text x="550" y="365" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">slow (crosses a screen)</text>
<line x1="440" y1="390" x2="480" y2="390" stroke="#b45309" stroke-width="10" stroke-dasharray="6 3"/>
<text x="490" y="395" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">fast (between screens)</text>
<text x="20" y="300" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Bars = time a</text>
<text x="20" y="315" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">tumour is</text>
<text x="20" y="330" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">detectable but</text>
<text x="20" y="345" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">silent</text>

</svg>
