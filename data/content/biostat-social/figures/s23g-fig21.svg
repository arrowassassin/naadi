<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="740" height="500" role="img" aria-label="Decision tree for naming a study design" font-family="sans-serif"><title>Decision tree for naming a study design</title><rect x="0" y="0" width="740" height="500" fill="#ffffff"/><defs><marker id="s23g-fig21-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="250" y="14" width="240" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="370.0" y="32.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Did the investigator assign</text><text x="370.0" y="48.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">the exposure?</text><line x1="330" y1="58" x2="150" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><text x="200" y="76" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">Yes</text><line x1="410" y1="58" x2="560" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><text x="492" y="76" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">No</text><rect x="40" y="100" width="220" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="126.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Experimental study</text><rect x="470" y="100" width="230" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/><text x="585.0" y="126.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Observational study</text><line x1="150" y1="144" x2="150" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><rect x="40" y="180" width="220" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="150.0" y="206.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Assigned at random?</text><line x1="110" y1="224" x2="80" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><text x="56" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">Yes</text><line x1="190" y1="224" x2="220" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><text x="210" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">No</text><rect x="14" y="270" width="140" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="84.0" y="288.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Randomized</text><text x="84.0" y="304.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">controlled trial</text><rect x="166" y="270" width="120" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="226.0" y="288.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Non-randomized</text><text x="226.0" y="304.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">trial</text><line x1="585" y1="144" x2="585" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><rect x="460" y="180" width="250" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="585.0" y="206.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">Is there a comparison group?</text><line x1="530" y1="224" x2="400" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><text x="440" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">No</text><line x1="640" y1="224" x2="640" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><text x="648" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">Yes</text><rect x="300" y="270" width="200" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="400.0" y="288.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Descriptive: case report,</text><text x="400.0" y="303.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">case series</text><rect x="530" y="270" width="200" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="630.0" y="288.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Analytical observational:</text><text x="630.0" y="303.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">how were people selected?</text><line x1="570" y1="314" x2="410" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><line x1="630" y1="314" x2="630" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><line x1="690" y1="314" x2="700" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#s23g-fig21-arr)"/><rect x="300" y="360" width="170" height="62" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="380.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">By exposure, then</text><text x="385.0" y="395.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">followed to outcome:</text><text x="385.0" y="410.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">COHORT</text><rect x="480" y="360" width="150" height="62" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="555.0" y="380.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">By outcome, then</text><text x="555.0" y="395.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">exposure looked back:</text><text x="555.0" y="410.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">CASE-CONTROL</text><rect x="640" y="360" width="96" height="62" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="688.0" y="372.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">Both at one</text><text x="688.0" y="387.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">time point:</text><text x="688.0" y="402.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">CROSS-</text><text x="688.0" y="417.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">SECTIONAL</text><text x="20" y="440" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Unit of analysis a group (country, county) rather than a person: ECOLOGICAL study.</text><text x="20" y="460" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Cohort timing: prospective = outcomes occur after the study starts; retrospective = past records.</text><text x="20" y="480" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a" font-style="italic">Solid blue border = experimental branch; dashed amber border = observational branch.</text></svg>