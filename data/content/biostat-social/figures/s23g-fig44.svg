<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" width="760" height="405" role="img" aria-label="Forest plot of five fictional placebo-controlled trials and a pooled odds ratio" font-family="sans-serif">
<title>Forest plot of five fictional placebo-controlled trials and a pooled odds ratio</title>
<rect x="0" y="0" width="760" height="405" fill="#ffffff"/>
<text x="20" y="30" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">Study</text>
<text x="590" y="30" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">OR (95% CI)</text>
<text x="390" y="30" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Odds ratio for the outcome (log scale)</text>
<text x="20" y="75" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Trial A</text>
<line x1="242.4" y1="70" x2="412.4" y2="70" stroke="#334155" stroke-width="2.5"/>
<rect x="323.2" y="65.8" width="8.4" height="8.4" fill="#2563eb"/>
<text x="590" y="75" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">0.60 (0.30–1.20)</text>
<text x="20" y="119" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Trial B</text>
<line x1="316.7" y1="114" x2="423.1" y2="114" stroke="#334155" stroke-width="2.5"/>
<rect x="364.0" y="107.9" width="12.1" height="12.1" fill="#2563eb"/>
<text x="590" y="119" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">0.85 (0.55–1.31)</text>
<text x="20" y="163" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Trial C</text>
<line x1="309.8" y1="158" x2="382.4" y2="158" stroke="#334155" stroke-width="2.5"/>
<rect x="336.7" y="148.4" width="19.1" height="19.1" fill="#2563eb"/>
<text x="590" y="163" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">0.70 (0.52–0.94)</text>
<text x="20" y="207" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Trial D</text>
<line x1="305.0" y1="202" x2="498.4" y2="202" stroke="#334155" stroke-width="2.5"/>
<rect x="397.8" y="198.1" width="7.9" height="7.9" fill="#2563eb"/>
<text x="590" y="207" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">1.10 (0.50–2.42)</text>
<text x="20" y="251" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Trial E</text>
<line x1="277.6" y1="246" x2="397.1" y2="246" stroke="#334155" stroke-width="2.5"/>
<rect x="331.7" y="240.6" width="10.9" height="10.9" fill="#2563eb"/>
<text x="590" y="251" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">0.65 (0.40–1.06)</text>
<text x="20" y="305" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">Pooled</text>
<path d="M327.4,300 L351.4,290 L377.1,300 L351.4,310 z" fill="#b45309" stroke="#0f172a" stroke-width="1.5"/>
<text x="590" y="305" font-size="12" text-anchor="start" font-weight="bold" fill="#0f172a">0.73 (0.60–0.90)</text>
<line x1="390.0" y1="48" x2="390.0" y2="330" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="220" y1="330" x2="560" y2="330" stroke="#334155" stroke-width="1.5"/>
<line x1="220.0" y1="330" x2="220.0" y2="336" stroke="#334155"/>
<text x="220.0" y="351" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">0.25</text>
<line x1="305.0" y1="330" x2="305.0" y2="336" stroke="#334155"/>
<text x="305.0" y="351" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">0.5</text>
<line x1="390.0" y1="330" x2="390.0" y2="336" stroke="#334155"/>
<text x="390.0" y="351" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">1</text>
<line x1="475.0" y1="330" x2="475.0" y2="336" stroke="#334155"/>
<text x="475.0" y="351" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">2</text>
<line x1="560.0" y1="330" x2="560.0" y2="336" stroke="#334155"/>
<text x="560.0" y="351" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">4</text>
<text x="305.0" y="372" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">favours drug</text>
<text x="475.0" y="372" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">favours placebo</text>
<text x="20" y="392" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">Square size reflects each trial's weight; the diamond is the pooled estimate.</text>

</svg>
