<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440" role="img" aria-label="Chart of the test statistic against information fraction with a solid efficacy boundary that starts very high and falls towards the final look, a dashed harm boundary below zero, and a continue zone between them" font-family="sans-serif">
<title>Interim analysis with stopping boundaries for benefit and harm</title>
