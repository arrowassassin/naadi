<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Swiss-cheese model: four layers of defence, three latent and one active, with holes that line up so a hazard passes through all of them and reaches the patient">
<title>Swiss-cheese model of accident causation</title>
<defs><marker id="s23g-fig91-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="360" y="28" font-size="16" text-anchor="middle" font-weight="bold">Layers of defence, each with its own holes</text>
<g stroke="#334155" stroke-width="2">
<rect x="130" y="60" width="70" height="220" rx="8" fill="#fef3c7"/>
<rect x="270" y="60" width="70" height="220" rx="8" fill="#fef3c7"/>
<rect x="410" y="60" width="70" height="220" rx="8" fill="#fef3c7"/>
<rect x="550" y="60" width="70" height="220" rx="8" fill="#dbeafe" stroke-dasharray="6 4"/>
</g>
<g fill="#ffffff" stroke="#334155" stroke-width="1.5">
<ellipse cx="165" cy="100" rx="14" ry="10"/><ellipse cx="165" cy="170" rx="16" ry="12"/><ellipse cx="160" cy="240" rx="12" ry="9"/>
<ellipse cx="305" cy="120" rx="13" ry="9"/><ellipse cx="305" cy="170" rx="16" ry="12"/><ellipse cx="310" cy="250" rx="12" ry="9"/>
<ellipse cx="445" cy="90" rx="12" ry="9"/><ellipse cx="445" cy="170" rx="16" ry="12"/><ellipse cx="440" cy="225" rx="13" ry="9"/>
<ellipse cx="585" cy="130" rx="11" ry="8"/><ellipse cx="585" cy="170" rx="16" ry="12"/><ellipse cx="590" cy="250" rx="12" ry="9"/>
</g>
<line x1="40" y1="170" x2="690" y2="170" stroke="#b45309" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#s23g-fig91-arrow)"/>
<text x="40" y="155" font-size="14" font-weight="bold">Hazard</text>
<text x="690" y="155" font-size="14" font-weight="bold" text-anchor="end">Harm</text>
<g font-size="12" text-anchor="middle">
<text x="165" y="300">Leadership,</text><text x="165" y="315">staffing, culture</text>
<text x="305" y="300">Equipment and</text><text x="305" y="315">software design</text>
<text x="445" y="300">Policies and</text><text x="445" y="315">supervision</text>
<text x="585" y="300">Front-line act</text><text x="585" y="315">(slip, lapse, mistake)</text>
</g>
<text x="270" y="350" font-size="13" text-anchor="middle" font-weight="bold">LATENT conditions (solid layers): built in, often for years</text>
<text x="600" y="350" font-size="13" text-anchor="middle" font-weight="bold">ACTIVE failure (dashed)</text>
<text x="360" y="372" font-size="12" text-anchor="middle">Harm occurs only when holes in every layer line up along the dashed path.</text>
</g>
</svg>
