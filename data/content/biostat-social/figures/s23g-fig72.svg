<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Comparison of palliative care and hospice across the course of a serious illness.">
<title>Palliative care versus hospice</title>
<defs>
<marker id="s23g-fig72-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="360" y="26" font-size="15" font-weight="bold" text-anchor="middle">Course of a serious illness</text>
<line x1="40" y1="60" x2="690" y2="60" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig72-arrow)"/>
<line x1="40" y1="52" x2="40" y2="68" stroke="#334155" stroke-width="2"/>
<text x="40" y="46" font-size="12" text-anchor="start">Diagnosis</text>
<line x1="480" y1="52" x2="480" y2="68" stroke="#334155" stroke-width="2"/>
<text x="480" y="46" font-size="12" text-anchor="middle">Prognosis ≤ 6 months</text>
<text x="680" y="46" font-size="12" text-anchor="end">Death</text>
<text x="40" y="96" font-size="12">Disease-directed treatment</text>
<rect x="40" y="102" width="440" height="20" fill="#ffffff" stroke="#334155" stroke-width="2" stroke-dasharray="2 3"/>
<text x="40" y="146" font-size="12">Palliative care (any stage, alongside treatment)</text>
<rect x="40" y="152" width="640" height="20" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="480" y="196" font-size="12">Hospice (comfort focus)</text>
<rect x="480" y="202" width="200" height="20" fill="#ffffff" stroke="#b45309" stroke-width="3" stroke-dasharray="8 4"/>
<text x="580" y="217" font-size="12" text-anchor="middle" fill="#b45309">hospice</text>
<text x="680" y="242" font-size="12" text-anchor="end">Bereavement support for family continues after death</text>
<g font-size="12">
<rect x="20" y="262" width="680" height="190" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<line x1="20" y1="292" x2="700" y2="292" stroke="#334155" stroke-width="1.5"/>
<line x1="180" y1="262" x2="180" y2="452" stroke="#334155" stroke-width="1"/>
<line x1="440" y1="262" x2="440" y2="452" stroke="#334155" stroke-width="1"/>
<text x="30" y="282" font-weight="bold">Feature</text>
<text x="190" y="282" font-weight="bold">Palliative care (solid bar)</text>
<text x="450" y="282" font-weight="bold">Hospice (dashed bar)</text>
<line x1="20" y1="332" x2="700" y2="332" stroke="#334155" stroke-width="1"/>
<text x="30" y="317">When it starts</text>
<text x="190" y="317">At diagnosis of serious illness</text>
<text x="450" y="310">Prognosis ≤ 6 months if illness</text>
<text x="450" y="326">runs its usual course</text>
<line x1="20" y1="372" x2="700" y2="372" stroke="#334155" stroke-width="1"/>
<text x="30" y="357">Curative treatment</text>
<text x="190" y="357">Continues alongside</text>
<text x="450" y="350">Forgone for the terminal illness</text>
<text x="450" y="366">(children: may continue)</text>
<line x1="20" y1="412" x2="700" y2="412" stroke="#334155" stroke-width="1"/>
<text x="30" y="397">Eligibility</text>
<text x="190" y="397">Need, not prognosis</text>
<text x="450" y="390">Two physicians certify;</text>
<text x="450" y="406">patient elects, may revoke</text>
<text x="30" y="437">Setting</text>
<text x="190" y="437">Hospital, clinic, home</text>
<text x="450" y="437">Mostly home; nursing home, unit</text>
</g>
</g>
</svg>
