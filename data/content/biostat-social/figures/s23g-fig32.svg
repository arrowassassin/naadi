<text x="595.5" y="200.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">With disease</text>
<text x="595.5" y="216.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#0f172a">(dashed curve)</text>
<line x1="390.8" y1="40.0" x2="390.8" y2="300.0" stroke="#0f172a" stroke-width="2.5"/>
<text x="390.8" y="32.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Cut-off: values to the right are called positive</text>
<text x="376.8" y="282.0" font-size="13" text-anchor="end" font-weight="bold" fill="#b45309">FN</text>
<text x="404.8" y="282.0" font-size="13" text-anchor="start" font-weight="bold" fill="#2563eb">FP</text>
<text x="60.0" y="322.0" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">Test value (low → high)</text>
<defs><marker id="s23g-fig32-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/></marker></defs>
<line x1="384.8" y1="70.0" x2="300.8" y2="70.0" stroke="#0f172a" stroke-width="2" marker-end="url(#s23g-fig32-arr)"/>
<text x="294.8" y="62.0" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">Move cut-off left:</text>
<text x="294.8" y="78.0" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">fewer FN, more FP</text>
<text x="294.8" y="94.0" font-size="12" text-anchor="end" font-weight="normal" fill="#0f172a">sensitivity ↑, specificity ↓</text>
<text x="60.0" y="344.0" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">FN (amber, left of the line under the dashed curve) = diseased people called negative.</text>
<text x="60.0" y="362.0" font-size="12" text-anchor="start" font-weight="normal" fill="#0f172a">FP (blue, right of the line under the solid curve) = healthy people called positive.</text>
