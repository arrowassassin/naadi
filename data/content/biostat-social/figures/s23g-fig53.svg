<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440" role="img" aria-label="Monitoring chart with a solid efficacy boundary, a dashed harm boundary and the trial's test statistic plotted at two interim looks" font-family="sans-serif">
<title>Interim monitoring chart for a fictional trial</title>
<defs><marker id="s23g-fig53-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#0f172a"/></marker></defs>
<rect x="0" y="0" width="740" height="440" fill="#ffffff"/>
<line x1="110" y1="50" x2="110" y2="370" stroke="#334155" stroke-width="2"/>
<line x1="110" y1="370" x2="600" y2="370" stroke="#334155" stroke-width="2"/>
<line x1="110" y1="210.0" x2="600" y2="210.0" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
<text x="100" y="356.22222222222223" text-anchor="end" font-size="12" fill="#0f172a">−4</text>
<line x1="105" y1="352.22222222222223" x2="110" y2="352.22222222222223" stroke="#334155"/>
<text x="100" y="285.1111111111111" text-anchor="end" font-size="12" fill="#0f172a">−2</text>
<line x1="105" y1="281.1111111111111" x2="110" y2="281.1111111111111" stroke="#334155"/>
<text x="100" y="214.0" text-anchor="end" font-size="12" fill="#0f172a">0</text>
<line x1="105" y1="210.0" x2="110" y2="210.0" stroke="#334155"/>
<text x="100" y="142.88888888888889" text-anchor="end" font-size="12" fill="#0f172a">2</text>
<line x1="105" y1="138.88888888888889" x2="110" y2="138.88888888888889" stroke="#334155"/>
<text x="100" y="71.77777777777777" text-anchor="end" font-size="12" fill="#0f172a">4</text>
<line x1="105" y1="67.77777777777777" x2="110" y2="67.77777777777777" stroke="#334155"/>
<line x1="232.5" y1="370" x2="232.5" y2="375" stroke="#334155"/>
<text x="232.5" y="390" text-anchor="middle" font-size="12" fill="#0f172a">Look 1 (25%)</text>
<line x1="355.0" y1="370" x2="355.0" y2="375" stroke="#334155"/>
<text x="355.0" y="390" text-anchor="middle" font-size="12" fill="#0f172a">Look 2 (50%)</text>
<line x1="477.5" y1="370" x2="477.5" y2="375" stroke="#334155"/>
<text x="477.5" y="390" text-anchor="middle" font-size="12" fill="#0f172a">Look 3 (75%)</text>
<line x1="600.0" y1="370" x2="600.0" y2="375" stroke="#334155"/>
<text x="600.0" y="390" text-anchor="middle" font-size="12" fill="#0f172a">Look 4 (100%)</text>
<text x="355.0" y="414" text-anchor="middle" font-size="13" fill="#0f172a">Information fraction (share of planned events observed)</text>
<text x="24" y="210.0" text-anchor="middle" font-size="13" fill="#0f172a" transform="rotate(-90 24 210.0)">Test statistic (Z)</text>
<text x="116" y="202.0" font-size="12" fill="#0f172a">above 0: new drug better</text>
<text x="116" y="228.0" font-size="12" fill="#0f172a">below 0: new drug worse</text>
<polyline points="232.5,64.22222222222223 355.0,106.88888888888889 477.5,126.44444444444444 600.0,138.88888888888889" fill="none" stroke="#2563eb" stroke-width="3"/>
<polyline points="232.5,302.44444444444446 355.0,291.77777777777777 477.5,286.44444444444446 600.0,281.1111111111111" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 5"/>
<text x="608" y="142.88888888888889" font-size="12" fill="#0f172a">efficacy</text><text x="608" y="157.88888888888889" font-size="12" fill="#0f172a">boundary (solid)</text>
<text x="608" y="285.1111111111111" font-size="12" fill="#0f172a">harm</text><text x="608" y="300.1111111111111" font-size="12" fill="#0f172a">boundary (dashed)</text>
<polyline points="110,210.0 232.5,242.00000000000003 355.0,302.44444444444446" fill="none" stroke="#0f172a" stroke-width="2" marker-mid="url(#s23g-fig53-dot)" marker-end="url(#s23g-fig53-dot)"/>
<text x="240.5" y="258.0" font-size="12" fill="#0f172a">Z = −0.9</text>
<text x="363.0" y="318.44444444444446" font-size="12" fill="#0f172a">Z = −2.6</text>
<text x="379.5" y="57.111111111111114" font-size="12" fill="#0f172a">black line with dots: this trial</text>
</svg>