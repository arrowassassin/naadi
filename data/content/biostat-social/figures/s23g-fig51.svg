<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Flow from preclinical studies through the IND, clinical phases I to III, NDA or BLA review and approval, to phase IV surveillance and REMS" font-family="sans-serif">
<title>From laboratory to market: the US drug development pathway</title>
<defs><marker id="s23g-fig51-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Row 1: before approval</text>
<rect x="20" y="50" width="128" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="84.0" y="85.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Preclinical</text><text x="84.0" y="101.0" text-anchor="middle" font-size="12" fill="#0f172a">lab and animal</text><text x="84.0" y="117.0" text-anchor="middle" font-size="12" fill="#0f172a">toxicity, dose</text>
<line x1="148" y1="96.0" x2="164" y2="96.0" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<rect x="168" y="50" width="128" height="92" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><text x="232.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">IND filed</text><text x="232.0" y="93.0" text-anchor="middle" font-size="12" fill="#0f172a">FDA may start</text><text x="232.0" y="109.0" text-anchor="middle" font-size="12" fill="#0f172a">after 30 days</text><text x="232.0" y="125.0" text-anchor="middle" font-size="12" fill="#0f172a">or place a hold</text>
<line x1="296" y1="96.0" x2="312" y2="96.0" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<rect x="316" y="50" width="128" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="380.0" y="85.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Phase I</text><text x="380.0" y="101.0" text-anchor="middle" font-size="12" fill="#0f172a">tens of people</text><text x="380.0" y="117.0" text-anchor="middle" font-size="12" fill="#0f172a">safety, dose, PK</text>
<line x1="444" y1="96.0" x2="460" y2="96.0" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<rect x="464" y="50" width="128" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="528.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Phase II</text><text x="528.0" y="93.0" text-anchor="middle" font-size="12" fill="#0f172a">up to hundreds</text><text x="528.0" y="109.0" text-anchor="middle" font-size="12" fill="#0f172a">efficacy signal,</text><text x="528.0" y="125.0" text-anchor="middle" font-size="12" fill="#0f172a">dose finding</text>
<line x1="592" y1="96.0" x2="608" y2="96.0" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<rect x="612" y="50" width="128" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="676.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Phase III</text><text x="676.0" y="93.0" text-anchor="middle" font-size="12" fill="#0f172a">hundreds to</text><text x="676.0" y="109.0" text-anchor="middle" font-size="12" fill="#0f172a">thousands, RCTs</text><text x="676.0" y="125.0" text-anchor="middle" font-size="12" fill="#0f172a">confirm benefit</text>
<text x="316" y="168" font-size="12" fill="#0f172a">IRB approval and informed consent at every clinical step</text>
<line x1="316" y1="176" x2="740" y2="176" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3"/>
<path d="M676,142 L676,200 L140,200 L140,226" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<text x="170" y="222" font-size="16" font-weight="bold" fill="#0f172a">Row 2: review and after approval</text>
<rect x="30" y="240" width="220" height="104" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="140.0" y="273.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">NDA or BLA</text><text x="140.0" y="289.0" text-anchor="middle" font-size="12" fill="#0f172a">NDA: small molecules</text><text x="140.0" y="305.0" text-anchor="middle" font-size="12" fill="#0f172a">BLA: biologics</text><text x="140.0" y="321.0" text-anchor="middle" font-size="12" fill="#0f172a">FDA weighs benefit vs risk</text>
<line x1="250" y1="292" x2="266" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<rect x="270" y="240" width="220" height="104" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="380.0" y="273.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Approval</text><text x="380.0" y="289.0" text-anchor="middle" font-size="12" fill="#0f172a">label, boxed warning</text><text x="380.0" y="305.0" text-anchor="middle" font-size="12" fill="#0f172a">accelerated approval:</text><text x="380.0" y="321.0" text-anchor="middle" font-size="12" fill="#0f172a">confirmatory trials due</text>
<line x1="490" y1="292" x2="506" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#s23g-fig51-arr)"/>
<rect x="510" y="240" width="220" height="104" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="620.0" y="273.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Phase IV</text><text x="620.0" y="289.0" text-anchor="middle" font-size="12" fill="#0f172a">post-marketing studies</text><text x="620.0" y="305.0" text-anchor="middle" font-size="12" fill="#0f172a">MedWatch reports to FAERS</text><text x="620.0" y="321.0" text-anchor="middle" font-size="12" fill="#0f172a">REMS for serious risks</text>
<text x="20" y="372" font-size="12" fill="#0f172a">Dashed amber box: the regulatory gate before the first human dose.</text>
<text x="20" y="390" font-size="12" fill="#0f172a">Blue box: surveillance continues for the life of the product.</text>
</svg>