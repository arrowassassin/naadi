<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Interpretation grid for TSH and free T4">
<title>Reading TSH with free T4</title>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">TSH (rows) against free T4 (columns)</text>
<text x="230" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Free T4 low</text>
<text x="420" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Free T4 normal</text>
<text x="610" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Free T4 high</text>
<text x="20" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">TSH high</text>
<text x="20" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">TSH normal</text>
<text x="20" y="335" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">TSH low</text>
<rect x="135" y="70" width="190" height="100" fill="#dbeafe" stroke="#334155"/>
<text x="145" y="95" font-family="sans-serif" font-size="12" fill="#0f172a">Primary hypothyroidism</text>
<text x="145" y="113" font-family="sans-serif" font-size="12" fill="#0f172a">(Hashimoto, after RAI or</text>
<text x="145" y="131" font-family="sans-serif" font-size="12" fill="#0f172a">surgery, iodine deficiency,</text>
<text x="145" y="149" font-family="sans-serif" font-size="12" fill="#0f172a">lithium, amiodarone)</text>
<rect x="325" y="70" width="190" height="100" fill="#eff6ff" stroke="#334155"/>
<text x="335" y="95" font-family="sans-serif" font-size="12" fill="#0f172a">Subclinical hypothyroidism;</text>
<text x="335" y="113" font-family="sans-serif" font-size="12" fill="#0f172a">recovery phase of</text>
<text x="335" y="131" font-family="sans-serif" font-size="12" fill="#0f172a">nonthyroidal illness;</text>
<text x="335" y="149" font-family="sans-serif" font-size="12" fill="#0f172a">missed levothyroxine doses</text>
<rect x="515" y="70" width="190" height="100" fill="#fef3c7" stroke="#334155"/>
<text x="525" y="95" font-family="sans-serif" font-size="12" fill="#0f172a">Rare: TSH-secreting</text>
<text x="525" y="113" font-family="sans-serif" font-size="12" fill="#0f172a">pituitary adenoma or</text>
<text x="525" y="131" font-family="sans-serif" font-size="12" fill="#0f172a">thyroid hormone resistance</text>
<rect x="135" y="170" width="190" height="110" fill="#fef3c7" stroke="#334155"/>
<text x="145" y="195" font-family="sans-serif" font-size="12" fill="#0f172a">Central hypothyroidism</text>
<text x="145" y="213" font-family="sans-serif" font-size="12" fill="#0f172a">(pituitary or hypothalamic</text>
<text x="145" y="231" font-family="sans-serif" font-size="12" fill="#0f172a">disease): TSH is normal or</text>
<text x="145" y="249" font-family="sans-serif" font-size="12" fill="#0f172a">low, so follow free T4;</text>
<text x="145" y="267" font-family="sans-serif" font-size="12" fill="#0f172a">nonthyroidal illness</text>
<rect x="325" y="170" width="190" height="110" fill="#dcfce7" stroke="#334155"/>
<text x="420" y="230" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Euthyroid</text>
<rect x="515" y="170" width="190" height="110" fill="#fef3c7" stroke="#334155"/>
<text x="525" y="195" font-family="sans-serif" font-size="12" fill="#0f172a">Assay interference,</text>
<text x="525" y="213" font-family="sans-serif" font-size="12" fill="#0f172a">heparin, amiodarone,</text>
<text x="525" y="231" font-family="sans-serif" font-size="12" fill="#0f172a">or early central</text>
<text x="525" y="249" font-family="sans-serif" font-size="12" fill="#0f172a">hyperthyroidism</text>
<rect x="135" y="280" width="190" height="100" fill="#fef3c7" stroke="#334155"/>
<text x="145" y="305" font-family="sans-serif" font-size="12" fill="#0f172a">Central hypothyroidism;</text>
<text x="145" y="323" font-family="sans-serif" font-size="12" fill="#0f172a">nonthyroidal illness;</text>
<text x="145" y="341" font-family="sans-serif" font-size="12" fill="#0f172a">high-dose glucocorticoids</text>
<rect x="325" y="280" width="190" height="100" fill="#fff7ed" stroke="#334155"/>
<text x="335" y="305" font-family="sans-serif" font-size="12" fill="#0f172a">Subclinical hyperthyroidism</text>
<text x="335" y="323" font-family="sans-serif" font-size="12" fill="#0f172a">or T3 toxicosis (check</text>
<text x="335" y="341" font-family="sans-serif" font-size="12" fill="#0f172a">total or free T3); early</text>
<text x="335" y="359" font-family="sans-serif" font-size="12" fill="#0f172a">pregnancy (hCG effect)</text>
<rect x="515" y="280" width="190" height="100" fill="#fee2e2" stroke="#334155"/>
<text x="525" y="305" font-family="sans-serif" font-size="12" fill="#0f172a">Primary hyperthyroidism</text>
<text x="525" y="323" font-family="sans-serif" font-size="12" fill="#0f172a">or thyroiditis: radioiodine</text>
<text x="525" y="341" font-family="sans-serif" font-size="12" fill="#0f172a">uptake separates high</text>
<text x="525" y="359" font-family="sans-serif" font-size="12" fill="#0f172a">synthesis from leakage</text>
</svg>
