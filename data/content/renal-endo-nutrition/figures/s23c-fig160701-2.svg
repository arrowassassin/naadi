<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Schematic ECG changes as serum potassium rises: peaked T waves, then a flat P wave, longer PR and wider QRS, then a sine-wave pattern">
<title>ECG changes with rising potassium</title>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Schematic ECG as serum potassium rises (two beats per row)</text>
<rect x="20" y="40" width="720" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="34" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Normal</text>
<path d="M0,0 L20,0 Q30,-10 40,0 L60,0 L64,6 L70,-48 L76,14 L80,0 L100,0 Q118,-18 136,0 L180,0" transform="translate(330,96)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M0,0 L20,0 Q30,-10 40,0 L60,0 L64,6 L70,-48 L76,14 L80,0 L100,0 Q118,-18 136,0 L180,0" transform="translate(520,96)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="20" y="140" width="720" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="34" y="166" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Mild</text>
<text x="34" y="184" font-family="sans-serif" font-size="11.5" fill="#334155">tall, narrow, peaked T waves</text>
<path d="M0,0 L20,0 Q30,-10 40,0 L60,0 L64,6 L70,-48 L76,14 L80,0 L104,0 L118,-46 L132,0 L180,0" transform="translate(330,196)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M0,0 L20,0 Q30,-10 40,0 L60,0 L64,6 L70,-48 L76,14 L80,0 L104,0 L118,-46 L132,0 L180,0" transform="translate(520,196)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="20" y="240" width="720" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="34" y="266" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Moderate</text>
<text x="34" y="284" font-family="sans-serif" font-size="11.5" fill="#334155">P flattens, PR lengthens, QRS widens</text>
<path d="M0,0 L14,0 Q24,-4 34,0 L66,0 L72,8 L82,-38 L94,18 L102,0 L112,0 L124,-40 L136,0 L180,0" transform="translate(330,296)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M0,0 L14,0 Q24,-4 34,0 L66,0 L72,8 L82,-38 L94,18 L102,0 L112,0 L124,-40 L136,0 L180,0" transform="translate(520,296)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="20" y="340" width="720" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="34" y="366" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Severe</text>
<text x="34" y="384" font-family="sans-serif" font-size="11.5" fill="#334155">P lost; QRS merges with T (sine wave)</text>
<path d="M0,0 C20,-40 40,-40 60,0 C80,40 100,40 120,0 C140,-40 160,-40 180,0" transform="translate(330,396)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M0,0 C20,-40 40,-40 60,0 C80,40 100,40 120,0 C140,-40 160,-40 180,0" transform="translate(520,396)" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>
<text x="20" y="458" font-family="sans-serif" font-size="11" fill="#475569">The sequence and the potassium level at which each change appears vary; a normal ECG does not exclude dangerous hyperkalemia. Naadi original.</text>
</svg>
