<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Sources of blood glucose and fuel during fasting: glycogen in the first day, gluconeogenesis over the next days, ketone bodies sparing protein after about a week">
<title>Fuel sources during fasting</title>
<defs><marker id="s23c-f160405-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<text x="360" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Where fuel comes from as fasting goes on (schematic)</text>
<line x1="70" y1="290" x2="690" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160405-arrow)"/>
<line x1="70" y1="290" x2="70" y2="50" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160405-arrow)"/>
<text x="380" y="330" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Time without food</text>
<text x="30" y="170" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" transform="rotate(-90 30 170)">Share of fuel supply</text>
<text x="110" y="310" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">hours</text>
<text x="230" y="310" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">1 day</text>
<text x="400" y="310" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">3–5 days</text>
<text x="620" y="310" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">weeks</text>
<path d="M75,70 C150,70 200,120 240,285" fill="none" stroke="#0369a1" stroke-width="3"/>
<path d="M90,280 C170,250 210,90 300,80 C380,75 420,150 520,220 C580,250 640,255 680,255" fill="none" stroke="#b45309" stroke-width="3"/>
<path d="M200,285 C320,280 380,200 470,120 C540,80 610,75 680,75" fill="none" stroke="#15803d" stroke-width="3"/>
<text x="140" y="62" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Liver glycogen</text>
<text x="300" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">Gluconeogenesis</text>
<text x="300" y="62" font-family="sans-serif" font-size="11" fill="#b45309">(amino acids, glycerol, lactate)</text>
<text x="520" y="66" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">Ketone bodies</text>
<text x="530" y="150" font-family="sans-serif" font-size="11" fill="#15803d">brain adapts to ketones,</text>
<text x="530" y="164" font-family="sans-serif" font-size="11" fill="#15803d">so less muscle is broken down</text>
<text x="70" y="352" font-family="sans-serif" font-size="11.5" fill="#475569">Fatty acids fuel muscle and liver throughout. In illness (stress), catabolic hormones keep</text><text x="70" y="368" font-family="sans-serif" font-size="11.5" fill="#475569">protein breakdown high, so this protein-sparing adaptation is lost.</text>
</svg>
