<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Nephritic versus nephrotic syndrome compared: dominant injury, urine, blood pressure and complications">
<title>Nephritic versus nephrotic syndrome</title>
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
<rect x="20" y="20" width="330" height="300" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="370" y="20" width="330" height="300" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="185" y="48" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Nephritic</text>
<text x="535" y="48" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Nephrotic</text>
<text x="34" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Injury</text>
<text x="34" y="98" font-family="sans-serif" font-size="12" fill="#0f172a">Inflammation and proliferation in the tuft;</text>
<text x="34" y="114" font-family="sans-serif" font-size="12" fill="#0f172a">capillary walls break</text>
<text x="34" y="144" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Urine</text>
<text x="34" y="162" font-family="sans-serif" font-size="12" fill="#0f172a">Dysmorphic red cells, red cell casts;</text>
<text x="34" y="178" font-family="sans-serif" font-size="12" fill="#0f172a">protein usually below 3.5 g/day; oliguria</text>
<text x="34" y="208" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Circulation</text>
<text x="34" y="226" font-family="sans-serif" font-size="12" fill="#0f172a">Low GFR, salt and water retention:</text>
<text x="34" y="242" font-family="sans-serif" font-size="12" fill="#0f172a">hypertension, periorbital edema, azotemia</text>
<text x="34" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Complications</text>
<text x="34" y="290" font-family="sans-serif" font-size="12" fill="#0f172a">Rapid loss of function (crescents),</text>
<text x="34" y="306" font-family="sans-serif" font-size="12" fill="#0f172a">pulmonary edema, hypertensive emergency</text>
<text x="384" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Injury</text>
<text x="384" y="98" font-family="sans-serif" font-size="12" fill="#0f172a">Podocyte or filtration-barrier damage;</text>
<text x="384" y="114" font-family="sans-serif" font-size="12" fill="#0f172a">little inflammation</text>
<text x="384" y="144" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Urine</text>
<text x="384" y="162" font-family="sans-serif" font-size="12" fill="#0f172a">Protein above 3.5 g/day, frothy urine;</text>
<text x="384" y="178" font-family="sans-serif" font-size="12" fill="#0f172a">oval fat bodies, fatty casts; bland otherwise</text>
<text x="384" y="208" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Blood</text>
<text x="384" y="226" font-family="sans-serif" font-size="12" fill="#0f172a">Albumin low, lipids high; generalised edema;</text>
<text x="384" y="242" font-family="sans-serif" font-size="12" fill="#0f172a">blood pressure often normal at first</text>
<text x="384" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Complications</text>
<text x="384" y="290" font-family="sans-serif" font-size="12" fill="#0f172a">Venous and renal vein thrombosis (antithrombin</text>
<text x="384" y="306" font-family="sans-serif" font-size="12" fill="#0f172a">loss), infection (IgG loss), atherosclerosis</text>
<text x="360" y="346" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">Many diseases overlap (lupus, MPGN, diabetic disease): classify by the dominant pattern.</text>
</svg>
