<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Thyroid hormone synthesis in the follicular cell with the steps each drug blocks">
<title>Thyroid hormone synthesis and drug targets</title>
<defs><marker id="s23c-f150201-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
<text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Blood (basolateral)</text>
<text x="560" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Colloid (lumen)</text>
<rect x="150" y="45" width="370" height="330" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="335" y="68" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Follicular cell</text>
<rect x="530" y="45" width="175" height="330" rx="14" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="30" y="110" font-family="sans-serif" font-size="13" fill="#0f172a">Iodide (I⁻)</text>
<line x1="105" y1="105" x2="200" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f150201-arrow)"/>
<rect x="160" y="88" width="40" height="34" rx="6" fill="#dbeafe" stroke="#334155"/>
<text x="180" y="110" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">NIS</text>
<text x="215" y="100" font-family="sans-serif" font-size="12" fill="#0f172a">1. Trapping (Na⁺/I⁻ symporter)</text>
<text x="215" y="116" font-family="sans-serif" font-size="12" fill="#b91c1c">Blocked by perchlorate, pertechnetate</text>
<line x1="450" y1="140" x2="590" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f150201-arrow)"/>
<text x="215" y="145" font-family="sans-serif" font-size="12" fill="#0f172a">I⁻ exits to colloid (pendrin)</text>
<text x="545" y="175" font-family="sans-serif" font-size="12" fill="#0f172a">2. Oxidation and</text>
<text x="545" y="191" font-family="sans-serif" font-size="12" fill="#0f172a">organification by TPO:</text>
<text x="545" y="207" font-family="sans-serif" font-size="12" fill="#0f172a">I joins tyrosines on</text>
<text x="545" y="223" font-family="sans-serif" font-size="12" fill="#0f172a">thyroglobulin → MIT, DIT</text>
<text x="545" y="249" font-family="sans-serif" font-size="12" fill="#0f172a">3. Coupling by TPO:</text>
<text x="545" y="265" font-family="sans-serif" font-size="12" fill="#0f172a">DIT + DIT → T4</text>
<text x="545" y="281" font-family="sans-serif" font-size="12" fill="#0f172a">MIT + DIT → T3</text>
<rect x="540" y="296" width="158" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="619" y="314" font-family="sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle">Methimazole, PTU</text>
<text x="619" y="330" font-family="sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle">block TPO (steps 2–3)</text>
<line x1="590" y1="355" x2="450" y2="355" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f150201-arrow)"/>
<text x="215" y="300" font-family="sans-serif" font-size="12" fill="#0f172a">4. Endocytosis and proteolysis</text>
<text x="215" y="316" font-family="sans-serif" font-size="12" fill="#0f172a">of thyroglobulin frees T4 (most) and T3</text>
<text x="215" y="332" font-family="sans-serif" font-size="12" fill="#b91c1c">Large iodide doses and lithium block release</text>
<line x1="200" y1="250" x2="105" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f150201-arrow)"/>
<text x="20" y="240" font-family="sans-serif" font-size="13" fill="#0f172a">T4, T3 to blood</text>
<text x="20" y="268" font-family="sans-serif" font-size="12" fill="#0f172a">(about 99% bound,</text>
<text x="20" y="284" font-family="sans-serif" font-size="12" fill="#0f172a">mostly to TBG)</text>
<text x="215" y="210" font-family="sans-serif" font-size="12" fill="#0f172a">Peripheral 5′-deiodinase: T4 → active T3</text>
<text x="215" y="226" font-family="sans-serif" font-size="12" fill="#b91c1c">Inhibited by PTU, propranolol (high dose),</text>
<text x="215" y="242" font-family="sans-serif" font-size="12" fill="#b91c1c">glucocorticoids, amiodarone, iodinated contrast</text>
<text x="20" y="405" font-family="sans-serif" font-size="12" fill="#0f172a">Excess iodide transiently stops organification (Wolff-Chaikoff effect); a normal gland escapes within days.</text>
</svg>
