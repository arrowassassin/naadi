<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="Urine casts and what each one points to: hyaline, red cell, white cell, muddy brown granular, waxy and fatty casts">
<title>Urine casts: what each points to</title>
<rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
<text x="360" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Casts form in tubules: every cast is a message from the kidney</text>
<g font-family="sans-serif" font-size="12" fill="#0f172a">
<rect x="30" y="55" width="150" height="34" rx="17" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="200" y="70" font-weight="bold">Hyaline</text>
<text x="200" y="86">Tamm-Horsfall protein only. Concentrated urine, diuretics, exercise: nonspecific</text>
<rect x="30" y="115" width="150" height="34" rx="17" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="65" cy="132" r="7" fill="#dc2626"/><circle cx="90" cy="128" r="7" fill="#dc2626"/><circle cx="115" cy="135" r="7" fill="#dc2626"/><circle cx="140" cy="129" r="7" fill="#dc2626"/>
<text x="200" y="130" font-weight="bold">Red blood cell</text>
<text x="200" y="146">Glomerular bleeding: glomerulonephritis (nephritic syndrome)</text>
<rect x="30" y="175" width="150" height="34" rx="17" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="65" cy="192" r="8" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="95" cy="190" r="8" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="125" cy="194" r="8" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="152" cy="190" r="7" fill="#bfdbfe" stroke="#1d4ed8"/>
<text x="200" y="190" font-weight="bold">White blood cell</text>
<text x="200" y="206">Tubulointerstitial inflammation: pyelonephritis, acute interstitial nephritis</text>
<rect x="30" y="235" width="150" height="34" rx="17" fill="#e7d8c6" stroke="#78350f" stroke-width="1.5"/>
<circle cx="60" cy="248" r="3" fill="#78350f"/><circle cx="80" cy="258" r="3" fill="#78350f"/><circle cx="102" cy="246" r="3" fill="#78350f"/><circle cx="124" cy="257" r="3" fill="#78350f"/><circle cx="146" cy="249" r="3" fill="#78350f"/><circle cx="160" cy="259" r="3" fill="#78350f"/>
<text x="200" y="250" font-weight="bold">Muddy brown granular</text>
<text x="200" y="266">Sloughed tubular cells: acute tubular necrosis (ischemic or toxic)</text>
<rect x="30" y="295" width="150" height="34" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
<line x1="80" y1="295" x2="76" y2="329" stroke="#334155" stroke-width="1.2"/><line x1="130" y1="295" x2="134" y2="329" stroke="#334155" stroke-width="1.2"/>
<text x="200" y="310" font-weight="bold">Waxy (and broad)</text>
<text x="200" y="326">Long stasis in dilated, atrophic tubules: advanced chronic kidney disease</text>
<rect x="30" y="355" width="150" height="34" rx="17" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<circle cx="70" cy="372" r="6" fill="#fde68a" stroke="#a16207"/><circle cx="100" cy="368" r="5" fill="#fde68a" stroke="#a16207"/><circle cx="128" cy="374" r="6" fill="#fde68a" stroke="#a16207"/>
<text x="200" y="370" font-weight="bold">Fatty (oval fat bodies)</text>
<text x="200" y="386">Lipiduria with "Maltese cross" birefringence: nephrotic syndrome</text>
</g>
<text x="360" y="418" font-family="sans-serif" font-size="12" fill="#55575e" text-anchor="middle">Crystals are not casts: envelopes (calcium oxalate), rhomboids (uric acid), coffin lids (struvite), hexagons (cystine)</text>
</svg>
