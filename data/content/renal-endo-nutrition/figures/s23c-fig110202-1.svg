<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Kidney and urinary tract tumours by the cell they arise from">
<title>Urinary tract tumours by cell of origin</title>
<defs><marker id="s23c-f110202-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Urinary tract tumours by the cell they come from</text>
<circle cx="120" cy="110" r="30" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="120" y="114" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">Glomerulus</text>
<path d="M150,110 C210,110 210,170 250,170 C290,170 290,90 330,90 L330,250 C330,290 380,290 380,250 L380,120 C380,90 430,90 440,120 L440,330" fill="none" stroke="#334155" stroke-width="6"/>
<text x="210" y="200" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Proximal tubule</text>
<text x="356" y="314" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Loop</text>
<text x="452" y="230" font-family="sans-serif" font-size="12" fill="#0f172a">Collecting duct</text>
<path d="M420,330 Q440,360 460,330 Z" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="470" y="350" font-family="sans-serif" font-size="12" fill="#0f172a">Pelvis, ureter, bladder</text>
<g font-family="sans-serif" font-size="12" fill="#0f172a">
<rect x="16" y="230" width="250" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="28" y="252" font-weight="bold">From proximal tubule</text>
<text x="28" y="272">• Clear cell RCC (most common):</text>
<text x="28" y="288">  3p loss, VHL inactivated, HIF up</text>
<text x="28" y="306">• Papillary RCC: MET (type 1);</text>
<text x="28" y="322">  trisomy 7 and 17; often multifocal</text>
<text x="28" y="340">• Papillary adenoma (small,</text>
<text x="28" y="356">  incidental, benign)</text>
<line x1="210" y1="226" x2="210" y2="206" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110202-arrow)"/>
<rect x="520" y="60" width="190" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="532" y="82" font-weight="bold">From intercalated</text>
<text x="532" y="98" font-weight="bold">cells</text>
<text x="532" y="118">• Oncocytoma (benign):</text>
<text x="532" y="134">  central stellate scar</text>
<text x="532" y="152">• Chromophobe RCC:</text>
<text x="532" y="168">  perinuclear halos</text>
<line x1="518" y1="150" x2="446" y2="200" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110202-arrow)"/>
<rect x="520" y="250" width="190" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="532" y="272" font-weight="bold">From urothelium</text>
<text x="532" y="292">• Urothelial carcinoma</text>
<text x="532" y="310">• Squamous (chronic irritation)</text>
<text x="300" y="60" font-weight="bold">Children: Wilms tumour</text>
<text x="300" y="76">from metanephric blastema</text>
<text x="300" y="92">(blastema, stroma, epithelium)</text>
</g>
</svg>
