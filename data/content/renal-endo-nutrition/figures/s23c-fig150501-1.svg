<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Hypothalamic-pituitary axes: hypothalamic releasing hormones, anterior pituitary hormones, target glands and negative feedback; the posterior pituitary releases ADH and oxytocin made in hypothalamic neurons">
<title>Hypothalamic-pituitary axes</title>
<defs><marker id="s23c-f150501-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
<text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Hypothalamus</text>
<text x="200" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Anterior pituitary</text>
<text x="390" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Target</text>
<text x="540" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Feeds back</text>
<g font-family="sans-serif" font-size="12" fill="#0f172a">
<rect x="15" y="45" width="150" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="25" y="67">CRH</text>
<rect x="195" y="45" width="150" height="34" rx="6" fill="#fef3c7" stroke="#334155"/><text x="205" y="67">ACTH</text>
<rect x="385" y="45" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="395" y="67">Adrenal cortex</text>
<text x="540" y="67">Cortisol ⊣ CRH, ACTH</text>
<rect x="15" y="90" width="150" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="25" y="112">TRH</text>
<rect x="195" y="90" width="150" height="34" rx="6" fill="#fef3c7" stroke="#334155"/><text x="205" y="112">TSH</text>
<rect x="385" y="90" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="395" y="112">Thyroid</text>
<text x="540" y="112">T4/T3 ⊣ TRH, TSH</text>
<rect x="15" y="135" width="150" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="25" y="157">GnRH (pulsatile)</text>
<rect x="195" y="135" width="150" height="34" rx="6" fill="#fef3c7" stroke="#334155"/><text x="205" y="157">LH, FSH</text>
<rect x="385" y="135" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="395" y="157">Gonads</text>
<text x="540" y="152">Sex steroids ⊣ GnRH, LH;</text><text x="540" y="166">inhibin ⊣ FSH</text>
<rect x="15" y="180" width="150" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="25" y="196">GHRH (+)</text><text x="25" y="209">somatostatin (−)</text>
<rect x="195" y="180" width="150" height="34" rx="6" fill="#fef3c7" stroke="#334155"/><text x="205" y="202">GH</text>
<rect x="385" y="180" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="395" y="202">Liver → IGF-1</text>
<text x="540" y="202">IGF-1 ⊣ GH, + somatostatin</text>
<rect x="15" y="225" width="150" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c"/><text x="25" y="241">Dopamine (−)</text><text x="25" y="254">tonic inhibition</text>
<rect x="195" y="225" width="150" height="34" rx="6" fill="#fef3c7" stroke="#334155"/><text x="205" y="247">Prolactin</text>
<rect x="385" y="225" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#334155"/><text x="395" y="247">Breast</text>
<text x="540" y="241">Prolactin ⊣ GnRH:</text><text x="540" y="254">amenorrhea, low libido</text>
</g>
<g stroke="#334155" stroke-width="1.5" marker-end="url(#s23c-f150501-arrow)">
<line x1="165" y1="62" x2="193" y2="62"/><line x1="345" y1="62" x2="383" y2="62"/>
<line x1="165" y1="107" x2="193" y2="107"/><line x1="345" y1="107" x2="383" y2="107"/>
<line x1="165" y1="152" x2="193" y2="152"/><line x1="345" y1="152" x2="383" y2="152"/>
<line x1="165" y1="197" x2="193" y2="197"/><line x1="345" y1="197" x2="383" y2="197"/>
<line x1="165" y1="242" x2="193" y2="242"/><line x1="345" y1="242" x2="383" y2="242"/>
</g>
<rect x="15" y="290" width="690" height="115" rx="8" fill="#eef2ff" stroke="#334155"/>
<text x="27" y="312" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Posterior pituitary: stores hormones made in the hypothalamus (axons down the stalk)</text>
<text x="27" y="336" font-family="sans-serif" font-size="12" fill="#0f172a">• ADH (vasopressin): supraoptic &gt; paraventricular nuclei → V2 receptors on collecting duct → aquaporin-2 → water retained</text>
<text x="27" y="358" font-family="sans-serif" font-size="12" fill="#0f172a">• Oxytocin: paraventricular &gt; supraoptic nuclei → milk let-down, uterine contraction</text>
<text x="27" y="382" font-family="sans-serif" font-size="12" fill="#0f172a">• Stalk section or compression: ADH falls (diabetes insipidus) and dopamine stops reaching lactotrophs (prolactin rises)</text>
<text x="27" y="398" font-family="sans-serif" font-size="12" fill="#0f172a">⊣ = inhibits</text>
</svg>
