<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="Nephron map of where common nephrotoxic drugs act">
<title>Where nephrotoxic drugs act</title>
<defs><marker id="s23c-f110801-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
<line x1="40" y1="70" x2="101" y2="70" stroke="#334155" stroke-width="4"/>
<text x="40" y="60" font-family="sans-serif" font-size="12" fill="#0f172a">Afferent</text>
<circle cx="135" cy="82" r="36" fill="#fde2e2" stroke="#334155" stroke-width="2"/>
<text x="135" y="86" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">Glomerulus</text>
<line x1="104" y1="100" x2="40" y2="110" stroke="#334155" stroke-width="3"/>
<text x="40" y="126" font-family="sans-serif" font-size="12" fill="#0f172a">Efferent</text>
<path d="M171,82 C220,82 230,140 260,140 L330,140" fill="none" stroke="#334155" stroke-width="6"/>
<text x="196" y="66" font-family="sans-serif" font-size="12" fill="#0f172a">Proximal tubule</text>
<path d="M330,140 L330,330 Q345,360 360,330 L360,190" fill="none" stroke="#334155" stroke-width="5"/>
<text x="290" y="370" font-family="sans-serif" font-size="12" fill="#0f172a">Loop of Henle</text>
<path d="M360,190 C380,150 420,150 440,170 L470,170" fill="none" stroke="#334155" stroke-width="5"/>
<path d="M470,170 L470,400" fill="none" stroke="#334155" stroke-width="7"/>
<text x="480" y="395" font-family="sans-serif" font-size="12" fill="#0f172a">Collecting duct</text>
<rect x="20" y="160" width="230" height="78" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="30" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Glomerular hemodynamics</text>
<text x="30" y="196" font-family="sans-serif" font-size="11" fill="#0f172a">Afferent constriction: NSAIDs, cyclosporine,</text>
<text x="30" y="211" font-family="sans-serif" font-size="11" fill="#0f172a">tacrolimus</text>
<text x="30" y="228" font-family="sans-serif" font-size="11" fill="#0f172a">Efferent dilation: ACE inhibitors, ARBs</text>
<line x1="135" y1="160" x2="135" y2="121" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110801-arrow)"/>
<rect x="400" y="20" width="300" height="78" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="410" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Proximal tubule cell injury</text>
<text x="410" y="56" font-family="sans-serif" font-size="11" fill="#0f172a">Aminoglycosides (ATN), cisplatin (ATN, Mg loss),</text>
<text x="410" y="72" font-family="sans-serif" font-size="11" fill="#0f172a">tenofovir and ifosfamide (Fanconi-type loss),</text>
<text x="410" y="88" font-family="sans-serif" font-size="11" fill="#0f172a">iodinated contrast (vasoconstriction plus toxicity)</text>
<line x1="400" y1="70" x2="280" y2="134" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110801-arrow)"/>
<rect x="20" y="270" width="250" height="78" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="30" y="288" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">Tubular lumen: crystals</text>
<text x="30" y="306" font-family="sans-serif" font-size="11" fill="#0f172a">Acyclovir, methotrexate, sulfonamides,</text>
<text x="30" y="322" font-family="sans-serif" font-size="11" fill="#0f172a">indinavir; prevent with hydration</text>
<text x="30" y="338" font-family="sans-serif" font-size="11" fill="#0f172a">(urine alkalinisation for methotrexate)</text>
<line x1="270" y1="300" x2="326" y2="270" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110801-arrow)"/>
<rect x="510" y="130" width="200" height="110" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="520" y="148" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">Distal nephron</text>
<text x="520" y="166" font-family="sans-serif" font-size="11" fill="#0f172a">Amphotericin B: distal</text>
<text x="520" y="181" font-family="sans-serif" font-size="11" fill="#0f172a">(type 1) RTA, K and Mg loss</text>
<text x="520" y="199" font-family="sans-serif" font-size="11" fill="#0f172a">Lithium: nephrogenic DI</text>
<text x="520" y="214" font-family="sans-serif" font-size="11" fill="#0f172a">(less aquaporin-2)</text>
<text x="520" y="232" font-family="sans-serif" font-size="11" fill="#0f172a">Trimethoprim: blocks ENaC, high K</text>
<line x1="510" y1="200" x2="476" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110801-arrow)"/>
<rect x="510" y="270" width="200" height="94" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="520" y="288" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4c1d95">Interstitium: AIN</text>
<text x="520" y="306" font-family="sans-serif" font-size="11" fill="#0f172a">Penicillins, cephalosporins,</text>
<text x="520" y="321" font-family="sans-serif" font-size="11" fill="#0f172a">PPIs, NSAIDs, sulfonamides,</text>
<text x="520" y="336" font-family="sans-serif" font-size="11" fill="#0f172a">immune checkpoint inhibitors</text>
<text x="520" y="354" font-family="sans-serif" font-size="11" fill="#0f172a">Bladder: cyclophosphamide (acrolein)</text>
<line x1="510" y1="310" x2="370" y2="300" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110801-arrow)"/>
</svg>
