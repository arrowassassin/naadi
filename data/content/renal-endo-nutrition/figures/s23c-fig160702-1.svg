<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" width="740" height="560" role="img" aria-label="Stepwise acid-base interpretation: pH, primary process, expected compensation, anion gap, then delta ratio and osmolal gap">
<title>Stepwise acid-base interpretation</title>
<defs><marker id="s23c-f160702-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="740" height="560" fill="#ffffff"/>
<rect x="20" y="20" width="330" height="70" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="34" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">1. pH</text>
<text x="34" y="64" font-family="sans-serif" font-size="12" fill="#0f172a">below 7.35: acidemia</text>
<text x="34" y="80" font-family="sans-serif" font-size="12" fill="#0f172a">above 7.45: alkalemia</text>
<rect x="20" y="115" width="330" height="86" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="34" y="139" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">2. Primary process</text>
<text x="34" y="159" font-family="sans-serif" font-size="12" fill="#0f172a">Which value moved in the direction of the pH?</text>
<text x="34" y="175" font-family="sans-serif" font-size="12" fill="#0f172a">HCO₃⁻ → metabolic;  PaCO₂ → respiratory</text>
<text x="34" y="191" font-family="sans-serif" font-size="12" fill="#0f172a">(both point the same way: two primary disorders)</text>
<rect x="20" y="226" width="330" height="70" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="34" y="250" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">3. Is compensation as expected?</text>
<text x="34" y="270" font-family="sans-serif" font-size="12" fill="#0f172a">Use the rules on the right. Outside the</text>
<text x="34" y="286" font-family="sans-serif" font-size="12" fill="#0f172a">range = a second (mixed) disorder.</text>
<rect x="20" y="321" width="330" height="86" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="34" y="345" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">4. Anion gap (every acidosis)</text>
<text x="34" y="365" font-family="sans-serif" font-size="12" fill="#0f172a">AG = Na⁺ − (Cl⁻ + HCO₃⁻), normal about 12</text>
<text x="34" y="381" font-family="sans-serif" font-size="12" fill="#0f172a">Add about 2.5 for every 1 g/dL that albumin</text>
<text x="34" y="397" font-family="sans-serif" font-size="12" fill="#0f172a">is below 4 g/dL</text>
<rect x="20" y="432" width="330" height="108" rx="8" fill="#ede9fe" stroke="#334155" stroke-width="1.5"/>
<text x="34" y="456" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">5. If the gap is high</text>
<text x="34" y="476" font-family="sans-serif" font-size="12" fill="#0f172a">Delta ratio = (AG − 12) ÷ (24 − HCO₃⁻)</text>
<text x="34" y="492" font-family="sans-serif" font-size="12" fill="#0f172a">  below 1: plus a normal-gap acidosis</text>
<text x="34" y="508" font-family="sans-serif" font-size="12" fill="#0f172a">  above 2: plus a metabolic alkalosis</text>
<text x="34" y="528" font-family="sans-serif" font-size="12" fill="#0f172a">Osmolal gap above about 10: toxic alcohol?</text>
<line x1="185" y1="90" x2="185" y2="113" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160702-arrow)"/>
<line x1="185" y1="201" x2="185" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160702-arrow)"/>
<line x1="185" y1="296" x2="185" y2="319" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160702-arrow)"/>
<line x1="185" y1="407" x2="185" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160702-arrow)"/>
<rect x="380" y="20" width="340" height="300" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="394" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">Expected compensation</text>
<text x="394" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Metabolic acidosis (Winter):</text>
<text x="394" y="88" font-family="sans-serif" font-size="12" fill="#0f172a">PaCO₂ = 1.5 × HCO₃⁻ + 8 (± 2)</text>
<text x="394" y="114" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Metabolic alkalosis:</text>
<text x="394" y="132" font-family="sans-serif" font-size="12" fill="#0f172a">PaCO₂ rises about 0.7 per 1 mEq/L HCO₃⁻ rise</text>
<text x="394" y="158" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Respiratory acidosis, per 10 mm Hg PaCO₂ rise:</text>
<text x="394" y="176" font-family="sans-serif" font-size="12" fill="#0f172a">acute: HCO₃⁻ up about 1</text>
<text x="394" y="192" font-family="sans-serif" font-size="12" fill="#0f172a">chronic (3–5 days): HCO₃⁻ up about 3.5–4</text>
<text x="394" y="218" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Respiratory alkalosis, per 10 mm Hg PaCO₂ fall:</text>
<text x="394" y="236" font-family="sans-serif" font-size="12" fill="#0f172a">acute: HCO₃⁻ down about 2</text>
<text x="394" y="252" font-family="sans-serif" font-size="12" fill="#0f172a">chronic: HCO₃⁻ down about 4–5</text>
<text x="394" y="280" font-family="sans-serif" font-size="12" fill="#475569">Compensation never overshoots: a normal or</text>
<text x="394" y="296" font-family="sans-serif" font-size="12" fill="#475569">reversed pH means a second process.</text>
<rect x="380" y="345" width="340" height="195" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="394" y="369" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Normal values (arterial)</text>
<text x="394" y="393" font-family="sans-serif" font-size="12" fill="#0f172a">pH 7.35–7.45</text>
<text x="394" y="411" font-family="sans-serif" font-size="12" fill="#0f172a">PaCO₂ 33–45 mm Hg (use 40 for the rules)</text>
<text x="394" y="429" font-family="sans-serif" font-size="12" fill="#0f172a">HCO₃⁻ 22–28 mEq/L (use 24)</text>
<text x="394" y="455" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Calculated serum osmolality:</text>
<text x="394" y="473" font-family="sans-serif" font-size="12" fill="#0f172a">2 × Na⁺ + glucose/18 + BUN/2.8</text>
<text x="394" y="491" font-family="sans-serif" font-size="12" fill="#0f172a">(add ethanol/3.7 if ethanol is present)</text>
<text x="394" y="519" font-family="sans-serif" font-size="11" fill="#475569">Naadi original diagram.</text>
</svg>
