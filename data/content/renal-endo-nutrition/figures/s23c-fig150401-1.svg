<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Work-up of an incidentally found adrenal mass: hormone testing for every mass and imaging features for cancer risk">
<title>Adrenal incidentaloma work-up</title>
<defs><marker id="s23c-f150401-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
<rect x="230" y="14" width="260" height="40" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="360" y="39" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Adrenal mass found on imaging</text>
<line x1="300" y1="54" x2="190" y2="92" stroke="#334155" stroke-width="1.5" marker-end="url(#s23c-f150401-arrow)"/>
<line x1="420" y1="54" x2="530" y2="92" stroke="#334155" stroke-width="1.5" marker-end="url(#s23c-f150401-arrow)"/>
<rect x="20" y="94" width="330" height="190" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="34" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">1. Is it secreting?</text>
<text x="34" y="142" font-family="sans-serif" font-size="12" fill="#0f172a">• 1-mg overnight dexamethasone test</text>
<text x="44" y="160" font-family="sans-serif" font-size="12" fill="#0f172a">(autonomous cortisol)</text>
<text x="34" y="182" font-family="sans-serif" font-size="12" fill="#0f172a">• Metanephrines, unless clearly a lipid-rich</text>
<text x="44" y="200" font-family="sans-serif" font-size="12" fill="#0f172a">adenoma (pheochromocytoma)</text>
<text x="34" y="222" font-family="sans-serif" font-size="12" fill="#0f172a">• Aldosterone and renin if hypertension</text>
<text x="44" y="240" font-family="sans-serif" font-size="12" fill="#0f172a">or hypokalemia</text>
<text x="34" y="264" font-family="sans-serif" font-size="12" fill="#0f172a">• Sex steroids only if virilisation or cancer suspected</text>
<rect x="370" y="94" width="330" height="190" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="384" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d">2. Could it be malignant?</text>
<text x="384" y="142" font-family="sans-serif" font-size="12" fill="#0f172a">Benign-looking: homogeneous, smooth,</text>
<text x="384" y="160" font-family="sans-serif" font-size="12" fill="#0f172a">≤10 HU on noncontrast CT (lipid-rich)</text>
<text x="384" y="186" font-family="sans-serif" font-size="12" fill="#0f172a">Worrying: large (≥4 cm), irregular,</text>
<text x="384" y="204" font-family="sans-serif" font-size="12" fill="#0f172a">heterogeneous, &gt;10 HU, calcification,</text>
<text x="384" y="222" font-family="sans-serif" font-size="12" fill="#0f172a">growth on follow-up</text>
<text x="384" y="248" font-family="sans-serif" font-size="12" fill="#0f172a">Biopsy rarely: never before excluding</text>
<text x="384" y="266" font-family="sans-serif" font-size="12" fill="#0f172a">pheochromocytoma</text>
<line x1="185" y1="284" x2="250" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#s23c-f150401-arrow)"/>
<line x1="535" y1="284" x2="470" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#s23c-f150401-arrow)"/>
<rect x="60" y="322" width="600" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="74" y="346" font-family="sans-serif" font-size="13" font-weight="bold" fill="#064e3b">Decision</text>
<text x="74" y="368" font-family="sans-serif" font-size="12" fill="#0f172a">Functioning or suspicious imaging → adrenalectomy (alpha blockade first for pheochromocytoma)</text>
<text x="74" y="390" font-family="sans-serif" font-size="12" fill="#0f172a">Small, benign-appearing, nonfunctioning → no further imaging needed for most</text>
</svg>
