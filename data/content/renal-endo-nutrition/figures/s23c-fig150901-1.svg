<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="How long-term glucocorticoid treatment suppresses the hypothalamic-pituitary-adrenal axis and why stopping it abruptly causes adrenal insufficiency">
<title>Glucocorticoid suppression of the HPA axis</title>
<defs><marker id="s23c-f150901-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<g font-family="sans-serif" font-size="13" fill="#0f172a">
<rect x="40" y="20" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="140" y="47" text-anchor="middle">Hypothalamus: CRH ↓</text>
<rect x="40" y="110" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="140" y="137" text-anchor="middle">Pituitary: ACTH ↓</text>
<rect x="40" y="200" width="200" height="60" rx="8" fill="#fef3c7" stroke="#334155"/><text x="140" y="225" text-anchor="middle">Adrenal fasciculata</text><text x="140" y="245" text-anchor="middle">atrophies; cortisol ↓</text>
<line x1="140" y1="64" x2="140" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f150901-arrow)"/>
<line x1="140" y1="154" x2="140" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f150901-arrow)"/>
<rect x="330" y="80" width="170" height="60" rx="8" fill="#fde2e2" stroke="#b91c1c"/><text x="415" y="105" text-anchor="middle" font-weight="bold">Exogenous</text><text x="415" y="125" text-anchor="middle" font-weight="bold">glucocorticoid</text>
<line x1="330" y1="95" x2="244" y2="45" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#s23c-f150901-arrow)"/>
<line x1="330" y1="120" x2="244" y2="132" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#s23c-f150901-arrow)"/>
<text x="248" y="100" font-size="12" fill="#7f1d1d">negative feedback</text>
<text x="40" y="300" font-weight="bold">Abrupt stop after weeks of therapy:</text>
<text x="40" y="322">ACTH and the atrophic adrenal take weeks to months to recover</text>
<text x="40" y="344">→ secondary (central) adrenal insufficiency: fatigue, nausea, hypotension, hypoglycemia</text>
<text x="40" y="366">Aldosterone is preserved (renin-angiotensin control), so hyperkalemia is not expected</text>
<rect x="530" y="20" width="180" height="250" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="540" y="44" font-weight="bold" fill="#065f46">Practical rules</text>
<text x="540" y="70" font-size="12">• Taper, do not stop,</text>
<text x="540" y="88" font-size="12">  after about 3 weeks</text>
<text x="540" y="106" font-size="12">  of supraphysiologic dose</text>
<text x="540" y="132" font-size="12">• Stress-dose steroids for</text>
<text x="540" y="150" font-size="12">  surgery, sepsis, trauma</text>
<text x="540" y="176" font-size="12">• Adrenal crisis: IV</text>
<text x="540" y="194" font-size="12">  hydrocortisone at once,</text>
<text x="540" y="212" font-size="12">  with IV fluids; test later</text>
<text x="540" y="238" font-size="12">• Dexamethasone does not</text>
<text x="540" y="256" font-size="12">  cross-react in cortisol assays</text>
</g>
</svg>
