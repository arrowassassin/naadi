<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-label="Where nutrients are absorbed along the gut, and which segments a Roux-en-Y gastric bypass removes from the food stream">
<title>Nutrient absorption sites and gastric bypass</title>
<defs><marker id="s23c-f160403-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="740" height="400" fill="#ffffff"/>
<text x="370" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Main absorption sites (top) and what a Roux-en-Y gastric bypass bypasses (bottom)</text>
<rect x="20" y="50" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="85" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Stomach</text>
<text x="85" y="94" font-family="sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">acid, intrinsic factor</text>
<rect x="165" y="50" width="160" height="56" rx="8" fill="#fde2e2" stroke="#334155" stroke-width="1.5"/>
<text x="245" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Duodenum</text>
<text x="245" y="94" font-family="sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">+ proximal jejunum</text>
<rect x="340" y="50" width="170" height="56" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="425" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Jejunum</text>
<text x="425" y="94" font-family="sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">bulk of absorption</text>
<rect x="525" y="50" width="195" height="56" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="622" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Terminal ileum</text>
<text x="622" y="94" font-family="sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">specific receptors</text>
<line x1="150" y1="78" x2="163" y2="78" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160403-arrow)"/>
<line x1="325" y1="78" x2="338" y2="78" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160403-arrow)"/>
<line x1="510" y1="78" x2="523" y2="78" stroke="#334155" stroke-width="2" marker-end="url(#s23c-f160403-arrow)"/>
<text x="24" y="134" font-family="sans-serif" font-size="11.5" fill="#0f172a">Releases B12 from food;</text>
<text x="24" y="150" font-family="sans-serif" font-size="11.5" fill="#0f172a">acid keeps iron soluble;</text>
<text x="24" y="166" font-family="sans-serif" font-size="11.5" fill="#0f172a">copper partly absorbed</text>
<text x="169" y="134" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">Iron</text>
<text x="169" y="150" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">Calcium (needs calcitriol)</text>
<text x="169" y="166" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">Copper</text>
<text x="169" y="182" font-family="sans-serif" font-size="11.5" fill="#0f172a">Zinc, folate, thiamine begin</text>
<text x="344" y="134" font-family="sans-serif" font-size="11.5" fill="#0f172a">Zinc, folate, thiamine</text>
<text x="344" y="150" font-family="sans-serif" font-size="11.5" fill="#0f172a">Most macronutrients</text>
<text x="344" y="166" font-family="sans-serif" font-size="11.5" fill="#0f172a">Water-soluble vitamins</text>
<text x="344" y="182" font-family="sans-serif" font-size="11.5" fill="#0f172a">Fat-soluble vitamins (with bile)</text>
<text x="529" y="134" font-family="sans-serif" font-size="11.5" fill="#0f172a">Vitamin B12-intrinsic factor</text>
<text x="529" y="150" font-family="sans-serif" font-size="11.5" fill="#0f172a">Bile acids (reabsorbed)</text>
<text x="529" y="166" font-family="sans-serif" font-size="11.5" fill="#0f172a">Magnesium partly (also colon)</text>
<line x1="20" y1="205" x2="720" y2="205" stroke="#cbd5e1" stroke-width="1"/>
<text x="20" y="232" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Roux-en-Y gastric bypass</text>
<rect x="20" y="248" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="65" y="273" font-family="sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">Small pouch</text>
<line x1="110" y1="268" x2="338" y2="268" stroke="#334155" stroke-width="3" marker-end="url(#s23c-f160403-arrow)"/>
<text x="224" y="260" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">food goes straight to the Roux limb</text>
<rect x="340" y="248" width="170" height="40" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="425" y="273" font-family="sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">Roux (alimentary) limb</text>
<rect x="165" y="300" width="160" height="40" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="245" y="317" font-family="sans-serif" font-size="11.5" fill="#7f1d1d" text-anchor="middle">Remnant stomach and</text>
<text x="245" y="333" font-family="sans-serif" font-size="11.5" fill="#7f1d1d" text-anchor="middle">duodenum: no food</text>
<text x="20" y="366" font-family="sans-serif" font-size="11.5" fill="#b91c1c">Lifelong risk: iron, calcium and vitamin D, copper, B12 (little acid and intrinsic factor), thiamine if vomiting.</text>
<text x="20" y="386" font-family="sans-serif" font-size="11" fill="#475569">Red: absorbed mainly in the bypassed segment. Naadi original diagram.</text>
</svg>
