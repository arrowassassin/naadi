<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Unilateral renal artery stenosis: the ischemic kidney releases renin, angiotensin II and aldosterone raise blood pressure, and the normal contralateral kidney suppresses its own renin">
<title>Unilateral renal artery stenosis</title>
<defs><marker id="s23c-f110501-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<rect x="340" y="20" width="40" height="300" rx="10" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="360" y="345" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Aorta</text>
<path d="M340,150 L250,150" stroke="#334155" stroke-width="10" fill="none"/>
<path d="M300,143 Q290,150 300,157" fill="#b91c1c"/>
<path d="M380,150 L470,150" stroke="#334155" stroke-width="10" fill="none"/>
<ellipse cx="200" cy="150" rx="50" ry="72" fill="#fde2e2" stroke="#334155" stroke-width="2"/>
<ellipse cx="520" cy="150" rx="50" ry="72" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<g font-family="sans-serif" font-size="12" fill="#0f172a">
<text x="290" y="132" text-anchor="middle">Stenosis</text>
<text x="200" y="40" text-anchor="middle" font-weight="bold">Stenotic kidney</text>
<text x="200" y="245" text-anchor="middle">Low perfusion pressure</text>
<text x="200" y="261" text-anchor="middle">→ renin HIGH</text>
<text x="200" y="277" text-anchor="middle">GFR held up by Ang II</text>
<text x="200" y="293" text-anchor="middle">constricting efferent arteriole</text>
<text x="520" y="40" text-anchor="middle" font-weight="bold">Contralateral kidney</text>
<text x="520" y="245" text-anchor="middle">High pressure → renin suppressed</text>
<text x="520" y="261" text-anchor="middle">pressure natriuresis</text>
<text x="520" y="277" text-anchor="middle">exposed to hypertensive injury</text>
</g>
<rect x="40" y="320" width="270" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="52" y="340" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">Systemic result</text>
<text x="52" y="358" font-family="sans-serif" font-size="12" fill="#0f172a">High renin + high aldosterone (secondary)</text>
<text x="52" y="376" font-family="sans-serif" font-size="12" fill="#0f172a">Hypertension, low K⁺, metabolic alkalosis</text>
<rect x="410" y="320" width="290" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="422" y="340" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">ACE inhibitor or ARB</text>
<text x="422" y="358" font-family="sans-serif" font-size="12" fill="#0f172a">Removes efferent tone → GFR of the stenotic</text>
<text x="422" y="376" font-family="sans-serif" font-size="12" fill="#0f172a">kidney falls; bilateral disease: creatinine jumps</text>
<line x1="200" y1="222" x2="200" y2="232" stroke="#334155" stroke-width="1.2" marker-end="url(#s23c-f110501-arrow)"/>
</svg>
