<text x="20" y="440" font-family="sans-serif" font-size="12" fill="#b91c1c">21-OH block: ↓ aldosterone, ↓ cortisol, ↑ 17-OH progesterone, ↑ androgens → salt wasting, virilisation</text>
<text x="20" y="462" font-family="sans-serif" font-size="12" fill="#0369a1">11β-OH block: ↑ 11-deoxycorticosterone (mineralocorticoid) → hypertension, ↑ androgens</text>
<text x="20" y="484" font-family="sans-serif" font-size="12" fill="#6d28d9">17α block: no cortisol or sex steroids; ↑ mineralocorticoid precursors → hypertension;</text><text x="20" y="502" font-family="sans-serif" font-size="12" fill="#6d28d9">   46,XY infants are undervirilised and 46,XX adolescents lack puberty</text>
<text x="20" y="526" font-family="sans-serif" font-size="12" fill="#475569">All: low cortisol → high ACTH → bilateral adrenal hyperplasia</text>
