<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Marasmus compared with kwashiorkor: intake, weight, edema, albumin, liver and skin findings">
<title>Marasmus and kwashiorkor compared</title>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Severe acute malnutrition: two clinical pictures</text>
<rect x="20" y="44" width="160" height="36" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<rect x="180" y="44" width="260" height="36" fill="#e0f2fe" stroke="#334155" stroke-width="1"/>
<rect x="440" y="44" width="260" height="36" fill="#fef3c7" stroke="#334155" stroke-width="1"/>
<text x="100" y="67" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Feature</text>
<text x="310" y="67" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Marasmus (wasting)</text>
<text x="570" y="67" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Kwashiorkor (edematous)</text>
<g font-family="sans-serif" font-size="12" fill="#0f172a">
<line x1="20" y1="118" x2="700" y2="118" stroke="#cbd5e1"/>
<text x="30" y="104">Deficit</text><text x="190" y="104">Too little energy overall</text><text x="450" y="104">Poor protein quality with illness, oxidative stress</text>
<line x1="20" y1="156" x2="700" y2="156" stroke="#cbd5e1"/>
<text x="30" y="142">Weight for height</text><text x="190" y="142">Very low; "skin and bones"</text><text x="450" y="142">Can look near normal (fluid hides loss)</text>
<line x1="20" y1="194" x2="700" y2="194" stroke="#cbd5e1"/>
<text x="30" y="180">Edema</text><text x="190" y="180">Absent</text><text x="450" y="180">Bilateral pitting, starts at the feet</text>
<line x1="20" y1="232" x2="700" y2="232" stroke="#cbd5e1"/>
<text x="30" y="218">Serum albumin</text><text x="190" y="218">Normal or mildly low</text><text x="450" y="218">Low (↓ plasma oncotic pressure)</text>
<line x1="20" y1="270" x2="700" y2="270" stroke="#cbd5e1"/>
<text x="30" y="256">Liver</text><text x="190" y="256">Normal size</text><text x="450" y="256">Enlarged, fatty (↓ apoB-100, VLDL export)</text>
<line x1="20" y1="308" x2="700" y2="308" stroke="#cbd5e1"/>
<text x="30" y="294">Skin and hair</text><text x="190" y="294">Thin, loose skin folds</text><text x="450" y="294">Peeling "flaky paint" patches; pale, sparse hair</text>
<line x1="20" y1="346" x2="700" y2="346" stroke="#cbd5e1"/>
<text x="30" y="332">Fat and muscle</text><text x="190" y="332">Both severely wasted</text><text x="450" y="332">Some fat kept; muscle wasted</text>
</g>
<text x="20" y="378" font-family="sans-serif" font-size="11.5" fill="#475569">Both: hypoglycemia, hypothermia, hidden infection and refeeding risk. Mixed forms (marasmic kwashiorkor) are common.</text>
</svg>
