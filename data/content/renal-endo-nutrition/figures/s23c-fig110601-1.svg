<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Where the lesion is decides the bladder: brain lesions give an overactive but coordinated bladder; spinal cord lesions above the sacral cord give an overactive bladder with detrusor-sphincter dyssynergia; sacral or peripheral nerve lesions give an underactive bladder with retention">
<title>Neurogenic bladder by level of lesion</title>
<rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
<text x="360" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Neurogenic bladder: the level of the lesion predicts the bladder</text>
<rect x="30" y="50" width="120" height="70" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="90" y="80" font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Cortex, pons</text>
<text x="90" y="98" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">(pontine micturition</text>
<text x="90" y="111" font-family="sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">centre coordinates)</text>
<rect x="70" y="120" width="40" height="160" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="90" y="205" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" transform="rotate(-90 90 205)">Spinal cord</text>
<rect x="62" y="280" width="56" height="40" rx="6" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="90" y="305" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">S2–S4</text>
<line x1="118" y1="300" x2="150" y2="360" stroke="#334155" stroke-width="2"/>
<text x="155" y="375" font-family="sans-serif" font-size="11" fill="#0f172a">pelvic (parasympathetic) and pudendal nerves</text>
<rect x="210" y="55" width="490" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="222" y="77" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Above the pons (stroke, dementia, Parkinson disease)</text>
<text x="222" y="97" font-family="sans-serif" font-size="12" fill="#0f172a">Detrusor overactivity: urgency and urge incontinence</text>
<text x="222" y="115" font-family="sans-serif" font-size="12" fill="#0f172a">Sphincter still relaxes on time: low residual volume, low risk to kidneys</text>
<rect x="210" y="160" width="490" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="222" y="182" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d">Spinal cord between pons and sacral cord (injury, MS)</text>
<text x="222" y="202" font-family="sans-serif" font-size="12" fill="#0f172a">Detrusor overactivity plus detrusor-sphincter dyssynergia</text>
<text x="222" y="220" font-family="sans-serif" font-size="12" fill="#0f172a">High bladder pressure: reflux, hydronephrosis, infection, renal damage</text>
<text x="222" y="238" font-family="sans-serif" font-size="12" fill="#0f172a">Injury at T6 or above: autonomic dysreflexia from a full bladder</text>
<rect x="210" y="280" width="490" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="222" y="302" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">Sacral cord, cauda equina, peripheral nerves (diabetes)</text>
<text x="222" y="322" font-family="sans-serif" font-size="12" fill="#0f172a">Underactive (areflexic) detrusor: retention, large residual,</text>
<text x="222" y="340" font-family="sans-serif" font-size="12" fill="#0f172a">overflow incontinence. Treat with clean intermittent catheterisation</text>
<line x1="152" y1="85" x2="205" y2="95" stroke="#334155" stroke-width="1.2"/>
<line x1="112" y1="200" x2="205" y2="205" stroke="#334155" stroke-width="1.2"/>
<line x1="120" y1="300" x2="205" y2="320" stroke="#334155" stroke-width="1.2"/>
<text x="360" y="400" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">Sympathetic T10–L2 (hypogastric) relaxes detrusor and closes the internal sphincter; parasympathetic S2–S4 contracts the detrusor.</text>
</svg>
