<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Comparison of renal tubular acidosis types 1, 2 and 4: defect, potassium, urine pH, stones and classic causes">
<title>Renal tubular acidosis at a glance</title>
<rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
<text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Normal anion gap metabolic acidosis of renal origin</text>
<rect x="10" y="40" width="130" height="270" fill="#f1f5f9" stroke="#334155"/>
<rect x="140" y="40" width="190" height="270" fill="#fef2f2" stroke="#334155"/>
<rect x="330" y="40" width="190" height="270" fill="#fffbeb" stroke="#334155"/>
<rect x="520" y="40" width="190" height="270" fill="#eff6ff" stroke="#334155"/>
<g font-family="sans-serif" font-size="12" fill="#0f172a">
<text x="235" y="62" text-anchor="middle" font-weight="bold">Type 1 (distal)</text>
<text x="425" y="62" text-anchor="middle" font-weight="bold">Type 2 (proximal)</text>
<text x="615" y="62" text-anchor="middle" font-weight="bold">Type 4 (hypoaldosteronism)</text>
<text x="18" y="95" font-weight="bold">Defect</text>
<text x="148" y="90">α-intercalated cells cannot</text><text x="148" y="104">secrete H⁺</text>
<text x="338" y="90">Proximal HCO₃⁻ reabsorption</text><text x="338" y="104">threshold is low</text>
<text x="528" y="90">Low aldosterone effect: less</text><text x="528" y="104">K⁺ and H⁺ secretion, low NH₄⁺</text>
<text x="18" y="140" font-weight="bold">Serum K⁺</text>
<text x="148" y="140">Low</text><text x="338" y="140">Low (worse with alkali)</text><text x="528" y="140" font-weight="bold">High</text>
<text x="18" y="180" font-weight="bold">Urine pH</text>
<text x="148" y="180">Above 5.5 even when acidotic</text><text x="338" y="174">Below 5.5 once serum HCO₃⁻</text><text x="338" y="188">falls below the threshold</text><text x="528" y="180">Below 5.5</text>
<text x="18" y="225" font-weight="bold">Stones, bone</text>
<text x="148" y="220">Calcium phosphate stones,</text><text x="148" y="234">nephrocalcinosis</text>
<text x="338" y="220">No stones; rickets or</text><text x="338" y="234">osteomalacia (with Fanconi)</text>
<text x="528" y="225">No stones</text>
<text x="18" y="275" font-weight="bold">Classic causes</text>
<text x="148" y="265">Sjögren syndrome, lupus,</text><text x="148" y="279">amphotericin B, lithium,</text><text x="148" y="293">hypercalciuria</text>
<text x="338" y="265">Fanconi syndrome, multiple</text><text x="338" y="279">myeloma, tenofovir, ifosfamide,</text><text x="338" y="293">acetazolamide</text>
<text x="528" y="265">Diabetic nephropathy, ACE</text><text x="528" y="279">inhibitors/ARBs, spironolactone,</text><text x="528" y="293">trimethoprim, heparin, NSAIDs</text>
</g>
</svg>
