<text x="120" y="70" font-family="sans-serif" font-size="12" fill="#991b1b">Rapid-acting (lispro, aspart, glulisine)</text>
<text x="160" y="132" font-family="sans-serif" font-size="12" fill="#78350f">Regular</text>
<text x="240" y="158" font-family="sans-serif" font-size="12" fill="#1e40af">NPH (intermediate)</text>
<text x="420" y="222" font-family="sans-serif" font-size="12" fill="#14532d">Long-acting basal (glargine, detemir, degludec): flat</text>
<text x="70" y="22" font-family="sans-serif" font-size="12" fill="#0f172a">Schematic only; durations vary with dose and patient. Only regular insulin is routinely given intravenously.</text>
