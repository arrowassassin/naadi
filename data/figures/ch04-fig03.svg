<svg aria-label="Iron studies comparison chart across six conditions" role="img" viewbox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<g fill="#0f172a" font-family="sans-serif" font-size="13">
<rect fill="#ffffff" height="36" stroke="#334155" width="200" x="20" y="20"></rect>
<text font-weight="bold" text-anchor="middle" x="120" y="43">Condition</text>
<rect fill="#ffffff" height="36" stroke="#334155" width="110" x="220" y="20"></rect>
<text font-weight="bold" text-anchor="middle" x="275" y="43">Serum iron</text>
<rect fill="#ffffff" height="36" stroke="#334155" width="110" x="330" y="20"></rect>
<text font-weight="bold" text-anchor="middle" x="385" y="43">Ferritin</text>
<rect fill="#ffffff" height="36" stroke="#334155" width="110" x="440" y="20"></rect>
<text font-weight="bold" text-anchor="middle" x="495" y="43">TIBC</text>
<rect fill="#ffffff" height="36" stroke="#334155" width="110" x="550" y="20"></rect>
<text font-weight="bold" text-anchor="middle" x="605" y="43">% saturation</text>
<rect fill="#ffffff" height="40" stroke="#334155" width="200" x="20" y="56"></rect><text x="30" y="81">Iron deficiency</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="220" y="56"></rect><text text-anchor="middle" x="275" y="81">↓</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="330" y="56"></rect><text text-anchor="middle" x="385" y="81">↓ (key)</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="440" y="56"></rect><text text-anchor="middle" x="495" y="81">↑</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="550" y="56"></rect><text text-anchor="middle" x="605" y="81">↓↓</text>
<rect fill="#ffffff" height="40" stroke="#334155" width="200" x="20" y="96"></rect><text x="30" y="121">Chronic disease (ACD)</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="220" y="96"></rect><text text-anchor="middle" x="275" y="121">↓</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="330" y="96"></rect><text text-anchor="middle" x="385" y="121">↑ or N</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="440" y="96"></rect><text text-anchor="middle" x="495" y="121">↓</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="550" y="96"></rect><text text-anchor="middle" x="605" y="121">N or ↓</text>
<rect fill="#ffffff" height="40" stroke="#334155" width="200" x="20" y="136"></rect><text x="30" y="161">Hemochromatosis</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="220" y="136"></rect><text text-anchor="middle" x="275" y="161">↑</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="330" y="136"></rect><text text-anchor="middle" x="385" y="161">↑</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="440" y="136"></rect><text text-anchor="middle" x="495" y="161">↓</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="550" y="136"></rect><text text-anchor="middle" x="605" y="161">↑↑ (&gt; 45%)</text>
<rect fill="#ffffff" height="40" stroke="#334155" width="200" x="20" y="176"></rect><text x="30" y="201">Sideroblastic / lead</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="220" y="176"></rect><text text-anchor="middle" x="275" y="201">↑</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="330" y="176"></rect><text text-anchor="middle" x="385" y="201">↑</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="440" y="176"></rect><text text-anchor="middle" x="495" y="201">↓ or N</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="550" y="176"></rect><text text-anchor="middle" x="605" y="201">↑</text>
<rect fill="#ffffff" height="40" stroke="#334155" width="200" x="20" y="216"></rect><text x="30" y="241">Thalassemia trait</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="220" y="216"></rect><text text-anchor="middle" x="275" y="241">N</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="330" y="216"></rect><text text-anchor="middle" x="385" y="241">N</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="440" y="216"></rect><text text-anchor="middle" x="495" y="241">N</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="550" y="216"></rect><text text-anchor="middle" x="605" y="241">N</text>
<rect fill="#ffffff" height="40" stroke="#334155" width="200" x="20" y="256"></rect><text x="30" y="281">Pregnancy / OCP use</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="220" y="256"></rect><text text-anchor="middle" x="275" y="281">N</text>
<rect fill="#dcfce7" height="40" stroke="#334155" width="110" x="330" y="256"></rect><text text-anchor="middle" x="385" y="281">N</text>
<rect fill="#fee2e2" height="40" stroke="#334155" width="110" x="440" y="256"></rect><text text-anchor="middle" x="495" y="281">↑ (transferrin)</text>
<rect fill="#e0f2fe" height="40" stroke="#334155" width="110" x="550" y="256"></rect><text text-anchor="middle" x="605" y="281">↓</text>
<rect fill="#fee2e2" height="14" stroke="#334155" width="16" x="20" y="310"></rect><text font-size="12" x="42" y="322">increased</text>
<rect fill="#e0f2fe" height="14" stroke="#334155" width="16" x="130" y="310"></rect><text font-size="12" x="152" y="322">decreased</text>
<rect fill="#dcfce7" height="14" stroke="#334155" width="16" x="240" y="310"></rect><text font-size="12" x="262" y="322">normal</text>
<text font-size="12" x="340" y="322">TIBC ≈ transferrin; % sat = iron ÷ TIBC</text>
</g>
</svg>