<svg aria-label="Frank-Starling curves showing normal, increased contractility and decreased contractility" role="img" viewbox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch05-arrow-f1" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<rect fill="#ffffff" height="360" width="700" x="0" y="0"></rect>
<line marker-end="url(#ch05-arrow-f1)" stroke="#334155" stroke-width="2" x1="70" x2="420" y1="310" y2="310"></line>
<line marker-end="url(#ch05-arrow-f1)" stroke="#334155" stroke-width="2" x1="70" x2="70" y1="310" y2="30"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="13" text-anchor="middle" x="245" y="340">Preload (LV end-diastolic volume / pressure)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 30 170)" x="30" y="170">Stroke volume / cardiac output</text>
<path d="M75,300 C140,130 220,80 410,62" fill="none" stroke="#16a34a" stroke-width="3"></path>
<path d="M75,302 C140,180 220,140 410,128" fill="none" stroke="#334155" stroke-width="3"></path>
<path d="M75,304 C150,240 240,215 410,206" fill="none" stroke="#dc2626" stroke-width="3"></path>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="415" y="58">↑ contractility</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="415" y="124">Normal</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="415" y="202">↓ contractility</text>
<circle cx="330" cy="210" fill="#fee2e2" r="6" stroke="#334155" stroke-width="2"></circle>
<circle cx="210" cy="226" fill="#fef3c7" r="6" stroke="#334155" stroke-width="2"></circle>
<circle cx="330" cy="70" fill="#dcfce7" r="6" stroke="#334155" stroke-width="2"></circle>
<line marker-end="url(#ch05-arrow-f1)" stroke="#334155" stroke-width="1.5" x1="322" x2="222" y1="212" y2="225"></line>
<line marker-end="url(#ch05-arrow-f1)" stroke="#334155" stroke-dasharray="5,4" stroke-width="1.5" x1="330" x2="330" y1="202" y2="80"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="200" y="250">Diuretic/venodilator: moves LEFT</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="200" y="265">on same curve (↓ congestion, small ↓ SV)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="338" y="150">Inotrope: moves UP</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="338" y="165">to a higher curve</text>
<rect fill="#dcfce7" height="120" rx="6" stroke="#334155" width="170" x="525" y="40"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="535" y="60">↑ Contractility</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="78">Catecholamines</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="94">Dobutamine, milrinone</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="110">Digoxin</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="126">↑ intracellular Ca²⁺</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="142">↓ extracellular Na⁺</text>
<rect fill="#fee2e2" height="120" rx="6" stroke="#334155" width="170" x="525" y="180"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="535" y="200">↓ Contractility</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="218">HFrEF, MI (myocyte loss)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="234">β-blockers (acute)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="250">Non-DHP CCBs</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="266">Acidosis, hypoxia</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="535" y="282">Hypercapnia</text>
</svg>