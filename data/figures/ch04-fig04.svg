<svg aria-label="Comparison of intravascular and extravascular hemolysis pathways, labs, and causes" role="img" viewbox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<g fill="#0f172a" font-family="sans-serif" font-size="13">
<rect fill="#fee2e2" height="38" rx="8" stroke="#334155" width="300" x="20" y="12"></rect>
<text font-weight="bold" text-anchor="middle" x="170" y="36">Intravascular (inside vessels)</text>
<rect fill="#fef3c7" height="38" rx="8" stroke="#334155" width="300" x="360" y="12"></rect>
<text font-weight="bold" text-anchor="middle" x="510" y="36">Extravascular (spleen / liver)</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="20" y="68"></rect>
<text font-size="12" text-anchor="middle" x="170" y="93">RBC lysed in circulation → free Hb in plasma</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="20" y="130"></rect>
<text font-size="12" text-anchor="middle" x="170" y="155">Hb binds haptoglobin → haptoglobin ↓↓ (absent)</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="20" y="192"></rect>
<text font-size="12" text-anchor="middle" x="170" y="217">Excess Hb filtered → hemoglobinuria</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="20" y="254"></rect>
<text font-size="12" text-anchor="middle" x="170" y="279">Tubular cells store iron → hemosiderinuria (days)</text>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="170" x2="170" y1="108" y2="128"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="170" x2="170" y1="170" y2="190"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="170" x2="170" y1="232" y2="252"></line>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="360" y="68"></rect>
<text font-size="12" text-anchor="middle" x="510" y="93">Coated/rigid RBCs eaten by macrophages</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="360" y="130"></rect>
<text font-size="12" text-anchor="middle" x="510" y="155">Heme → biliverdin → unconjugated bilirubin</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="360" y="192"></rect>
<text font-size="12" text-anchor="middle" x="510" y="217">Jaundice, pigment (black) gallstones</text>
<rect fill="#ffffff" height="40" rx="6" stroke="#334155" width="300" x="360" y="254"></rect>
<text font-size="12" text-anchor="middle" x="510" y="279">Splenomegaly, spherocytes; no hemoglobinuria</text>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="510" x2="510" y1="108" y2="128"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="510" x2="510" y1="170" y2="190"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="510" x2="510" y1="232" y2="252"></line>
<rect fill="#fee2e2" height="64" rx="6" stroke="#334155" width="300" x="20" y="312"></rect>
<text font-size="12" font-weight="bold" x="30" y="332">Causes:</text>
<text font-size="12" x="30" y="350">PNH, MAHA (TTP/HUS/DIC), mechanical valve,</text>
<text font-size="12" x="30" y="367">G6PD crisis, ABO mismatch, cold AIHA, malaria</text>
<rect fill="#fef3c7" height="64" rx="6" stroke="#334155" width="300" x="360" y="312"></rect>
<text font-size="12" font-weight="bold" x="370" y="332">Causes:</text>
<text font-size="12" x="370" y="350">Hereditary spherocytosis, warm AIHA,</text>
<text font-size="12" x="370" y="367">sickle cell, HbC, PK deficiency, thalassemia</text>
<rect fill="#dcfce7" height="32" rx="6" stroke="#334155" width="640" x="20" y="390"></rect>
<text font-size="12" text-anchor="middle" x="340" y="411">Both: ↑ LDH, ↑ reticulocytes, ↑ indirect bilirubin, ↓ haptoglobin (deeper in intravascular)</text>
</g>
</svg>