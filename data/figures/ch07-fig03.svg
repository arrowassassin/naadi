<svg aria-label="Circle of Willis with cortical territories and classic stroke deficits" role="img" viewbox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch07-arrow2" markerheight="10" markerwidth="10" orient="auto" refx="9" refy="5"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<!-- ACA -->
<line stroke="#334155" stroke-width="3" x1="170" x2="150" y1="60" y2="20"></line>
<line stroke="#334155" stroke-width="3" x1="210" x2="230" y1="60" y2="20"></line>
<line stroke="#334155" stroke-width="3" x1="170" x2="210" y1="60" y2="60"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle" x="190" y="52">AComm</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="125" y="20">ACA</text>
<!-- ICA -->
<line stroke="#334155" stroke-width="3" x1="170" x2="150" y1="60" y2="120"></line>
<line stroke="#334155" stroke-width="3" x1="210" x2="230" y1="60" y2="120"></line>
<circle cx="150" cy="120" fill="#fee2e2" r="6" stroke="#334155"></circle><circle cx="230" cy="120" fill="#fee2e2" r="6" stroke="#334155"></circle>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="100" y="125">ICA</text>
<!-- MCA -->
<line stroke="#334155" stroke-width="3" x1="150" x2="60" y1="120" y2="115"></line>
<line stroke="#334155" stroke-width="3" x1="230" x2="320" y1="120" y2="115"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="40" y="105">MCA</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="300" y="105">MCA</text>
<!-- PComm -->
<line stroke="#334155" stroke-width="3" x1="150" x2="160" y1="120" y2="190"></line>
<line stroke="#334155" stroke-width="3" x1="230" x2="220" y1="120" y2="190"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="85" y="160">PComm</text>
<!-- PCA -->
<line stroke="#334155" stroke-width="3" x1="160" x2="190" y1="190" y2="200"></line>
<line stroke="#334155" stroke-width="3" x1="220" x2="190" y1="190" y2="200"></line>
<line stroke="#334155" stroke-width="3" x1="160" x2="80" y1="190" y2="215"></line>
<line stroke="#334155" stroke-width="3" x1="220" x2="300" y1="190" y2="215"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="45" y="235">PCA</text>
<!-- SCA -->
<line stroke="#334155" stroke-width="2" x1="190" x2="110" y1="215" y2="240"></line><line stroke="#334155" stroke-width="2" x1="190" x2="270" y1="215" y2="240"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="255" y="258">SCA</text>
<!-- basilar -->
<line stroke="#334155" stroke-width="4" x1="190" x2="190" y1="200" y2="310"></line>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="198" y="280">Basilar</text>
<line stroke="#334155" stroke-width="2" x1="190" x2="110" y1="275" y2="290"></line><text fill="#0f172a" font-family="sans-serif" font-size="12" x="60" y="300">AICA</text>
<!-- vertebral -->
<line stroke="#334155" stroke-width="3" x1="190" x2="160" y1="310" y2="380"></line><line stroke="#334155" stroke-width="3" x1="190" x2="220" y1="310" y2="380"></line>
<line stroke="#334155" stroke-width="2" x1="170" x2="110" y1="355" y2="360"></line><text fill="#0f172a" font-family="sans-serif" font-size="12" x="60" y="372">PICA</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="228" y="375">Vertebral</text>
<!-- table of deficits -->
<rect fill="#fef3c7" height="85" stroke="#334155" width="285" x="345" y="20"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="355" y="38">ACA (medial surface)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="56">Contralateral leg &gt; arm weakness/sensory</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="74">Abulia, urinary incontinence</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="92">AComm = most common aneurysm site</text>
<rect fill="#e0f2fe" height="125" stroke="#334155" width="285" x="345" y="115"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="355" y="133">MCA (lateral convexity)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="151">Contralateral face + arm &gt; leg weakness</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="169">Dominant: aphasia (Broca/Wernicke)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="187">Nondominant: hemineglect</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="205">Gaze deviates TOWARD lesion</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="223">Lenticulostriates: lacunes, internal capsule</text>
<rect fill="#dcfce7" height="85" stroke="#334155" width="285" x="345" y="250"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="355" y="268">PCA (occipital, thalamus)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="286">Contralateral homonymous hemianopia</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="304">with macular sparing (MCA collateral)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="322">Dominant: alexia without agraphia</text>
<rect fill="#fee2e2" height="45" stroke="#334155" width="285" x="345" y="345"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="363">PComm aneurysm → CN III palsy</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="355" y="381">with blown pupil</text>
</svg>