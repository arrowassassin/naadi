<svg aria-label="Hypothalamic-pituitary-adrenal axis with negative feedback loops and interpretation of dexamethasone suppression testing" role="img" viewbox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch06-arrow3" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<rect fill="#fef3c7" height="86" rx="6" stroke="#334155" width="105" x="10" y="10"></rect>
<text font-weight="bold" x="18" y="28">Inputs</text>
<text x="18" y="46">Stress</text>
<text x="18" y="62">Hypoglycemia</text>
<text x="18" y="78">Circadian (peak</text>
<text x="18" y="92">~6–8 AM)</text>
<line marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-width="2" x1="115" x2="198" y1="38" y2="38"></line>
<rect fill="#e0f2fe" height="50" rx="6" stroke="#334155" width="190" x="200" y="25"></rect>
<text font-weight="bold" x="210" y="45">Hypothalamus (PVN)</text>
<text x="210" y="63">secretes CRH (portal blood)</text>
<line marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-width="2" x1="295" x2="295" y1="75" y2="113"></line>
<rect fill="#e0f2fe" height="50" rx="6" stroke="#334155" width="190" x="200" y="115"></rect>
<text font-weight="bold" x="210" y="135">Anterior pituitary</text>
<text x="210" y="153">POMC → ACTH (+ MSH)</text>
<line marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-width="2" x1="295" x2="295" y1="165" y2="203"></line>
<rect fill="#dcfce7" height="50" rx="6" stroke="#334155" width="190" x="200" y="205"></rect>
<text font-weight="bold" x="210" y="225">Adrenal cortex</text>
<text x="210" y="243">zona fasciculata</text>
<line marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-width="2" x1="295" x2="295" y1="255" y2="293"></line>
<rect fill="#dcfce7" height="50" rx="6" stroke="#334155" width="190" x="200" y="295"></rect>
<text font-weight="bold" x="210" y="315">Cortisol</text>
<text x="210" y="333">(~90% bound to CBG)</text>
<path d="M200,320 C150,320 150,140 198,140" fill="none" marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-dasharray="6,4" stroke-width="2"></path>
<path d="M200,330 C110,330 110,62 198,62" fill="none" marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-dasharray="6,4" stroke-width="2"></path>
<text font-weight="bold" x="20" y="215">− feedback</text>
<text x="20" y="231">(dashed)</text>
<text x="20" y="365">Actions: ↑ gluconeogenesis, ↑ BP (↑ α1 response),</text>
<text x="20" y="381">↓ immunity, ↓ bone formation, insulin resistance</text>
<rect fill="#fef3c7" height="120" rx="6" stroke="#334155" width="220" x="410" y="25"></rect>
<text font-weight="bold" x="418" y="43">Screen for Cushing syndrome</text>
<text x="418" y="61">(any 1–2 of):</text>
<text x="418" y="79">24-h urine free cortisol ↑</text>
<text x="418" y="97">Late-night salivary cortisol ↑</text>
<text x="418" y="115">1-mg overnight dexamethasone:</text>
<text x="418" y="133">no suppression of AM cortisol</text>
<line marker-end="url(#ch06-arrow3)" stroke="#334155" stroke-width="2" x1="520" x2="520" y1="145" y2="168"></line>
<rect fill="#e0f2fe" height="40" rx="6" stroke="#334155" width="220" x="410" y="170"></rect>
<text font-weight="bold" x="418" y="195">Measure plasma ACTH</text>
<rect fill="#fee2e2" height="50" rx="6" stroke="#334155" width="220" x="410" y="225"></rect>
<text x="418" y="244">ACTH ↓ → adrenal source or</text>
<text x="418" y="262">exogenous steroid → adrenal CT</text>
<rect fill="#dcfce7" height="95" rx="6" stroke="#334155" width="220" x="410" y="285"></rect>
<text x="418" y="303">ACTH ↑ → high-dose dex / CRH test:</text>
<text x="418" y="321">Suppresses (CRH ↑ ACTH) →</text>
<text x="418" y="337">pituitary adenoma (Cushing</text>
<text x="418" y="353">disease) → MRI ± IPSS</text>
<text x="418" y="371">No suppression → ectopic ACTH</text>
</g>
</svg>