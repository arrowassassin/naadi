<text fill="#0f172a" font-size="12" text-anchor="start" x="650" y="315">Chronic HBV: HBsAg &gt; 6 months,</text>
<text fill="#0f172a" font-size="12" text-anchor="start" x="650" y="332">anti-HBs never appears.</text>
