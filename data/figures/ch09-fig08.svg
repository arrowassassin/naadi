<svg aria-label="HIV management timeline" role="img" viewbox="0 0 640 470" xmlns="http://www.w3.org/2000/svg">
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<g text-anchor="middle">
<rect fill="#fee2e2" height="62" rx="6" stroke="#334155" width="118" x="11" y="10"></rect>
<text font-weight="bold" x="70" y="28">Diagnosis</text>
<text x="70" y="44">Ag/Ab screen →</text>
<text x="70" y="60">differentiation</text>
<rect fill="#dcfce7" height="62" rx="6" stroke="#334155" width="118" x="136" y="10"></rect>
<text font-weight="bold" x="195" y="28">Start ART</text>
<text x="195" y="44">same day–7 days</text>
<text x="195" y="60">any CD4 count</text>
<rect fill="#e0f2fe" height="62" rx="6" stroke="#334155" width="118" x="261" y="10"></rect>
<text font-weight="bold" x="320" y="28">Weeks 2–8</text>
<text x="320" y="44">viral load, labs,</text>
<text x="320" y="60">adherence check</text>
<rect fill="#e0f2fe" height="62" rx="6" stroke="#334155" width="118" x="386" y="10"></rect>
<text font-weight="bold" x="445" y="28">By 12–24 wk</text>
<text x="445" y="44">VL undetectable</text>
<text x="445" y="60">(&lt;50 copies/mL)</text>
<rect fill="#fef3c7" height="62" rx="6" stroke="#334155" width="118" x="511" y="10"></rect>
<text font-weight="bold" x="570" y="28">Long term</text>
<text x="570" y="44">VL every 3–6 mo;</text>
<text x="570" y="60">CD4 less often</text>
<line stroke="#334155" stroke-width="2" x1="40" x2="600" y1="100" y2="100"></line>
<circle cx="70" cy="100" fill="#fee2e2" r="6" stroke="#334155"></circle>
<circle cx="195" cy="100" fill="#dcfce7" r="6" stroke="#334155"></circle>
<circle cx="320" cy="100" fill="#e0f2fe" r="6" stroke="#334155"></circle>
<circle cx="445" cy="100" fill="#e0f2fe" r="6" stroke="#334155"></circle>
<circle cx="570" cy="100" fill="#fef3c7" r="6" stroke="#334155"></circle>
<line stroke="#334155" x1="70" x2="70" y1="72" y2="94"></line>
<line stroke="#334155" x1="195" x2="195" y1="72" y2="94"></line>
<line stroke="#334155" x1="320" x2="320" y1="72" y2="94"></line>
<line stroke="#334155" x1="445" x2="445" y1="72" y2="94"></line>
<line stroke="#334155" x1="570" x2="570" y1="72" y2="94"></line>
<text x="320" y="124">Unsuppressed VL &gt;200 after 24 wk → adherence, interactions, resistance genotype</text>
</g>
<rect fill="#ffffff" height="150" rx="6" stroke="#334155" width="305" x="10" y="138"></rect>
<text font-weight="bold" x="20" y="156">Baseline labs (do not delay ART for results)</text>
<text x="20" y="176">• CD4, HIV RNA, genotype (RT/protease;</text>
<text x="20" y="191">  integrase if prior cabotegravir PrEP)</text>
<text x="20" y="209">• HLA-B*57:01 only if abacavir planned</text>
<text x="20" y="227">• HBV panel, HCV Ab, HAV IgG</text>
<text x="20" y="245">• Creatinine, UA, LFTs, lipids, A1c</text>
<text x="20" y="263">• Pregnancy, syphilis, GC/CT NAAT</text>
<text x="20" y="281">• TB (IGRA), Toxoplasma IgG</text>
<rect fill="#dcfce7" height="150" rx="6" stroke="#334155" width="305" x="325" y="138"></rect>
<text font-weight="bold" x="335" y="156">Preferred initial regimens (DHHS)</text>
<text x="335" y="176">• BIC/FTC/TAF (single tablet)</text>
<text x="335" y="194">• DTG + (TAF or TDF) + (FTC or 3TC)</text>
<text x="335" y="212">• DTG/3TC only if VL &lt;500,000,</text>
<text x="335" y="227">  HBV-negative, genotype known</text>
<text x="335" y="245">• HBV coinfection: include TDF/TAF</text>
<text x="335" y="263">• Pregnancy: DTG-based preferred</text>
<text x="335" y="281">• Rapid start: BIC- or DTG-based</text>
<rect fill="#fef3c7" height="160" rx="6" stroke="#334155" width="305" x="10" y="300"></rect>
<text font-weight="bold" x="20" y="318">OI prophylaxis by CD4 (cells/µL)</text>
<text x="20" y="338">• &lt;200 (or thrush): TMP-SMX → PJP</text>
<text x="20" y="356">• &lt;100 + Toxo IgG+: TMP-SMX DS</text>
<text x="20" y="374">• &lt;50: MAC prophylaxis NOT needed</text>
<text x="20" y="389">  if ART started at once</text>
<text x="20" y="407">• Sulfa allergy: dapsone (G6PD!)</text>
<text x="20" y="422">  or atovaquone</text>
<text x="20" y="440">• Stop PJP when CD4 &gt;200 for</text>
<text x="20" y="455">  ≥3 months on ART</text>
<rect fill="#fee2e2" height="160" rx="6" stroke="#334155" width="305" x="325" y="300"></rect>
<text font-weight="bold" x="335" y="318">ART timing with an active OI</text>
<text x="335" y="338">• PJP, toxo, most OIs: within 2 weeks</text>
<text x="335" y="356">• TB, CD4 &lt;50: within 2 weeks</text>
<text x="335" y="374">• TB, CD4 ≥50: within 8 weeks</text>
<text x="335" y="392">• Cryptococcal meningitis: DELAY</text>
<text x="335" y="407">  4–6 weeks (early ART ↑ fatal IRIS)</text>
<text x="335" y="425">• IRIS: continue ART;</text>
<text x="335" y="440">  NSAIDs or prednisone</text>
</g>
</svg>