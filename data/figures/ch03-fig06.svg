<svg aria-label="Overlapping distributions of a test value in healthy and diseased people with a cutoff line, and an ROC curve." role="img" viewbox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch03-arrow5" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<text font-size="14" font-weight="bold" text-anchor="middle" x="170" y="22">A. Moving the cutoff</text>
<polygon fill="#dcfce7" points="25,280 25,278.2 42.5,273 60,258.4 77.5,228 95,183 112.5,139 130,120 147.5,139 165,183 182.5,228 200,258.4 217.5,273 235,278.2 235,280" stroke="#334155" stroke-width="2"></polygon>
<polygon fill="#fee2e2" fill-opacity="0.75" points="105,280 105,278.2 122.5,273 140,258.4 157.5,228 175,183 192.5,139 210,120 227.5,139 245,183 262.5,228 280,258.4 297.5,273 315,278.2 315,280" stroke="#334155" stroke-width="2"></polygon>
<line marker-end="url(#ch03-arrow5)" stroke="#334155" stroke-width="1.5" x1="20" x2="325" y1="280" y2="280"></line>
<line stroke="#334155" stroke-width="2.5" x1="170" x2="170" y1="95" y2="290"></line>
<text font-weight="bold" text-anchor="middle" x="170" y="90">cutoff</text>
<text text-anchor="middle" x="80" y="112">No disease</text>
<text text-anchor="middle" x="262" y="112">Disease</text>
<text font-weight="bold" text-anchor="middle" x="95" y="255">TN</text>
<text font-weight="bold" text-anchor="middle" x="245" y="255">TP</text>
<text font-weight="bold" text-anchor="middle" x="150" y="274">FN</text>
<text font-weight="bold" text-anchor="middle" x="190" y="274">FP</text>
<text text-anchor="middle" x="170" y="300">Test value (positive if right of cutoff) →</text>
<line marker-end="url(#ch03-arrow5)" stroke="#334155" stroke-width="1.5" x1="165" x2="95" y1="318" y2="318"></line>
<text x="20" y="338">Cutoff ← (lower): ↑Sn, ↓Sp, ↑FP, ↓FN, ↑NPV, ↓PPV</text>
<line marker-end="url(#ch03-arrow5)" stroke="#334155" stroke-width="1.5" x1="175" x2="245" y1="318" y2="318"></line>
<text x="20" y="354">Cutoff → (higher): ↑Sp, ↓Sn, ↓FP, ↑FN, ↑PPV, ↓NPV</text>
<text font-size="14" font-weight="bold" text-anchor="middle" x="500" y="22">B. ROC curve</text>
<line marker-end="url(#ch03-arrow5)" stroke="#334155" stroke-width="1.5" x1="380" x2="628" y1="300" y2="300"></line>
<line marker-end="url(#ch03-arrow5)" stroke="#334155" stroke-width="1.5" x1="380" x2="380" y1="300" y2="50"></line>
<line stroke="#334155" stroke-dasharray="6 5" x1="380" x2="620" y1="300" y2="60"></line>
<text text-anchor="middle" x="560" y="150">AUC 0.5</text><text text-anchor="middle" x="560" y="165">(useless test)</text>
<path d="M380,300 C390,140 460,75 620,60" fill="none" stroke="#334155" stroke-width="3"></path>
<circle cx="380" cy="60" fill="#dcfce7" r="5" stroke="#334155"></circle>
<text x="390" y="52">Perfect test (AUC 1.0)</text>
<circle cx="393" cy="215" fill="#fef3c7" r="5" stroke="#334155"></circle>
<text x="408" y="190">High cutoff</text><text x="408" y="205">↑Sp ↓Sn</text>
<circle cx="500" cy="88" fill="#fee2e2" r="5" stroke="#334155"></circle>
<text x="480" y="124">Low cutoff</text><text x="480" y="139">↑Sn ↓Sp</text>
<text text-anchor="middle" x="505" y="322">1 − Specificity (false-positive rate)</text>
<text text-anchor="middle" transform="rotate(-90 362 180)" x="362" y="180">Sensitivity (TP rate)</text>
</g>
</svg>