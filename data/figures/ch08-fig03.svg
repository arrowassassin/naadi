<svg aria-label="Simplified ACLS adult pulseless arrest algorithm" role="img" viewbox="0 0 640 430" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch08-arrow3" markerheight="10" markerwidth="10" orient="auto" refx="9" refy="5"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">
<rect fill="#e0f2fe" height="44" rx="6" stroke="#334155" width="400" x="120" y="8"></rect>
<text font-weight="bold" x="320" y="26">Unresponsive, no pulse: start CPR</text>
<text x="320" y="43">100–120/min · 5–6 cm · O2 · attach monitor/defibrillator</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="320" x2="320" y1="52" y2="70"></line>
<rect fill="#fef3c7" height="34" rx="6" stroke="#334155" width="200" x="220" y="72"></rect>
<text font-weight="bold" x="320" y="94">Rhythm shockable?</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="220" x2="165" y1="89" y2="122"></line>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="420" x2="475" y1="89" y2="122"></line>
<text x="175" y="98">Yes: VF / pVT</text>
<text x="470" y="98">No: PEA / asystole</text>
<rect fill="#fee2e2" height="36" rx="6" stroke="#334155" width="290" x="20" y="124"></rect>
<text x="165" y="147">SHOCK (120–200 J) → CPR 2 min, IV/IO</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="165" x2="165" y1="160" y2="176"></line>
<rect fill="#fee2e2" height="44" rx="6" stroke="#334155" width="290" x="20" y="178"></rect>
<text x="165" y="196">SHOCK → CPR 2 min</text>
<text x="165" y="213">+ EPINEPHRINE 1 mg q3–5 min</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="165" x2="165" y1="222" y2="238"></line>
<rect fill="#fee2e2" height="60" rx="6" stroke="#334155" width="290" x="20" y="240"></rect>
<text x="165" y="258">SHOCK → CPR 2 min</text>
<text x="165" y="275">+ AMIODARONE 300 mg (2nd dose 150 mg)</text>
<text x="165" y="292">or lidocaine 1–1.5 mg/kg</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="165" x2="165" y1="300" y2="316"></line>
<rect fill="#fef3c7" height="36" rx="6" stroke="#334155" width="290" x="20" y="318"></rect>
<text x="165" y="341">Repeat cycle; treat reversible causes</text>
<rect fill="#dcfce7" height="44" rx="6" stroke="#334155" width="290" x="330" y="124"></rect>
<text x="475" y="142">CPR 2 min, IV/IO access</text>
<text x="475" y="159">EPINEPHRINE 1 mg ASAP, then q3–5 min</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="475" x2="475" y1="168" y2="184"></line>
<rect fill="#dcfce7" height="44" rx="6" stroke="#334155" width="290" x="330" y="186"></rect>
<text x="475" y="204">Rhythm check every 2 min</text>
<text x="475" y="221">Becomes shockable → go to left column</text>
<line marker-end="url(#ch08-arrow3)" stroke="#334155" x1="475" x2="475" y1="230" y2="246"></line>
<rect fill="#dcfce7" height="44" rx="6" stroke="#334155" width="290" x="330" y="248"></rect>
<text x="475" y="266">No defibrillation, no atropine</text>
<text x="475" y="283">for PEA/asystole</text>
<rect fill="#e0f2fe" height="58" rx="6" stroke="#334155" width="600" x="20" y="364"></rect>
<text font-weight="bold" x="320" y="383">Reversible causes: H's &amp; T's</text>
<text x="320" y="400">Hypovolemia · Hypoxia · H+ (acidosis) · Hypo/Hyperkalemia · Hypothermia</text>
<text x="320" y="416">Tension pneumothorax · Tamponade · Toxins · Thrombosis (PE, coronary)</text>
</g>
</svg>