<svg aria-label="Liver enzyme pattern chart" role="img" viewbox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch09-arrow2" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<rect fill="#e0f2fe" height="40" rx="6" stroke="#334155" width="400" x="120" y="8"></rect>
<text font-weight="bold" text-anchor="middle" x="320" y="25">Abnormal liver chemistries → repeat, assess pattern</text>
<text text-anchor="middle" x="320" y="41">R = (ALT ÷ ULN) ÷ (ALP ÷ ULN)</text>
<line marker-end="url(#ch09-arrow2)" stroke="#334155" x1="200" x2="125" y1="48" y2="64"></line>
<line marker-end="url(#ch09-arrow2)" stroke="#334155" x1="320" x2="320" y1="48" y2="64"></line>
<line marker-end="url(#ch09-arrow2)" stroke="#334155" x1="440" x2="515" y1="48" y2="64"></line>
<rect fill="#fee2e2" height="30" rx="6" stroke="#334155" width="230" x="10" y="66"></rect>
<text font-weight="bold" text-anchor="middle" x="125" y="86">Hepatocellular (R ≥5)</text>
<rect fill="#fef3c7" height="30" rx="6" stroke="#334155" width="140" x="250" y="66"></rect>
<text font-weight="bold" text-anchor="middle" x="320" y="86">Mixed (R 2–5)</text>
<rect fill="#dcfce7" height="30" rx="6" stroke="#334155" width="230" x="400" y="66"></rect>
<text font-weight="bold" text-anchor="middle" x="515" y="86">Cholestatic (R ≤2)</text>
<rect fill="#ffffff" height="250" rx="6" stroke="#334155" width="230" x="10" y="104"></rect>
<text font-weight="bold" x="20" y="122">ALT/AST &gt;1000 (acute):</text>
<text x="20" y="138">• Ischemic hepatitis (shock, LDH ↑↑)</text>
<text x="20" y="154">• Acetaminophen → NAC at once</text>
<text x="20" y="170">• Acute viral (A, B, E), HSV</text>
<text x="20" y="186">• Autoimmune hepatitis (ASMA, IgG)</text>
<text x="20" y="202">• Budd–Chiari, passed CBD stone</text>
<text font-weight="bold" x="20" y="224">Chronic mild rise (&lt;5× ULN):</text>
<text x="20" y="240">• MASLD (ALT &gt; AST, metabolic)</text>
<text x="20" y="256">• Alcohol (AST:ALT ≥2, ↑GGT)</text>
<text x="20" y="272">• HBV, HCV → serology/RNA</text>
<text x="20" y="288">• Hemochromatosis (TSAT &gt;45%)</text>
<text x="20" y="304">• Wilson (&lt;40 y: ceruloplasmin)</text>
<text x="20" y="320">• α1-antitrypsin, celiac (tTG-IgA)</text>
<text x="20" y="336">• Drugs: statins, INH, MTX, herbals</text>
<rect fill="#ffffff" height="130" rx="6" stroke="#334155" width="140" x="250" y="104"></rect>
<text text-anchor="middle" x="320" y="124">Drug-induced</text>
<text text-anchor="middle" x="320" y="140">(amox-clavulanate),</text>
<text text-anchor="middle" x="320" y="156">alcohol, infiltrative</text>
<text text-anchor="middle" x="320" y="172">disease, hepatitis</text>
<text text-anchor="middle" x="320" y="188">with cholestasis</text>
<text font-weight="bold" text-anchor="middle" x="320" y="210">→ work up both</text>
<text font-weight="bold" text-anchor="middle" x="320" y="226">arms</text>
<rect fill="#ffffff" height="44" rx="6" stroke="#334155" width="230" x="400" y="104"></rect>
<text text-anchor="middle" x="515" y="121">Confirm hepatic source: ↑GGT</text>
<text font-weight="bold" text-anchor="middle" x="515" y="139">→ RUQ ultrasound</text>
<line marker-end="url(#ch09-arrow2)" stroke="#334155" x1="470" x2="460" y1="148" y2="164"></line>
<line marker-end="url(#ch09-arrow2)" stroke="#334155" x1="560" x2="570" y1="148" y2="164"></line>
<rect fill="#fef3c7" height="92" rx="6" stroke="#334155" width="108" x="400" y="166"></rect>
<text font-weight="bold" text-anchor="middle" x="454" y="184">Dilated ducts</text>
<text text-anchor="middle" x="454" y="200">MRCP or EUS</text>
<text text-anchor="middle" x="454" y="216">→ ERCP to treat</text>
<text text-anchor="middle" x="454" y="232">stone/stricture;</text>
<text text-anchor="middle" x="454" y="248">CT if mass</text>
<rect fill="#dcfce7" height="188" rx="6" stroke="#334155" width="114" x="516" y="166"></rect>
<text font-weight="bold" text-anchor="middle" x="573" y="184">Non-dilated</text>
<text text-anchor="middle" x="573" y="202">AMA+ → PBC</text>
<text text-anchor="middle" x="573" y="218">(ursodiol)</text>
<text text-anchor="middle" x="573" y="238">MRCP beading</text>
<text text-anchor="middle" x="573" y="254">→ PSC (UC)</text>
<text text-anchor="middle" x="573" y="274">Drugs, sepsis,</text>
<text text-anchor="middle" x="573" y="290">TPN, infiltrative</text>
<text text-anchor="middle" x="573" y="310">AMA– and MRCP</text>
<text text-anchor="middle" x="573" y="326">normal → liver</text>
<text text-anchor="middle" x="573" y="342">biopsy</text>
<rect fill="#e0f2fe" height="46" rx="6" stroke="#334155" width="620" x="10" y="366"></rect>
<text text-anchor="middle" x="320" y="384">Isolated ↑ unconjugated bilirubin, normal enzymes &amp; CBC, rises with fasting/illness → Gilbert syndrome</text>
<text text-anchor="middle" x="320" y="402">Isolated ↑ALP with normal GGT → bone (Paget, metastases, growth, pregnancy = placental ALP)</text>
</g>
</svg>