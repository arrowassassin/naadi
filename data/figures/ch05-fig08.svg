<text fill="#0f172a" font-family="sans-serif" font-size="12" x="106" y="22">~65% Na⁺/H₂O (isotonic); all</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="106" y="38">glucose &amp; AA; ~85% HCO₃⁻; NH₃</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="106" y="54">NHE3, SGLT2, CA; PTH ↓ PO₄</text>
<rect fill="#ffffff" height="60" rx="4" stroke="#334155" width="190" x="310" y="6"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="316" y="22">~5–10% Na⁺; NCC (Na⁺/Cl⁻)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="316" y="38">PTH ↑ Ca²⁺ reabsorption</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="316" y="54">water-impermeable (dilutes)</text>
<rect fill="#ffffff" height="50" rx="4" stroke="#334155" width="105" x="125" y="200"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="130" y="216">H₂O out (AQP1);</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="130" y="231">NaCl stays in;</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="130" y="246">concentrates</text>
<rect fill="#ffffff" height="62" rx="4" stroke="#334155" width="330" x="120" y="385"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="126" y="401">TAL (~25% Na⁺): NKCC2 + ROMK K⁺ back-leak</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="126" y="417">→ lumen-positive potential → paracellular Mg²⁺, Ca²⁺</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="126" y="433">water-impermeable ("diluting segment"); macula densa</text>
<rect fill="#ffffff" height="150" rx="4" stroke="#334155" width="205" x="510" y="72"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="516" y="88">Principal cell</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="104">ENaC Na⁺ in; ROMK K⁺ out</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="120">Aldosterone ↑ ENaC and pump</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="136">ADH (V2) → AQP2 insertion</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="516" y="156">α-intercalated cell</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="172">H⁺-ATPase, H⁺/K⁺-ATPase</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" x="516" y="192">β-intercalated cell</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="208">HCO₃⁻ secretion (pendrin)</text>
<rect fill="#fee2e2" height="46" rx="4" stroke="#334155" width="122" x="4" y="162"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="12" y="180">Acetazolamide (CA)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="12" y="198">SGLT2 inhibitors</text>
