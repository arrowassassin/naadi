<rect fill="#fee2e2" height="46" rx="4" stroke="#334155" width="118" x="6" y="290"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="12" y="308">Mannitol (osmotic)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="12" y="326">PCT + thin desc.</text>
<line marker-end="url(#ch05-arrow-f8)" stroke="#dc2626" stroke-width="2" x1="124" x2="231" y1="312" y2="300"></line>
<rect fill="#fee2e2" height="46" rx="4" stroke="#334155" width="108" x="350" y="250"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="356" y="268">Loop diuretics</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="356" y="286">block NKCC2</text>
<line marker-end="url(#ch05-arrow-f8)" stroke="#dc2626" stroke-width="2" x1="350" x2="344" y1="273" y2="273"></line>
<rect fill="#fee2e2" height="46" rx="4" stroke="#334155" width="108" x="350" y="130"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="356" y="148">Thiazides</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="356" y="166">block NCC</text>
<line marker-end="url(#ch05-arrow-f8)" stroke="#dc2626" stroke-width="2" x1="404" x2="404" y1="130" y2="114"></line>
<rect fill="#fee2e2" height="110" rx="4" stroke="#334155" width="205" x="510" y="240"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="258">K⁺-sparing:</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="274">amiloride, triamterene (ENaC)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="290">spironolactone, eplerenone,</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="306">finerenone (MR antagonists)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="326">Tolvaptan, conivaptan (V2)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="516" y="342">ADH → ↑ water reabsorption</text>
<line marker-end="url(#ch05-arrow-f8)" stroke="#dc2626" stroke-width="2" x1="510" x2="499" y1="300" y2="300"></line>
