<svg aria-label="Basal ganglia direct and indirect pathways with dopamine D1 and D2 effects" role="img" viewbox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch07-arrow3" markerheight="10" markerwidth="10" orient="auto" refx="9" refy="5"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<rect fill="#e0f2fe" height="36" rx="6" stroke="#334155" width="140" x="250" y="10"></rect><text text-anchor="middle" x="320" y="33">Cortex</text>
<rect fill="#fef3c7" height="36" rx="6" stroke="#334155" width="140" x="250" y="95"></rect><text text-anchor="middle" x="320" y="118">Striatum</text>
<rect fill="#dcfce7" height="36" rx="6" stroke="#334155" width="150" x="20" y="95"></rect><text text-anchor="middle" x="95" y="113">SNc (dopamine)</text><text font-size="11" text-anchor="middle" x="95" y="127">lost in Parkinson</text>
<rect fill="#fef3c7" height="36" rx="6" stroke="#334155" width="140" x="90" y="190"></rect><text text-anchor="middle" x="160" y="213">GPi / SNr</text>
<rect fill="#fef3c7" height="36" rx="6" stroke="#334155" width="140" x="420" y="170"></rect><text text-anchor="middle" x="490" y="193">GPe</text>
<rect fill="#fee2e2" height="36" rx="6" stroke="#334155" width="140" x="420" y="260"></rect><text text-anchor="middle" x="490" y="283">STN</text>
<rect fill="#e0f2fe" height="36" rx="6" stroke="#334155" width="140" x="250" y="330"></rect><text text-anchor="middle" x="320" y="353">Thalamus (VA/VL)</text>
<!-- cortex -> striatum -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" x1="320" x2="320" y1="46" y2="93"></line><text x="326" y="74">+ glutamate</text>
<!-- SNc -> striatum -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" x1="170" x2="248" y1="113" y2="113"></line><text font-size="11" x="176" y="105">D1 +  /  D2 −</text>
<!-- direct: striatum -> GPi -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" x1="280" x2="200" y1="131" y2="188"></line><text font-size="11" x="180" y="160">DIRECT − (GABA)</text>
<!-- indirect: striatum -> GPe -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" stroke-dasharray="5,3" x1="370" x2="460" y1="131" y2="168"></line><text font-size="11" x="420" y="145">INDIRECT − (GABA)</text>
<!-- GPe -> STN -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" stroke-dasharray="5,3" x1="490" x2="490" y1="206" y2="258"></line><text x="498" y="236">−</text>
<!-- STN -> GPi -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" stroke-dasharray="5,3" x1="420" x2="232" y1="275" y2="218"></line><text x="300" y="262">+ glutamate</text>
<!-- GPi -> thalamus -->
<line marker-end="url(#ch07-arrow3)" stroke="#334155" x1="160" x2="280" y1="226" y2="328"></line><text x="160" y="290">− (GABA)</text>
<!-- thalamus -> cortex -->
<path d="M390,348 C620,348 620,28 392,28" fill="none" marker-end="url(#ch07-arrow3)" stroke="#334155"></path><text x="575" y="110">+</text>
<text font-size="12" x="20" y="320">Direct: ↑ movement</text>
<text font-size="12" x="20" y="338">Indirect: ↓ movement</text>
<text font-size="12" x="20" y="356">Dopamine → both favor</text>
<text font-size="12" x="20" y="374">movement (D1 excites direct,</text>
<text font-size="12" x="20" y="392">D2 inhibits indirect)</text>
</g>
</svg>