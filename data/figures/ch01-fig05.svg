<svg aria-label="Two-signal T-cell activation with drug targets and CD4 helper subset differentiation" role="img" viewbox="0 0 720 535" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch01-arr-tcell" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif">
