<text font-size="12" font-weight="normal" text-anchor="middle" x="277.5" y="299.2">B7</text>
<rect fill="#fee2e2" height="34" rx="6" stroke="#334155" stroke-width="1.5" width="100" x="380" y="278"></rect>
<text font-size="12" font-weight="normal" text-anchor="middle" x="430.0" y="299.2">CTLA-4</text>
