<text font-size="12" font-weight="normal" text-anchor="middle" x="100" y="498">IFN-γ → macrophages</text>
<text font-size="12" font-style="italic" font-weight="normal" text-anchor="middle" x="275" y="422">IL-4</text>
<line marker-end="url(#ch01-arr-tcell)" stroke="#334155" stroke-width="1.6" x1="275" x2="275" y1="427" y2="447"></line>
<rect fill="#fef3c7" height="32" rx="6" stroke="#334155" stroke-width="1.5" width="120" x="215" y="448"></rect>
<text font-size="14" font-weight="bold" text-anchor="middle" x="275.0" y="468.9">Th2</text>
<text font-size="12" font-weight="normal" text-anchor="middle" x="275" y="498">IL-4, 5, 13 → IgE, eos</text>
<text font-size="12" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="422">TGF-β + IL-6</text>
<line marker-end="url(#ch01-arr-tcell)" stroke="#334155" stroke-width="1.6" x1="450" x2="450" y1="427" y2="447"></line>
<rect fill="#dcfce7" height="32" rx="6" stroke="#334155" stroke-width="1.5" width="120" x="390" y="448"></rect>
<text font-size="14" font-weight="bold" text-anchor="middle" x="450.0" y="468.9">Th17</text>
<text font-size="12" font-weight="normal" text-anchor="middle" x="450" y="498">IL-17 → neutrophils</text>
<text font-size="12" font-style="italic" font-weight="normal" text-anchor="middle" x="625" y="422">TGF-β + IL-2</text>
<line marker-end="url(#ch01-arr-tcell)" stroke="#334155" stroke-width="1.6" x1="625" x2="625" y1="427" y2="447"></line>
<rect fill="#fee2e2" height="32" rx="6" stroke="#334155" stroke-width="1.5" width="120" x="565" y="448"></rect>
<text font-size="14" font-weight="bold" text-anchor="middle" x="625.0" y="468.9">Treg</text>
<text font-size="12" font-weight="normal" text-anchor="middle" x="625" y="498">IL-10, TGF-β (FOXP3)</text>
<text font-size="12" font-style="italic" font-weight="normal" text-anchor="middle" x="360" y="525">IFN-γ inhibits Th2; IL-4 and IL-10 inhibit Th1</text>
