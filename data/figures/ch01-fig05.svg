<text font-size="12" font-weight="normal" text-anchor="middle" x="595.0" y="267.2">mTOR → proliferation</text>
<line marker-end="url(#ch01-arr-tcell)" stroke="#334155" stroke-width="1.6" x1="595" x2="595" y1="126" y2="149"></line>
<line marker-end="url(#ch01-arr-tcell)" stroke="#334155" stroke-width="1.6" x1="595" x2="595" y1="176" y2="199"></line>
<line marker-end="url(#ch01-arr-tcell)" stroke="#334155" stroke-width="1.6" x1="595" x2="595" y1="226" y2="249"></line>
