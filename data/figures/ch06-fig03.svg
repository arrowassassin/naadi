<svg aria-label="Timeline of hepatitis B serologic markers in acute resolving infection showing the window period" role="img" viewbox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<line stroke="#334155" stroke-width="1.5" x1="130" x2="620" y1="275" y2="275"></line>
<text text-anchor="middle" x="130" y="293">0</text><text text-anchor="middle" x="223" y="293">8</text><text text-anchor="middle" x="317" y="293">16</text><text text-anchor="middle" x="410" y="293">24</text><text text-anchor="middle" x="503" y="293">32</text><text text-anchor="middle" x="597" y="293">40</text>
<text text-anchor="middle" x="375" y="315">Weeks after exposure (acute, resolving infection)</text>
<rect fill="#fef3c7" height="250" stroke="#334155" stroke-dasharray="4,3" width="98" x="398" y="20"></rect>
<text font-weight="bold" text-anchor="middle" x="447" y="36">Window</text>
<text text-anchor="middle" x="447" y="52">period</text>
<text x="12" y="80">HBsAg</text><rect fill="#fee2e2" height="16" rx="3" stroke="#334155" width="221" x="177" y="68"></rect>
<text x="12" y="112">HBeAg / HBV DNA</text><rect fill="#fee2e2" height="16" rx="3" stroke="#334155" width="140" x="200" y="100"></rect>
<text x="12" y="144">IgM anti-HBc</text><rect fill="#e0f2fe" height="16" rx="3" stroke="#334155" width="295" x="235" y="132"></rect>
<text x="12" y="176">IgG anti-HBc</text><rect fill="#e0f2fe" height="16" rx="3" stroke="#334155" width="315" x="305" y="164"></rect>
<text x="12" y="208">Anti-HBe</text><rect fill="#dcfce7" height="16" rx="3" stroke="#334155" width="268" x="352" y="196"></rect>
<text x="12" y="240">Anti-HBs</text><rect fill="#dcfce7" height="16" rx="3" stroke="#334155" width="124" x="496" y="228"></rect>
<text x="200" y="60">Symptoms, ↑ ALT ~ weeks 8–20</text>
</g>
</svg>