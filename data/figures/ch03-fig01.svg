<svg xmlns="http://www.w3.org/2000/svg" aria-label="Left: first-order versus zero-order elimination curves. Right: accumulation to steady state with percentages at each half-life and the effect of a loading dose." role="img" viewbox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch03-arrow" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<text font-size="14" font-weight="bold" text-anchor="middle" x="170" y="22">A. Elimination after an IV bolus</text>
<line marker-end="url(#ch03-arrow)" stroke="#334155" stroke-width="1.5" x1="50" x2="295" y1="300" y2="300"></line>
<line marker-end="url(#ch03-arrow)" stroke="#334155" stroke-width="1.5" x1="50" x2="50" y1="300" y2="45"></line>
<text text-anchor="middle" x="170" y="322">Time</text>
<text text-anchor="middle" transform="rotate(-90 20 180)" x="20" y="180">Plasma concentration</text>
<polyline fill="none" points="50,80 75,144 100,190 125,222 150,245 200,272 250,286 290,292" stroke="#334155" stroke-width="2.5"></polyline>
<line stroke="#334155" stroke-dasharray="7 5" stroke-width="2.5" x1="50" x2="250" y1="80" y2="300"></line>
<text fill="#0f172a" x="180" y="230">First-order (exponential):</text>
<text x="180" y="246">constant FRACTION/time</text>
<text x="150" y="120">Zero-order (linear):</text>
<text x="150" y="136">constant AMOUNT/time</text>
<line stroke="#334155" stroke-dasharray="3 3" x1="100" x2="100" y1="190" y2="300"></line>
<text text-anchor="middle" x="100" y="315">1 t½</text>
<text font-size="14" font-weight="bold" text-anchor="middle" x="500" y="22">B. Repeated dosing or constant infusion</text>
<line marker-end="url(#ch03-arrow)" stroke="#334155" stroke-width="1.5" x1="370" x2="630" y1="300" y2="300"></line>
<line marker-end="url(#ch03-arrow)" stroke="#334155" stroke-width="1.5" x1="370" x2="370" y1="300" y2="45"></line>
<line stroke="#334155" stroke-dasharray="7 5" stroke-width="2" x1="370" x2="625" y1="80" y2="80"></line>
<text x="380" y="70">With loading dose: target reached at once</text>
<polyline fill="none" points="370,300 395,235.5 420,190 445,157.8 470,135 495,119 520,107.5 545,99.4 570,93.8 595,89.7 620,86.9" stroke="#334155" stroke-width="2.5"></polyline>
<circle cx="420" cy="190" fill="#fef3c7" r="4" stroke="#334155"></circle><text x="428" y="205">50%</text>
<circle cx="470" cy="135" fill="#fef3c7" r="4" stroke="#334155"></circle><text x="476" y="152">75%</text>
<circle cx="520" cy="107.5" fill="#fef3c7" r="4" stroke="#334155"></circle><text x="514" y="126">87.5%</text>
<circle cx="570" cy="93.8" fill="#dcfce7" r="4" stroke="#334155"></circle><text x="560" y="114">94%</text>
<circle cx="620" cy="86.9" fill="#dcfce7" r="4" stroke="#334155"></circle><text x="604" y="104">97%</text>
<text text-anchor="middle" x="420" y="315">1</text><text text-anchor="middle" x="470" y="315">2</text><text text-anchor="middle" x="520" y="315">3</text><text text-anchor="middle" x="570" y="315">4</text><text text-anchor="middle" x="620" y="315">5</text>
<text text-anchor="middle" x="500" y="335">Number of half-lives</text>
<text text-anchor="middle" x="500" y="352">Without a loading dose, steady state takes about 4–5 t½, whatever the dose</text>
<text text-anchor="middle" transform="rotate(-90 345 180)" x="345" y="180">% of steady state</text>
</g>
</svg>