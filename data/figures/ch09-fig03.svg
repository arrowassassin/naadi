<svg aria-label="DKA management flow" role="img" viewbox="0 0 640 470" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch09-arrow3" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">
<rect fill="#fee2e2" height="54" rx="6" stroke="#334155" width="440" x="100" y="8"></rect>
<text font-weight="bold" x="320" y="26">DKA confirmed: glucose ≥200, BHB ≥3.0, pH &lt;7.3 or HCO₃ &lt;18</text>
<text x="320" y="42">Labs q1–2 h glucose, q2–4 h BMP/VBG; find trigger (infection, MI,</text>
<text x="320" y="56">missed insulin, SGLT2i, new diagnosis); ECG for K⁺ effects</text>
<line marker-end="url(#ch09-arrow3)" stroke="#334155" x1="180" x2="110" y1="62" y2="80"></line>
<line marker-end="url(#ch09-arrow3)" stroke="#334155" x1="320" x2="320" y1="62" y2="80"></line>
<line marker-end="url(#ch09-arrow3)" stroke="#334155" x1="460" x2="530" y1="62" y2="80"></line>
<rect fill="#e0f2fe" height="150" rx="6" stroke="#334155" width="200" x="10" y="82"></rect>
<text font-weight="bold" x="110" y="100">1. FLUIDS</text>
<text x="110" y="120">0.9% NaCl or balanced</text>
<text x="110" y="136">crystalloid 1–1.5 L in</text>
<text x="110" y="152">first hour, then</text>
<text x="110" y="168">250–500 mL/h</text>
<text x="110" y="188">Corrected Na normal/high</text>
<text x="110" y="204">→ switch to 0.45% NaCl</text>
<text font-size="11" x="110" y="222">(Na corr = Na + 1.6 per 100 &gt;100)</text>
<rect fill="#fef3c7" height="150" rx="6" stroke="#334155" width="200" x="220" y="82"></rect>
<text font-weight="bold" x="320" y="100">2. POTASSIUM (check first!)</text>
<text x="320" y="122">K⁺ &lt;3.5 → HOLD insulin;</text>
<text x="320" y="138">give IV KCl until ≥3.5</text>
<text x="320" y="160">K⁺ 3.5–5.0 → add</text>
<text x="320" y="176">20–30 mEq KCl per L</text>
<text x="320" y="198">K⁺ &gt;5.0 → no K⁺ now,</text>
<text x="320" y="214">recheck every 2 h</text>
<rect fill="#dcfce7" height="150" rx="6" stroke="#334155" width="200" x="430" y="82"></rect>
<text font-weight="bold" x="530" y="100">3. INSULIN</text>
<text x="530" y="120">Regular insulin IV infusion</text>
<text x="530" y="136">0.1 U/kg/h (bolus optional)</text>
<text x="530" y="156">Goal: glucose ↓ 50–75</text>
<text x="530" y="172">mg/dL per hour</text>
<text x="530" y="192">Mild DKA: SC rapid-acting</text>
<text x="530" y="208">analog is acceptable</text>
<text font-size="11" x="530" y="224">(not for HHS/severe DKA)</text>
<line marker-end="url(#ch09-arrow3)" stroke="#334155" x1="320" x2="320" y1="232" y2="248"></line>
<rect fill="#fef3c7" height="52" rx="6" stroke="#334155" width="520" x="60" y="250"></rect>
<text font-weight="bold" x="320" y="270">Glucose &lt;250 mg/dL but ketoacidosis persists</text>
<text x="320" y="288">→ ADD dextrose (D5/D10 in 0.45% NaCl); continue insulin (may lower to 0.05 U/kg/h)</text>
<line marker-end="url(#ch09-arrow3)" stroke="#334155" x1="320" x2="320" y1="302" y2="318"></line>
<rect fill="#dcfce7" height="52" rx="6" stroke="#334155" width="520" x="60" y="320"></rect>
<text font-weight="bold" x="320" y="340">Resolution: pH ≥7.3, HCO₃ ≥18, BHB &lt;0.6 mmol/L (anion gap closed)</text>
<text x="320" y="358">→ give SC basal insulin, overlap ≥2 h, then stop infusion; patient eating</text>
<rect fill="#e0f2fe" height="70" rx="6" stroke="#334155" width="300" x="10" y="390"></rect>
<text font-weight="bold" x="160" y="408">Bicarbonate</text>
<text x="160" y="426">only if pH &lt;7.0</text>
<text x="160" y="444">Phosphate only if &lt;1.0 mg/dL or</text>
<text x="160" y="458">cardiac/respiratory weakness</text>
<rect fill="#fee2e2" height="70" rx="6" stroke="#334155" width="300" x="330" y="390"></rect>
<text font-weight="bold" x="480" y="408">Complications</text>
<text x="480" y="426">Hypokalemia, hypoglycemia</text>
<text x="480" y="442">Cerebral edema (children; overly rapid</text>
<text x="480" y="456">osmolality fall) → mannitol</text>
</g>
</svg>