<svg aria-label="Coagulation cascade with sites of action of anticoagulant and fibrinolytic drugs" role="img" viewbox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<g fill="#0f172a" font-family="sans-serif" font-size="13">
<text font-weight="bold" x="30" y="26">Intrinsic pathway (aPTT)</text>
<rect fill="#e0f2fe" height="30" rx="6" stroke="#334155" width="150" x="30" y="40"></rect>
<text text-anchor="middle" x="105" y="60">XII → XIIa</text>
<rect fill="#e0f2fe" height="30" rx="6" stroke="#334155" width="150" x="30" y="100"></rect>
<text text-anchor="middle" x="105" y="120">XI → XIa</text>
<rect fill="#e0f2fe" height="30" rx="6" stroke="#334155" width="150" x="30" y="160"></rect>
<text text-anchor="middle" x="105" y="180">IX → IXa (+ VIIIa)</text>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="105" x2="105" y1="70" y2="98"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="105" x2="105" y1="130" y2="158"></line>
<text font-weight="bold" x="330" y="148">Extrinsic (PT/INR)</text>
<rect fill="#e0f2fe" height="30" rx="6" stroke="#334155" width="150" x="330" y="160"></rect>
<text text-anchor="middle" x="405" y="180">Tissue factor + VIIa</text>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="105" x2="228" y1="190" y2="228"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="405" x2="322" y1="190" y2="228"></line>
<text font-size="12" font-weight="bold" x="30" y="250">Common pathway →</text>
<rect fill="#fef3c7" height="30" rx="6" stroke="#334155" width="170" x="190" y="230"></rect>
<text text-anchor="middle" x="275" y="250">X → Xa (+ Va)</text>
<rect fill="#fef3c7" height="30" rx="6" stroke="#334155" width="170" x="190" y="300"></rect>
<text text-anchor="middle" x="275" y="320">II → IIa (thrombin)</text>
<rect fill="#dcfce7" height="30" rx="6" stroke="#334155" width="170" x="190" y="370"></rect>
<text text-anchor="middle" x="275" y="390">Fibrinogen → fibrin</text>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="275" x2="275" y1="260" y2="298"></line>
<line marker-end="url(#ch04-arrow)" stroke="#334155" stroke-width="2" x1="275" x2="275" y1="330" y2="368"></line>
<text font-size="12" x="282" y="352">XIIIa cross-links</text>
<text font-size="12" font-weight="bold" x="20" y="296">Lab key</text>
<text font-size="12" x="20" y="314">PT/INR: VII, X, V,</text>
<text font-size="12" x="20" y="330">II, fibrinogen</text>
<text font-size="12" x="20" y="350">aPTT: XII, XI, IX,</text>
<text font-size="12" x="20" y="366">VIII + common</text>
<text font-size="12" x="20" y="386">XIII: neither test</text>
<rect fill="#fee2e2" height="62" rx="6" stroke="#334155" width="170" x="500" y="30"></rect>
<text font-size="12" font-weight="bold" x="510" y="48">Warfarin (VKORC1)</text>
<text font-size="12" x="510" y="65">↓ γ-carboxylation of</text>
<text font-size="12" x="510" y="82">II, VII, IX, X, C, S</text>
<line stroke="#334155" stroke-dasharray="5,3" stroke-width="2" x1="500" x2="472" y1="88" y2="158"></line>
<rect fill="#fee2e2" height="46" rx="6" stroke="#334155" width="170" x="500" y="100"></rect>
<text font-size="12" font-weight="bold" x="510" y="118">UFH: ↑ antithrombin</text>
<text font-size="12" x="510" y="136">IIa ≈ Xa; LMWH: Xa &gt; IIa</text>
<rect fill="#fee2e2" height="62" rx="6" stroke="#334155" width="170" x="500" y="210"></rect>
<text font-size="12" font-weight="bold" x="510" y="228">Direct Xa: apixaban,</text>
<text font-size="12" x="510" y="245">rivaroxaban, edoxaban</text>
<text font-size="12" x="510" y="262">Indirect: fondaparinux</text>
<line stroke="#334155" stroke-dasharray="5,3" stroke-width="2" x1="500" x2="362" y1="241" y2="245"></line>
<rect fill="#fee2e2" height="62" rx="6" stroke="#334155" width="170" x="500" y="282"></rect>
<text font-size="12" font-weight="bold" x="510" y="300">Direct IIa inhibitors:</text>
<text font-size="12" x="510" y="317">dabigatran, argatroban,</text>
<text font-size="12" x="510" y="334">bivalirudin</text>
<line stroke="#334155" stroke-dasharray="5,3" stroke-width="2" x1="500" x2="362" y1="313" y2="315"></line>
<rect fill="#fee2e2" height="62" rx="6" stroke="#334155" width="170" x="500" y="354"></rect>
<text font-size="12" font-weight="bold" x="510" y="372">Alteplase, tenecteplase:</text>
<text font-size="12" x="510" y="389">plasminogen → plasmin</text>
<text font-size="12" x="510" y="406">(TXA blocks this)</text>
<line stroke="#334155" stroke-dasharray="5,3" stroke-width="2" x1="500" x2="362" y1="385" y2="385"></line>
</g>
</svg>