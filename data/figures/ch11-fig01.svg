<svg aria-label="Neonatal jaundice approach: schematic Bhutani hour-specific nomogram and AAP 2022 management ladder" font-family="sans-serif" role="img" viewbox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch11-arrow" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<text fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle" x="160" y="22">Bhutani hour-specific nomogram (schematic)</text>
<line stroke="#334155" stroke-width="1.5" x1="50" x2="292" y1="290" y2="290"></line>
<line stroke="#334155" stroke-width="1.5" x1="50" x2="50" y1="290" y2="55"></line>
<g fill="#0f172a" font-size="12" text-anchor="middle">
<text x="50" y="306">0</text><text x="90" y="306">24</text><text x="130" y="306">48</text><text x="170" y="306">72</text><text x="210" y="306">96</text><text x="250" y="306">120</text><text x="290" y="306">144</text>
<text x="170" y="322">Postnatal age (hours)</text>
</g>
<g fill="#0f172a" font-size="12" text-anchor="end">
<text x="45" y="294">0</text><text x="45" y="248">5</text><text x="45" y="202">10</text><text x="45" y="156">15</text><text x="45" y="110">20</text><text x="45" y="64">25</text>
</g>
<text fill="#0f172a" font-size="12" text-anchor="middle" transform="rotate(-90 16 175)" x="16" y="175">TSB (mg/dL)</text>
<path d="M83,226 L90,216 L110,180 L130,152 L150,143 L170,138 L210,129 L290,129" fill="none" stroke="#334155" stroke-width="2.5"></path>
<path d="M90,235 L110,203 L130,175 L170,152 L210,147 L290,147" fill="none" stroke="#334155" stroke-dasharray="7,4" stroke-width="2"></path>
<path d="M90,249 L110,226 L130,207 L170,180 L210,170 L290,170" fill="none" stroke="#334155" stroke-dasharray="2,3" stroke-width="2"></path>
<g fill="#0f172a" font-size="12">
<text x="120" y="110">High-risk zone (&gt;95th)</text>
<text x="196" y="142">High-intermediate</text>
<text x="196" y="163">Low-intermediate</text>
<text x="196" y="200">Low-risk (&lt;40th)</text>
</g>
<rect fill="#fee2e2" height="58" rx="6" stroke="#334155" width="286" x="22" y="334"></rect>
<g fill="#0f172a" font-size="12">
<text x="32" y="352">Direct (conjugated) bili &gt;1.0 mg/dL =</text>
<text x="32" y="368">never physiologic → biliary atresia</text>
<text x="32" y="384">work-up (US, HIDA; Kasai by ~60 d)</text>
</g>
<g fill="#0f172a" font-size="12">
<rect fill="#e0f2fe" height="30" rx="6" stroke="#334155" width="300" x="325" y="14"></rect>
<text font-weight="bold" text-anchor="middle" x="475" y="34">Jaundiced newborn ≥35 weeks</text>
<rect fill="#fee2e2" height="44" rx="6" stroke="#334155" width="300" x="325" y="58"></rect>
<text x="333" y="76">Visible &lt;24 h = pathologic → TSB, blood</text>
<text x="333" y="93">type + DAT, CBC/retic; G6PD if at risk</text>
<rect fill="#e0f2fe" height="44" rx="6" stroke="#334155" width="300" x="325" y="116"></rect>
<text x="333" y="134">≥24 h: TcB/TSB plotted by age in hours on</text>
<text x="333" y="151">AAP 2022 curves (GA ± neurotoxicity risk)</text>
<rect fill="#dcfce7" height="44" rx="6" stroke="#334155" width="300" x="325" y="174"></rect>
<text x="333" y="192">Below threshold → follow-up timed by gap</text>
<text x="333" y="209">to threshold (Bhutani zone = predictive)</text>
<rect fill="#fef3c7" height="44" rx="6" stroke="#334155" width="300" x="325" y="232"></rect>
<text x="333" y="250">≥ phototherapy threshold → phototherapy,</text>
<text x="333" y="267">keep feeding; stop when 2 below start</text>
<rect fill="#fee2e2" height="44" rx="6" stroke="#334155" width="300" x="325" y="290"></rect>
<text x="333" y="308">Within 2 mg/dL of exchange → escalate:</text>
<text x="333" y="325">intensive phototx, IV fluids, IVIG if DAT+</text>
<rect fill="#fee2e2" height="44" rx="6" stroke="#334155" width="300" x="325" y="348"></rect>
<text x="333" y="366">≥ exchange threshold or signs of acute</text>
<text x="333" y="383">bilirubin encephalopathy → exchange now</text>
</g>
<g marker-end="url(#ch11-arrow)" stroke="#334155" stroke-width="1.5">
<line x1="475" x2="475" y1="44" y2="56"></line><line x1="475" x2="475" y1="102" y2="114"></line><line x1="475" x2="475" y1="160" y2="172"></line><line x1="475" x2="475" y1="218" y2="230"></line><line x1="475" x2="475" y1="276" y2="288"></line><line x1="475" x2="475" y1="334" y2="346"></line>
</g>
</svg>