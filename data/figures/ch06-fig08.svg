<svg aria-label="Hormone curves across a 28-day menstrual cycle showing FSH, LH surge, estradiol and progesterone with follicular and luteal phases" role="img" viewbox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<rect fill="#e0f2fe" height="240" opacity="0.6" width="270" x="60" y="40"></rect>
<rect fill="#fef3c7" height="240" opacity="0.6" width="270" x="330" y="40"></rect>
<rect fill="#fee2e2" height="240" opacity="0.7" width="96" x="60" y="40"></rect>
<text text-anchor="middle" x="108" y="56">Menses</text>
<text font-weight="bold" text-anchor="middle" x="243" y="56">Follicular phase</text>
<text font-weight="bold" text-anchor="middle" x="465" y="56">Luteal phase (fixed ~14 d)</text>
<line stroke="#334155" stroke-dasharray="3,3" stroke-width="1" x1="330" x2="330" y1="40" y2="280"></line>
<text text-anchor="middle" x="330" y="34">Ovulation (day 14)</text>
<line stroke="#334155" stroke-width="1.5" x1="60" x2="600" y1="280" y2="280"></line>
<line stroke="#334155" stroke-width="1.5" x1="60" x2="60" y1="40" y2="280"></line>
<text text-anchor="middle" x="60" y="296">0</text><text text-anchor="middle" x="195" y="296">7</text><text text-anchor="middle" x="330" y="296">14</text><text text-anchor="middle" x="465" y="296">21</text><text text-anchor="middle" x="600" y="296">28</text>
<text text-anchor="middle" x="330" y="312">Cycle day</text>
<text text-anchor="middle" transform="rotate(-90 20 165)" x="20" y="165">Relative level</text>
<path d="M60,262 L253,258 L300,240 L318,150 L330,64 L342,150 L360,240 L380,258 L600,264" fill="none" stroke="#334155" stroke-width="3"></path>
<path d="M60,240 L98,232 L156,240 L253,256 L300,240 L330,205 L360,245 L400,262 L523,266 L562,252 L600,238" fill="none" stroke="#334155" stroke-dasharray="8,4" stroke-width="2"></path>
<path d="M60,262 L195,255 L253,220 L291,160 L311,122 L330,170 L349,220 L407,190 L465,168 L523,205 L600,262" fill="none" stroke="#334155" stroke-dasharray="2,3" stroke-width="2"></path>
<path d="M60,272 L330,270 L368,240 L407,170 L465,112 L523,170 L562,240 L600,272" fill="none" stroke="#334155" stroke-dasharray="12,4,2,4" stroke-width="2.5"></path>
<text x="344" y="80">LH surge</text>
<text x="80" y="226">FSH (early rise)</text>
<text x="196" y="142">Estradiol peak</text>
<text x="196" y="158">(+ feedback)</text>
<text x="472" y="106">Progesterone</text>
<text x="425" y="210">E2 (2nd peak)</text>
<rect fill="#fee2e2" height="30" stroke="#334155" width="96" x="60" y="320"></rect><text text-anchor="middle" x="108" y="340">Shedding</text>
<rect fill="#e0f2fe" height="30" stroke="#334155" width="174" x="156" y="320"></rect><text text-anchor="middle" x="243" y="340">Proliferative (estrogen)</text>
<rect fill="#fef3c7" height="30" stroke="#334155" width="270" x="330" y="320"></rect><text text-anchor="middle" x="465" y="340">Secretory (progesterone)</text>
<text x="10" y="340">Endo-</text><text x="10" y="354">metrium</text>
<text x="60" y="374">Legend: LH thick solid · FSH dashed · Estradiol dotted · Progesterone dash-dot</text>
<text x="60" y="392">Basal body temperature ↑ ~0.5 °F (0.3 °C) after ovulation (progesterone) — sustained if pregnant</text>
</g>
</svg>