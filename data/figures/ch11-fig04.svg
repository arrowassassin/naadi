<line x1="240" x2="240" y1="30" y2="400"></line><line x1="276" x2="276" y1="30" y2="400"></line><line x1="312" x2="312" y1="30" y2="400"></line><line x1="348" x2="348" y1="30" y2="400"></line><line x1="384" x2="384" y1="30" y2="400"></line><line x1="420" x2="420" y1="30" y2="400"></line><line x1="456" x2="456" y1="30" y2="400"></line><line x1="492" x2="492" y1="30" y2="400"></line><line x1="528" x2="528" y1="30" y2="400"></line><line x1="564" x2="564" y1="30" y2="400"></line><line x1="600" x2="600" y1="30" y2="400"></line>
