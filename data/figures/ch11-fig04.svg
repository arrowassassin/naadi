<g fill="#0f172a" font-size="12">
<text text-anchor="end" x="232" y="50">First-visit labs (see table)</text>
<text text-anchor="end" x="232" y="74">Cell-free DNA (from 10 wk)</text>
<text text-anchor="end" x="232" y="98">CVS (diagnostic)</text>
<text text-anchor="end" x="232" y="122">NT + PAPP-A + hCG (combined)</text>
<text text-anchor="end" x="232" y="146">Low-dose aspirin start if at risk</text>
<text text-anchor="end" x="232" y="170">Amniocentesis (diagnostic)</text>
<text text-anchor="end" x="232" y="194">Quad screen / MSAFP</text>
<text text-anchor="end" x="232" y="218">Anatomy ultrasound</text>
<text text-anchor="end" x="232" y="242">GDM screen (50-g GCT)</text>
<text text-anchor="end" x="232" y="266">Hb, antibody screen; RhIG if Rh−</text>
<text text-anchor="end" x="232" y="290">Tdap (every pregnancy)</text>
<text text-anchor="end" x="232" y="314">RSV vaccine (Sep–Jan)</text>
<text text-anchor="end" x="232" y="338">GBS rectovaginal culture</text>
<text text-anchor="end" x="232" y="362">39-wk IOL option; IOL by 41–42</text>
<text text-anchor="end" x="232" y="386">Visit frequency</text>
</g>
