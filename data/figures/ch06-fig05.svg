<text x="250" y="350">Androstenedione → estrone</text><text x="250" y="366">via aromatase (adipose, granulosa)</text>
<rect fill="#fef3c7" height="120" rx="6" stroke="#334155" width="620" x="10" y="405"></rect>
<text x="18" y="424"><tspan font-weight="bold">21-OH def (~90%):</tspan> ↓ aldo, ↓ cortisol, ↑ 17-OH progesterone, ↑ androgens →</text>
<text x="18" y="440">salt wasting (↓Na⁺, ↑K⁺, ↑renin, hypotension), virilized XX infant; precocious pubarche in XY</text>
<text x="18" y="460"><tspan font-weight="bold">11β-OH def:</tspan> ↓ aldo, ↓ cortisol, but ↑ 11-deoxycorticosterone (weak mineralocorticoid) →</text>
<text x="18" y="476">hypertension, ↓K⁺, ↓renin; ↑ androgens → virilization</text>
<text x="18" y="496"><tspan font-weight="bold">17α-OH def:</tspan> ↑ DOC → hypertension, ↓K⁺, ↓renin; ↓ cortisol and ↓ sex steroids →</text>
<text x="18" y="512">XY: undervirilized/female external genitalia; XX: normal at birth, absent puberty</text>
