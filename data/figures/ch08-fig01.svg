<svg aria-label="Acute coronary syndrome management algorithm" role="img" viewbox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch08-arrow" markerheight="10" markerwidth="10" orient="auto" refx="9" refy="5"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">
<rect fill="#e0f2fe" height="46" rx="6" stroke="#334155" width="300" x="170" y="10"></rect>
<text font-weight="bold" x="320" y="29">Suspected ACS</text>
<text x="320" y="46">12-lead ECG ≤10 min · hs-troponin 0 and 1–3 h</text>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="250" x2="160" y1="56" y2="88"></line>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="390" x2="480" y1="56" y2="88"></line>
<rect fill="#fee2e2" height="50" rx="6" stroke="#334155" width="280" x="20" y="90"></rect>
<text font-weight="bold" x="160" y="110">STEMI or STEMI-equivalent</text>
<text x="160" y="127">(posterior MI, Sgarbossa+ LBBB)</text>
<rect fill="#fef3c7" height="50" rx="6" stroke="#334155" width="280" x="340" y="90"></rect>
<text font-weight="bold" x="480" y="110">No ST elevation (NSTE-ACS)</text>
<text x="480" y="127">Troponin rise/fall = NSTEMI; normal = UA</text>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="160" x2="160" y1="140" y2="170"></line>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="480" x2="480" y1="140" y2="170"></line>
<rect fill="#e0f2fe" height="56" rx="6" stroke="#334155" width="280" x="20" y="172"></rect>
<text x="160" y="193">PCI achievable within 90 min of FMC</text>
<text x="160" y="210">(≤120 min if transfer needed)?</text>
<rect fill="#e0f2fe" height="56" rx="6" stroke="#334155" width="280" x="340" y="172"></rect>
<text x="480" y="193">Risk-stratify: GRACE, dynamic ST,</text>
<text x="480" y="210">troponin trend, HF, arrhythmia</text>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="100" x2="85" y1="228" y2="262"></line>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="220" x2="230" y1="228" y2="262"></line>
<text x="72" y="248">Yes</text>
<text x="245" y="248">No</text>
<rect fill="#dcfce7" height="80" rx="6" stroke="#334155" width="130" x="20" y="264"></rect>
<text font-weight="bold" x="85" y="290">Primary PCI</text>
<text x="85" y="307">radial access;</text>
<text x="85" y="324">symptoms ≤12 h</text>
<rect fill="#dcfce7" height="80" rx="6" stroke="#334155" width="140" x="160" y="264"></rect>
<text font-weight="bold" x="230" y="282">Fibrinolytic</text>
<text x="230" y="298">≤30 min of arrival</text>
<text x="230" y="314">transfer; angio 2–24 h</text>
<text x="230" y="330">rescue PCI if fails</text>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="400" x2="385" y1="228" y2="262"></line>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="480" x2="480" y1="228" y2="262"></line>
<line marker-end="url(#ch08-arrow)" stroke="#334155" x1="560" x2="575" y1="228" y2="262"></line>
<rect fill="#fee2e2" height="80" rx="6" stroke="#334155" width="90" x="340" y="264"></rect>
<text font-weight="bold" x="385" y="282">Immediate</text>
<text x="385" y="298">&lt;2 h: shock,</text>
<text x="385" y="314">VT/VF, AHF,</text>
<text x="385" y="330">ongoing pain</text>
<rect fill="#fef3c7" height="80" rx="6" stroke="#334155" width="90" x="435" y="264"></rect>
<text font-weight="bold" x="480" y="282">Early</text>
<text x="480" y="298">&lt;24 h: NSTEMI</text>
<text x="480" y="314">GRACE &gt;140</text>
<text x="480" y="330">dynamic ST</text>
<rect fill="#dcfce7" height="80" rx="6" stroke="#334155" width="90" x="530" y="264"></rect>
<text font-weight="bold" x="575" y="282">Selective</text>
<text x="575" y="298">low risk:</text>
<text x="575" y="314">stress test</text>
<text x="575" y="330">or CCTA first</text>
<rect fill="#fef3c7" height="72" rx="6" stroke="#334155" width="600" x="20" y="358"></rect>
<text font-weight="bold" x="320" y="377">All ACS: aspirin 162–325 mg chewed · P2Y12 inhibitor · parenteral anticoagulant</text>
<text x="320" y="395">High-intensity statin · oral β-blocker within 24 h if no HF/shock/heart block</text>
<text x="320" y="413">Nitrates for pain (avoid: RV MI, PDE-5 inhibitor, SBP &lt;90) · DAPT ≥12 months</text>
</g>
</svg>