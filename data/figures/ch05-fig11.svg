<svg aria-label="Comparison chart of nephritic versus nephrotic syndromes with representative diseases" role="img" viewbox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="430" width="680" x="0" y="0"></rect>
<rect fill="#fee2e2" height="140" rx="8" stroke="#334155" stroke-width="1.5" width="250" x="10" y="10"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="135" y="30">NEPHRITIC</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="18" y="50">Inflamed glomerular capillaries</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="18" y="68">• Hematuria, dysmorphic RBCs, RBC casts</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="18" y="86">• Hypertension, oliguria, azotemia</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="18" y="104">• Proteinuria usually &lt; 3.5 g/day</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="18" y="122">• Edema from Na⁺ retention</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="18" y="140">  (periorbital)</text>
<rect fill="#e0f2fe" height="140" rx="8" stroke="#334155" stroke-width="1.5" width="250" x="420" y="10"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="545" y="30">NEPHROTIC</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="428" y="50">Podocyte injury → barrier loss</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="428" y="68">• Proteinuria &gt; 3.5 g/day; fatty casts</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="428" y="86">• Hypoalbuminemia → pitting edema</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="428" y="104">• Hyperlipidemia (↑ hepatic synthesis)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="428" y="122">• Hypercoagulable (urinary AT III loss)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" x="428" y="140">• Infection (urinary IgG loss)</text>
<rect fill="#fef3c7" height="90" rx="8" stroke="#334155" stroke-width="1.5" width="136" x="272" y="35"></rect>
<text fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="340" y="55">Either / both</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle" x="340" y="75">Diffuse prolif. GN</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle" x="340" y="91">(lupus class IV)</text>
<text fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle" x="340" y="111">MPGN / C3 GN</text>
<rect fill="#ffffff" height="255" rx="8" stroke="#334155" stroke-width="1.5" width="330" x="10" y="165"></rect>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<text font-weight="bold" x="18" y="185">Post-streptococcal GN</text>
<text x="18" y="200">2–4 wk after strep; subepithelial humps; ↓ C3</text>
<text font-weight="bold" x="18" y="222">IgA nephropathy</text>
<text x="18" y="237">1–3 days after URI/GI infection; mesangial IgA</text>
<text font-weight="bold" x="18" y="259">Anti-GBM disease (Goodpasture)</text>
<text x="18" y="274">linear IgG; α3 chain type IV collagen; lung + kidney</text>
<text font-weight="bold" x="18" y="296">Pauci-immune crescentic GN</text>
<text x="18" y="311">ANCA: GPA (PR3), MPA and EGPA (MPO)</text>
<text font-weight="bold" x="18" y="333">Lupus nephritis class IV</text>
<text x="18" y="348">subendothelial "wire loops"; ↓ C3 and C4</text>
<text font-weight="bold" x="18" y="370">Alport syndrome</text>
<text x="18" y="385">type IV collagen (COL4A5, X-linked); deafness,</text>
<text x="18" y="400">lens defects; "basket-weave" split GBM on EM</text>
</g>
<rect fill="#ffffff" height="255" rx="8" stroke="#334155" stroke-width="1.5" width="320" x="350" y="165"></rect>
<g fill="#0f172a" font-family="sans-serif" font-size="12">
<text font-weight="bold" x="358" y="185">Minimal change disease</text>
<text x="358" y="200">children; LM normal; foot-process effacement</text>
<text x="358" y="215">on EM; selective albuminuria; steroid-responsive</text>
<text font-weight="bold" x="358" y="237">FSGS</text>
<text x="358" y="252">Black/Hispanic adults (APOL1); HIV (collapsing),</text>
<text x="358" y="267">heroin, sickle cell, obesity; poor steroid response</text>
<text font-weight="bold" x="358" y="289">Membranous nephropathy</text>
<text x="358" y="304">anti-PLA2R; subepithelial "spike and dome";</text>
<text x="358" y="319">renal vein thrombosis; SLE V, HBV, tumors, NSAIDs</text>
<text font-weight="bold" x="358" y="341">Diabetic nephropathy</text>
<text x="358" y="356">Kimmelstiel–Wilson nodules; #1 cause ESRD (US)</text>
<text font-weight="bold" x="358" y="378">Amyloidosis</text>
<text x="358" y="393">AL or AA; Congo red apple-green birefringence</text>
<text x="358" y="408">under polarized light</text>
</g>
</svg>