<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The page's own policy: the YouTube API script and the privacy-enhanced embed, nothing else. A meta tag cannot
         carry frame-ancestors, so player.js checks who embeds the page. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Naadi player</title>
    <style>
      html,
      body,
      #player {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script src="player.js"></script>
  </body>
</html>
