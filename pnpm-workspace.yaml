packages:
  - apps/web
  - packages/*
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.6.8'
  - '@biomejs/cli-android-arm64@2.6.8'
  - '@biomejs/cli-android-x64@2.6.8'
  - '@biomejs/cli-darwin-arm64@2.6.8'
  - '@biomejs/cli-darwin-x64@2.6.8'
  - '@biomejs/cli-linux-arm64-musl@2.6.8'
  - '@biomejs/cli-linux-arm64@2.6.8'
  - '@biomejs/cli-linux-x64-musl@2.6.8'
  - '@biomejs/cli-linux-x64@2.6.8'
  - '@biomejs/cli-win32-arm64@2.6.8'
  - '@biomejs/cli-win32-x64@2.6.8'
  - '@testing-library/user-event@14.6.12'
# Security overrides (segment 22, `pnpm audit --prod --audit-level high` in CI): transitive copies pulled in by
# @excalidraw/excalidraw and its mermaid-to-excalidraw. Same API; exact patched versions. Drop an entry once the
# parent package ships the fix itself.
overrides:
  nanoid@<3.3.18: 3.3.20
  nanoid@>=4.0.0 <5.1.16: 5.1.16
  lodash-es@<4.18.1: 4.18.1
