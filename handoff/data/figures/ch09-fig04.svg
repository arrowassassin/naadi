<svg aria-label="Thyroid nodule workup algorithm" role="img" viewbox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ch09-arrow4" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#334155"></path></marker></defs>
<g fill="#0f172a" font-family="sans-serif" font-size="12" text-anchor="middle">
<rect fill="#e0f2fe" height="40" rx="6" stroke="#334155" width="340" x="150" y="8"></rect>
<text font-weight="bold" x="320" y="25">Thyroid nodule (palpable or incidental)</text>
<text x="320" y="41">Step 1: serum TSH + diagnostic neck ultrasound</text>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="240" x2="140" y1="48" y2="66"></line>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="400" x2="470" y1="48" y2="66"></line>
<rect fill="#fef3c7" height="34" rx="6" stroke="#334155" width="250" x="10" y="68"></rect>
<text font-weight="bold" x="135" y="90">TSH LOW (subnormal)</text>
<rect fill="#dcfce7" height="34" rx="6" stroke="#334155" width="330" x="300" y="68"></rect>
<text font-weight="bold" x="465" y="90">TSH normal or HIGH → sonographic pattern</text>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="135" x2="135" y1="102" y2="118"></line>
<rect fill="#fef3c7" height="34" rx="6" stroke="#334155" width="250" x="10" y="120"></rect>
<text x="135" y="142">Radionuclide (I-123/Tc-99m) scan</text>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="90" x2="75" y1="154" y2="172"></line>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="180" x2="195" y1="154" y2="172"></line>
<rect fill="#dcfce7" height="84" rx="6" stroke="#334155" width="120" x="10" y="174"></rect>
<text font-weight="bold" x="70" y="192">"Hot"</text>
<text x="70" y="208">(hyperfunctioning)</text>
<text x="70" y="224">rarely malignant</text>
<text x="70" y="240">→ NO FNA; treat</text>
<text x="70" y="254">hyperthyroidism</text>
<rect fill="#fee2e2" height="84" rx="6" stroke="#334155" width="120" x="140" y="174"></rect>
<text font-weight="bold" x="200" y="192">"Cold" or</text>
<text x="200" y="208">indeterminate</text>
<text x="200" y="228">→ evaluate by</text>
<text x="200" y="244">US criteria →</text>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="260" x2="296" y1="216" y2="216"></line>
<rect fill="#ffffff" height="164" rx="6" stroke="#334155" width="330" x="300" y="112"></rect>
<text font-weight="bold" x="465" y="130">ATA pattern → FNA size threshold</text>
<text text-anchor="start" x="310" y="152">High suspicion (hypoechoic solid + micro-</text>
<text text-anchor="start" x="310" y="167">calcifications, irregular margin, taller-</text>
<text text-anchor="start" x="310" y="182">than-wide, extrathyroidal extension) → ≥1 cm</text>
<text text-anchor="start" x="310" y="202">Intermediate (hypoechoic solid, smooth) → ≥1 cm</text>
<text text-anchor="start" x="310" y="222">Low (iso/hyperechoic solid) → ≥1.5 cm</text>
<text text-anchor="start" x="310" y="242">Very low (spongiform) → ≥2 cm or observe</text>
<text text-anchor="start" x="310" y="262">Purely cystic → no FNA (aspirate if symptomatic)</text>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="465" x2="465" y1="276" y2="292"></line>
<rect fill="#e0f2fe" height="30" rx="6" stroke="#334155" width="620" x="10" y="294"></rect>
<text font-weight="bold" x="320" y="314">US-guided FNA → Bethesda cytology</text>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="90" x2="90" y1="324" y2="340"></line>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="245" x2="245" y1="324" y2="340"></line>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="400" x2="400" y1="324" y2="340"></line>
<line marker-end="url(#ch09-arrow4)" stroke="#334155" x1="555" x2="555" y1="324" y2="340"></line>
<rect fill="#fef3c7" height="88" rx="6" stroke="#334155" width="148" x="10" y="342"></rect>
<text font-weight="bold" x="84" y="360">I Nondiagnostic</text>
<text x="84" y="378">Repeat US-guided</text>
<text x="84" y="394">FNA</text>
<rect fill="#dcfce7" height="88" rx="6" stroke="#334155" width="148" x="166" y="342"></rect>
<text font-weight="bold" x="240" y="360">II Benign</text>
<text x="240" y="378">Repeat US in</text>
<text x="240" y="394">12–24 months</text>
<rect fill="#fef3c7" height="88" rx="6" stroke="#334155" width="148" x="322" y="342"></rect>
<text font-weight="bold" x="396" y="360">III AUS / IV FN</text>
<text x="396" y="378">Repeat FNA or</text>
<text x="396" y="394">molecular testing;</text>
<text x="396" y="410">or diagnostic</text>
<text x="396" y="424">lobectomy</text>
<rect fill="#fee2e2" height="88" rx="6" stroke="#334155" width="152" x="478" y="342"></rect>
<text font-weight="bold" x="554" y="360">V Suspicious /</text>
<text font-weight="bold" x="554" y="376">VI Malignant</text>
<text x="554" y="394">Surgery (lobectomy</text>
<text x="554" y="410">or total</text>
<text x="554" y="424">thyroidectomy)</text>
</g>
</svg>