<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Course map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#C6FF3D}a:hover{color:#E2FF94}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #050506; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 16px 0 24px">
<div style="position: sticky; top: 16px; z-index: 5; padding: 0 16px"><dc-import name="Nav" active="learn" hint-size="100%,58px"></dc-import></div>

<main style="max-width: 1320px; margin: 0 auto; padding: 64px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(56px, 10vw, 136px); line-height: 0.88; letter-spacing: -0.05em">Everything<span style="color: #C6FF3D">,</span><br><span style="color: #8A8C92">mapped.</span></h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #F4F4F0; color: #050506; font-weight: 600; font-size: 14px">Step 1</button>
<button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 14px">Step 2 CK</button>
<button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 14px">Weak areas only</button>
<button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A3D45; background: transparent; color: #F4F4F0; font-size: 14px">High-yield only</button>
</div>
</header>

<section aria-label="Systems" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{systems}}" as="s" hint-placeholder-count="12">
<a href="#renal" style="{{s.style}}">
<span style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8"><span>{{s.count}}</span><span>{{s.tag}}</span></span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: -0.02em">{{s.name}}</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="{{s.track}}"><span style="{{s.bar}}"></span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{s.pct}}</span></span>
</a>
</sc-for>
</section>

<section id="renal" aria-labelledby="ren-h" style="padding: 36px; border-radius: 32px; background: #0E0F12; border: 1px solid #1F2126; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<h2 id="ren-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 64px); line-height: 0.95; letter-spacing: -0.04em">Renal</h2>
<span style="font-size: 14px; color: #9C9EA6">14 chapters · some to read, some to watch, all with questions and cards</span>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="7">
<a href="{{c.href}}" style="display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 68px; padding: 8px 0; border-top: 1px solid #1F2126; text-decoration: none; color: #F4F4F0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9C9EA6">{{c.n}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600; font-size: 17px">{{c.name}}</span><span style="font-size: 13px; color: #9C9EA6">{{c.meta}}</span></span>
<span style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end"><span style="{{c.fmt}}">{{c.format}}</span><span style="{{c.st}}">{{c.status}}</span></span>
</a>
</sc-for>
</div>
</section>
</main>

<div style="position: sticky; bottom: 20px; z-index: 6; margin-top: 36px; padding: 0 16px"><dc-import name="Dock" ask="“What should I study next?”" hint-size="100%,66px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const tile = 'display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:170px;padding:22px;border-radius:26px;text-decoration:none;box-sizing:border-box;';
    const raw = [['Biochemistry', 18, 82], ['Immunology', 9, 77], ['Microbiology', 22, 64], ['Pathology basics', 10, 90], ['Pharmacology', 16, 58], ['Cardiovascular', 17, 74], ['Respiratory', 12, 69], ['Renal', 14, 43], ['Gastrointestinal', 15, 66], ['Endocrine', 11, 58], ['Neurology', 20, 61], ['Musculoskeletal', 13, 35], ['Reproductive', 12, 20], ['Heme & oncology', 14, 12], ['Biostatistics & ethics', 8, 0]];
    const systems = raw.map(([name, n, p]) => {
      const now = name === 'Renal';
      return {
        name, count: n + ' chapters', pct: p + '%', tag: now ? 'This week' : (p === 0 ? 'Not started' : (p < 50 ? 'In progress' : '')),
        style: tile + (now ? 'background:#C6FF3D;color:#0B1400' : 'background:#0E0F12;border:1px solid #1F2126;color:#F4F4F0'),
        track: 'flex:1;height:6px;border-radius:3px;background:' + (now ? 'rgba(11,20,0,0.2)' : '#26282E'),
        bar: 'display:block;height:6px;border-radius:3px;width:' + p + '%;background:' + (now ? '#0B1400' : '#F4F4F0')
      };
    });
    const chip = 'font-size:12px;padding:5px 12px;border-radius:999px;white-space:nowrap;';
    const fRead = chip + 'border:1px solid #3A3D45;color:#F4F4F0';
    const fWatch = chip + 'background:#17132E;border:1px solid #3A3170;color:#C4BAFF';
    const done = chip + 'background:#1B1D22;color:#F4F4F0';
    const now = chip + 'background:#C6FF3D;color:#0B1400;font-weight:600';
    const todo = chip + 'border:1px dashed #5A5D66;color:#C9CBD1';
    const chapters = [
      ['04', 'Glomerular filtration', '9 pages · 16 questions · 10 cards', 'Read', fRead, 'Done', done, 'Chapter.dc.html'],
      ['05', 'Tubular transport', '11 pages · 20 questions · 14 cards', 'Read', fRead, 'Done', done, 'Chapter.dc.html'],
      ['06', 'Acid–base disorders', '18 min video · 6 pages · 22 questions', 'Read + watch', fWatch, 'Now', now, 'Lesson.dc.html'],
      ['07', 'Renal tubular acidosis', '9 pages · 18 questions · 12 cards', 'Read', fRead, 'Next', todo, 'Chapter.dc.html'],
      ['08', 'Diuretics', '14 min video · 5 pages · 24 questions', 'Read + watch', fWatch, 'Planned', todo, 'Lesson.dc.html'],
      ['09', 'Glomerular disease', '12 pages · 28 questions · 20 cards', 'Read', fRead, 'Planned', todo, 'Chapter.dc.html'],
      ['10', 'Your upload: nephrology notes', 'PDF · 34 pages · Naadi made 15 questions', 'Your file', fRead, 'Planned', todo, 'Library.dc.html']
    ].map(([n, name, meta, format, fmt, status, st, href]) => ({ n, name, meta, format, fmt, status, st, href }));
    return { systems, chapters };
  }
}
</script>
</body>
</html>
