<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naadi — Library and uploads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#C6FF3D}a:hover{color:#E2FF94}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #050506; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 16px 0 24px">
<div style="position: sticky; top: 16px; z-index: 5; padding: 0 16px"><dc-import name="Nav" active="notes" hint-size="100%,58px"></dc-import></div>

<main style="max-width: 1320px; margin: 0 auto; padding: 64px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(56px, 10vw, 136px); line-height: 0.88; letter-spacing: -0.05em">Bring your<br><span style="color: #8A8C92">own shelf.</span></h1>

<div style="display: flex; flex-wrap: wrap; gap: 20px">
<label style="flex: 2 1 480px; min-width: 0; min-height: 260px; padding: 32px; border-radius: 32px; border: 2px dashed #5A5D66; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<input type="file" multiple aria-label="Upload files" style="position: absolute; width: 1px; height: 1px; opacity: 0">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.02; letter-spacing: -0.03em">Drop PDFs, slides, photos of pages, videos or a YouTube link.</span>
<span style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><span style="display: flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; background: #C6FF3D; color: #0B1400; font-weight: 600; font-size: 15px">Choose files</span><span style="display: flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 1px solid #3A3D45; font-size: 15px">Paste a link</span><span style="display: flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 1px solid #3A3D45; font-size: 15px">Scan with camera</span><span style="display: flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 1px solid #3A3D45; font-size: 15px">Import Anki deck</span></span>
</label>
<section aria-label="What Naadi does with uploads" style="flex: 1 1 320px; min-width: 0; padding: 32px; border-radius: 32px; background: #17132E; border: 1px solid #2C2552; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #C4BAFF">Every upload becomes</span>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; line-height: 1.2">A readable chapter you can write on, a set of questions, a deck of cards, and something Naadi can answer from.</p>
<span style="font-size: 13px; color: #C4BAFF">Storage used: [N] GB of [N] GB</span>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<button type="button" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>

<section aria-label="Files" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<sc-for list="{{files}}" as="x" hint-placeholder-count="8">
<article style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 26px; background: #0E0F12; border: 1px solid #1F2126">
<div style="{{x.thumb}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em">{{x.type}}</span></div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px">{{x.name}}</span><span style="font-size: 13px; color: #9C9EA6">{{x.meta}}</span></div>
<div style="display: flex; gap: 8px"><a href="Ink.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; background: #F4F4F0; color: #050506; text-decoration: none; font-weight: 600; font-size: 13px">Open</a><button type="button" style="flex: 1; min-height: 44px; border-radius: 999px; border: 1px solid #5A4FA0; background: transparent; color: #C4BAFF; font-size: 13px">Ask Naadi</button></div>
</article>
</sc-for>
</section>
</main>

<div style="position: sticky; bottom: 20px; z-index: 6; margin-top: 36px; padding: 0 16px"><dc-import name="Dock" ask="“Make 20 questions from my nephrology PDF”" hint-size="100%,66px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (on) => 'min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;' + (on ? 'border:0;background:#F4F4F0;color:#050506;font-weight:600' : 'border:1px solid #3A3D45;background:transparent;color:#F4F4F0');
    const filters = ['All', 'PDFs', 'Images', 'Videos', 'Links', 'Decks'].map((label, i) => ({ label, on: i === 0 ? 'true' : 'false', style: chip(i === 0) }));
    const th = 'height:120px;border-radius:18px;display:flex;align-items:flex-end;padding:12px;box-sizing:border-box;';
    const kinds = { PDF: th + 'background:#F4F4F0;color:#050506', IMAGE: th + 'background:#1B1D22;color:#F4F4F0;border:1px dashed #5A5D66', VIDEO: th + 'background:#17132E;color:#C4BAFF;border:1px solid #3A3170', LINK: th + 'background:#1B1D22;color:#C6FF3D', DECK: th + 'background:#C6FF3D;color:#0B1400' };
    const files = [
      ['PDF', 'Nephrology notes', '34 pages · 12 ink annotations'], ['PDF', '[YOUR FILE NAME]', '[N] pages'], ['IMAGE', 'ECG strip photo', 'Scanned · text recognised'], ['VIDEO', '[YOUR LECTURE RECORDING]', '[LENGTH] · 4K · transcript ready'],
      ['LINK', '[YOUTUBE VIDEO TITLE]', 'YouTube · plays inside Naadi'], ['DECK', 'Imported Anki deck', '[N] cards · synced to review'], ['IMAGE', 'Whiteboard from study group', 'Photo · searchable handwriting'], ['PDF', 'ECFMG documents', 'Private · pathway vault']
    ].map(([type, name, meta]) => ({ type, name, meta, thumb: kinds[type] }));
    return { filters, files };
  }
}
</script>
</body>
</html>
