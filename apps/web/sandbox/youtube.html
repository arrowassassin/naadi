<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube player</title>
    <style>
      html,
      body,
      #player {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      The official YouTube IFrame Player API, loaded only inside <iframe sandbox="allow-scripts">
      (opaque origin: no cookies, no storage, no access to the app). Its own CSP (set by the server for this path)
      is the only one that allows scripts from www.youtube.com; the app's CSP stays script-src 'self'.
      See src/sandbox/youtube.ts and src/video/bridge.ts.
    -->
    <div id="player"></div>
    <script type="module" src="/src/sandbox/youtube.ts"></script>
  </body>
</html>
