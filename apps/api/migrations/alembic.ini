# Naadi Alembic configuration. The database URL is never written here: env.py reads DATABASE_URL through
# naadi_api.settings. Run from apps/api:
#   uv run alembic -c migrations/alembic.ini upgrade head
# or, the way the Space does at startup (advisory lock + clear failure line):
#   uv run python -m naadi_api.migrate

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
