[project]
name = "naadi-api"
version = "0.1.0"
description = "Naadi API: FastAPI app serving the SPA and /api"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "psycopg[binary,pool]==3.3.9",
    "psycopg-pool==3.3.3",
    "supabase==2.34.1",
    "openrouter==1.3.179",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
    "langchain-nvidia-ai-endpoints==1.5.0",
    "pyjwt[crypto]==2.15.1",
    "tzdata==2026.6",
    "alembic==1.20.1",
    "sqlalchemy==2.1.8",
    "aegra-api==0.11.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "langgraph-sdk==0.4.14",
    "langchain-core==1.8.1",
    "langchain-openrouter==0.2.9",
    "tavily-python==0.8.5",
    "biopython==1.88",
    "sse-starlette==3.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
    "httpx2==2.16.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "types-pyyaml==6.0.12.20261113",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["naadi_api"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT018"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["naadi_api"]

[[tool.mypy.overrides]]
module = ["supabase.*", "openrouter.*", "psycopg_pool.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-ra"]
markers = [
    "integration: talks to real external services (Supabase, OpenRouter, Tavily); needs the env from docs/SECRETS.md",
    "db: needs a reachable Postgres (DATABASE_URL); runs in GitHub Actions and against the Space",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Third-party deprecations we cannot act on (jsonpath via openrouter, supabase storage options).
    "ignore::DeprecationWarning:jsonpath.*",
    "ignore::DeprecationWarning:supabase.*",
    "ignore:.*DEPRECATED.*This will be removed:DeprecationWarning",
]

[tool.uv]
# langchain-openrouter 0.2.9 (latest) declares openrouter<1.0; the 1.x SDK keeps the chat.send/send_async
# surface it calls (verified live by tests/agent/test_llm_live.py). Revisit on every upgrade of either.
override-dependencies = ["openrouter==1.3.179"]
