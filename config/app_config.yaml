# Naadi runtime configuration seeded into `app_config` (HANDOFF §7.5) by the seed importer
# (apps/api/naadi_api/seed). Edited later in the admin console with history; a re-seed only rewrites keys an
# admin has never edited (admin_edited_at unset; `seed.py --force` overwrites). Each key is validated by its pydantic model in
# apps/api/naadi_api/config_api/schemas.py. models / budget / search / generation come from models.yaml;
# nothing in here is secret.

# Publishing gates for content licenses (config/sources.yaml header, HANDOFF §7.1).
sources_policy:
  block_without_license: true
  block_noncommercial_on_paid: true
  block_share_alike_in_proprietary: true
  block_non_ai_ingest_from_rag: true
  youtube_metadata_max_age_days: 30
  original_source_id: naadi-original-v1

# Feature flags. audience "admins" = only admins see it; everyone_outside_prod = also everyone when
# APP_ENV is not prod (local / staging). A screen's flag is switched on by the segment that ships the screen.
feature_flags:
  today: {enabled: true}
  courses: {enabled: true}        # S06 Courses + Reader
  qbank: {enabled: true}          # S08 Builder + tutor mode
  qbank_timed: {enabled: false}   # S09 timed + exam-simulation screens; the Builder disables those modes until on
  planner: {enabled: false}       # S11
  notes: {enabled: false}         # S13
  pathway: {enabled: false}       # S17
  search: {enabled: true}         # S07 Search
  assistant: {enabled: false}     # S14 (also always off in exam mode)
  ink_lab: {enabled: true, audience: admins, everyone_outside_prod: true}

# Top-level navigation, in display order. An item shows only while its feature flag is on, so the shell never
# links to a screen that does not exist yet. Paths are in-app routes; icons are names from the web icon set.
ui.nav:
  - {id: today, label: Today, path: /, icon: sun, feature: today}
  - {id: learn, label: Learn, path: /learn, icon: book-open, feature: courses}
  - {id: practice, label: Practice, path: /practice, icon: list-checks, feature: qbank}

# USMLE block format (usmle.org bulletin: Step 1 = 7 one-hour blocks, Step 2 CK = 8, up to 40 items each)
# and the three practice modes (HANDOFF §8 Builder/Qbank/Exam).
exam_rules:
  block:
    min_questions: 1
    max_questions: 40
    default_questions: 40
  diagnostic_questions: 40
  exams:
    step1: {label: "Step 1", blocks: 7, questions_per_block: 40, minutes_per_block: 60}
    step2ck: {label: "Step 2 CK", blocks: 8, questions_per_block: 40, minutes_per_block: 60}
  modes:
    tutor:
      timed: false
      seconds_per_question: null
      explanations: after_each_question
      assistant: true
    timed:
      timed: true
      seconds_per_question: 90
      explanations: after_block
      assistant: true
    exam:
      timed: true
      seconds_per_question: 90
      explanations: after_block
      assistant: false             # the assistant is silent in exam mode (CLAUDE.md)

# Reference ranges for the question view's Lab values panel (GET /api/lab-values). Naadi-original table of
# common adult ranges (conventional units, SI where it differs). The exam board's own table is (c) and is only
# linked to, through its `sources` row (official_source_id).
lab_values:
  source_id: naadi-original-v1
  official_source_id: nbme-lab-values
  groups:
    - id: chemistry
      label: Blood chemistry
      rows:
        - {analyte: "Sodium", range: "136-145 mEq/L", si: "136-145 mmol/L"}
        - {analyte: "Potassium", range: "3.5-5.0 mEq/L", si: "3.5-5.0 mmol/L"}
        - {analyte: "Chloride", range: "95-105 mEq/L", si: "95-105 mmol/L"}
        - {analyte: "Bicarbonate", range: "22-28 mEq/L", si: "22-28 mmol/L"}
        - {analyte: "Urea nitrogen (BUN)", range: "7-18 mg/dL", si: "2.5-6.4 mmol/L"}
        - {analyte: "Creatinine", range: "0.6-1.2 mg/dL", si: "53-106 umol/L"}
        - {analyte: "Glucose, fasting", range: "70-100 mg/dL", si: "3.9-5.6 mmol/L"}
        - {analyte: "Calcium, total", range: "8.4-10.2 mg/dL", si: "2.1-2.6 mmol/L"}
        - {analyte: "Magnesium", range: "1.5-2.0 mEq/L", si: "0.75-1.0 mmol/L"}
        - {analyte: "Phosphorus", range: "3.0-4.5 mg/dL", si: "1.0-1.5 mmol/L"}
        - {analyte: "Albumin", range: "3.5-5.5 g/dL", si: "35-55 g/L"}
        - {analyte: "Total protein", range: "6.0-7.8 g/dL", si: "60-78 g/L"}
        - {analyte: "Uric acid", range: "3.0-8.2 mg/dL", si: "0.18-0.48 mmol/L"}
        - {analyte: "Lactate, venous", range: "4.5-20 mg/dL", si: "0.5-2.2 mmol/L"}
        - {analyte: "Osmolality, serum", range: "275-295 mOsm/kg"}
    - id: liver
      label: Liver and pancreas
      rows:
        - {analyte: "AST", range: "12-38 U/L"}
        - {analyte: "ALT", range: "10-40 U/L"}
        - {analyte: "Alkaline phosphatase", range: "25-100 U/L"}
        - {analyte: "GGT", range: "8-38 U/L"}
        - {analyte: "Bilirubin, total", range: "0.1-1.0 mg/dL", si: "2-17 umol/L"}
        - {analyte: "Bilirubin, direct", range: "0.0-0.3 mg/dL", si: "0-5 umol/L"}
        - {analyte: "Amylase", range: "25-125 U/L"}
        - {analyte: "Lipase", range: "0-160 U/L"}
    - id: blood
      label: Hematology and coagulation
      rows:
        - {analyte: "Hemoglobin, male", range: "13.5-17.5 g/dL", si: "135-175 g/L"}
        - {analyte: "Hemoglobin, female", range: "12.0-16.0 g/dL", si: "120-160 g/L"}
        - {analyte: "Hematocrit, male", range: "41-53%"}
        - {analyte: "Hematocrit, female", range: "36-46%"}
        - {analyte: "MCV", range: "80-100 fL"}
        - {analyte: "Leukocytes", range: "4,500-11,000/mm3", si: "4.5-11.0 x 10^9/L"}
        - {analyte: "Platelets", range: "150,000-400,000/mm3", si: "150-400 x 10^9/L"}
        - {analyte: "Reticulocytes", range: "0.5-1.5% of red cells"}
        - {analyte: "ESR, male", range: "0-15 mm/h"}
        - {analyte: "ESR, female", range: "0-20 mm/h"}
        - {analyte: "Prothrombin time", range: "11-15 s"}
        - {analyte: "aPTT", range: "25-40 s"}
        - {analyte: "INR", range: "0.8-1.1"}
    - id: gases
      label: Arterial blood gas
      rows:
        - {analyte: "pH", range: "7.35-7.45"}
        - {analyte: "PaCO2", range: "33-45 mm Hg", si: "4.4-5.9 kPa"}
        - {analyte: "PaO2", range: "75-105 mm Hg", si: "10.0-14.0 kPa"}
        - {analyte: "HCO3-", range: "22-28 mEq/L", si: "22-28 mmol/L"}
    - id: endocrine
      label: Endocrine, lipids and cardiac
      rows:
        - {analyte: "TSH", range: "0.5-5.0 uU/mL", si: "0.5-5.0 mU/L"}
        - {analyte: "Free thyroxine (T4)", range: "0.8-1.8 ng/dL", si: "10-23 pmol/L"}
        - {analyte: "Hemoglobin A1c", range: "below 5.7%"}
        - {analyte: "Cortisol, 8 AM", range: "5-23 ug/dL", si: "138-635 nmol/L"}
        - {analyte: "Total cholesterol", range: "below 200 mg/dL", si: "below 5.2 mmol/L"}
        - {analyte: "LDL cholesterol", range: "below 130 mg/dL", si: "below 3.4 mmol/L"}
        - {analyte: "HDL cholesterol", range: "40 mg/dL or more", si: "1.0 mmol/L or more"}
        - {analyte: "Triglycerides", range: "below 150 mg/dL", si: "below 1.7 mmol/L"}
        - {analyte: "Troponin I", range: "0.04 ng/mL or less"}
        - {analyte: "BNP", range: "below 100 pg/mL"}
    - id: urine_csf
      label: Urine and cerebrospinal fluid
      rows:
        - {analyte: "Urine specific gravity", range: "1.003-1.030"}
        - {analyte: "Urine pH", range: "4.5-8.0"}
        - {analyte: "CSF opening pressure", range: "70-180 mm H2O"}
        - {analyte: "CSF protein", range: "15-45 mg/dL"}
        - {analyte: "CSF glucose", range: "40-70 mg/dL"}
        - {analyte: "CSF leukocytes", range: "0-5/mm3"}

