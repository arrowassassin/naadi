# Flashcard scheduling (S10): FSRS-6, server-authoritative. Defaults are ts-fsrs 6.0.0's (the Python `fsrs`
# 6.3.3 package has the same weights and steps); fuzz is off by default, as in ts-fsrs. Steps are in seconds.
fsrs:
  weights: [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614,
            0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542]
  desired_retention: 0.9
  learning_steps_s: [60, 600]
  relearning_steps_s: [600]
  maximum_interval: 36500
  enable_fuzz: false

# Handwriting search (S13, graph `ink_ocr`). After a save the layer is queued; a sweep every two minutes reads
# layers idle for idle_seconds with at least min_items live items and new content: Pillow renders the ink alone
# (black on white, 1600 px wide, tiles of at most 2048 px, at most max_tiles), one `vision` call per tile (purpose
# job). per_user_daily caps OCR calls per student per UTC day; over the cap or the job budget the layer is
# `deferred` and the nightly pass (00:23 UTC, after the caps reset) retries it. Students can turn it off in
# Settings -> Pencil & ink (profiles.settings.handwriting_search = false).
ink_ocr:
  enabled: true
  idle_seconds: 120
  min_items: 3
  max_tiles: 4
  per_user_daily: 40
  convert_per_user_daily: 30
  max_layers_per_run: 25

# Weekly `youtube_map` graph (S20, Sunday 05:17 UTC): candidates need min_score, at most max_candidates_per_section
# per section, metadata older than refresh_days is re-fetched (YouTube policy: never kept past 30 days), and one run
# spends at most quota_units_per_run of the free 10,000 daily API units.
youtube:
  enabled: true
  min_score: 0.42
  max_candidates_per_section: 3
  refresh_days: 25
  quota_units_per_run: 2000
  max_new_per_channel: 50

# Supabase Storage bucket names (created by migration 0002).
storage:
  content_public: content-public
  content_private: content-private
  user_uploads: user-uploads
  vault: vault
  generated_media: generated-media

