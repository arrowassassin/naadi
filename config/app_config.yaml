# Flashcard scheduling (S10): FSRS-6, server-authoritative. Defaults are ts-fsrs 6.0.0's (the Python `fsrs`
# 6.3.3 package has the same weights and steps); fuzz is off by default, as in ts-fsrs. Steps are in seconds.
fsrs:
  weights: [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614,
            0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542]
  desired_retention: 0.9
  learning_steps_s: [60, 600]
  relearning_steps_s: [600]
  maximum_interval: 36500
  enable_fuzz: false

# Handwriting search (S13, graph `ink_ocr`). After a save the layer is queued; a sweep every two minutes reads
# layers idle for idle_seconds with at least min_items live items and new content: Pillow renders the ink alone
# (black on white, 1600 px wide, tiles of at most 2048 px, at most max_tiles), one `vision` call per tile (purpose
# job). per_user_daily caps OCR calls per student per UTC day; over the cap or the job budget the layer is
# `deferred` and the nightly pass (00:23 UTC, after the caps reset) retries it. Students can turn it off in
# Settings -> Pencil & ink (profiles.settings.handwriting_search = false).
ink_ocr:
  enabled: true
  idle_seconds: 120
  min_items: 3
  max_tiles: 4
  per_user_daily: 40
  convert_per_user_daily: 30
  max_layers_per_run: 25

# Weekly `youtube_map` graph (S20, Sunday 05:17 UTC): candidates need min_score, at most max_candidates_per_section
# per section, metadata older than refresh_days is re-fetched (YouTube policy: never kept past 30 days), and one run
# spends at most quota_units_per_run of the free 10,000 daily API units.
youtube:
  enabled: true
  min_score: 0.42
  max_candidates_per_section: 3
  refresh_days: 25
  quota_units_per_run: 2000
  max_new_per_channel: 50
# Question authoring (S21, graph `author`, Aegra cron 22:41 UTC) and the review/psychometric thresholds.
# One human approval publishes (the owner is the only user) once lint, source check and the blind solver pass;
# required_approvals: 2 asks for two blind admins on every item. Nothing here retires an item below act_min_n.
authoring:
  nightly_enabled: true
  max_items_per_night: 10
  max_llm_calls_per_night: 40
  max_pending_review: 30
  lint_retries: 2
  solver_retries: 1
  min_published_per_topic: 15
  target_exams: [step1]
  required_approvals: 1
  excerpts_per_item: 4
  excerpt_chars: 1200
  similarity_error: 0.92
  similarity_warn: 0.85
  uncited_max_ratio: 0.34
  psychometrics_min_n: 30
  act_min_n: 100
  p_low: 0.20
  p_high: 0.95
  pb_min: 0.05
  time_factor: 2.0
  report_flags: 2
# Pathway (S17). A task whose last_verified is older than reverify_days, or that the weekly `pathway_verify`
# graph flagged (needs_review), shows "Re-verify". Only an admin confirming a task changes last_verified. The weekly
# check (Mondays 04:13 UTC) fetches at most verify_max_tasks_per_run official pages directly and makes at most
# verify_max_llm_calls model calls (free chains only, through llm.py). Vault files: PDF, JPEG, PNG or HEIC up to
# vault_max_bytes, opened through a signed URL that works signed_url_seconds. Costs are summed per currency; there
# is no conversion.
pathway:
  reverify_days: 90
  verify_max_tasks_per_run: 60
  verify_max_llm_calls: 20
  verify_page_timeout_s: 15
  verify_max_page_bytes: 2000000
  signed_url_seconds: 60
  expiry_soon_days: 60
  vault_max_bytes: 20971520
  vault_max_documents: 100
  vault_types: [passport, diploma, transcript, visa, ds2019, ecfmg, licence, id_proof, other]
  currencies: [USD, INR]
  max_costs_per_user: 2000

# Universal ingest (S15, `ingest` graph). Caps are checked before any byte is parsed; vault-looking files stop at the
# local sensitivity gate before any model call. `max_vision_pages` scanned pages per file go to the vision role, the
# rest to local OCR. Images become WebP (the original is kept only when <= keep_image_original_kb); audio is deleted
# after transcription unless audio_keep. Near-duplicates: >= near_dup_share of chunks at cosine >= near_dup_cosine.
ingest:
  enabled: true
  max_file_mb: 50
  zip_max_entries: 200
  zip_max_uncompressed_mb: 300
  zip_max_depth: 2
  zip_max_ratio: 100
  max_image_megapixels: 50
  max_pages: 2000
  max_vision_pages: 40
  vision_per_user_daily: 80
  local_ocr_pages: 200
  max_audio_minutes: 120
  audio_keep: false
  user_storage_mb: 600
  items_per_user_daily: 200
  max_paste_chars: 200000
  keep_image_original_kb: 512
  near_dup_cosine: 0.97
  near_dup_share: 0.8
  undo_days: 7

# Supabase Storage bucket names (created by migration 0002).
storage:
  content_public: content-public
  content_private: content-private
  user_uploads: user-uploads
  vault: vault
  generated_media: generated-media

