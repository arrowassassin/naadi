# Naadi runtime configuration seeded into `app_config` (HANDOFF §7.5) by the seed importer
# (apps/api/naadi_api/seed). Edited later in the admin console with history; a re-seed only rewrites keys an
# admin has never edited (admin_edited_at unset; `seed.py --force` overwrites). Each key is validated by its pydantic model in
# apps/api/naadi_api/config_api/schemas.py. models / budget / search / generation come from models.yaml;
# nothing in here is secret.

# Publishing gates for content licenses (config/sources.yaml header, HANDOFF §7.1).
sources_policy:
  block_without_license: true
  block_noncommercial_on_paid: true
  block_share_alike_in_proprietary: true
  block_non_ai_ingest_from_rag: true
  youtube_metadata_max_age_days: 30
  original_source_id: naadi-original-v1

# Feature flags. audience "admins" = only admins see it; everyone_outside_prod = also everyone when
# APP_ENV is not prod (local / staging). A screen's flag is switched on by the segment that ships the screen.
feature_flags:
  today: {enabled: true}
  courses: {enabled: true}        # S06 Courses + Reader
  qbank: {enabled: true}          # S08 Builder + tutor mode
  qbank_timed: {enabled: true}    # S09 timed + exam-simulation screens (mock exams run here)
  planner: {enabled: false}       # S16 Planner screen ("Full plan" on Today stays hidden until on)
  coach: {enabled: true}          # S11 nightly coach suggestions on Today
  notes: {enabled: true}          # S13 Notes, highlights, notebooks, handwriting search
  pathway: {enabled: false}       # S17
  search: {enabled: true}         # S07 Search
  cards: {enabled: true}          # S10 Flashcards (FSRS review, create/edit; Builder link, Save as flashcard)
  assistant: {enabled: false}     # S14 (also always off in exam mode)
  generation: {enabled: true}     # S15b image/video generation; stays off until HF_GEN_TOKEN is set (not configured)
  anki: {enabled: true}           # S20 Anki .apkg import/export (Library tile, Cards import/export)
  ink_lab: {enabled: true, audience: admins, everyone_outside_prod: true}

# Top-level navigation, in display order. An item shows only while its feature flag is on, so the shell never
# links to a screen that does not exist yet. Paths are in-app routes; icons are names from the web icon set.
ui.nav:
  - {id: today, label: Today, path: /, icon: sun, feature: today}
  - {id: learn, label: Learn, path: /learn, icon: book-open, feature: courses}
  - {id: practice, label: Practice, path: /practice, icon: list-checks, feature: qbank}
  - {id: notes, label: Notes, path: /notes, icon: notebook-pen, feature: notes}

# USMLE block format (usmle.org bulletin: Step 1 = 7 one-hour blocks, Step 2 CK = 8, up to 40 items each)
# and the three practice modes (HANDOFF §8 Builder/Qbank/Exam).
exam_rules:
  block:
    min_questions: 1
    max_questions: 40
    default_questions: 40
  diagnostic_questions: 40
  break_minutes: 45                # shared break pool of a multi-section timed/exam session (S09)
  expiry_grace_seconds: 2          # an answer arriving this late after the deadline still counts
  exams:
    step1: {label: "Step 1", blocks: 7, questions_per_block: 40, minutes_per_block: 60}
    step2ck: {label: "Step 2 CK", blocks: 8, questions_per_block: 40, minutes_per_block: 60}
  modes:
    tutor:
      timed: false
      seconds_per_question: null
      explanations: after_each_question
      assistant: true
    timed:
      timed: true
      seconds_per_question: 90
      explanations: after_block
      assistant: true
    exam:
      timed: true
      seconds_per_question: 90
      explanations: after_block
      assistant: false             # the assistant is silent in exam mode (CLAUDE.md)

# Study-plan generator (S11, naadi_api/plan/generator.py). Hours scale by daily_hours / reference_hours (the
# template's daily maximum); fewer than min_study_days available dates, or an exam more than max_study_days away,
# is refused. Exams without a template are
# not offered in onboarding. item_minutes sizes a day's items (durations only, never clock times).
plan:
  reference_hours: 10
  min_study_days: 21
  max_study_days: 180   # an exam further away than this is refused (422 too_many_days); the date picker stops here
  max_daily_hours: 14
  templates: {step1: step1-60d}
  item_minutes: {cards: 30, admin: 30, extra: 30, questions_untimed: 60, seconds_per_question: 90, review_factor: 1.0, min_read: 30}

# Nightly coach (S11, graph `coach`, Aegra cron 21:07 UTC) and the thresholds Today shows. weak_below: a system
# under this share correct is "weak"; min_attempts: fewer attempts show "not enough data". Readiness =
# blueprint-weighted % correct over first attempts in the last readiness_days, shown only after
# readiness_min_answered answers covering readiness_min_coverage of the weighted systems.
coach:
  enabled: true
  max_suggestions: 3
  max_users_per_run: 200
  weak_below: 0.55
  min_attempts: 5
  window_days: 14
  readiness_days: 60
  readiness_min_answered: 40
  readiness_min_coverage: 0.5
  catch_up_questions: 20

