# Candidate YouTube channel allowlist for Naadi (consumed by tools/youtube_mapper.py).
#
# Generated 2026-11-15 from research_notes/.../content_sources.md (Q1).
# Only Ninja Nerd, MedCram and Dr. Najeeb (plus two extra channels the research surfaced)
# have channel IDs confirmed against a third-party stats page (vidIQ). Every other
# handle below is a BEST GUESS and is marked verified: false - resolve each with the
# YouTube Data API `channels.list?part=id,snippet,contentDetails,statistics&forHandle=@handle`
# (1 quota unit), confirm the returned title is the intended channel, then record
# channel_id here and set verified: true. Do not hard-code subscriber counts or cadence.
# Embeddability is per video (videos.list status.embeddable), never per channel.
#
# Fields
#   handle      YouTube @handle (null when only the channel ID is known)
#   channel_id  UC... id when known (verified via cited page); else null
#   subjects    Naadi taxonomy domains (cardio, resp, renal, gi, endo, repro, preg, heme,
#               immune, neuro, psych, msk, derm, multi, nutrition, biostat, social, dev, all)
#   exams       step1 / step2ck / step3
#   commercial_brand  true = free teaser videos from a paid platform; embed only, never copy slides/notes
#   include     whether youtube_mapper.py should crawl it

channels:
  - handle: "@ninjanerdofficial"
    channel_id: UC6QYFutt9cluQ3uSM963_KQ
    name: Ninja Nerd
    url: https://www.youtube.com/@ninjanerdofficial
    subjects: [all]
    exams: [step1, step2ck]
    commercial_brand: false
    include: true
    verified: true
    verified_url: https://vidiq.com/youtube-stats/channel/UC6QYFutt9cluQ3uSM963_KQ
    notes: Handle and channel ID confirmed via vidIQ; subscriber count not shown there.

