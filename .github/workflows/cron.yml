# Daily 03:00 UTC: GET /api/health on the live Space. Keeps the free Supabase project active
# (it pauses after a week without queries) and warms the Space. Backups arrive in segment 22.
name: cron

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: cron-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keepalive:
    name: live health (Supabase keep-alive, Space warm-up)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: arrowassassin/naadi
    steps:
      - name: Require HF_TOKEN
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret HF_TOKEN (Settings -> Secrets and variables -> Actions). See docs/SECRETS.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: Smoke the live Space (database must be ok; / and /api/ready must answer)
        run: uv run --script scripts/deploy_space.py --space "$HF_SPACE_ID" --smoke-only
