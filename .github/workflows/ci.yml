# Naadi CI. Public repo: ubuntu runners only (free). No secrets here: HF_TOKEN is used by deploy.yml only.
# install -> lint -> typecheck -> unit -> contracts drift -> requirements drift -> check_models -> build
# -> db integration (supabase/postgres service) -> e2e (WebKit, Chromium, Firefox x 6 viewports)
# Deploying is a separate workflow (deploy.yml) that runs when this one succeeds on main, so a newer push
# can cancel a superseded CI run but never a deploy that is uploading.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # PRs share one group per PR (superseded PR runs are cancelled). Every push gets its own group (keyed by
  # sha), so on the busy multiplayer shared branch no push run is ever queued behind, or replaced by, a newer
  # one: each commit gets complete results (public repo: Actions minutes are free).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.3"
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.32"
  SPACE_ID: arrowassassin/naadi
  SPACE_URL: https://arrowassassin-naadi.hf.space
  FORCE_COLOR: "1"

jobs:
  checks:
    name: lint · typecheck · unit · drift · models · build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from package.json)
        run: |
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv --directory apps/api sync --frozen
      - name: Lint (biome, ruff)
        run: pnpm lint
      - name: Typecheck (tsc, mypy)
        run: pnpm typecheck
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Unit tests (pytest, no external services, cleared environment)
        run: uv --directory apps/api run pytest -m "not live and not db"
      - name: Contracts drift (OpenAPI -> zod + TS client)
        run: |
          pnpm gen:contracts
          git diff --exit-code -- packages/shared || { echo "::error::Generated contracts are stale: run 'pnpm gen:contracts' and commit"; exit 1; }
      - name: Requirements drift (uv.lock -> requirements.txt)
        run: |
          pnpm gen:requirements
          git diff --exit-code -- apps/api/requirements.txt || { echo "::error::apps/api/requirements.txt is stale: run 'pnpm gen:requirements' and commit"; exit 1; }
      - name: Model chains (free-only, catalog, capabilities)
        # No NVIDIA key in CI: NVIDIA models are listed as "not probed in CI"; the Space health check probes them.
        run: uv --directory apps/api run python ../../tools/check_models.py
      - name: Build web
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  audit:
    name: dependency audit · SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install the audit tools (pip-audit, cyclonedx-py; pinned in the api dev group)
        run: uv --directory apps/api sync --frozen
      - name: Web dependencies (production tree, high and critical fail)
        run: pnpm audit --prod --audit-level high
      - name: API dependencies (the hash-locked requirements.txt the Space installs)
        working-directory: apps/api
        run: uv run --frozen pip-audit --strict --require-hashes --disable-pip --progress-spinner off -r requirements.txt
      - name: SBOMs (CycloneDX JSON)
        run: |
          mkdir -p sbom
          pnpm --filter @naadi/web sbom --sbom-format cyclonedx --sbom-type application --prod --lockfile-only --out "$PWD/sbom/web.cdx.json"
          uv --directory apps/api run --frozen cyclonedx-py requirements requirements.txt --of JSON -o ../../sbom/api.cdx.json
          test -s sbom/web.cdx.json && test -s sbom/api.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom
          retention-days: 90

  searxng:
    name: SearXNG stage builds and answers on loopback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned SearXNG stage of the Space image
        run: docker build --target searxng -t naadi-searxng-ci -f deploy/space/Dockerfile .
      - name: Start it with the Space's settings; /healthz must answer (no search engine is queried)
        run: |
          docker run -d --name searxng-ci --network host -e SEARXNG_SECRET="$(openssl rand -hex 32)" \
            -e SEARXNG_SETTINGS_PATH=/settings.yml -v "$PWD/deploy/searxng/settings.yml:/settings.yml:ro" \
            -w /opt/searxng/src naadi-searxng-ci \
            /opt/searxng/.venv/bin/granian --interface wsgi --host 127.0.0.1 --port 8888 --workers 1 searx.webapp:app
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8888/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8888/healthz
          # The engines it may query are exactly the allow-listed ones (general web + Wikipedia, nothing else).
          curl -fsS http://127.0.0.1:8888/config | python3 -c 'import json,sys; c=json.load(sys.stdin); e=sorted(x["name"] for x in c["engines"] if x["enabled"]); print(e); assert set(e) <= {"duckduckgo","brave","mojeek","wikipedia"}, e'
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' searxng-ci
      - name: SearXNG log (only on failure)
        if: failure()
        run: docker logs searxng-ci 2>&1 | tail -80 || true

  db:
    name: integration (db, supabase/postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: # real Supabase Postgres: anon/authenticated/service_role roles + auth schema
        image: supabase/postgres:17.11.0.019
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Throwaway service-container credentials, not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      APP_ENV: staging
      # storage-api started by `stack.sh storage` on the host network: the seed importer's db tests upload
      # figures through it with a service key minted from the stack's local-only JWT secret.
      NAADI_STORAGE_URL: http://localhost:5000
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv --directory apps/api sync --frozen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          # The model ids live in config/models.yaml (roles.embeddings); a change there refreshes the cache.
          key: fastembed-${{ hashFiles('config/models.yaml') }}
      - name: Local search models (embedding + reranker, cached; query time never downloads)
        run: uv --directory apps/api run --frozen python -m naadi_api.embeddings prefetch
      - name: Supabase Storage schema (real storage-api migrations against the service container)
        env:
          NAADI_PG_PORT: "5432"
        run: apps/api/tests/db/stack.sh storage
      - name: Supabase auth server (migrates the auth schema as on the hosted project; sessions, confirmed emails)
        env:
          NAADI_PG_PORT: "5432"
        run: apps/api/tests/auth/auth_stack.sh ci
      - name: PostgreSQL 17 client (pg_dump / pg_restore for the backup dry run in the db tests)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
      - name: DB integration tests
        # Only the `db` tests: the other integration tests need service keys that live on the Space, not in CI.
        # Includes the backup dry run (segment 22): pg_dump -> age-encrypt to a throwaway key -> a local test path
        # -> decrypt -> pg_restore --list -> delete (tests/db/test_ops_db.py).
        env:
          NAADI_PG_BIN: /usr/lib/postgresql/17/bin
        run: uv --directory apps/api run pytest -m db -v

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # Each browser's six viewport projects are split across three shards (Playwright --shard): each shard pays
    # the ~6 min stack/seed/index setup once and runs a third of the tests, so no job nears the old 75 min.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium, firefox]
        shard: [1, 2, 3]
    services:
      postgres: # real Supabase Postgres: anon/authenticated/service_role roles + auth schema
        image: supabase/postgres:17.11.0.019
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_EXPECT_DB_OK: "1"
      CI: "1"
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv --directory apps/api sync --frozen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          # The model ids live in config/models.yaml (roles.embeddings); a change there refreshes the cache.
          key: fastembed-${{ hashFiles('config/models.yaml') }}
      - name: Local search models (embedding + reranker, cached; query time never downloads)
        run: uv --directory apps/api run --frozen python -m naadi_api.embeddings prefetch
      - name: Supabase Storage schema (the webServer runs the migrations, which need it)
        env:
          NAADI_PG_PORT: "5432"
        run: apps/api/tests/db/stack.sh storage
      - name: Supabase auth server (real sign-in without hosted secrets; per-run throwaway HS256 keys)
        env:
          NAADI_PG_PORT: "5432"
          NAADI_AUTH_SITE_URL: http://127.0.0.1:7860
          # The same gateway serves Storage at /storage/v1 (stack.sh's storage-api on the host network), so the
          # browser loads seeded figures from SUPABASE_URL/storage/v1/object/public/... as on the real project.
          NAADI_AUTH_STORAGE_UPSTREAM: 127.0.0.1:5000
        run: apps/api/tests/auth/auth_stack.sh ci
      - name: Install ${{ matrix.browser }} for the pinned @playwright/test
        run: pnpm --filter @naadi/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Migrate and import the seed content (chapters, questions, figures into local Storage)
        working-directory: apps/api
        env:
          NAADI_STORAGE_URL: http://localhost:5000
        run: |
          uv run --frozen python -m naadi_api.migrate
          # Throwaway service key for the local storage-api container (fixed local-only secret in stack.sh).
          SUPABASE_SERVICE_ROLE_KEY="$(uv run --frozen python -c 'from tests.db.storage import local_service_key; print(local_service_key())')" \
            uv run --frozen python scripts/seed.py --data ../../data --config ../../config
      - name: Build the local search index over the seeded content (fastembed, every core for this one-off run)
        working-directory: apps/api
        run: uv run --frozen python -m naadi_api.embeddings reindex --threads 4
      - name: Search latency on the seeded corpus (CPU p95 < 300 ms; wall p95 < 1000 ms on a shared runner, numbers in the log)
        if: matrix.shard == 1 # once per browser is enough: the corpus and the runner type are the same
        working-directory: apps/api
        env:
          NAADI_PERF_WALL_BUDGET_MS: "1000"
        run: uv run --frozen pytest tests/embeddings/test_perf.py -m db -s -q
      - name: Build and run e2e (served by uvicorn from the production build)
        env:
          # Export-all (S21) uploads its ZIP through the local storage-api (stack.sh's fixed local-only secret).
          NAADI_STORAGE_URL: http://localhost:5000
        run: |
          NAADI_STORAGE_SERVICE_KEY="$(uv --directory apps/api run --frozen python -c 'from tests.db.storage import local_service_key; print(local_service_key())')"
          export NAADI_STORAGE_SERVICE_KEY
          pnpm --filter @naadi/web build
          pnpm --filter @naadi/web exec playwright test --project "${{ matrix.browser }}-*" --shard "${{ matrix.shard }}/3"
      - name: Auth server and Mailpit logs (only on failure; throwaway test addresses, no keys)
        if: failure()
        run: |
          docker logs auth-naadi-test 2>&1 | tail -60 || true
          docker logs mail-naadi-test 2>&1 | tail -60 || true
      - name: Scan artifacts for credentials (minted CI keys, session storage, API keys)
        id: scan
        if: ${{ !cancelled() }}
        run: uv --directory apps/api run --frozen python -m tests.auth.scan_artifacts ../../test-results/screens/01 ../../test-results/screens/12a ../../test-results/screens/03 ../../test-results/screens/06 ../../test-results/screens/04 ../../test-results/screens/07 ../../test-results/screens/08 ../../test-results/screens/09 ../../test-results/screens/10 ../../test-results/screens/11 ../../test-results/screens/12b ../../test-results/screens/21 ../../test-results/screens/17
      - if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-${{ matrix.shard }}
          # Screenshots only: traces, videos and reports can hold tokens or cookies.
          path: |
            test-results/screens/01
            test-results/screens/12a
            test-results/screens/03
            test-results/screens/06
            test-results/screens/04
            test-results/screens/07
            test-results/screens/08
            test-results/screens/09
            test-results/screens/10
            test-results/screens/11
            test-results/screens/12b
            test-results/screens/21
            test-results/screens/17
          retention-days: 14
          if-no-files-found: ignore
